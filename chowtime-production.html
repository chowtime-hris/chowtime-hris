<style>

<body>

<header class="app">
  <div class="brand">
    <div class="mark">CT</div>
    <div>
      <h1>Chowtime Production System</h1>
      <div class="sub" id="headerSub">Piece-rate output &amp; payroll tracker</div>
    </div>
  </div>
  <span id="connBadge" class="badge-conn off">Offline (local)</span>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="main"></main>

<script>
/* ================= DATA LAYER ================= */
const DEFAULT_PRODUCTS = [
  {code:'NGT', label:'C. Nuggets'},
  {code:'LS',  label:'Longganisa Strips'},
  {code:'DP',  label:'Dumplings'},
  {code:'FILLET', label:'Chicken Fillet'},
  {code:'NGW', label:'Nugget Wrap'}
];
const DEFAULT_SKUS = [
  {code:'CUP', rate:0.15},{code:'BOX', rate:0.25},{code:'SOY', rate:5},
  {code:'BUFF', rate:5},{code:'GA', rate:5},{code:'CHEESE', rate:5},
  {code:'SHM', rate:5},{code:'SC', rate:5},{code:'TERI', rate:5},
  {code:'BBQ', rate:5},{code:'CHILI PASTE', rate:12.5},{code:'JUICE', rate:5}
];

let DB = null;
let USE_FIREBASE = false;

/* ===== POS INVENTORY BRIDGE =====================================
   A finished batch is stock that exists. Until now it lived only in the
   production database, so MAIN's inventory never knew about it and someone
   had to key it in twice. This posts it once, on save.

   The mapping is explicit on purpose: production codes (NGT, LS, FILLET) do
   not match POS item ids, and guessing by name is how the wrong item gets
   credited. Set it once in the Settings tab.                             */
const POS_CFG = {
  apiKey:            "AIzaSyBESg7q6sAapwavECcJLx72OPnc8SxOCJc",
  authDomain:        "chowtime-pos.firebaseapp.com",
  projectId:         "chowtime-pos",
  storageBucket:     "chowtime-pos.firebasestorage.app",
  messagingSenderId: "446140959237",
  appId:             "1:446140959237:web:c58f75db697223ef33ea6c"
};
let POS_FS = null;
function posDB(){
  if(POS_FS) return POS_FS;
  try{
    const app = firebase.apps.find(a=>a.name==="pos")
      || firebase.initializeApp(POS_CFG,"pos");
    POS_FS = app.firestore();
  }catch(e){ console.error("POS bridge:", e); POS_FS = null; }
  return POS_FS;
}

// Local date — the POS files their day in Manila time, and using UTC here
// would file an early-morning batch under the previous day.
function posLocalDate(d){
  const x = d ? new Date(d) : new Date();
  return x.getFullYear() + "-" +
    String(x.getMonth()+1).padStart(2,"0") + "-" +
    String(x.getDate()).padStart(2,"0");
}

// Pack size is not a second setting to keep in step — it is read from the
// MAIN inventory item this code is linked to. Change it there and Production
// follows. Only items counted in pieces get the pack/loose split; a sauce
// measured in ml has no pack and keeps its single field.
// Cached in localStorage and read back before the first paint, so the row
// knows immediately whether it needs one field or two. Pack sizes change once
// in a blue moon; a stale value for a few seconds costs nothing, a redraw
// under the cashier's fingers costs a mistyped batch.
const PACK_CACHE_KEY = "ct_pos_pack_v1";
function readPackCache(){
  try{
    const c = localStorage.getItem(PACK_CACHE_KEY);
    return c ? JSON.parse(c) : null;
  }catch(e){ return null; }
}

async function loadPosPackInfo(){
  const fs = posDB();
  if(!fs) return {};
  const info = {};
  try{
    const dm = await fs.collection("settings").doc("production_map").get();
    const map = (dm.exists && dm.data() && dm.data().map) || {};
    state.posMap = map;
    for(const code of Object.keys(map)){
      const cfg = map[code];
      const id = typeof cfg==="string" ? cfg : (cfg && cfg.id);
      if(!id) continue;
      try{
        const snap = await fs.collection("inventory").doc(id).get();
        if(!snap.exists) continue;
        const d = snap.data() || {};
        info[code] = {
          unit: d.unit || "",
          packUnit: d.packUnit || "",
          packSize: Number(d.packSize) || 0,
          name: d.name || id
        };
      }catch(e){ console.warn("pack info", code, e); }
    }
  }catch(e){ console.warn("pack info map:", e); }
  const changed = JSON.stringify(state.posPack||{}) !== JSON.stringify(info);
  state.posPack = info;
  try{ localStorage.setItem(PACK_CACHE_KEY, JSON.stringify(info)); }catch(e){}
  return {info, changed};
}

// True when this code should be entered as packs + loose pieces.
function usesPackEntry(code){
  const pi = (state.posPack || {})[code];
  return !!(pi && pi.packSize > 1 && /^pcs?$/i.test(pi.unit || ""));
}
function packSizeOfCode(code){
  const pi = (state.posPack || {})[code];
  return (pi && Number(pi.packSize)) || 0;
}

// Post one day's finished quantities into MAIN's inventory.
// Guarded by a marker per date so re-saving the same day tops up by the
// difference rather than adding the whole batch a second time.
async function postProductionToPOS(dateStr, products){
  const fs = posDB();
  if(!fs) return {ok:false, reason:"POS database not reachable"};
  // Both the links and the already-posted marker live in the POS project.
  let map = state.posMap || {};
  let posted = {};
  try{
    const dm = await fs.collection("settings").doc("production_map").get();
    if(dm.exists && dm.data() && dm.data().map){ map = dm.data().map; state.posMap = map; }
    const dp = await fs.collection("settings").doc("production_posted").get();
    if(dp.exists && dp.data() && dp.data()[dateStr]) posted = dp.data()[dateStr];
  }catch(e){ console.warn("bridge state:", e); }
  const done = [], skipped = [], failed = [];

  for(const code of Object.keys(products||{})){
    const qty = Number((products[code]||{}).qty) || 0;
    const cfg = map[code];
    // a link is either the old plain id, or {id, unit, per}
    const itemId = cfg ? (typeof cfg==="string" ? cfg : cfg.id) : "";
    const per    = cfg && typeof cfg==="object" ? (Number(cfg.per)||1) : 1;
    const pUnit  = cfg && typeof cfg==="object" ? (cfg.unit||"") : "";
    if(!itemId){ if(qty>0) skipped.push(code); continue; }
    const already = Number(posted[code]) || 0;
    // Convert to POS units before comparing: 5 bottles at 1000 ml is 5000 ml,
    // and posting 5 would credit a thousandth of what was made.
    //
    // posBase means the entry was already keyed in POS base units — packs were
    // turned into pieces at entry time. Multiplying by `per` again would credit
    // a pack's worth for every single piece.
    const alreadyBase = !!(products[code] && products[code].posBase);
    const wantPos = alreadyBase
      ? Math.round(qty * 1000) / 1000
      : Math.round(qty * per * 1000) / 1000;
    const delta   = Math.round((wantPos - already) * 1000) / 1000;
    if(delta === 0) continue;
    try{
      const ref = fs.collection("inventory").doc(itemId);
      const snap = await ref.get();
      if(!snap.exists){ failed.push(code+" (no such POS item)"); continue; }
      const prev = Number(snap.data().stock) || 0;
      const next = Math.round((prev + delta) * 1000) / 1000;
      await ref.update({
        stock: next,
        lastRestocked: firebase.firestore.FieldValue.serverTimestamp()
      });
      await fs.collection("inventory_log").add({
        itemId: itemId,
        itemName: snap.data().name || itemId,
        unit: snap.data().unit || "",
        type: delta >= 0 ? "add" : "deduct",
        amount: delta,
        prevStock: prev,
        newStock: next,
        desc: "Production " + dateStr + " · " + code +
              (alreadyBase
                ? ((products[code]||{}).packs
                    ? (" · " + (products[code]||{}).packs + " pack"
                       + (((products[code]||{}).loose)
                          ? (" + " + (products[code]||{}).loose + " pc") : ""))
                    : "")
                : (per !== 1 ? " · " + qty + " " + (pUnit || "unit") +
                    (qty === 1 ? "" : "s") + " x " + per : "")) +
              (already ? " (adjusted from " + already + ")" : ""),
        source: "PRODUCTION",
        ref: dateStr,
        branch: "ct-main",
        by: "Production",
        date: posLocalDate(),
        at: firebase.firestore.FieldValue.serverTimestamp(),
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });
      posted[code] = wantPos;
      done.push(code + " " + (delta > 0 ? "+" : "") + delta + " " +
        (snap.data().unit || "") +
        (per !== 1 ? " (" + qty + " " + (pUnit || "unit") + " x " + per + ")" : ""));
    }catch(e){
      console.error("post " + code, e);
      failed.push(code + " (" + (e.message||e) + ")");
    }
  }

  state.posPosted = state.posPosted || {};
  state.posPosted[dateStr] = posted;
  // Kept in the POS project, not the production one: the production database
  // rejects paths its rules do not know about, and this belongs next to the
  // inventory it guards anyway.
  try{
    await fs.collection("settings").doc("production_posted")
      .set({[dateStr]: posted}, {merge:true});
  }catch(e){ console.warn("posted marker:", e); }
  return {ok:true, done, skipped, failed};
}

let state = {
  staff: {},        // id -> {name, jobTitle, idNumber, account, rates:{code:rate}}
  products: DEFAULT_PRODUCTS,
  production: {},   // "YYYY-MM-DD" -> { staffId: {NGT:qty,...} }
  skus: DEFAULT_SKUS,
  materials: {},    // cutoffKey -> { skuCode: qty }
  sideJobs: {},     // cutoffKey -> { staffId: amount }
  ledger: {},        // staffId -> [ {id,type:'loan'|'fine'|'ca'|'payment'|'cashfund_add'|'cashfund_deduct',amount,date,note} ]
  deductions: {}     // cutoffKey -> { staffId: {sss,philhealth,pagibig} }
};
// Seeded before anything renders, so the batch rows know from the first paint
// which items are counted in packs.
state.posPack = readPackCache();

const LS_STATE_KEY = 'chowtimeProduction_state_v1';
const LS_CFG_KEY = 'chowtimeProduction_fbConfig_v1';

function loadLocalState(){
  try{
    const raw = localStorage.getItem(LS_STATE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      Object.keys(state).forEach(k=>{ if(saved[k]!==undefined) state[k]=saved[k]; });
    }
  }catch(e){ console.warn('Local storage unavailable, running in-memory only for this session.'); }
}
function persistLocalState(){
  try{ localStorage.setItem(LS_STATE_KEY, JSON.stringify(state)); }catch(e){}
}
function saveState(key, val){
  state[key] = val;
  persistLocalState();
  if(USE_FIREBASE && DB){
    return DB.ref('chowtimeProduction/'+key).set(val || {})
      .then(()=>'synced')
      .catch(err=>{
        console.error('Cloud save failed for', key, err);
        alert('Warning: this was saved on THIS DEVICE only — it could NOT reach the cloud database (error: '+err.message+'). It will not show up on other devices until this is fixed. Check the internet connection and try saving again.');
        return 'failed';
      });
  }
  return Promise.resolve('offline');
}
// Use this instead of multiple saveState() calls in a row when several sections change together
// (e.g. renaming a product code touches staff rates + production history + the product list at
// once). Multiple separate saveState() calls each fire the live listener as soon as they land,
// and a still-in-flight write can get silently overwritten by a snapshot taken between writes.
// A single update() writes everything atomically so the listener only ever sees the final result.
function saveStateMulti(updates){
  Object.keys(updates).forEach(k=>{ state[k]=updates[k]; });
  persistLocalState();
  if(USE_FIREBASE && DB){
    return DB.ref('chowtimeProduction').update(updates)
      .then(()=>'synced')
      .catch(err=>{
        console.error('Cloud save failed', err);
        alert('Warning: this was saved on THIS DEVICE only — it could NOT reach the cloud database (error: '+err.message+'). It will not show up on other devices until this is fixed.');
        return 'failed';
      });
  }
  return Promise.resolve('offline');
}
function initFirebase(cfgStr, fromSaved){
  try{
    const cfg = JSON.parse(cfgStr);
    if(firebase.apps.length) firebase.app().delete();
    firebase.initializeApp(cfg);
    DB = firebase.database();
    USE_FIREBASE = true;
    try{ localStorage.setItem(LS_CFG_KEY, cfgStr); }catch(e){}

    // Keep the badge honest: this checks Firebase's actual live connection state, not just
    // whether we successfully called initFirebase once. If the network drops, the badge
    // updates within seconds — so anyone can glance at it before assuming a save went through.
    DB.ref('.info/connected').on('value', snap=>{
      const badge = document.getElementById('connBadge');
      if(!badge) return;
      if(snap.val()===true){
        badge.textContent = 'Connected (synced)';
        badge.className = 'badge-conn on';
      } else {
        badge.textContent = 'Offline (local)';
        badge.className = 'badge-conn off';
      }
    });

    // Reconcile once before listening live: if the cloud copy is empty (or missing whole
    // sections) but this device already has local data, push the local copy up FIRST so a
    // fresh/empty cloud database never wipes out data that only ever lived on this device.
    DB.ref('chowtimeProduction').once('value').then(snap=>{
      const cloud = snap.val() || {};
      const sections = ['staff','products','production','skus','materials','sideJobs','ledger','deductions'];
      const updates = {};
      sections.forEach(key=>{
        const cloudHas = cloud[key] && Object.keys(cloud[key]).length>0;
        const localHas = state[key] && Object.keys(state[key]).length>0;
        if(!cloudHas && localHas) updates[key] = state[key];
      });
      const pushLocal = Object.keys(updates).length
        ? DB.ref('chowtimeProduction').update(updates)
        : Promise.resolve();
      pushLocal.finally(()=>{
        DB.ref('chowtimeProduction').on('value', snap2=>{
          const v = snap2.val() || {};
          state.staff = v.staff || {};
          state.products = v.products || DEFAULT_PRODUCTS;
          state.production = v.production || {};
          state.skus = v.skus || DEFAULT_SKUS;
          state.materials = v.materials || {};
          state.sideJobs = v.sideJobs || {};
          state.ledger = v.ledger || {};
          state.deductions = v.deductions || {};
          persistLocalState();
          render();
        });
      });
    });
    return true;
  }catch(e){
    if(!fromSaved) alert('Invalid Firebase config: '+e.message);
    return false;
  }
}

/* ================= HELPERS ================= */
function uid(){ return 'x'+Math.random().toString(36).slice(2,10); }
function fmt(n){ n = Number(n)||0; return n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function cutoffKeyFor(dateISO){
  const [y,m,d] = dateISO.split('-').map(Number);
  const half = d<=15 ? '1' : '2';
  return `${y}-${String(m).padStart(2,'0')}-C${half}`;
}
function cutoffLabel(key){
  const [y,m,half] = key.split('-');
  const monthName = new Date(Number(y), Number(m)-1, 1).toLocaleString('en-US',{month:'short'});
  return half==='C1' ? `${monthName} 1–15, ${y}` : `${monthName} 16–end, ${y}`;
}
function creditedQtyForStaff(dayData, productCode, staffId){
  if(!dayData || !dayData.products || !dayData.products[productCode]) return 0;
  const p = dayData.products[productCode];
  const staffOnBatch = p.staff || [];
  if(!staffOnBatch.includes(staffId)) return 0;
  if(!staffOnBatch.length) return 0;
  return (Number(p.qty)||0) / staffOnBatch.length;
}
function dailyIncomeForStaff(dayData, staffId){
  const s = state.staff[staffId]; if(!s) return 0;
  let total = 0;
  state.products.forEach(p=>{
    const qty = creditedQtyForStaff(dayData, p.code, staffId);
    const rate = Number((s.rates && s.rates[p.code]) || 0);
    total += qty*rate;
  });
  return total;
}
function cutoffDatesForKey(key){
  const [y,m,half] = key.split('-');
  const year=Number(y), month=Number(m);
  const start = half==='C1' ? 1 : 16;
  const end = half==='C1' ? 15 : new Date(year, month, 0).getDate();
  const dates=[];
  for(let d=start; d<=end; d++){
    dates.push(`${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  }
  return dates;
}
function staffCutoffProduction(staffId, cutoffKey){
  const dates = cutoffDatesForKey(cutoffKey);
  let total = 0; const byProduct = {};
  state.products.forEach(p=>byProduct[p.code]=0);
  dates.forEach(dISO=>{
    const day = state.production[dISO];
    if(!day) return;
    state.products.forEach(p=>{
      byProduct[p.code] += creditedQtyForStaff(day, p.code, staffId);
    });
    total += dailyIncomeForStaff(day, staffId);
  });
  return {total, byProduct};
}
function ledgerBalance(staffId){
  const entries = state.ledger[staffId] || [];
  let loanOwed=0, cashFund=0, totalOwedRaised=0, totalPaid=0;
  entries.forEach(e=>{
    if(e.type==='loan' || e.type==='fine' || e.type==='ca'){ loanOwed += Number(e.amount); totalOwedRaised += Number(e.amount); }
    if(e.type==='payment'){ loanOwed -= Number(e.amount); totalPaid += Number(e.amount); }
    if(e.type==='cashfund_add') cashFund += Number(e.amount);
    if(e.type==='cashfund_deduct') cashFund -= Number(e.amount);
  });
  return {loanOwed, cashFund, totalOwedRaised, totalPaid};
}
function activeStaffList(){
  return Object.entries(state.staff).map(([id,s])=>({id,...s}));
}
function allCutoffKeysWithData(){
  const keys = new Set();
  Object.keys(state.production).forEach(d=>keys.add(cutoffKeyFor(d)));
  Object.keys(state.materials).forEach(k=>keys.add(k));
  Object.keys(state.sideJobs).forEach(k=>keys.add(k));
  return Array.from(keys).sort().reverse();
}

/* ---------- PRODUCTION ENTRY ---------- */
let entryDate = todayISO();
function renderEntry(main){
  const staffList = activeStaffList();
  const day = state.production[entryDate] || {attendance:{}, ca:{}, products:{}};
  // default: if no attendance saved yet for this date, treat everyone as present

    <div class="row">
      <div style="min-width:200px"><label>Date</label><input type="date" id="entryDateInput" value="${entryDate}"></div>

    <h2>Who's in today</h2>

      <thead><tr><th>Item</th><th>Qty made</th><th>Credited to</th></tr></thead>
      <tbody>
        ${state.products.map(p=>{
          const pd = (day.products && day.products[p.code]) || {};
          const qty = pd.qty!=null ? pd.qty : '';
          const usePack = usesPackEntry(p.code);
          const per = packSizeOfCode(p.code);

          // loose so nothing is silently reinterpreted as packs.

          const loose = pd.loose!=null ? pd.loose
                        : (pd.packs!=null ? '' : qty);

                <div style="padding-top:12px;color:#5A5A5A">+</div>

        <tbody id="previewBody"></tbody>
      </table></div>

      // simplest: just refresh preview, leave per-item checkboxes as the user set them
      refreshPreview();
    });
  });
  document.querySelectorAll('.batchPacks,.batchLoose').forEach(el=>{
    el.addEventListener('input', ()=>{
      const code = el.dataset.code;
      const per  = packSizeOfCode(code) || 1;
      const packs = Number((document.querySelector(`.batchPacks[data-code="${code}"]`)||{}).value)||0;
      const loose = Number((document.querySelector(`.batchLoose[data-code="${code}"]`)||{}).value)||0;
      const hint = document.querySelector(`.packHint[data-code="${code}"]`);
      if(hint) hint.textContent = (packs||loose)
        ? (packs+' pack × '+per+(loose?(' + '+loose):'')+' = '+(packs*per+loose)+' pc')
        : ('1 pack = '+per+' pc');
      refreshPreview();
    });
  });
  document.querySelectorAll('.batchQty,.creditCheck').forEach(el=>{
    el.addEventListener('input', refreshPreview);
    el.addEventListener('change', refreshPreview);
  });

  function collectDayData(){
    const data = {attendance:{}, ca:{}, products:{}};
    document.querySelectorAll('.attCheck').forEach(cb=>{ data.attendance[cb.dataset.staff]=cb.checked; });
    document.querySelectorAll('.caInput').forEach(i=>{ const v=Number(i.value)||0; if(v>0) data.ca[i.dataset.staff]=v; });
    state.products.forEach(p=>{
      const staffIds = Array.from(document.querySelectorAll(`.creditCheck[data-code="${p.code}"]:checked`)).map(c=>c.dataset.staff);
      if(usesPackEntry(p.code)){
        const per   = packSizeOfCode(p.code) || 1;
        const packs = Number((document.querySelector(`.batchPacks[data-code="${p.code}"]`)||{}).value)||0;
        const loose = Number((document.querySelector(`.batchLoose[data-code="${p.code}"]`)||{}).value)||0;
        // qty stays PIECES — payroll reads it exactly as before, at the same
        // per-piece rate. packs/loose are kept only as a record of how the
        // figure was reached, and posBase marks it as already converted.
        const qty = Math.round((packs*per + loose)*1000)/1000;
        data.products[p.code] = {qty, packs, loose, per, posBase:true, staff: staffIds};
      }else{
        const qtyEl = document.querySelector(`.batchQty[data-code="${p.code}"]`);
        const qty = Number(qtyEl ? qtyEl.value : 0)||0;
        data.products[p.code] = {qty, staff: staffIds};
      }
    });
    return data;
  }
  function refreshPreview(){
    const tbody = document.getElementById('previewBody');
    if(!tbody) return;
    const data = collectDayData();
    tbody.innerHTML = staffList.map(s=>{
      const parts = [];
      let income=0;
      state.products.forEach(p=>{
        const cq = creditedQtyForStaff(data, p.code, s.id);
        if(cq>0){
          const rate = (s.rates&&s.rates[p.code])||0;
          income += cq*rate;
          parts.push(`${p.code}: ${cq.toFixed(1)}×₱${rate}`);
        }
      });
      const ca = data.ca[s.id]||0;
      return `<tr><td>${s.name}</td><td style="font-size:11px;color:#6b5a3a">${parts.join(', ')||'—'}</td><td><strong>₱${fmt(income)}</strong>${ca?` <span class="pill gold">CA ₱${fmt(ca)}</span>`:''}</td></tr>`;
    }).join('');
  }
  refreshPreview();

  // Refreshed quietly in the background. The screen is already drawn from the
  // cached sizes, so it is only redrawn when MAIN actually changed something —
  // no flicker on a normal day.
  loadPosPackInfo().then(r=>{ if(r && r.changed) render(); });

  document.getElementById('saveEntryBtn').onclick = ()=>{
    const emptyBatches = state.products.filter(p=>{
      const qty = usesPackEntry(p.code)
        ? ((Number((document.querySelector(`.batchPacks[data-code="${p.code}"]`)||{}).value)||0)
           *(packSizeOfCode(p.code)||1)
           +(Number((document.querySelector(`.batchLoose[data-code="${p.code}"]`)||{}).value)||0))
        : (Number((document.querySelector(`.batchQty[data-code="${p.code}"]`)||{}).value)||0);
      const staffCount = document.querySelectorAll(`.creditCheck[data-code="${p.code}"]:checked`).length;
      return qty>0 && staffCount===0;
    });
    if(emptyBatches.length){
      alert('These items have a quantity but no one credited: '+emptyBatches.map(p=>p.label).join(', ')+'. Check at least one staff box for each, or clear the quantity.');
      return;
    }
    state.production[entryDate] = collectDayData();
    const btn = document.getElementById('saveEntryBtn');
    btn.disabled = true; btn.textContent = 'Saving...';
    saveState('production', state.production).then(async result=>{
      // Post the finished quantities into MAIN's inventory. Done after the
      // production save succeeds, so a failed sync never credits stock that
      // was not recorded.
      let posMsg = '';
      try{
        const r = await postProductionToPOS(entryDate,
          state.production[entryDate].products);
        if(!r.ok){
          posMsg = '\n\n⚠ POS inventory NOT updated: ' + r.reason;
        }else{
          if(r.done.length)    posMsg += '\n\nPOS MAIN stock updated: ' + r.done.join(', ');
          if(r.skipped.length) posMsg += '\n\n⚠ Not linked to a POS item yet: ' +
            r.skipped.join(', ') + ' — set this in Settings › POS inventory link.';
          if(r.failed.length)  posMsg += '\n\n⚠ Failed: ' + r.failed.join(', ');
        }
      }catch(e){
        posMsg = '\n\n⚠ POS inventory NOT updated: ' + (e.message||e);
      }
      btn.disabled = false;
      if(result==='synced'){
        alert('✓ Saved and synced — this entry for '+entryDate+' is now visible on all connected devices.'+posMsg);
      } else if(result==='offline'){
        alert('⚠ Saved on THIS DEVICE ONLY (not connected to the cloud right now). This entry for '+entryDate+' will NOT appear anywhere else until this device reconnects.'+posMsg);
      }
      // 'failed' case already alerts inside saveState itself
      render();
    });
  };
}

/* ---------- PRODUCTION LOG (CALENDAR) ---------- */
let logMonth = todayISO().slice(0,7); // "YYYY-MM"
let logSelectedDate = todayISO();
function dayHasData(dateISO){
  const day = state.production[dateISO];
  if(!day) return false;
  const hasQty = day.products && Object.values(day.products).some(p=>Number(p.qty)>0);
  const hasCa = day.ca && Object.values(day.ca).some(v=>Number(v)>0);
  return hasQty || hasCa;
}
function renderLog(main){
  const [y,m] = logMonth.split('-').map(Number);
  const firstOfMonth = new Date(y, m-1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startWeekday = firstOfMonth.getDay(); // 0=Sun
  const monthLabel = firstOfMonth.toLocaleString('en-US',{month:'long',year:'numeric'});
  const staffList = activeStaffList();

  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  main.innerHTML = `
  <div class="card">
    <h2>Production Log — calendar</h2>
    <div class="msg info">Days highlighted in gold have production data saved. Tap any day to see what was entered, without paging through them one at a time.</div>
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
      <button class="btn ghost sm" id="logPrevBtn">← Prev</button>
      <strong style="color:var(--maroon);font-size:15px">${monthLabel}</strong>
      <button class="btn ghost sm" id="logNextBtn">Next →</button>
    </div>
    <div class="cal-grid">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(d===null) return `<div class="cal-cell empty-cell"></div>`;
        const dateISO = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const has = dayHasData(dateISO);
        const isSel = dateISO===logSelectedDate;
        return `<div class="cal-cell ${has?'has-data':''} ${isSel?'selected':''}" data-date="${dateISO}">
          <div class="cal-daynum">${d}</div>
          ${has?'<div class="cal-mark">● logged</div>':''}
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="card" id="logDetailCard"></div>
  `;

  document.getElementById('logPrevBtn').onclick = ()=>{
    const prev = new Date(y, m-2, 1);
    logMonth = `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}`;

// ── AUTOMATIC PER-CUTOFF DEDUCTION ───────────────────────
// Each debt carries its own perCutoff amount, so a fine can be paid down at
// ₱1,500 a cutoff while a cash advance runs at a different rate.
//
// Nothing is written to the ledger for it. The amount due by a given cutoff is
// derived: cutoffs elapsed since the debt × perCutoff, capped at the debt.
// A manually logged payment does not stack on top — whichever is further along
// wins — so a cutoff that was already settled by hand is never charged twice.
function cutoffsElapsed(fromISO, toKey){
  if(!fromISO || !toKey) return 0;
  const fk = cutoffKeyFor(fromISO);
  const [fy,fm,fh] = fk.split('-');
  const [ty,tm,th] = toKey.split('-');
  const fi = Number(fy)*24 + Number(fm)*2 + (fh==='C1'?0:1);
  const ti = Number(ty)*24 + Number(tm)*2 + (th==='C1'?0:1);
  return Math.max(0, ti - fi + 1);   // the debt's own cutoff counts as the first
}
function debtDeemedPaidBy(debt, manualPaid, cutoffKey){
  const amount = Number(debt.amount)||0;
  const per = Number(debt.perCutoff)||0;
  if(per<=0) return Math.min(amount, manualPaid);
  const scheduled = per * cutoffsElapsed(debt.date, cutoffKey);
  return Math.min(amount, Math.max(manualPaid, scheduled));
}
function prevCutoffKey(key){
  const [y,m,half] = key.split('-');
  if(half==='C2') return `${y}-${m}-C1`;
  const pm = Number(m)-1;
  return pm>=1 ? `${y}-${String(pm).padStart(2,'0')}-C2`
               : `${Number(y)-1}-12-C2`;
}
// What this cutoff actually takes off the pay: the step between what was due
// by the end of the previous cutoff and what is due by the end of this one.
function debtDueThisCutoff(debt, manualPaid, cutoffKey){
  const now  = debtDeemedPaidBy(debt, manualPaid, cutoffKey);
  const before = debtDeemedPaidBy(debt, manualPaid, prevCutoffKey(cutoffKey));
  return Math.max(0, Math.round((now-before)*100)/100);
}

function staffDebts(staffId){
  const entries = state.ledger[staffId] || [];
  const debts = entries.filter(e=>e.type==='loan'||e.type==='fine'||e.type==='ca');
  const typeLabels = {loan:'Loan', fine:'Fine / penalty', ca:'Cash advance'};
  return debts.map(d=>{
    const paid = entries.filter(e=>e.type==='payment' && e.debtId===d.id).reduce((a,e)=>a+Number(e.amount),0);
    // "paid" stays the hand-logged figure; deemedPaid also counts the
    // automatic schedule up to today, which is what the balance owes against.
    const deemed = debtDeemedPaidBy(d, paid, cutoffKeyFor(todayISO()));
    return {...d, typeLabel:typeLabels[d.type]||d.type, paid,
      deemedPaid: deemed,
      balance: Math.max(0, Math.round((Number(d.amount)-deemed)*100)/100)};
  }).sort((a,b)=> a.date<b.date?1:-1);
}
function staffDebtBalancesByType(staffId){
  const debts = staffDebts(staffId);
  const out = {loan:0, fine:0, ca:0};
  debts.forEach(d=>{ if(out[d.type]!=null) out[d.type]+=d.balance; });
  return out;
}

                ? `<div style="font-size:10px;color:#8A8A8A">₱${fmt(d.paid)} logged + ₱${fmt(d.deemedPaid-d.paid)} auto</div>`
                : ''}</td>
            <td>${d.balance>0.004?`<span class="pill bad">₱${fmt(d.balance)}</span>`:'<span class="pill good">paid off</span>'}</td>
            <td>${d.note||''}</td>
            <td><span class="tag-rm delLedger" data-key="${s.id}||${d.id}">✕</span></td>
          </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`;
  }).join('')}

  <div class="card">
    <h2>Payment history (all staff)</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Staff</th><th>Paid toward</th><th>Amount</th><th>Note</th><th></th></tr></thead>
      <tbody>
      ${renderPaymentRows()}
      </tbody>
    </table></div>
  </div>

  <div class="card">
    <h2>Cash fund ledger (all staff)</h2>
    <div class="table-wrap"><table>
      <thead><tr><th>Date</th><th>Staff</th><th>Type</th><th>Amount</th><th>Note</th><th></th></tr></thead>
      <tbody>
      ${renderCashFundRows()}
      </tbody>
    </table></div>
  </div>
  `;

  document.getElementById('lStaff').onchange = e=>{ renderLoans._lastStaff = e.target.value; renderLoans(main); };
  document.getElementById('lType').onchange = e=>{ renderLoans._lastType = e.target.value; renderLoans(main); };

  document.getElementById('addLedgerBtn').onclick = ()=>{
    const staffId = document.getElementById('lStaff').value;
    const type = document.getElementById('lType').value;
    const amount = Number(document.getElementById('lAmt').value)||0;
    if(!staffId || amount<=0){ alert('Choose staff and enter a valid amount'); return; }
    const entry = {id:uid(), type, amount, date:document.getElementById('lDate').value, note:document.getElementById('lNote').value.trim()};
    // 0 keeps the old behaviour for this debt: nothing comes off until a
    // payment is logged by hand.
    if(type!=='payment'){
      entry.perCutoff = Number(document.getElementById('lPerCutoff').value)||0;
    }
    if(type==='payment'){
      const debtId = document.getElementById('lDebtId').value;
      if(!debtId){ alert('Pick which debt this payment is for. If there are no open debts listed, this staff has nothing outstanding.'); return; }
      entry.debtId = debtId;
    }
    if(!state.ledger[staffId]) state.ledger[staffId]=[];
    state.ledger[staffId].push(entry);
    saveState('ledger', state.ledger);
    renderLoans._lastStaff = staffId;
    render();
  };

  document.querySelectorAll('.delLedger').forEach(b=>b.onclick=()=>{
    const [sid,eid]=b.dataset.key.split('||');
    if(confirm('Remove this entry? If it\'s a loan/fine/CA with payments already tagged to it, those payment records will stay but no longer be linked to anything.')){
      state.ledger[sid] = (state.ledger[sid]||[]).filter(e=>e.id!==eid);
      saveState('ledger', state.ledger);
      render();
    }
  });
}
function renderPaymentRows(){
  const rows=[];
  Object.entries(state.ledger).forEach(([sid,entries])=>{
    const name = state.staff[sid]?state.staff[sid].name:'(removed staff)';
    const debtsById = {};
    (entries||[]).forEach(e=>{ if(e.type==='loan'||e.type==='fine'||e.type==='ca') debtsById[e.id]=e; });
    (entries||[]).forEach(e=>{
      if(e.type!=='payment') return;
      const debt = debtsById[e.debtId];
      const typeLabels = {loan:'Loan', fine:'Fine / penalty', ca:'Cash advance'};
      const target = debt? `${typeLabels[debt.type]||debt.type} (${debt.date})` : '<span style="color:#C62828">unlinked</span>';
      rows.push({date:e.date, html:`<tr><td>${e.date}</td><td>${name}</td><td>${target}</td><td>₱${fmt(e.amount)}</td><td>${e.note||''}</td><td><span class="tag-rm delLedger" data-key="${sid}||${e.id}">✕</span></td></tr>`});
    });
  });
  if(!rows.length) return `<tr><td colspan="6" class="empty">No payments logged yet.</td></tr>`;
  rows.sort((a,b)=> a.date<b.date?1:-1);
  return rows.map(r=>r.html).join('');
}
function renderCashFundRows(){
  const rows=[];
  Object.entries(state.ledger).forEach(([sid,entries])=>{
    const name = state.staff[sid]?state.staff[sid].name:'(removed staff)';
    (entries||[]).forEach(e=>{
      if(e.type!=='cashfund_add' && e.type!=='cashfund_deduct') return;
      const typeLabel = {cashfund_add:'Cash fund +',cashfund_deduct:'Cash fund −'}[e.type];
      rows.push({date:e.date, html:`<tr><td>${e.date}</td><td>${name}</td><td>${typeLabel}</td><td>₱${fmt(e.amount)}</td><td>${e.note||''}</td><td><span class="tag-rm delLedger" data-key="${sid}||${e.id}">✕</span></td></tr>`});
    });
  });
  if(!rows.length) return `<tr><td colspan="6" class="empty">No cash fund entries yet.</td></tr>`;
  rows.sort((a,b)=> a.date<b.date?1:-1);
  return rows.map(r=>r.html).join('');
}

/* ---------- PAYSLIP ---------- */
function renderPayslip(main){
  const staffList = activeStaffList();
  const keys = allCutoffKeysWithData();
  if(!keys.includes(cutoffKeyFor(todayISO()))) keys.unshift(cutoffKeyFor(todayISO()));

  main.innerHTML = `
  <div class="card no-print">
    <h2>Generate payslip</h2>
    <div class="grid cols-2">
      <div><label>Staff</label><select id="psStaff">${staffList.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div>
      <div><label>Cutoff period</label><select id="psCutoff">${keys.map(k=>`<option value="${k}">${cutoffLabel(k)}</option>`).join('')}</select></div>
    </div>
    <h2 style="margin-top:14px">Statutory &amp; other deductions</h2>
    <div class="grid cols-3">
      <div><label>SSS</label><input id="psSss" type="number" step="any" value="0"></div>
      <div><label>PhilHealth</label><input id="psPhil" type="number" step="any" value="0"></div>
      <div><label>Pag-IBIG</label><input id="psPagibig" type="number" step="any" value="0"></div>
    </div>
    <div class="foot-actions"><button class="btn gold" id="genBtn">Generate</button></div>
  </div>
  <div id="payslipOut"></div>
  `;

  document.getElementById('genBtn').onclick = ()=>genPayslip();
  document.getElementById('psStaff').onchange = ()=>genPayslip();
  document.getElementById('psCutoff').onchange = ()=>genPayslip();
  function genPayslip(){
    const sid = document.getElementById('psStaff').value;
    const ck = document.getElementById('psCutoff').value;
    const s = state.staff[sid];
    if(!s) return;
    const {total, byProduct} = staffCutoffProduction(sid, ck);
    const side = (state.sideJobs[ck]||{})[sid] || 0;
    const gross = total + side;
    const sss = Number(document.getElementById('psSss').value)||0;
    const phil = Number(document.getElementById('psPhil').value)||0;
    const pagibig = Number(document.getElementById('psPagibig').value)||0;

    // this cutoff's actual deduction is whatever "Payment received" was logged this cutoff —
    // categorized by which debt (loan/fine/CA) each payment was tagged to. Issuing a loan,
    // fine, or cash advance itself doesn't touch payroll; only a logged payment does, whenever
    // and however much it's actually paid.
    const dates = new Set(cutoffDatesForKey(ck));
    const entries = (state.ledger[sid]||[]).filter(e=>dates.has(e.date));
    const allDebts = staffDebts(sid);
    const debtsById = {}; allDebts.forEach(d=>{ debtsById[d.id]=d; });
    const paymentsThisCutoff = entries.filter(e=>e.type==='payment');
    const payByType = {loan:0, fine:0, ca:0, unlinked:0};
    paymentsThisCutoff.forEach(p=>{
      const d = debtsById[p.debtId];
      if(d && payByType[d.type]!=null) payByType[d.type]+=Number(p.amount);
      else payByType.unlinked+=Number(p.amount);
    });
    const deductionPayment = paymentsThisCutoff.reduce((a,e)=>a+Number(e.amount),0);
    const balByType = staffDebtBalancesByType(sid);
    const cashfund = entries.filter(e=>e.type==='cashfund_deduct').reduce((a,e)=>a+Number(e.amount),0);
    const currentBalance = ledgerBalance(sid).loanOwed;
    let caTotal = 0;
    cutoffDatesForKey(ck).forEach(d=>{
      const day = state.production[d];
      if(day && day.ca) caTotal += Number(day.ca[sid]||0);
    });

    const totalDeduction = sss+phil+pagibig+deductionPayment+autoTotal+caTotal+cashfund;
    const net = gross - totalDeduction;

    // Automatic schedule. Each debt with a perCutoff contributes its step for
    // this cutoff; a hand-logged payment in the same cutoff counts toward it
    // rather than on top of it.
    const autoByType = {loan:0, fine:0, ca:0};
    allDebts.forEach(d=>{
      if(!(Number(d.perCutoff)>0)) return;
      const manualHere = paymentsThisCutoff
        .filter(p=>p.debtId===d.id).reduce((a,p)=>a+Number(p.amount),0);
      const due = debtDueThisCutoff(d, Number(d.paid)||0, ck);
      const extra = Math.max(0, due - manualHere);
      if(autoByType[d.type]!=null) autoByType[d.type]+=extra;
    });
    const autoTotal = autoByType.loan+autoByType.fine+autoByType.ca;

    const deductionRows = [
      {label:'Loan payment', pay:payByType.loan+autoByType.loan, bal:balByType.loan},
      {label:'Fine / penalty payment', pay:payByType.fine+autoByType.fine, bal:balByType.fine},
      {label:'Cash advance payment', pay:payByType.ca+autoByType.ca, bal:balByType.ca}
    ].filter(r=>r.pay>0.004 || r.bal>0.004);

    document.getElementById('payslipOut').innerHTML = `
    <div class="card">
      <div class="payslip">
        <h3>CHOWTIME PRODUCTION</h3>
        <div class="sub">Official Payslip — ${cutoffLabel(ck)}</div>
        <table style="width:100%">
          <tr><td>Employee ID</td><td>${s.idNumber||'—'}</td></tr>
          <tr><td>Name</td><td><strong>${s.name}</strong></td></tr>
          <tr><td>Position</td><td>${s.jobTitle||''}</td></tr>
        </table>
        <h4 style="color:var(--maroon);margin:12px 0 4px">Production earnings</h4>
        <table style="width:100%">
          ${state.products.map(p=>{
            const qty = byProduct[p.code]||0;
            const rate = (s.rates&&s.rates[p.code])||0;
            return `<tr><td>${p.label}</td><td>${fmt(qty)}</td><td>₱${fmt(rate)}</td><td>₱${fmt(qty*rate)}</td></tr>`;
          }).join('')}
          ${side>0?`<tr><td colspan="3">Side job / income share</td><td>₱${fmt(side)}</td></tr>`:''}
          <tr class="total-row"><td colspan="3">Gross Salary</td><td>₱${fmt(gross)}</td></tr>
        </table>
        <h4 style="color:var(--maroon);margin:12px 0 4px">Deductions</h4>
        <table style="width:100%">
          <tr><td>SSS</td><td>₱${fmt(sss)}</td></tr>
          <tr><td>PhilHealth</td><td>₱${fmt(phil)}</td></tr>
          <tr><td>Pag-IBIG</td><td>₱${fmt(pagibig)}</td></tr>
          <tr><td>Cash Advance (same-day)</td><td>₱${fmt(caTotal)}</td></tr>
          ${deductionRows.map(r=>`
            <tr><td>${r.label}</td><td>₱${fmt(r.pay)}</td></tr>
            <tr><td style="padding-left:16px;font-size:11px;color:#5A5A5A">→ remaining balance</td><td style="font-size:11px;color:#5A5A5A">₱${fmt(r.bal)}</td></tr>
          `).join('')}
          ${payByType.unlinked>0?`<tr><td>Other payment (unlinked)</td><td>₱${fmt(payByType.unlinked)}</td></tr>`:''}
          <tr><td>Cash Fund payout</td><td>₱${fmt(cashfund)}</td></tr>
          <tr class="total-row"><td>Total Deductions</td><td>₱${fmt(totalDeduction)}</td></tr>
        </table>
        <table style="width:100%">
          <tr class="total-row"><td>NET SALARY</td><td>₱${fmt(net)}</td></tr>
        </table>
        <div class="sub" style="margin-top:10px">Account: ${s.account||'—'} &nbsp;•&nbsp; Total remaining balance (all deductions): ₱${fmt(currentBalance)} &nbsp;•&nbsp; Generated ${new Date().toLocaleDateString()}</div>
      </div>
      <div class="foot-actions no-print">
        <button class="btn ghost" onclick="window.print()">Print / Save PDF</button>
        <button class="btn ghost" id="emailBtn">Email payslip</button>
        <button class="btn gold" id="pushFeedBtn">Send to HRIS feed</button>
      </div>
      <div id="feedStatus" class="msg info no-print" style="display:none;margin-top:10px"></div>
    </div>`;

    document.getElementById('emailBtn').onclick = ()=>{
      if(!s.email){
        alert(`No email on file for ${s.name}. Add one in the Staff & Rates tab (tap "Edit" next to their name), then try again.`);
        return;
      }
      const lines = [];
      lines.push(`CHOWTIME PRODUCTION — PAYSLIP`);
      lines.push(cutoffLabel(ck));
      lines.push('');
      lines.push(`Employee ID: ${s.idNumber||'—'}`);
      lines.push(`Name: ${s.name}`);
      lines.push(`Position: ${s.jobTitle||''}`);
      lines.push('');
      lines.push('PRODUCTION EARNINGS');
      state.products.forEach(p=>{
        const qty = byProduct[p.code]||0;
        const rate = (s.rates&&s.rates[p.code])||0;
        if(qty>0) lines.push(`  ${p.label}: ${fmt(qty)} x ₱${fmt(rate)} = ₱${fmt(qty*rate)}`);
      });
      if(side>0) lines.push(`  Side job / income share: ₱${fmt(side)}`);
      lines.push(`  Gross Salary: ₱${fmt(gross)}`);
      lines.push('');
      lines.push('DEDUCTIONS');
      lines.push(`  SSS: ₱${fmt(sss)}`);
      lines.push(`  PhilHealth: ₱${fmt(phil)}`);
      lines.push(`  Pag-IBIG: ₱${fmt(pagibig)}`);
      lines.push(`  Cash Advance (same-day): ₱${fmt(caTotal)}`);
      deductionRows.forEach(r=>{
        lines.push(`  ${r.label}: ₱${fmt(r.pay)}  (remaining balance: ₱${fmt(r.bal)})`);
      });
      if(payByType.unlinked>0) lines.push(`  Other payment (unlinked): ₱${fmt(payByType.unlinked)}`);
      lines.push(`  Cash Fund payout: ₱${fmt(cashfund)}`);
      lines.push(`  Total Deductions: ₱${fmt(totalDeduction)}`);
      lines.push('');
      lines.push(`NET SALARY: ₱${fmt(net)}`);
      lines.push('');
      lines.push(`Account: ${s.account||'—'}`);
      lines.push(`Total remaining balance (all deductions): ₱${fmt(currentBalance)}`);
      lines.push('');
      lines.push('---');
      lines.push('If you have no concerns or questions about this payslip, please reply to this email');
      lines.push('with a photo of your Bank/GCash QR code so we can process your payment.');
      const subject = `Chowtime Production Payslip — ${cutoffLabel(ck)}`;
      const body = lines.join('\n');
      window.location.href = `mailto:${encodeURIComponent(s.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    };

    document.getElementById('pushFeedBtn').onclick = ()=>{
      pushToHrisFeed(sid, ck, {
        staffName: s.name, idNumber: s.idNumber||'', jobTitle: s.jobTitle||'',
        gross: Number(gross.toFixed(2)), deductions: Number(totalDeduction.toFixed(2)),
        net: Number(net.toFixed(2)), account: s.account||'',
        breakdown: {production: Number(total.toFixed(2)), sideJobs: Number(side.toFixed(2)),
          sss, philhealth: phil, pagibig, cashAdvance: caTotal, loanPayment: payByType.loan, finePayment: payByType.fine, caPayment: payByType.ca, cashFundPayout: cashfund},
        remainingBalanceByType: {loan: Number(balByType.loan.toFixed(2)), fine: Number(balByType.fine.toFixed(2)), ca: Number(balByType.ca.toFixed(2))},
        remainingDeductionBalance: Number(currentBalance.toFixed(2)),
        cutoffLabel: cutoffLabel(ck), pushedAt: new Date().toISOString()
      });
    };
  }
  genPayslip();
}

/* Publishes a read-only summary to a NEW, isolated Firebase node so it never
   touches or overwrites anything the existing HRIS files (chowtime-payroll.html,
   chowtime-kiosk.html, chowtime-setup.html) already read or write. Nothing in
   those files needs to change for this to be safe — it only becomes "connected"
   the day you choose to add a small read-only lookup to the HRIS payroll page. */
function pushToHrisFeed(staffId, cutoffKey, payload){
  const statusEl = document.getElementById('feedStatus');
  statusEl.style.display='block';
  if(!USE_FIREBASE || !DB){
    statusEl.className='msg warn no-print';
    statusEl.textContent = 'Not connected to Firebase yet — go to Settings and paste your firebaseConfig first, then this figure can be sent to the shared database.';
    return;
  }
  DB.ref(`hrisProductionFeed/${cutoffKey}/${staffId}`).set(payload)
    .then(()=>{
      statusEl.className='msg info no-print';
      statusEl.textContent = `Sent — saved under hrisProductionFeed/${cutoffKey}/${staffId} in Firebase. This is a separate node; your existing HRIS payroll page is untouched unless you later add a lookup for it.`;
    })
    .catch(err=>{
      statusEl.className='msg err no-print';
      statusEl.textContent = 'Could not send: '+err.message;
    });
}

function exportCsv(){
  const rows = [['Date','Staff', ...state.products.map(p=>p.code+' (credited qty)'),'CA','Day Income']];
  Object.keys(state.production).sort().forEach(dISO=>{
    const day = state.production[dISO];
    activeStaffList().forEach(s=>{
      const credited = state.products.map(p=>creditedQtyForStaff(day, p.code, s.id).toFixed(2));
      const ca = (day.ca && day.ca[s.id]) || 0;
      const income = dailyIncomeForStaff(day, s.id);
      if(income===0 && ca===0) return; // skip staff with nothing recorded that day
      rows.push([dISO, s.name, ...credited, ca, income.toFixed(2)]);
    });
  });
  const csv = rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  downloadBlob(csv, 'chowtime_production_log.csv', 'text/csv');
}
function exportJson(){
  downloadBlob(JSON.stringify(state,null,2), 'chowtime_production_backup.json', 'application/json');
}
function downloadBlob(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
