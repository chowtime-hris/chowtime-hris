        h("button",{onClick:issueDR,
          style:{flex:1,padding:"11px",
            background:`linear-gradient(135deg,${C.primary},${C.dark})`,
            border:"none",borderRadius:9,color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}},
          "✅ Issue DR → Update Branch Inventory")
      )
    )
  );
}

// ─── DR CHECK FORM (Branch confirms receipt, flags discrepancy) ──
function DRCheckForm({po,db,branchId,user,showT,INIT_INVENTORY,setAdvances,advances,branches=BRANCHES}){
  const [receivedQtys,setReceivedQtys]=useState(
    (po.deliveredItems||po. items||[]).reduce((acc,i)=>({...acc,[i.id]:i.actualQty!=null?i.actualQty:i.qty}),[])
  );
  const [discNotes,setDiscNotes]=useState("");
  const [expanded,setExpanded]=useState(true);

  const confirmReceipt=async()=>{
    // Re-read before applying. A double tap, or two tablets in the same
    // stockroom, would otherwise add the delivery to branch stock twice —
    // and there is no way to tell that apart from a real second delivery.
    try{
      const live=await getDoc(doc(db,"advances",po._docId));
      const st=live.exists()?(live.data().status||""):"";
      if(st==="completed"||st==="discrepancy"){
        showT("Already received — refresh to see the record","warn");
        onClose(); return;
      }
    }catch(e0){}
    const received=(po.deliveredItems||po. items||[]).map(i=>{
      // expected = what the DR says was issued (fall back to what was ordered)
      const expected = (i.actualQty!=null) ? i.actualQty : i.qty;
      // FIX: was `a ?? b!=null ? b : c` — ?? binds tighter than ?:, so the
      // number the receiver typed was evaluated as a boolean and thrown away.
      // Typing 7 gave 10; typing 0 gave the full ordered qty.
      const got = (receivedQtys[i.id]!=null && receivedQtys[i.id]!=="")
        ? (parseFloat(receivedQtys[i.id])||0)
        : expected;
      return {...i, receivedQty:got, expectedQty:expected, discrepancy:got-expected};
    });
    const hasDisc=received.some(i=>i.discrepancy!==0);
    try{
      await updateDoc(doc(db,"advances",po._docId),{
        status:"delivered",
        receivedItems:received,
        hasDiscrepancy:hasDisc,
        discrepancyNotes:discNotes,
        confirmedBy:user.name,
        confirmedAt:serverTimestamp()
      });
      // Update branch inventory with actual received qty
      const invCol="inventory_"+branchId;
    const isMainDest=false;   // this path only ever writes to a branch
      for(const  item of received){
        try{
          const ref=doc(db,invCol, item.id);
          const cur=await getDoc(ref);
          if(!cur.exists()){
            // first time this branch carries the  item — adopt it from Main
            let meta={};
            try{
              const m=await getDoc(doc(db,"inventory", item.id));
              if(m.exists())meta=m.data();
            }catch(e0){}
            await setDoc(ref,Object.assign({},meta,{
              id: item.id,
              name:meta.name|| item.name|| item.id,
              unit:meta.unit|| item.unit||"pc",
              cat:meta.cat||"Other",
              packUnit:meta.packUnit|| item.packUnit||"",
              packSize:Number(meta.packSize|| item.packSize)||0,
              // what THIS branch paid Main for it, not Main's own cost
              cost:isMainDest?(Number(meta.cost)||0)
                :(Number( item.price)||Number(meta.price)||0),
              price:Number(meta.price)||0,
              minStock:0,   // branch sets its own reorder point, not Main's
              branch:branchId,
              stock:Number( item.receivedQty)||0,
              lots:lotsAdd([],Number( item.receivedQty)||0,
                Number( item.price)||0,po.poNum||"",Date.now()),
              adoptedFrom:"main",
              adoptedAt:serverTimestamp(),
              lastRestocked:serverTimestamp()
            }),{merge:true});
          }else{
            await updateDoc(ref,{
              stock:increment( item.receivedQty||0),
              lastRestocked:serverTimestamp()
            });
          }
        }catch(e){
          const base=INIT_INVENTORY.find(i=>i.id=== item.id)||{};
          await setDoc(doc(db,invCol, item.id),{
            ...base,id: item.id,branch:branchId,
            stock: item.receivedQty||0,lastRestocked:serverTimestamp()
          });
        }
      }
      const shortLines=received.filter(i=>(i.discrepancy||0)!==0);
      await notify(db,{to:"ct-main",
        type:hasDisc?"discrepancy":"po_received",
        title:hasDisc?" There is discrepancy — "+(po.branchName||branchId)
                     :"Received — "+(po.branchName||branchId),
        message:hasDisc
          ?shortLines.map(i=>i.name+" "+(i.discrepancy>0?"+":"")+i.discrepancy).join(", ")
          :received.length+"  item/s received in full",
        page:"po_monitor",ref:po.drNum||po.poNum||"",by:user.name});
      if(hasDisc){
        await notify(db,{to:branchId,type:"discrepancy",
          title:"Discrepancy recorded",
          message:shortLines.length+"  item/s differ from the DR",
          page:"stock_order",ref:po.drNum||po.poNum||"",by:user.name});
      }
      showT(hasDisc?"Receipt confirmed with discrepancy ⚠️":"Receipt confirmed ✓ Inventory updated!",hasDisc?"warn":"ok");
    }catch(e){showT("Error confirming receipt","err");}
  };

  const printDR=()=>{
    const w=window.open("","_blank","width=400,height=600");
    if(!w)return;
    const  items=po.deliveredItems||po. items||[];
    w.document.write(`<!DOCTYPE html><html><head><title>DR</title>
    <style>*{margin:0;padding:0;}body{font-family:'Courier New',monospace;font-size:11px;width:80mm;margin:0 auto;padding:8px;}
    .c{text-align:center;}.b{font-weight:bold;}.hr{border-top:1px dashed #000;margin:6px 0;}
    .row{display:flex;justify-content:space-between;}</style></head><body>
    <div class="c"><b style="font-size:14px">DELIVERY RECEIPT</b><br>CHOWTIME COMMISSARY<br>${po.drNum||('DR-'+po.poNum)}</div>
    <div class="hr"></div>
    <div class="row"><span>PO#: ${po.poNum}</span><span>${po.deliveryDate||po.date}</span></div>
    <div class="row"><span>Branch: ${branches.find(b=>b.id===po.branch)?.full||po.branch}</span></div>
    <div class="row"><span>Issued by: ${po.issuedBy||"Commissary"}</span></div>
    <div class="hr"></div>
    <div class="b">ITEMS DELIVERED:</div>
    ${ items.map(i=>`<div class="row"><span>${i.name}</span><span>${i.actualQty!=null?i.actualQty:i.qty} ${i.unit}</span></div>
    <div style="padding-left:10px;font-size:9px">PO Qty: ${i.qty} ${i.unit}</div>`).join("")}
    <div class="hr"></div>
    <div>Received by: ________________</div>
    <div>Signature: ________________</div>
    <div>Date: ________________</div>
    <div class="hr"></div>
    <div class="c">CHOWTIME FAST-FOOD CHAIN<br>This DR is your proof of delivery.</div>
    </body></html>`);
    w.document.close();setTimeout(()=>w.print(),400);
  };

  return h("div",{style:{background:"#fff",borderRadius:12,border:"2px solid "+C.info,marginBottom:10,overflow:"hidden"}},
    h("div",{style:{background:"#E3F2FD",padding:"12px 16px",display:"flex",alignItems:"center",gap:10}},
      h("div",{style:{flex:1}},
        h("div",{style:{fontSize:14,fontWeight:800}},po.drNum||po.poNum+" — For Receipt"),
        h("div",{style:{fontSize:13,color:C.info,marginTop:1}},"Delivery Date: "+(po.deliveryDate||"—")+" · Issued by: "+(po.issuedBy||"Commissary"))
      ),
      h("button",{onClick:()=>printDR(companySettings),style:{padding:"5px 11px",background:C.info,border:"none",borderRadius:7,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}},"🖨️ Print DR")
    ),
    h("div",{style:{padding:"12px 16px"}},
      h("div",{style:{fontSize:12,fontWeight:800,color:C.muted,marginBottom:8,letterSpacing:1}},"VERIFY ACTUAL RECEIVED QTY (edit if different from DR)"),
      h("div",{style:{display:"grid",gap:5}},
        (po.deliveredItems||po. items||[]).map( item=>{
          const drQty= item.actualQty?? item.qty;
          const received=receivedQtys[ item.id]??drQty;
          const diff=received-drQty;
          return h("div",{key: item.id,style:{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:8,background:diff!==0?"#FFEBEE":"#f9f9f9",border:diff!==0?"1px solid #FFCDD2":"1px solid transparent"}},
            h("div",{style:{flex:1}},
              h("div",{style:{fontSize:13,fontWeight:700}}, item.name),
              h("div",{style:{fontSize:12,color:C.muted}},"DR Qty: "+drQty+" "+ item.unit+" (PO: "+ item.qty+")")
            ),
            h("div",{style:{display:"flex",alignItems:"center",gap:7}},
              h("button",{onClick:()=>setReceivedQtys(p=>({...p,[ item.id]:Math.max(0,(p[ item.id]??drQty)-(Number( item.packSize)||1))})),
                style:{width:26,height:26,borderRadius:6,border:"1px solid "+C.border,background:"#fff",cursor:"pointer",fontSize:14,fontWeight:900}},"−"),
              h("span",{style:{minWidth:32,textAlign:"center",fontWeight:900,fontSize:13,color:diff<0?C.danger:diff>0?C.info:C.success}},received),
              h("button",{onClick:()=>setReceivedQtys(p=>({...p,[ item.id]:(p[ item.id]??drQty)+(Number( item.packSize)||1)})),
                style:{width:26,height:26,borderRadius:6,border:`1px solid ${C.primary}`,background:"#F3E9F7",cursor:"pointer",fontWeight:900,color:C.primary,fontSize:14}},"+"),
              diff!==0&&h("span",{style:{fontSize:12,fontWeight:700,color:diff<0?C.danger:C.info}},
                (diff>0?"+":"")+diff+" ⚠️")
            )
          );
        })
      ),
      (po.deliveredItems||po. items||[]).some(i=>(receivedQtys[i.id]??i.actualQty!=null?i.actualQty:i.qty)!==(i.actualQty!=null?i.actualQty:i.qty))&&
        h("div",{style:{marginTop:10}},
          h("div",{style:{fontSize:12,fontWeight:700,color:C.muted,marginBottom:4,letterSpacing:1}},"DISCREPANCY NOTES"),
          h("textarea",{value:discNotes,onChange:e=>setDiscNotes(e.target.value),
            placeholder:"Describe missing/damaged  items...",
            style:{width:"100%",padding:"8px",border:"1px solid "+C.warning,borderRadius:7,fontSize:13,outline:"none",resize:"none",height:52,boxSizing:"border-box",fontFamily:"inherit"}})
        ),
      h("button",{onClick:confirmReceipt,
        style:{marginTop:12,width:"100%",padding:"11px",background:`linear-gradient(135deg,${C.success},${"#2e7d32"}`,border:"none",borderRadius:9,color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}},
        "✅ Confirm Receipt & Update Inventory")
    )
  );
}


// ─── CASH COUNT / DENOMINATION COMPONENT ─────────────────
const DENOMS = [
  {label:"₱1,000",value:1000,type:"bill",color:"#1565C0"},
  {label:"₱500", value:500, type:"bill",color:"#2E7D32"},
  {label:"₱200", value:200, type:"bill",color:"#BF360C"},
  {label:"₱100", value:100, type:"bill",color:"#6A1B9A"},
  {label:"₱50",  value:50,  type:"bill",color:"#AD1457"},
  {label:"₱20",  value:20,  type:"bill",color:"#00695C"},
  {label:"₱10",  value:10,  type:"coin",color:"#4E342E"},
  {label:"₱5",   value:5,   type:"coin",color:"#37474F"},
  {label:"₱1",   value:1,   type:"coin",color:"#546E7A"},
  {label:"25¢",  value:0.25,type:"coin",color:"#78909C"},
];

function CashCountPage({branchId,curBranch,user,db,orders,cashLog,showT}){
  const today = localDate();
  const [counts,setCounts]   = useState(DENOMS.reduce((a,d)=>({...a,[d.value]:0}),{}));
  const [remit,setRemit]     = useState("");
  const [countNote,setNote]  = useState("");
  const [history,setHistory] = useState([]);
  const [loading,setLoading] = useState(true);
  const [saved,setSaved]     = useState(false);
  const [selDate,setSelDate] = useState(today);
  const [showHistory,setShowHistory] = useState(false);
  const [cashEntry,setCashEntry] = useState({type:"in",desc:"",amount:""});
  const [addingCash,setAddingCash] = useState(false);

  // Load today's existing count + history from Firebase
  useEffect(()=>{
    if(!branchId)return;
    // no orderBy: that would need a composite index this project does not
    // have, and the failure is silent — the history simply never loads
    const q = query(
      collection(db,"cash_counts"),
      where("branch","==",branchId),
      limit(120)
    );
    const unsub = onSnapshot(q, snap=>{
      const all = snap.docs.map(d=>({...d.data(),_docId:d.id}))
        .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
      setHistory(all);
      // Load today's count if exists
      const todayCount = all.find(c=>c.date===today);
      if(todayCount){
        setCounts(todayCount.counts||DENOMS.reduce((a,d)=>({...a,[d.value]:0}),{}));
        setRemit(todayCount.remittance?.toString()||"");
        setNote(todayCount.note||"");
        setSaved(true);
      }
      setLoading(false);
    },err=>{
      console.error("cash_counts query failed:",err);
      showT("Cash count: "+String(err&&err.message||"query failed").slice(0,90),"err");
      setLoading(false);
    });
    return()=>unsub();
  },[branchId,today]);

  const totalCash = DENOMS.reduce((s,d)=>s+(counts[d.value]||0)*d.value, 0);
  const billsTotal = DENOMS.filter(d=>d.type==="bill").reduce((s,d)=>s+(counts[d.value]||0)*d.value,0);
  const coinsTotal = DENOMS.filter(d=>d.type==="coin").reduce((s,d)=>s+(counts[d.value]||0)*d.value,0);

  // Net sales from POS orders today
  const isToday=(o)=>{
    if(o.date) return o.date===today;
    const t=o.timestamp&&o.timestamp.toDate?o.timestamp.toDate():null;
    return t?localDate(t)===today:false;
  };
  // Cash counts reconcile the DRAWER, so only cash tenders belong here —
  // GCash / card sales never touch it.
  const todaySales = orders
    .filter(o=>o.branch===branchId
      &&o.status!=="cancelled"&&o.status!=="void"
      &&(o.payMethod||"cash")==="cash"
      &&isToday(o))
    .reduce((s,o)=>s+(o.total||0),0);

  const todayCash=(cashLog||[]).filter(c=>c.branch===branchId&&(c.date===today||isToday(c)));
  const isOpeningEntry=(c)=>c.type==="in"&&/opening/i.test(c.desc||"");
  // Opening is its own line, so it must not also count as Cash In
  const cashIn  = todayCash.filter(c=>c.type==="in"&&!isOpeningEntry(c))
    .reduce((s,c)=>s+(Number(c.amount)||0),0);
  const cashOut = todayCash.filter(c=>c.type==="out")
    .reduce((s,c)=>s+(Number(c.amount)||0),0);

  // Opening fund, in order of authority:
  //   1. an Opening Fund entry recorded today (what the crew actually put in)
  //   2. yesterday's closing balance, carried over automatically
  const loggedOpening = todayCash.filter(isOpeningEntry)
    .reduce((s,c)=>s+(Number(c.amount)||0),0);
  const prevRecord = history.find(c=>c.date<today&&c.closingBalance!==undefined);
  const carriedOpening = prevRecord?.closingBalance ?? 0;
  const openingFund = loggedOpening>0 ? loggedOpening : carriedOpening;
  const openingSource = loggedOpening>0 ? "logged" : (carriedOpening>0?"carried":"none");

  const remittanceAmt = parseFloat(remit)||0;
  const closingBalance = totalCash - remittanceAmt;
  const expectedCash = openingFund + todaySales + cashIn - cashOut;
  const variance = totalCash - expectedCash;

  // Cash movements are recorded HERE, not on the monitoring dashboard —
  // this is the page the crew opens at shift start and shift end, and the
  // opening fund is the first line of the count.
  const addCashEntry = async()=>{
    const amt=parseFloat(cashEntry.amount)||0;
    if(!cashEntry.desc.trim()){showT("Enter a description","warn");return;}
    if(amt<=0){showT("Enter an amount","warn");return;}
    setAddingCash(true);
    try{
      const now=new Date();
      await addDoc(collection(db,"cash_log"),{
        branch:branchId,type:cashEntry.type,
        desc:cashEntry.desc.trim(),amount:amt,
        date:localDate(now),
        time:now.toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit"}),
        by:user.name,timestamp:serverTimestamp(),at:serverTimestamp()
      });
      setCashEntry({type:"in",desc:"",amount:""});
      showT("Cash "+(cashEntry.type==="in"?"In":"Out")+" recorded \u2713");
    }catch(e){
      console.error("cash entry failed:",e);
      showT("Failed: "+String(e&&e.message||e).slice(0,70),"err");
    }
    setAddingCash(false);
  };

  const saveCashCount = async(isClosing=false)=>{
    if(totalCash===0&&!isClosing){showT("Enter denominations first","warn");return;}
    try{
      const payload = {
        branch: branchId,
        branchName: curBranch.full,
        date: today,
        counts,
        totalCash,
        billsTotal,
        coinsTotal,
        openingFund,
        openingSource,
        todaySales,
        cashIn,
        cashOut,
        expectedCash,
        variance,
        remittance: remittanceAmt,
        closingBalance,
        note: countNote,
        countedBy: user.name,
        isClosing,
        timestamp: serverTimestamp(),
      };
      // Use date+branch as document ID so it upserts
      await setDoc(
        doc(db,"cash_counts",branchId+"_"+today),
        payload
      );
      setSaved(true);
      showT(isClosing?"Closing count saved! ₱"+peso(closingBalance)+" carried over ✓":"Cash count saved ✓");
    }catch(e){showT("Save failed","err");console.error(e);}
  };

  const printCount = (isClosing=false)=>{
    const w=window.open("","_blank","width=400,height=700");
    if(!w)return;
    w.document.write(`<!DOCTYPE html><html><head><title>Cash Count</title>
    <style>*{margin:0;padding:0;}body{font-family:'Courier New',monospace;font-size:11px;width:80mm;margin:0 auto;padding:8px;}
    .c{text-align:center;}.b{font-weight:bold;}.hr{border-top:1px dashed #000;margin:6px 0;}
    .row{display:flex;justify-content:space-between;margin-bottom:2px;}</style></head><body>
    <div class="c"><b>${isClosing?"CLOSING":"CASH COUNT"} REPORT</b><br>
    CHOWTIME - ${curBranch.full}<br>${today}<br>Counted by: ${user.name}</div>
    <div class="hr"></div>
    <div class="b">DENOMINATION BREAKDOWN:</div>
    ${DENOMS.map(d=>(counts[d.value]||0)>0?
      `<div class="row"><span>${d.label} x ${counts[d.value]}</span><span>P${peso(((counts[d.value]||0)*d.value))}</span></div>`:""
    ).join("")}
    <div class="hr"></div>
    <div class="row"><span>Bills Total:</span><span>P${peso(billsTotal)}</span></div>
    <div class="row"><span>Coins Total:</span><span>P${peso(coinsTotal)}</span></div>
    <div class="row b"><span>TOTAL CASH:</span><span>P${peso(totalCash)}</span></div>
    <div class="hr"></div>
    <div class="row"><span>Opening Fund:</span><span>P${peso(openingFund)}</span></div>
    <div class="row"><span>Today's Sales:</span><span>P${peso(todaySales)}</span></div>
    <div class="row"><span>Cash In:</span><span>P${peso(cashIn)}</span></div>
    <div class="row"><span>Cash Out:</span><span>-P${peso(cashOut)}</span></div>
    <div class="row"><span>Expected:</span><span>P${peso(expectedCash)}</span></div>
    <div class="row ${variance!==0?'b':''}"><span>Variance:</span><span>${variance>=0?"+":""}P${peso(variance)}</span></div>
    ${isClosing?`<div class="hr"></div>
    <div class="row"><span>Total Cash:</span><span>P${peso(totalCash)}</span></div>
    <div class="row"><span>Remittance:</span><span>-P${peso(remittanceAmt)}</span></div>
    <div class="row b"><span>CLOSING BALANCE:</span><span>P${peso(closingBalance)}</span></div>
    <div style="font-size:9px;margin-top:4px">(This amount stays in cash box as tomorrow's opening fund)</div>`:""}
    <div class="hr"></div>
    ${countNote?`<div>Notes: ${countNote}</div><div class="hr"></div>`:""}
    <div>Counted by: ________________</div>
    <div>Manager: ________________</div>
    <div>Date/Time: ${new Date().toLocaleString("en-PH")}</div>
    </body></html>`);
    w.document.close();setTimeout(()=>w.print(),400);
  };

  if(loading) return h("div",{style:{textAlign:"center",padding:"40px",color:C.muted}},"Loading cash count...");

  const selHistory = history.find(c=>c.date===selDate);

  return h("div",null,
    // Header
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
      h("div",null,
        h("h2",{style:{margin:0,fontSize:17,fontWeight:800}},"💰 Cash Count — "+curBranch.name),
        h("div",{style:{fontSize:13,color:C.muted,marginTop:2}},today+" · Counted by: "+user.name)
      ),
      h("div",{style:{display:"flex",gap:7}},
        h("button",{onClick:()=>setShowHistory(!showHistory),
          style:{padding:"7px 13px",background:"#fff",border:"1px solid "+C.border,borderRadius:8,fontSize:13,cursor:"pointer"}},
          showHistory?"← Current Count":"📅 History"),
        !showHistory&&h("button",{onClick:()=>printCount(false),
          style:{padding:"7px 13px",background:"#fff",border:"1px solid "+C.border,borderRadius:8,fontSize:13,cursor:"pointer"}},"🖨️ Print"),
        !showHistory&&h("button",{onClick:()=>saveCashCount(false),
          style:{padding:"7px 13px",background:C.info,border:"none",borderRadius:8,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}},"💾 Save"),
        !showHistory&&h("button",{onClick:()=>saveCashCount(true),
          style:{padding:"7px 13px",background:`linear-gradient(135deg,${C.primary},${C.dark})`,border:"none",borderRadius:8,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}},"🏁 Close Store")
      )
    ),

    // HISTORY VIEW
    showHistory&&h("div",null,
      h("div",{style:{display:"flex",gap:8,marginBottom:13,alignItems:"center"}},
        h("div",{style:{fontSize:13,color:C.muted}},"Select date:"),
        h("select",{value:history.some(c=>c.date===selDate)?selDate:"",
          disabled:history.length===0,
          onChange:e=>setSelDate(e.target.value),
          style:{padding:"6px 10px",border:"1px solid "+C.border,borderRadius:7,
            fontSize:13,outline:"none",
            background:history.length===0?"#f5f5f5":"#fff",
            color:history.length===0?C.muted:C.text}},
          history.length===0
            ? h("option",{value:""},"\u2014 no record \u2014")
            : [h("option",{key:"_",value:"",disabled:true},"\u2014 choose a date \u2014")]
                .concat(history.map(c=>h("option",{key:c.date,value:c.date},
                  c.date+(c.isClosing?" (Closing)":""))))
        ),
        history.length>0&&h("span",{style:{fontSize:12,color:C.muted}},
          history.length+" saved count"+(history.length>1?"s":""))
      ),
      history.length===0
        ?h("div",{style:{background:"#fff",border:"1px dashed "+C.border,borderRadius:12,
          padding:"34px 20px",textAlign:"center"}},
          h("div",{style:{fontSize:34,marginBottom:9}},"\uD83D\uDCED"),
          h("div",{style:{fontSize:13,fontWeight:800,marginBottom:5}},"No saved cash count yet"),
          h("div",{style:{fontSize:13,color:C.muted,marginBottom:14,lineHeight:1.6}},
            "A record appears here once you save a count.",h("br"),
            "Open \u2190 Current Count, enter the denominations, then \uD83D\uDCBE Save."),
          h("button",{onClick:()=>setShowHistory(false),
            style:{padding:"9px 18px",background:C.primary,border:"none",borderRadius:8,
              color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}},
            "\u2190 Go to Current Count")
        )
      :selHistory?h("div",null,
        // Summary cards
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:13}},
          h(Stat,{label:"Total Cash",value:"₱"+peso(selHistory.totalCash),icon:"💵",color:C.primary}),
          h(Stat,{label:"Opening Fund",value:"₱"+peso(selHistory.openingFund||0),icon:"🌅",color:C.info}),
          h(Stat,{label:"Remittance",value:"₱"+peso(selHistory.remittance||0),icon:"🏦",color:C.warning}),
          h(Stat,{label:"Closing Balance",value:"₱"+peso(selHistory.closingBalance||0),sub:"Tomorrow's opening",icon:"🌙",color:C.success})
        ),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
          h("div",{style:{background:"#fff",borderRadius:12,padding:"13px 15px",border:"1px solid "+C.border}},
            h("b",{style:{fontSize:14}},"Denomination Breakdown"),
            h("div",{style:{marginTop:9}},
              DENOMS.map(d=>{const qty=(selHistory.counts||{})[d.value]||0;return qty>0?h("div",{key:d.value,style:{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #f5f5f5"}},
                h("span",{style:{fontSize:13,fontWeight:600}},d.label+" × "+qty),
                h("span",{style:{fontSize:13,fontWeight:700,color:d.type==="bill"?C.info:C.muted}},"₱"+peso((qty*d.value)))
              ):null;})
            )
          ),
          h("div",{style:{background:"#fff",borderRadius:12,padding:"13px 15px",border:"1px solid "+C.border}},
            h("b",{style:{fontSize:14}},"Summary"),
            h("div",{style:{marginTop:9}},
              [["Bills Total","₱"+peso(selHistory.billsTotal||0),C.info],
               ["Coins Total","₱"+peso(selHistory.coinsTotal||0),C.muted],
               ["Total Cash","₱"+peso(selHistory.totalCash||0),C.primary],
               ["Opening Fund","₱"+peso(selHistory.openingFund||0),C.success],
               ["Today's Sales","₱"+peso(selHistory.todaySales||0),C.primary],
               ["Variance",(selHistory.variance||0)>=0?"+"+(selHistory.variance||0).toFixed(2):(selHistory.variance||0).toFixed(2),(selHistory.variance||0)>=0?C.success:C.danger],
               ["Remittance","₱"+peso(selHistory.remittance||0),C.warning],
               ["Closing Balance","₱"+peso(selHistory.closingBalance||0),C.success],
              ].map(([l,v,col])=>h("div",{key:l,style:{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #f5f5f5"}},
                h("span",{style:{fontSize:13,color:C.muted}},l),
                h("span",{style:{fontSize:13,fontWeight:800,color:col}},v)
              ))
            ),
            selHistory.note&&h("div",{style:{marginTop:8,padding:"7px 10px",background:C.bg,borderRadius:7,fontSize:13,color:C.muted}},"📝 "+selHistory.note),
            h("button",{onClick:()=>printCount(selHistory.isClosing),
              style:{marginTop:10,width:"100%",padding:"8px",background:`linear-gradient(135deg,${C.primary},${C.dark})`,border:"none",borderRadius:7,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}},"🖨️ Reprint")
          )
        )
      ):h("div",{style:{textAlign:"center",padding:"30px",color:C.muted}},"No record for this date")
    ),

    // CURRENT COUNT VIEW
    !showHistory&&h("div",{style:{display:"grid",gridTemplateColumns:"1.2fr 1fr",gap:12}},

      // LEFT: Denomination entry
      h("div",null,
        // Opening fund info banner
        h("div",{style:{background:openingFund>0?"#E8F5E9":"#FFF8E1",border:"1px solid "+(openingFund>0?"#A5D6A7":"#FFE082"),borderRadius:10,padding:"10px 14px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}},
          h("div",null,
            h("div",{style:{fontSize:13,fontWeight:700,color:openingFund>0?C.success:"#795548"}},
            openingSource==="logged"?"Opening Fund (recorded today)":"Yesterday's Closing Balance → Today's Opening Fund"),
            h("div",{style:{fontSize:18,fontWeight:900,color:openingFund>0?C.success:C.muted}},"₱"+peso(openingFund)),
            h("div",{style:{fontSize:12,color:C.muted}},prevRecord?"From "+prevRecord.date+" closing":"No previous record — set manually if needed")
          ),
          h("div",{style:{fontSize:24}},openingFund>0?"✅":"📭")
        ),

        // Bills
        h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden",marginBottom:10}},
          h("div",{style:{padding:"10px 14px",background:"#E3F2FD",borderBottom:"1px solid #BBDEFB",display:"flex",justifyContent:"space-between"}},
            h("b",{style:{fontSize:14,color:C.info}},"💵 Bills"),
            h("span",{style:{fontSize:14,fontWeight:800,color:C.info}},"₱"+peso(billsTotal))
          ),
          h("div",{style:{padding:"8px 14px"}},
            DENOMS.filter(d=>d.type==="bill").map(d=>h("div",{key:d.value,style:{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid #f5f5f5"}},
              h("div",{style:{width:52,height:26,borderRadius:6,background:d.color+"22",border:"1px solid "+d.color+"44",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
                h("span",{style:{fontSize:13,fontWeight:900,color:d.color}},d.label)
              ),
              h("div",{style:{flex:1}},
                h("div",{style:{fontSize:12,color:C.muted}},"× "+( counts[d.value]||0)+" = ₱"+peso(((counts[d.value]||0)*d.value)))
              ),
              h("div",{style:{display:"flex",alignItems:"center",gap:6}},
                h("button",{onClick:()=>setCounts(p=>({...p,[d.value]:Math.max(0,(p[d.value]||0)-1)})),
                  style:{width:28,height:28,borderRadius:7,border:"1px solid "+C.border,background:"#fff",cursor:"pointer",fontSize:15,fontWeight:700}},"−"),
                h("input",{type:"number",onFocus:e=>e.target.select(),min:0,value:counts[d.value]||0,
                  onChange:e=>setCounts(p=>({...p,[d.value]:parseInt(e.target.value)||0})),
                  style:{width:52,textAlign:"center",padding:"4px",border:"1px solid "+C.border,borderRadius:6,fontSize:13,fontWeight:700,outline:"none"}}),
                h("button",{onClick:()=>setCounts(p=>({...p,[d.value]:(p[d.value]||0)+1})),
                  style:{width:28,height:28,borderRadius:7,border:"1px solid "+d.color,background:d.color+"18",cursor:"pointer",fontSize:15,fontWeight:700,color:d.color}},"+")
              )
            ))
          )
        ),

        // Coins
        h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
          h("div",{style:{padding:"10px 14px",background:"#F3E5F5",borderBottom:"1px solid #CE93D8",display:"flex",justifyContent:"space-between"}},
            h("b",{style:{fontSize:14,color:"#6A1B9A"}},"🪙 Coins"),
            h("span",{style:{fontSize:14,fontWeight:800,color:"#6A1B9A"}},"₱"+peso(coinsTotal))
          ),
          h("div",{style:{padding:"8px 14px"}},
            DENOMS.filter(d=>d.type==="coin").map(d=>h("div",{key:d.value,style:{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid #f5f5f5"}},
              h("div",{style:{width:52,height:26,borderRadius:6,background:d.color+"22",border:"1px solid "+d.color+"44",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
                h("span",{style:{fontSize:13,fontWeight:900,color:d.color}},d.label)
              ),
              h("div",{style:{flex:1}},
                h("div",{style:{fontSize:12,color:C.muted}},"× "+(counts[d.value]||0)+" = ₱"+peso(((counts[d.value]||0)*d.value)))
              ),
              h("div",{style:{display:"flex",alignItems:"center",gap:6}},
                h("button",{onClick:()=>setCounts(p=>({...p,[d.value]:Math.max(0,(p[d.value]||0)-1)})),
                  style:{width:28,height:28,borderRadius:7,border:"1px solid "+C.border,background:"#fff",cursor:"pointer",fontSize:15,fontWeight:700}},"−"),
                h("input",{type:"number",onFocus:e=>e.target.select(),min:0,value:counts[d.value]||0,
                  onChange:e=>setCounts(p=>({...p,[d.value]:parseInt(e.target.value)||0})),
                  style:{width:52,textAlign:"center",padding:"4px",border:"1px solid "+C.border,borderRadius:6,fontSize:13,fontWeight:700,outline:"none"}}),
                h("button",{onClick:()=>setCounts(p=>({...p,[d.value]:(p[d.value]||0)+1})),
                  style:{width:28,height:28,borderRadius:7,border:"1px solid "+d.color,background:d.color+"18",cursor:"pointer",fontSize:15,fontWeight:700,color:d.color}},"+")
              )
            ))
          )
        )
      ),

      // RIGHT: Summary + Remittance
      h("div",null,
        // Total summary card
        h("div",{style:{background:`linear-gradient(135deg,${C.primary},${C.dark})`,borderRadius:13,padding:"16px 18px",marginBottom:10}},
          h("div",{style:{color:C.accent,fontSize:12,fontWeight:700,letterSpacing:2}},"CASH COUNT TOTAL"),
          h("div",{style:{color:"#fff",fontSize:28,fontWeight:900,margin:"6px 0"}},"₱"+peso(totalCash)),
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:10}},

// ─── HRIS: CA / LOAN REQUEST PAGE ────────────────────────
function CALoanPage({user,branchId,curBranch,db,hrisDB,showT,mode,hrisEmps=[]}){
  const isCA = mode === "ca";
  const [amount, setAmount]     = useState("");
  const [reason, setReason]     = useState("");
  const [installments, setInst] = useState("2");
  const [myRequests, setMyReqs] = useState([]);
  const [loading, setLoading]   = useState(true);
  const today = localDate();

  // Start on the obvious match, but the person filing still confirms it.
  const guess = hrisEmps.find(e=>
    String(e.name||"").toLowerCase().trim()===String(user.name||"").toLowerCase().trim());
  const [empId,setEmpId]=useState(guess?guess.id:"");
  useEffect(()=>{
    if(!empId&&guess)setEmpId(guess.id);
  },[hrisEmps.length]);
  const hrisEmp = hrisEmps.find(e=>String(e.id)===String(empId));

  useEffect(()=>{ setLoading(false); },[hrisEmps]);

  // Load my requests from POS Firestore
  useEffect(()=>{
    // one equality filter only; the rest is done in memory so no composite
    // index is required
    const who=(hrisEmp&&hrisEmp.name)||user.name;
    const q = query(
      collection(db,"hris_requests"),
      where("staffName","==",who),
      limit(80)
    );
    const want=isCA?"Cash Advance":"Cash Loan";
    const unsub = onSnapshot(q, snap=>{
      setMyReqs(snap.docs.map(d=>({...d.data(),_docId:d.id}))
        .filter(r=>r.type===want)
        .sort((a,b)=>((b.timestamp&&b.timestamp.seconds)||0)
                    -((a.timestamp&&a.timestamp.seconds)||0)));
    }, (err)=>{ console.error("hris_requests:",err); });
    return()=>unsub();
  },[user.name, isCA, hrisEmp&&hrisEmp.name]);


  const submit = async()=>{
    if(!hrisEmp){
      showT("Pick the name from the payroll list — the deduction is posted "
        +"against that record","warn");
      return;
    }
    if(!amount||parseFloat(amount)<=0){showT("Enter amount","warn");return;}
    if(!reason.trim()){showT("Enter reason","warn");return;}
    const amt = parseFloat(amount);
    const cutoffDeduct = isCA ? amt : Math.ceil(amt/parseInt(installments));

    // 1. Save request to POS Firestore (for approval tracking)
    const reqRef = await addDoc(collection(db,"hris_requests"),{
      type: isCA?"Cash Advance":"Cash Loan",
      staffName: hrisEmp.name,
      requestedBy: user.name,
      branch: branchId,
      branchName: curBranch.full,
      amount: amt,
      reason,
      installments: isCA?1:parseInt(installments),
      cutoffDeduct,
      status: "pending",
      hrisEmpId: hrisEmp?.id||null,
      date: today,
      timestamp: serverTimestamp(),
    });

    showT((isCA?"Cash Advance":"Cash Loan")+" request submitted! Waiting for approval ✓");
    setAmount(""); setReason(""); setInst("2");
  };

  const pendingOwn  = myRequests.filter(r=>r.status==="pending");
  const approvedOwn = myRequests.filter(r=>r.status==="approved");
  const totalOwed   = myRequests.filter(r=>r.status==="approved"&&r.balance>0)
                        .reduce((s,r)=>s+(r.balance||0),0);

  if(loading) return h("div",{style:{textAlign:"center",padding:"40px",color:C.muted}},"Loading...");

  return h("div",null,
    // Header
    h("div",{style:{background:isCA?`linear-gradient(135deg,${C.primary},${C.dark})`:`linear-gradient(135deg,#1565C0,#0D47A1)`,borderRadius:13,padding:"16px 18px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}},
      h("div",null,
        h("div",{style:{color:C.accent,fontSize:12,fontWeight:700,letterSpacing:2}},isCA?"CASH ADVANCE REQUEST":"CASH LOAN REQUEST"),
        h("div",{style:{color:"#fff",fontSize:15,fontWeight:900,marginTop:2}},user.name),
        h("div",{style:{color:"rgba(255,255,255,.75)",fontSize:12,marginTop:1}},curBranch.full+" · "+today),
        hrisEmp
          ?h("div",{style:{color:"#2E7D32",fontSize:12,marginTop:3}},"✅ HRIS linked: "+hrisEmp.name+" ("+hrisEmp.pos+")")
          :h("div",{style:{color:"#fbbf24",fontSize:12,marginTop:3}},"⚠️ Name not found in HRIS — admin will link manually")
      ),
      h("div",{style:{textAlign:"right"}},
        h("div",{style:{color:"rgba(255,255,255,.75)",fontSize:12}},"OUTSTANDING BALANCE"),
        h("div",{style:{color:totalOwed>0?C.warning:"#4ade80",fontSize:20,fontWeight:900}},"₱"+peso(totalOwed))
      )
    ),

    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},

      // LEFT: Request form
      h("div",null,
        h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,padding:"16px"}},
          h("div",{style:{fontWeight:800,fontSize:13,marginBottom:14,color:isCA?C.primary:"#1565C0"}},
            isCA?"💵 New Cash Advance":"💸 New Cash Loan"),

          // Employee — from the payroll list, so the loan lands on the right
          // record and the cut-off deduction actually finds it
          h("div",{style:{marginBottom:11}},
            h("div",{style:{fontSize:12,fontWeight:700,color:C.muted,
              marginBottom:5,letterSpacing:1}},"NAME (from payroll)"),
            h("select",{value:empId,onChange:e=>setEmpId(e.target.value),
              style:{width:"100%",padding:"11px",borderRadius:9,fontSize:14,
                outline:"none",cursor:"pointer",boxSizing:"border-box",
                border:"1px solid "+(empId?C.primary:C.warning),
                background:empId?"#fff":C.warning+"14",
                fontWeight:empId?700:400}},
              h("option",{value:""},
                hrisEmps.length?"— select your name —":"No payroll records loaded"),
              hrisEmps.slice()
                .sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")))
                .map(e=>h("option",{key:e.id,value:e.id},
                  e.name+(e.pos?" · "+e.pos:"")))),
            !empId&&h("div",{style:{fontSize:11,color:C.warning,marginTop:4,
              lineHeight:1.5}},
              hrisEmps.length
                ? "The deduction is posted against this record, so it has to be "
                  +"the payroll name — not the POS login."
                : "The payroll list has not loaded. Check the HRIS connection.")),

          // Amount
          h("div",{style:{marginBottom:11}},
            h("div",{style:{fontSize:12,fontWeight:700,color:C.muted,marginBottom:5,letterSpacing:1}},"AMOUNT REQUESTED (₱)"),
            h("input",{type:"number",onFocus:e=>e.target.select(),value:amount,onChange:e=>setAmount(e.target.value),
              placeholder:"0.00",
              style:{width:"100%",padding:"12px",border:`2px solid ${isCA?C.primary:"#1565C0"}`,
                borderRadius:9,fontSize:20,fontWeight:700,outline:"none",
                boxSizing:"border-box",color:isCA?C.primary:"#1565C0"}})
          ),

          // Reason
          h("div",{style:{marginBottom:11}},
            h("div",{style:{fontSize:12,fontWeight:700,color:C.muted,marginBottom:5,letterSpacing:1}},"REASON / PURPOSE"),
            h("textarea",{value:reason,onChange:e=>setReason(e.target.value),
              placeholder:isCA?"e.g. Emergency medical expense, school fees...":"e.g. House repair, tuition fee, medical...",
              style:{width:"100%",padding:"10px 12px",border:"1px solid "+C.border,borderRadius:9,
                fontSize:14,outline:"none",resize:"none",height:80,boxSizing:"border-box",fontFamily:"inherit"}})
          ),

          // Installments (loan only)
          !isCA&&h("div",{style:{marginBottom:11}},
            h("div",{style:{fontSize:12,fontWeight:700,color:C.muted,marginBottom:5,letterSpacing:1}},"NUMBER OF CUTOFFS TO PAY"),
            h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}},
              ["2","3","4","6"].map(n=>h("button",{key:n,onClick:()=>setInst(n),
                style:{padding:"10px 0",borderRadius:8,border:`2px solid ${installments===n?"#1565C0":C.border}`,
                  background:installments===n?"#E3F2FD":"#fff",
                  color:installments===n?"#1565C0":C.muted,fontWeight:700,fontSize:14,cursor:"pointer"}},
                n+" cutoffs"))
            ),
            amount&&parseFloat(amount)>0&&h("div",{style:{marginTop:8,padding:"9px 12px",background:"#E3F2FD",borderRadius:8,fontSize:13,color:"#1565C0",fontWeight:600}},
              "₱"+peso(Math.ceil(parseFloat(amount)/parseInt(installments)))+" deducted per cutoff × "+installments+" = ₱"+peso(parseFloat(amount))
            )
          ),

          // CA deduction note
          isCA&&amount&&parseFloat(amount)>0&&h("div",{style:{marginBottom:11,padding:"9px 12px",background:"#FFF8E1",borderRadius:8,fontSize:13,color:"#795548",fontWeight:600}},
            "💡 Full ₱"+peso(parseFloat(amount))+" will be deducted on your NEXT CUTOFF payroll"
          ),

          h("button",{onClick:submit,
            style:{width:"100%",padding:"13px",
              background:isCA?`linear-gradient(135deg,${C.primary},${C.dark})`:`linear-gradient(135deg,#1565C0,#0D47A1)`,
              border:"none",borderRadius:10,color:"#fff",fontWeight:800,fontSize:13,cursor:"pointer"}},
            isCA?"📤 Submit CA Request":"📤 Submit Loan Request")
        )
      ),

      // RIGHT: My requests history
      h("div",null,
        h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,padding:"14px",marginBottom:10}},
          h("div",{style:{fontWeight:800,fontSize:14,marginBottom:10}},"📋 My Requests"),
          myRequests.length===0
            ?h("div",{style:{textAlign:"center",padding:"20px",color:C.muted,fontSize:13}},"No requests yet")
            :myRequests.map(r=>h("div",{key:r._docId,style:{padding:"10px 12px",borderRadius:9,border:"1px solid "+C.border,marginBottom:8,background:{"pending":"#FFF8E1","approved":"#E8F5E9","rejected":"#FFEBEE","released":"#E3F2FD"}[r.status]||"#fff"}},
              h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:4}},
                h("div",{style:{fontSize:14,fontWeight:800,color:{"pending":C.warning,"approved":C.success,"rejected":C.danger,"released":C.info}[r.status]||C.text}},
                  "₱"+peso(r.amount)),
                h(Badge,{label:r.status.toUpperCase(),color:{"pending":C.warning,"approved":C.success,"rejected":C.danger,"released":C.info}[r.status]||C.muted})
              ),
              h("div",{style:{fontSize:13,color:C.muted}},r.reason),
              h("div",{style:{fontSize:12,color:C.muted,marginTop:3}},r.date+" · "+r.type),
              r.status==="approved"&&r.balance>0&&h("div",{style:{fontSize:13,fontWeight:700,color:C.warning,marginTop:3}},"Balance: ₱"+peso((r.balance||r.amount))),
              r.status==="rejected"&&r.rejectReason&&h("div",{style:{fontSize:13,color:C.danger,marginTop:3}},"Reason: "+r.rejectReason),
              r.status==="approved"&&h("div",{style:{fontSize:12,color:C.success,marginTop:3}},"✅ Auto-deducted on the next payroll cutoff")
            ))
        )
      )
    )
  );
}

// ─── HRIS: ADMIN APPROVAL DASHBOARD ──────────────────────
function HRISDashPage({user,db,hrisDB,showT,branches:BRANCHES,hrisEmps=[]}){
  const [requests, setRequests] = useState([]);
  const [filterStatus, setFilter] = useState("pending");
  const [filterBranch, setFilterBranch] = useState("all");
  const [rejectModal, setRejectModal] = useState(null);
  const [rejectReason, setRejectReason] = useState("");

  useEffect(()=>{
    const q = query(collection(db,"hris_requests"), orderBy("timestamp","desc"), limit(200));
    const unsub = onSnapshot(q, snap=>{
      setRequests(snap.docs.map(d=>({...d.data(),_docId:d.id})));
    }, ()=>{});
    return()=>unsub();
  },[]);

  const approve = async(req)=>{
    // 1. Update POS Firestore status
    await updateDoc(doc(db,"hris_requests",req._docId),{
      status:"approved",
      approvedBy: user.name,
      approvedAt: serverTimestamp(),
      balance: req.amount,
    });

    // 2. Push to HRIS Realtime DB as loan deduction entry
    if(hrisDB && req.hrisEmpId){
      try{
        // Load current loans
        const snap = await get(ref(hrisDB,"loans"));
        const existing = snap.val();
        const loans = existing ? (Array.isArray(existing)?existing:Object.values(existing)) : [];
        const newLoan = {
          emp:      req.hrisEmpId,
          empName:  req.staffName,
          type:     req.type==="Cash Advance"?"Cash Advance":"Company Loan",
          amount:   req.amount,
          monthly:  req.cutoffDeduct,
          start:    req.date,
          status:   "Active",
          balance:  req.amount,
          posReqId: req._docId,
          branch:   req.branch,
          reason:   req.reason,
        };
        loans.push(newLoan);
        await set(ref(hrisDB,"loans"), loans);
        showT("Approved & synced to HRIS payroll ✓");
      }catch(e){
        console.warn("HRIS sync failed:",e);
        showT("Approved in POS — HRIS sync failed, add manually","warn");
      }
    } else {
      showT("Approved! No HRIS link — add deduction manually in HRIS","warn");
    }
  };

  const reject = async(req)=>{
    await updateDoc(doc(db,"hris_requests",req._docId),{
      status:"rejected",
      rejectedBy: user.name,
      rejectedAt: serverTimestamp(),
      rejectReason,
    });
    setRejectModal(null);
    setRejectReason("");
    showT("Request rejected");
  };

  const filtered = requests
    .filter(r=>filterStatus==="all"||r.status===filterStatus)
    .filter(r=>filterBranch==="all"||r.branch===filterBranch);

  const pending  = requests.filter(r=>r.status==="pending");
  const approved = requests.filter(r=>r.status==="approved");
  const totalCA  = approved.filter(r=>r.type==="Cash Advance").reduce((s,r)=>s+r.amount,0);
  const totalLoan= approved.filter(r=>r.type==="Cash Loan").reduce((s,r)=>s+r.amount,0);

  return h("div",null,
    h(SectionHeader,{title:"HRIS — CA & Loan Approvals"}),

    // KPI cards
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}},
      h(Stat,{label:"Pending Approval",value:pending.length,icon:"⏳",color:C.warning}),
      h(Stat,{label:"Approved CA",value:"₱"+totalCA.toLocaleString(),icon:"💵",color:C.primary}),
      h(Stat,{label:"Approved Loans",value:"₱"+totalLoan.toLocaleString(),icon:"💸",color:C.info}),
      h(Stat,{label:"HRIS Linked",value:hrisEmps.length+" employees",icon:"🔗",color:C.success})
    ),

    // HRIS link status
    h("div",{style:{background:hrisDB?"#E8F5E9":"#FFF8E1",border:"1px solid "+(hrisDB?"#A5D6A7":"#FFE082"),borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:13,color:hrisDB?"#1B5E20":"#795548"}},
      hrisDB
        ?"✅ Connected to HRIS (chowtime-hris) — approved CAs will auto-sync to payroll deductions"
        :"⚠️ HRIS connection unavailable — approvals will save to POS only"
    ),

    // Filters
    h("div",{style:{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}},
      h("div",{style:{display:"flex",gap:5}},
        ["pending","approved","rejected","all"].map(s=>h("button",{key:s,onClick:()=>setFilter(s),
          style:{padding:"5px 12px",borderRadius:20,border:`1px solid ${filterStatus===s?C.primary:C.border}`,
            background:filterStatus===s?"#F3E9F7":"#fff",color:filterStatus===s?C.primary:C.muted,
            fontSize:13,fontWeight:filterStatus===s?700:400,cursor:"pointer"}},
          s.toUpperCase()+" "+(s==="all"?requests.length:requests.filter(r=>r.status===s).length)))
      ),
      h("select",{value:filterBranch,onChange:e=>setFilterBranch(e.target.value),
        style:{padding:"5px 10px",border:"1px solid "+C.border,borderRadius:7,fontSize:13,outline:"none"}},
        h("option",{value:"all"},"All Branches"),
        ...BRANCHES.map(b=>h("option",{key:b.id,value:b.id},b.name))
      )
    ),

    // Requests table
    h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
      h("div",{style:{display:"grid",gridTemplateColumns:"100px 130px 1fr 80px 90px 110px 110px",padding:"8px 14px",background:"#f9f9f9",borderBottom:"1px solid #eee"}},
        ["Type","Staff","Reason / Branch","Amount","Cutoff Ded.","Status","Action"].map(h2=>
          h("div",{key:h2,style:{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase"}},h2))
      ),
      filtered.length===0
        ?h("div",{style:{textAlign:"center",padding:"30px",color:C.muted,fontSize:14}},"No requests")
        :filtered.map(req=>h("div",{key:req._docId,
            style:{display:"grid",gridTemplateColumns:"100px 130px 1fr 80px 90px 110px 110px",
              padding:"10px 14px",borderBottom:"1px solid #f5f5f5",alignItems:"center",
              background:req.status==="pending"?"#FFFDE7":"#fff"}},
          h("div",null,
            h(Badge,{label:req.type==="Cash Advance"?"💵 CA":"💸 Loan",
              color:req.type==="Cash Advance"?C.primary:"#1565C0",
              bg:req.type==="Cash Advance"?"#F3E9F7":"#E3F2FD"})
          ),
          h("div",null,
            h("div",{style:{fontSize:13,fontWeight:700}},req.staffName),
            h("div",{style:{fontSize:12,color:C.muted}},
              (BRANCHES.find(b=>b.id===req.branch)||{}).name||req.branch),
            req.hrisEmpId
              ?h("div",{style:{fontSize:11,color:C.success,fontWeight:600}},"🔗 HRIS linked")
              :h("div",{style:{fontSize:11,color:C.warning,fontWeight:600}},"⚠️ No HRIS link")
          ),
          h("div",{style:{fontSize:13,color:C.muted}},req.reason||"—"),
          h("div",{style:{fontSize:14,fontWeight:800,color:C.primary}},"₱"+peso(req.amount)),
          h("div",null,
            h("div",{style:{fontSize:13,fontWeight:700,color:"#1565C0"}},"₱"+peso(req.cutoffDeduct)),
            h("div",{style:{fontSize:11,color:C.muted}},req.type==="Cash Advance"?"Full @ cutoff":req.installments+"x cutoffs")
          ),
          h("div",null,h(Badge,{label:req.status.toUpperCase(),
            color:{pending:C.warning,approved:C.success,rejected:C.danger,released:C.info}[req.status]||C.muted})),
          h("div",{style:{display:"flex",gap:5}},
            req.status==="pending"&&h("button",{onClick:()=>approve(req),
              style:{padding:"4px 10px",background:"#E8F5E9",border:"none",borderRadius:6,
                color:C.success,fontSize:13,fontWeight:700,cursor:"pointer"}},"✓ Approve"),
            req.status==="pending"&&h("button",{onClick:()=>setRejectModal(req),
              style:{padding:"4px 9px",background:"#FFEBEE",border:"none",borderRadius:6,
                color:C.danger,fontSize:13,fontWeight:700,cursor:"pointer"}},"✗"),
            req.status==="approved"&&h("div",{style:{fontSize:12,color:C.success,fontWeight:600}},"✅ In payroll")
          )
        ))
    ),

    // Reject modal
    rejectModal&&h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:900}},
      h("div",{style:{background:"#fff",width:360,borderRadius:14,padding:"20px",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}},
        h("div",{style:{fontWeight:800,fontSize:14,marginBottom:4}},"✗ Reject Request"),
        h("div",{style:{fontSize:13,color:C.muted,marginBottom:14}},"Rejecting CA/Loan of "+rejectModal.staffName+" (₱"+rejectModal.amount+")"),
        h("div",{style:{fontSize:12,fontWeight:700,color:C.muted,marginBottom:5,letterSpacing:1}},"REASON FOR REJECTION"),
        h("textarea",{value:rejectReason,onChange:e=>setRejectReason(e.target.value),
          placeholder:"e.g. Outstanding balance not yet paid, over limit...",
          style:{width:"100%",padding:"9px",border:"1px solid "+C.border,borderRadius:8,
            fontSize:14,outline:"none",resize:"none",height:72,boxSizing:"border-box",fontFamily:"inherit"}}),
        h("div",{style:{display:"flex",gap:8,marginTop:12}},
          h("button",{onClick:()=>reject(rejectModal),
            style:{flex:1,padding:"10px",background:C.danger,border:"none",borderRadius:8,color:"#fff",fontWeight:700,cursor:"pointer"}},"Reject"),
          h("button",{onClick:()=>{setRejectModal(null);setRejectReason("");},
            style:{flex:1,padding:"10px",background:C.bg,border:"1px solid "+C.border,borderRadius:8,fontWeight:700,cursor:"pointer"}},"Cancel")
        )
      )
    )
  );
}

// ─── HRIS: BRANCH TEAM VIEW ───────────────────────────────
function HRISBranchPage({user,branchId,curBranch,db,hrisDB,showT}){
  const [myTeamReqs, setTeamReqs] = useState([]);
  const [hrisEmps, setHrisEmps]   = useState([]);

  useEffect(()=>{
    const q = query(collection(db,"hris_requests"),
      where("branch","==",branchId),limit(50));
    const unsub = onSnapshot(q, snap=>{
      setTeamReqs(snap.docs.map(d=>({...d.data(),_docId:d.id})));
    }, ()=>{});
    return()=>unsub();
  },[branchId]);

  useEffect(()=>{
    if(!hrisDB)return;
    onValue(ref(hrisDB,"employees"), snap=>{
      const data=snap.val();
      if(data) setHrisEmps(Array.isArray(data)?data:Object.values(data));
    });
  },[hrisDB]);

  const branchEmps = hrisEmps.filter(e=>
    e.branch===branchId||e.branch===curBranch.name||e.branch===curBranch.full||
    BRANCHES?.find(b=>b.id===branchId)?.name===e.branch
  );

  return h("div",null,
    h(SectionHeader,{title:"My Team — "+curBranch.name}),
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}},
      h(Stat,{label:"Pending CA/Loan",value:myTeamReqs.filter(r=>r.status==="pending").length,icon:"⏳",color:C.warning}),
      h(Stat,{label:"Approved This Month",value:myTeamReqs.filter(r=>r.status==="approved").length,icon:"✅",color:C.success}),
      h(Stat,{label:"Total Approved",value:"₱"+myTeamReqs.filter(r=>r.status==="approved").reduce((s,r)=>s+r.amount,0).toLocaleString(),icon:"💵",color:C.primary})
    ),
    h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
      h("div",{style:{padding:"10px 14px",background:"#f9f9f9",borderBottom:"1px solid #eee",fontSize:13,fontWeight:700,color:C.muted}},"TEAM CA & LOAN REQUESTS"),
      myTeamReqs.length===0
        ?h("div",{style:{textAlign:"center",padding:"30px",color:C.muted,fontSize:14}},"No requests from your branch yet")
        :myTeamReqs.map(r=>h("div",{key:r._docId,style:{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:"1px solid #f9f9f9",background:r.status==="pending"?"#FFFDE7":"#fff"}},
          h("div",{style:{width:36,height:36,borderRadius:9,background:r.type==="Cash Advance"?"#F3E9F7":"#E3F2FD",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}},
            r.type==="Cash Advance"?"💵":"💸"),
          h("div",{style:{flex:1}},
            h("div",{style:{fontSize:13,fontWeight:700}},r.staffName+" · "+r.type),
            h("div",{style:{fontSize:12,color:C.muted}},r.reason+" · "+r.date),
            r.status==="approved"&&h("div",{style:{fontSize:12,color:C.success,fontWeight:600}},"✅ In payroll · ₱"+r.cutoffDeduct+"/cutoff")
          ),
          h("div",{style:{fontSize:13,fontWeight:900,color:r.type==="Cash Advance"?C.primary:"#1565C0"}},"₱"+peso(r.amount)),
          h(Badge,{label:r.status.toUpperCase(),color:{pending:C.warning,approved:C.success,rejected:C.danger}[r.status]||C.muted})
        ))
    )
  );
}

// ─── MENU EDITOR COMPONENT ───────────────────────────────
const EMOJI_LIST = ["🍗","🥩","🐟","🍖","🌭","🥟","🍝","🍚","🧋","🥤","🍌","🍳","🍱","🥗","🍜","🍛","🍲","🫔","🌮","🌯","🥪","🧆","🧇","🥞","🍔","🍟","🌽","🥕","🧅","🍄"];
const CAT_LIST = ["Bestsellers","Silog Meals","Rice Toppings","Merienda","Drinks","Add-ons","Specials"];

function MenuEditor({menuItems,setMenuItems,db,user,showT}){
  const [view,setView]         = useState("list");
  const [editItem,setEditItem] = useState(null);
  const [filterCat,setFilter]  = useState("All");
  const [srch,setSrch]         = useState("");
  const [saving,setSaving]     = useState(false);
  const [optGroups,setOptGrps] = useState([]);

  useEffect(()=>{
    const unsub=onSnapshot(collection(db,"option_groups"),snap=>{
      setOptGrps(snap.docs.map(d=>({...d.data(),id:d.id})));
    },()=>{});
    return()=>unsub();
  },[]);

  // ── blank template for new  item
  const blankItem = ()=>({
    id:"m"+Date.now(),
    name:"",basePrice:0,emoji:"🍗",cat:"Bestsellers",
    desc:"",avail:true,
    variants:[{id:"v"+Date.now(),label:"Regular",priceAdd:0}],
    options:[],promos:[]
  });

  const openEdit = ( item)=>{ setEditItem(JSON.parse(JSON.stringify( item))); setView("edit"); };
  const openAdd  = ()=>{ setEditItem(blankItem()); setView("add item"); };

  const saveItem = async( item)=>{
    setSaving(true);
    const isNew = view==="add item";
    // Save to Firestore
    try{
      await setDoc(doc(db,"menu", item.id),{... item,updatedBy:user.name,updatedAt:serverTimestamp()});
    }catch(e){ console.warn("Menu save:",e); }
    // Update local state
    if(isNew){
      setMenuItems(p=>[...p, item]);
      showT( item.name+" added to menu ✓");
    } else {
      setMenuItems(p=>p.map(m=>m.id=== item.id? item:m));
      showT( item.name+" updated ✓");
    }
    setSaving(false);
    setView("list");
    setEditItem(null);
  };

  const deleteItem = async( item)=>{
    if(!confirm("Delete "+ item.name+"? This cannot be undone."))return;
    try{ await deleteDoc(doc(db,"menu", item.id)); }catch(e){}
    setMenuItems(p=>p.filter(m=>m.id!== item.id));
    showT( item.name+" deleted","warn");
    setView("list");setEditItem(null);
  };

  const toggleAvail = async( item)=>{
    const updated={... item,avail:! item.avail};
    try{ await updateDoc(doc(db,"menu", item.id),{avail:updated.avail,updatedBy:user.name}); }catch(e){}
    setMenuItems(p=>p.map(m=>m.id=== item.id?updated:m));
    showT( item.name+" "+(updated.avail?"enabled ✓":"hidden 🚫"));
  };

  const filtered = menuItems
    .filter(i=>filterCat==="All"||i.cat===filterCat)
    .filter(i=>i.name.toLowerCase().includes(srch.toLowerCase()));

  // ── LIST VIEW ──
  if(view==="list") return h("div",null,
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
      h("div",null,
        h("h2",{style:{margin:0,fontSize:17,fontWeight:800}},"🍽️ Menu Management"),
        h("div",{style:{fontSize:13,color:C.muted,marginTop:2}},menuItems.length+"  items · "+menuItems.filter(i=>i.avail).length+" active")
      ),
      h("div",{style:{display:"flex",gap:7}},
        h("div",{style:{position:"relative"}},
          h("span",{style:{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",fontSize:13,color:C.muted}},"🔍"),
          h("input",{value:srch,onChange:e=>setSrch(e.target.value),placeholder:"Search...",
            style:{padding:"7px 9px 7px 26px",border:"1px solid "+C.border,borderRadius:7,fontSize:13,outline:"none",width:140}})
        ),
        h("button",{onClick:openAdd,
          style:{padding:"8px 16px",background:`linear-gradient(135deg,${C.primary},${C.dark})`,border:"none",borderRadius:8,color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}},
          "+ Add Item")
      )
    ),
    // Category filter tabs
    h("div",{style:{display:"flex",gap:0,borderBottom:"1px solid "+C.border,marginBottom:14,overflowX:"auto"}},
      ["All",...CAT_LIST].map(c=>h("button",{key:c,onClick:()=>setFilter(c),
        style:{padding:"8px 14px",border:"none",background:"transparent",
          color:filterCat===c?C.primary:C.muted,
          fontWeight:filterCat===c?700:400,fontSize:13,cursor:"pointer",
          borderBottom:`2px solid ${filterCat===c?C.primary:"transparent"}`,
          whiteSpace:"nowrap"}},
        c+" ("+(c==="All"?menuItems.length:menuItems.filter(i=>i.cat===c).length)+")"
      ))
    ),
    // Item cards grid
    filtered.length===0
      ?h("div",{style:{textAlign:"center",padding:"40px",color:C.muted}},
          h("div",{style:{fontSize:40,marginBottom:8}},"🍽️"),
          h("div",null,"No  items found. "),
          h("button",{onClick:openAdd,style:{color:C.primary,background:"none",border:"none",cursor:"pointer",fontWeight:700,fontSize:14}},"+ Add your first  item")
        )
      :h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:9}},
        filtered.map( item=>h("div",{key: item.id,
          style:{background:"#fff",borderRadius:12,border:`2px solid ${ item.avail?C.border:"#eee"}`,
            overflow:"hidden",opacity: item.avail?1:.65,position:"relative"}},
          // Top: emoji + availability toggle
          h("div",{style:{height:80,background: item.avail?`${C.primary}0D`:"#f5f5f5",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:40,position:"relative"}},
             item.emoji,
            h("div",{style:{position:"absolute",top:7,right:7}},
              h("button",{onClick:()=>toggleAvail( item),
                style:{width:34,height:19,borderRadius:10,border:"none",
                  background: item.avail?C.success:"#ccc",
                  cursor:"pointer",position:"relative",transition:"all .2s"}},
                h("div",{style:{width:13,height:13,borderRadius:"50%",background:"#fff",
                  position:"absolute",top:3,transition:"all .2s",
                  left: item.avail?"calc(100% - 16px)":"3px",
                  boxShadow:"0 1px 3px rgba(0,0,0,.25)"}})
              )
            ),
            ! item.avail&&h("div",{style:{position:"absolute",inset:0,background:"rgba(255,255,255,.15)",
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}},"🚫")
          ),
          h("div",{style:{padding:"9px 11px"}},
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}},
              h("div",{style:{fontWeight:800,fontSize:14,color: item.avail?C.text:"#999",flex:1,marginRight:4}}, item.name),
              h("div",{style:{fontSize:13,fontWeight:900,flexShrink:0,color: item.avail?C.primary:"#bbb"}},
                "₱"+ item.basePrice)
            ),
            h("div",{style:{fontSize:11,color:C.muted,marginBottom:3}}, item.cat),
             item.desc&&h("div",{style:{fontSize:12,color:C.muted,lineHeight:1.4,marginBottom:6,
              whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}, item.desc),
            // Badges
            h("div",{style:{display:"flex",gap:4,flexWrap:"wrap",marginBottom:8}},
               item.variants.length>0&&h("span",{style:{fontSize:11,padding:"2px 6px",background:"#E3F2FD",color:C.info,borderRadius:20,fontWeight:600}}, item.variants.length+" sizes"),
               item.options.length>0&&h("span",{style:{fontSize:11,padding:"2px 6px",background:"#F3E5F5",color:"#6A1B9A",borderRadius:20,fontWeight:600}}, item.options.length+" options"),
               item.promos.length>0&&h("span",{style:{fontSize:11,padding:"2px 6px",background:"#F3E9F7",color:C.primary,borderRadius:20,fontWeight:600}},"🔥 "+ item.promos.length+" promo"),
            ),
            h("button",{onClick:()=>openEdit( item),
              style:{width:"100%",padding:"7px",background:C.bg,border:"1px solid "+C.border,
                borderRadius:7,fontSize:13,fontWeight:600,cursor:"pointer",color:C.text}},
              "✏️ Edit Item")
          )
        ))
      )
  );

  // ── ITEM EDITOR (Edit or Add) ──
  if(view==="edit"||view==="add item"){
    const  item = editItem;
    const isNew = view==="add item";
    const setField = (k,v)=>setEditItem(p=>({...p,[k]:v}));

    // Variant helpers
    const addVariant  = ()=>setEditItem(p=>({...p,variants:[...p.variants,{id:"v"+Date.now(),label:"",priceAdd:0}]}));
    const rmVariant   = (id)=>setEditItem(p=>({...p,variants:p.variants.filter(v=>v.id!==id)}));
    const setVariant  = (id,k,v)=>setEditItem(p=>({...p,variants:p.variants.map(vv=>vv.id===id?{...vv,[k]:v}:vv)}));

    // Option group helpers
    const addOptionGroup = ()=>setEditItem(p=>({...p,options:[...p.options,{id:"o"+Date.now(),label:"",required:false,multi:false,choices:[{id:"c"+Date.now(),label:"",priceAdd:0}]}]}));
    const rmOptionGroup  = (oid)=>setEditItem(p=>({...p,options:p.options.filter(o=>o.id!==oid)}));
    const setOpt         = (oid,k,v)=>setEditItem(p=>({...p,options:p.options.map(o=>o.id===oid?{...o,[k]:v}:o)}));
    const addChoice      = (oid)=>setEditItem(p=>({...p,options:p.options.map(o=>o.id===oid?{...o,choices:[...o.choices,{id:"c"+Date.now(),label:"",priceAdd:0}]}:o)}));
    const rmChoice       = (oid,cid)=>setEditItem(p=>({...p,options:p.options.map(o=>o.id===oid?{...o,choices:o.choices.filter(c=>c.id!==cid)}:o)}));
    const setChoice      = (oid,cid,k,v)=>setEditItem(p=>({...p,options:p.options.map(o=>o.id===oid?{...o,choices:o.choices.map(c=>c.id===cid?{...c,[k]:v}:c)}:o)}));

    // Promo helpers
    const addPromo  = ()=>setEditItem(p=>({...p,promos:[...p.promos,{id:"p"+Date.now(),label:"",discount:"bogo",tag:"BOGO",priceAdd:0}]}));
    const rmPromo   = (pid)=>setEditItem(p=>({...p,promos:p.promos.filter(pr=>pr.id!==pid)}));
    const setPromo  = (pid,k,v)=>setEditItem(p=>({...p,promos:p.promos.map(pr=>pr.id===pid?{...pr,[k]:v}:pr)}));

    const canSave =  item.name.trim()&& item.basePrice>0;

    return h("div",null,
      // Header
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
        h("div",{style:{display:"flex",alignItems:"center",gap:10}},
          h("button",{onClick:()=>{setView("list");setEditItem(null);},
            style:{padding:"6px 12px",background:C.bg,border:"1px solid "+C.border,borderRadius:7,fontSize:13,cursor:"pointer"}},"← Back"),
          h("h2",{style:{margin:0,fontSize:16,fontWeight:800}},isNew?"➕ Add New Item":"✏️ Edit — "+ item.name)
        ),
        h("div",{style:{display:"flex",gap:7}},
          !isNew&&h("button",{onClick:()=>deleteItem( item),
            style:{padding:"8px 14px",background:"#FFEBEE",border:"1px solid #FFCDD2",borderRadius:8,color:C.danger,fontWeight:700,fontSize:14,cursor:"pointer"}},
            "🗑️ Delete"),
          h("button",{onClick:()=>saveItem( item),disabled:!canSave||saving,
            style:{padding:"8px 18px",background:canSave?`linear-gradient(135deg,${C.primary},${C.dark})`:"#ddd",
              border:"none",borderRadius:8,color:canSave?"#fff":"#999",fontWeight:700,fontSize:14,cursor:canSave?"pointer":"not-allowed"}},
            saving?"Saving...":"💾 Save Item")
        ),

        // ── OPTION GROUPS SECTION ──
        h("div",{style:{marginTop:12,background:"#fff",borderRadius:10,
          border:"1px solid "+C.border,padding:"12px 16px"}},
          h("div",{style:{fontSize:13,fontWeight:800,marginBottom:8,
            display:"flex",justifyContent:"space-between",alignItems:"center"}},
            h("span",null,"⚙️ Linked Option Groups"),
            h("span",{style:{fontSize:12,color:C.muted,fontWeight:400}},
              "Options shown to cashier during ordering")
          ),
          optGroups.length===0
            ? h("div",{style:{fontSize:13,color:C.muted,padding:"8px 0"}},
                "No option groups yet — create them in BOM → Option Groups")
            : h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}},
                optGroups.map(g=>{
                  const linked=( item.optionGroups||[]).includes(g.id);
                  return h("div",{key:g.id,
                    onClick:()=>{

// ─── BRANCH MENU PAGE (toggle + price override) ──────────
function BranchMenuPage({menuItems,setMenuItems,branchId,curBranch,user,db,showT,branches=BRANCHES}){
  const [overrides,setOverrides] = useState({});
  const [exclusives,setExclusives] = useState([]); // branch-only  items
  const [filterCat,setFilter]    = useState("All");
  const [saving,setSaving]       = useState(null);
  const [showAddExclusive,setShowAddExclusive] = useState(false);
  const [newExItem,setNewExItem] = useState({name:"",basePrice:"",cat:"",emoji:"🍽️",desc:""});
  const [srch,setSrch]           = useState("");

  // Load overrides for this branch
  useEffect(()=>{
    const q=query(collection(db,"menu_overrides"),where("branch","==",branchId));
    const unsub=onSnapshot(q,snap=>{
      const ov={};
      const ex=[];
      snap.docs.forEach(d=>{
        const data={...d.data(),_docId:d.id};
        if(data.isExclusive){
          ex.push(data);
        } else {
          ov[data. itemId]={avail:data.avail,price:data.price,docId:d.id};
        }
      });
      setOverrides(ov);
      setExclusives(ex);
    },()=>{});
    return()=>unsub();
  },[branchId]);

  const getAvail=( item)=>overrides[ item.id]?.avail!==false;
  const getPrice=( item)=>overrides[ item.id]?.price?? item.basePrice;

  const saveOverride=async( item,payload)=>{
    setSaving( item.id);
    try{
      await setDoc(doc(db,"menu_overrides",branchId+"_"+ item.id),
        { itemId: item.id,branch:branchId,...payload},
        {merge:true});
      showT( item.name+" updated ✓");
    }catch(e){showT("Save failed","err");}
    setSaving(null);
  };

  const toggleAvail=async( item)=>{
    const newAvail=!getAvail( item);
    await saveOverride( item,{avail:newAvail});
  };

  const savePrice=async( item,price)=>{
    await saveOverride( item,{price:parseFloat(price)|| item.basePrice});
  };

  const resetItem=async( item)=>{
    if(!overrides[ item.id]?.docId)return;
    await deleteDoc(doc(db,"menu_overrides",overrides[ item.id].docId));
    showT( item.name+" reset to main menu ✓");
  };

  const addExclusive=async()=>{
    if(!newExItem.name||!newExItem.basePrice){showT("Fill name and price","warn");return;}
    try{
      const id="ex_"+branchId+"_"+Date.now();
      await setDoc(doc(db,"menu_overrides",id),{
        isExclusive:true,
        branch:branchId,
        id,
        name:newExItem.name,
        basePrice:parseFloat(newExItem.basePrice)||0,
        cat:newExItem.cat||"Others",
        emoji:newExItem.emoji||"🍽️",
        desc:newExItem.desc||"",
        avail:true,
        createdAt:serverTimestamp(),
        createdBy:user.name
      });
      showT(newExItem.name+" added as branch-exclusive ✓");
      setNewExItem({name:"",basePrice:"",cat:"",emoji:"🍽️",desc:""});
      setShowAddExclusive(false);
    }catch(e){showT("Error","err");}
  };

  const deleteExclusive=async(ex)=>{
    if(!confirm("Remove "+ex.name+" from branch menu?"))return;
    await deleteDoc(doc(db,"menu_overrides",ex._docId));
    showT(ex.name+" removed ✓");
  };

  const cats=["All",...new Set(menuItems.map(i=>i.cat).filter(Boolean))];
  const filtered=menuItems.filter(i=>{

  const CATS=["Protein","Produce","Frozen","Sauce","Dairy","Dry Goods","Packaging","Beverage","Other"];

  const blank=()=>({
    id:"ing_"+Date.now(),
    name:"",unit:"pc",cat:"Other",
    cost:0,   // cost per unit
    stock:0,  // current stock (optional - can sync with inventory)
    supplier:"",notes:""
  });

  useEffect(()=>{
    const unsub=onSnapshot(collection(db,"ingredients"),snap=>{
      setIngs(snap.docs.map(d=>({...d.data(),id:d.id}))
        .sort((a,b)=>(a.name||"").localeCompare(b.name||"")));
    },()=>{});
    return()=>unsub();

  const save=async()=>{
    if(!editing||!editing.name.trim()){showT("Enter ingredient name","warn");return;}
    if(!editing.unit){showT("Select unit","warn");return;}

    try{
      if(editing._isNew){
        const {_isNew,...data}=editing;
        await setDoc(doc(db,"ingredients",editing.id),{
          ...data,createdAt:serverTimestamp(),by:user.name
        });
      } else {
        await updateDoc(doc(db,"ingredients",editing.id),{
          ...editing,updatedAt:serverTimestamp(),by:user.name
        });
      }

      setEditing(null);

// ─── BOM MANAGER COMPONENT ───────────────────────────────
const UNITS = ["pc","pack","box","sack","kg","g","L","mL","cup","gal","tray","dozen","set","sheet","bottle","can","bag"];

// ── PACK MODEL ─────────────────────────────────────────────────────
// `stock` is ALWAYS carried in the  item's base unit ( item.unit) — deduction
// never has to convert, so the hot path stays as it is today.
// packSize/packUnit describe how the  item is BOUGHT and COUNTED, and are used
// only at the edges: receiving, physical count, PO, and display.
// Items without packSize behave exactly as before.
function packSizeOf(it){ const n=Number(it&&it.packSize)||0; return n>1?n:0; }
function packUnitOf(it){ return (it&&it.packUnit)||"pack"; }
function baseUnitOf(it){ return (it&&it.unit)||""; }
// packs + loose base units -> base units
function packsToBase(it,packs,loose){
  const sz=packSizeOf(it)||1;
  return (Number(packs)||0)*sz+(Number(loose)||0);
}
// base units -> {packs, loose}
function baseToPacks(it,base){
  const sz=packSizeOf(it);
  const b=Number(base)||0;
  if(!sz)return {packs:0,loose:b,hasPacks:false};
  return {packs:Math.floor(b/sz),loose:Math.round((b%sz)*1000)/1000,hasPacks:true};
}
// toISOString() converts to UTC. Manila is UTC+8, so every sale before 08:00
// was being stamped with the PREVIOUS day's date — and every date arithmetic
// helper shifted back one day. Always derive the calendar date locally.
function localDate(d){
  const x=(d instanceof Date)?d:new Date();
  return x.getFullYear()+"-"+
    String(x.getMonth()+1).padStart(2,"0")+"-"+
    String(x.getDate()).padStart(2,"0");
}
