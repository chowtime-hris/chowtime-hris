                      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}},
                        ["cashier","crew","stockclerk"].map(r=>{
                          const ri=ROLES[r]||{};
                          return h("button",{key:r,
                            onClick:()=>setEditingStaff(p=>({...p,role:r})),
                            style:{padding:"9px 6px",borderRadius:8,border:"2px solid",
                              cursor:"pointer",fontWeight:700,fontSize:13,
                              borderColor:editingStaff.role===r?ri.color||C.primary:C.border,
                              background:editingStaff.role===r?(ri.color||C.primary)+"15":"#fff",
                              color:editingStaff.role===r?ri.color||C.primary:C.text}},
                            (ri.emoji||"👤")+" "+ri.label||r);
                        })
                      )
                    ),
                    h("div",{style:{marginBottom:12}},
                      h("div",{style:{fontSize:12,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:4}},"PASSWORD (login password)"),
                      h("input",{type:"password",value:editingStaff.password||"",
                        onChange:e=>setEditingStaff(p=>({...p,password:e.target.value})),
                        placeholder:"Min 6 characters",
                        style:{width:"100%",padding:"9px",border:"1px solid "+C.border,
                          borderRadius:7,fontSize:13,outline:"none",
                          boxSizing:"border-box"}})
                    ),
                    // Create Login Account button
                    editingStaff.email&&h("button",{
                      onClick:async()=>{
                        if(!editingStaff.email){showT("Enter email first","warn");return;}
                        var tempPw=editingStaff.password||"";
                          if(!tempPw||tempPw.length<6){showT("Enter password (min 6 chars)","warn");return;}
                        try{
                          const _r=await createLoginAccount(editingStaff.email,tempPw);
                          if(!_r.ok)throw Object.assign(new Error(_r.message),{code:_r.code});
                          showT("✅ Login account created! Password: "+tempPw,"ok");
                        }catch(e){
                          if(e.code==="auth/email-already-in-use"){
                            showT("Account already exists — just update staff record","ok");
                          }else{
                            showT("Error: "+e.message,"err");
                          }
                        }
                      },
                      style:{width:"100%",padding:"10px",marginBottom:8,
                        background:"#1565C0",border:"none",borderRadius:9,
                        color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}},
                      "🔑 Create Login Account"),

                    h("button",{
                      onClick:async()=>{
                        if(!editingStaff.name){showT("Enter name","warn");return;}
                        if(!editingStaff.branch){showT("Pick a branch first","warn");return;}
                        try{
                          if(editingStaff._isNew){
                            await addDoc(collection(db,"staff_accounts"),{
                              name:editingStaff.name,
                              // clamp: a branch manager can only ever create
                              // staff roles, never another manager or owner
                              role:["cashier","crew","stockclerk"].includes(editingStaff.role)
                                ?editingStaff.role:"crew",
                              branch:branchId,email:(editingStaff.email||"").trim().toLowerCase(),
                              createdAt:serverTimestamp(),createdBy:user.name
                            });
                            showT(editingStaff.name+" added ✓");
                          } else {
                            await updateDoc(doc(db,"staff_accounts",editingStaff.id),{
                              name:editingStaff.name,
                              role:["cashier","crew","stockclerk"].includes(editingStaff.role)
                                ?editingStaff.role:"crew",
                              branch:branchId,   // cannot be moved to another branch
                              email:(editingStaff.email||"").trim().toLowerCase(),
                              updatedAt:serverTimestamp(),
                              updatedBy:user.name
                            });
                            showT(editingStaff.name+" updated ✓");
                          }
                          setEditingStaff(null);
                        }catch(e){showT("Error","err");}
                      },
                      style:{width:"100%",padding:"11px",
                        background:"linear-gradient(135deg,"+C.primary+","+C.dark+")",
                        border:"none",borderRadius:9,color:"#fff",
                        fontWeight:800,fontSize:13,cursor:"pointer"}},
                      "💾 Save")
                  )
                )
            )
          )
        ),


        // ══ CA REQUEST ══
        page==="ca_request"&&h(CALoanPage,{
          user,branchId,curBranch,db,hrisDB,showT,mode:"ca",
          hrisEmps,key:"ca_"+user.id
        }),

        // ══ LOAN REQUEST ══
        page==="loan_request"&&h(CALoanPage,{
          user,branchId,curBranch,db,hrisDB,showT,mode:"loan",
          hrisEmps,key:"loan_"+user.id
        }),

        // ══ HRIS DASHBOARD (Owner) ══
        page==="hris_dash"&&h(HRISDashPage,{
          user,db,hrisDB,showT,branches,hrisEmps
        }),

        // ══ HRIS BRANCH VIEW (Manager) ══
        page==="hris_branch"&&h(HRISBranchPage,{
          user,branchId,curBranch,db,hrisDB,showT
        }),


        // ══ COMMISSARY ══

        // ══ STOCK ORDER (Branch → Commissary PO) ══
        page==="inv_log"&&h(InvLogPage,{
          db,user,branchId,branches,showT
        }),

        page==="stock_order"&&h("div",null,
          h(SectionHeader,{title:"📦 Order Stocks from Commissary",
            action:()=>setModal("new_po"),actionLabel:"New Order"}),

          // Stats
          h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}},
            h(Stat,{label:"Pending",value:advances.filter(a=>a._type==="po"&&a.branch===branchId&&a.status==="received_by_main").length,icon:"⏳",color:C.warning}),
            h(Stat,{label:"Processing",value:advances.filter(a=>a._type==="po"&&a.branch===branchId&&a.status==="processing").length,icon:"⚙️",color:"#6A1B9A"}),
            h(Stat,{label:"For Receiving",value:advances.filter(a=>a._type==="po"&&a.branch===branchId&&a.status==="paid").length,icon:"📥",color:C.primary}),
            h(Stat,{label:"Completed",value:advances.filter(a=>a._type==="po"&&a.branch===branchId&&a.status==="completed").length,icon:"✅",color:C.success})
          ),

          // Filter tabs
          h("div",{style:{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}},
            ["all","received_by_main","processing","paid","discrepancy","completed"].map(s=>
              h("button",{key:s,
                onClick:()=>setPoFilter(s),
                style:{padding:"5px 14px",borderRadius:20,fontSize:13,cursor:"pointer",
                  border:"1px solid "+(poFilter===s?C.primary:C.border),
                  background:poFilter===s?C.primary+"15":"#fff",
                  color:poFilter===s?C.primary:C.muted,
                  fontWeight:poFilter===s?700:400}},
                {all:"All",received_by_main:"Pending",processing:"Processing",
                 paid:"For Receiving",discrepancy:"Discrepancy",completed:"Completed"}[s]||s)
            )
          ),

          // Same table as the PO Monitor. A branch has fewer orders but the
          // same question — what is still owed, what has not arrived — and a
          // card per order buries that under a scroll.
          (function(){
            const rows=advances
              .filter(a=>a._type==="po"&&a.branch===branchId&&
                (poFilter==="all"||(a.status||"pending")===poFilter))
              .sort((a,b)=>(b.timestamp?.seconds||0)-(a.timestamp?.seconds||0));
            const COLS="132px 88px 104px 104px 96px 116px 100px 100px 46px";
            const HEAD=["PO NUMBER","ITEMS","TOTAL","PAID","BALANCE",
                        "STATUS","ORDERED","ARRIVING",""];
            return h("div",{style:{background:"#fff",border:"1px solid "+C.border,
              borderRadius:12,overflow:"auto",marginBottom:12}},
              h("div",{style:{minWidth:920}},
                h("div",{style:{display:"grid",gridTemplateColumns:COLS,gap:6,
                  padding:"10px 14px",background:C.bg,
                  borderBottom:"1px solid "+C.border}},
                  HEAD.map((k,ix)=>h("div",{key:k+ix,
                    style:{fontSize:11,fontWeight:800,color:C.muted,letterSpacing:1,
                      textAlign:(ix>=1&&ix<=4)?"right":"left"}},k))),
                rows.length===0
                  ? h("div",{style:{padding:"30px",textAlign:"center",
                      color:C.muted,fontSize:13}},"No orders yet")
                  : rows.map(po=>{
                      const st=po.status||"pending";
                      const stC={received_by_main:C.warning,processing:C.primary,
                        paid:C.info,discrepancy:C.danger,
                        completed:C.success,cancelled:C.muted}[st]||C.muted;
                      const stL={received_by_main:"Pending at Main",
                        processing:"Processing",paid:"Ready to receive",
                        discrepancy:"Discrepancy",completed:"Completed",
                        cancelled:"Cancelled"}[st]||st;
                      const paid=(po.payments||[]).reduce((a,p)=>a+(p.amount||0),0);
                      const val=poValue(po);
                      const bal=val-paid;
                      const open=poOpen===po._docId;
                      const nItems=((po.receivedItems||po.deliveredItems||po.items)||[]).length;
                      const needsPost=(st==="completed"||st==="discrepancy")
                        &&!po.stockPosted&&((po.receivedItems||[]).length>0);
                      return h("div",{key:po._docId},
                        h("div",{onClick:()=>setPoOpen(open?"":po._docId),
                          style:{display:"grid",gridTemplateColumns:COLS,gap:6,
                            padding:"11px 14px",alignItems:"center",cursor:"pointer",
                            borderBottom:"1px solid "+C.border,
                            background:open?C.primary+"0D":"#fff"}},
                          h("div",{style:{fontSize:12,fontFamily:"monospace",
                            fontWeight:700}},po.poNum||"—",
                            needsPost&&h("div",{style:{fontSize:10,color:C.warning,
                              fontWeight:800,fontFamily:"inherit"}},"not in stock")),
                          h("div",{style:{fontSize:13,textAlign:"right"}},nItems),
                          h("div",{style:{fontSize:13,textAlign:"right",
                            fontWeight:700}},"₱"+peso(val)),
                          h("div",{style:{fontSize:13,textAlign:"right",
                            color:paid>0?C.success:C.muted}},"₱"+peso(paid)),
                          h("div",{style:{fontSize:13,textAlign:"right",
                            fontWeight:bal>0?800:400,
                            color:bal>0?C.danger:C.muted}},
                            bal>0?"₱"+peso(bal):"—"),
                          h("div",null,h("span",{style:{fontSize:11,fontWeight:800,
                            padding:"3px 9px",borderRadius:20,
                            background:stC+"18",color:stC}},stL)),
                          h("div",{style:{fontSize:12,color:C.muted}},po.date||"—"),
                          h("div",{style:{fontSize:12,color:C.muted}},
                            po.deliveryDate||"—"),
                          h("div",{style:{fontSize:12,color:C.muted,
                            textAlign:"right"}},open?"▾":"▸")
                        )
                      );
                    })
              )
            );
          })(),

          // The full card for the open row — Edit, Cancel, Receive Items and
          // the recovery banner all stay where they were.
          h("div",{style:{display:"grid",gap:10}},
            advances
            .filter(a=>a._type==="po"&&a.branch===branchId&&
              (poFilter==="all"||(a.status||"pending")===poFilter))
            .filter(a=>a._docId===poOpen)
            .map(po=>{
              const st=po.status||"pending";
              const stColor={
                received_by_main:"#FF9500",processing:"#6A1B9A",
                paid:C.primary,discrepancy:"#C62828",completed:C.success
              }[st]||C.muted;
              const stLabel={
                received_by_main:"⏳ Pending at Main",processing:"⚙️ Processing",
                approved:"⚙️ Processing",
                paid:"📥 Ready to Receive",discrepancy:"⚠️ Discrepancy",completed:"✅ Completed",
                cancelled:"✕ Cancelled"
              }[st]||st;
              const total=poValue(po);
              const paid=(po.payments||[]).reduce((s,p)=>s+(p.amount||0),0);
              const bal=(total||0)-paid;

              return h("div",{key:po._docId,
                style:{background:"#fff",borderRadius:12,
                  border:"2px solid "+stColor+"33",overflow:"hidden"}},

                // Header
                h("div",{style:{padding:"10px 16px",background:stColor+"12",
                  display:"flex",justifyContent:"space-between",alignItems:"center",
                  borderBottom:"1px solid "+stColor+"22"}},
                  h("div",null,
                    h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
                      h("span",{style:{fontWeight:900,color:stColor,fontSize:13}},po.poNum),
                      h("span",{style:{fontSize:12,padding:"2px 8px",background:stColor,
                        color:"#111111",borderRadius:10,fontWeight:700}},stLabel)
                    ),
                    // Three independent dimensions. One badge cannot say
                    // "delivered but unpaid", which is the state that matters
                    // most when chasing collections.
                    h("div",{style:{display:"flex",gap:5,marginTop:4,flexWrap:"wrap"}},
                      (function(){
                        const dv=po.deliveryStatus||"Pending";
                        const dm={Pending:["#9E9E9E","⏸ Not dispatched"],
                                  Dispatched:["#1565C0","🚚 In transit"],
                                  Delivered:["#2E7D32","📦 Delivered"],
                                  Short:["#C62828","⚠️ Short delivery"]}[dv]
                                 ||["#9E9E9E",dv];
                        const pv=po.paymentStatus||"Unpaid";
                        const pm=pv==="Paid"?["#2E7D32","💰 Paid"]
                                            :["#E65100","💸 Unpaid"];
                        return [dm,pm].map((x,ix)=>h("span",{key:ix,
                          style:{fontSize:11,fontWeight:800,padding:"2px 7px",
                            borderRadius:10,background:x[0]+"1A",color:x[0],
                            border:"1px solid "+x[0]+"44"}},x[1]));
                      })()
                    ),
                    h("div",{style:{fontSize:12,color:C.muted,marginTop:3}},
                      po.date+(po.deliveryDate?" · DR Date: "+po.deliveryDate:"")+
                      (po.vatType?" · "+po.vatType.toUpperCase():""))
                  ),
                  h("div",{style:{display:"flex",alignItems:"center",gap:10}},
                    // Editable only while Main has not issued the DR. After
                    // that the request is the audit baseline for discrepancy.
                    (po.status==="received_by_main")&&h("div",{style:{display:"flex",gap:5}},
                      h("button",{onClick:()=>{setEditingPO(po);setModal("new_po");},
                        style:{padding:"4px 10px",borderRadius:7,fontSize:12,fontWeight:700,
                          border:"1px solid "+C.border,background:"#fff",
                          color:C.text,cursor:"pointer"}},"✏️ Edit"),
                      h("button",{onClick:async()=>{
                          const why=prompt("Reason for cancelling "+po.poNum+"?","");
                          if(why===null)return;
                          try{
                            const snap=await getDoc(doc(db,"advances",po._docId));
                            if(snap.exists()&&snap.data().status!=="received_by_main"){
                              showT("Cannot be cancelled — already processed","err");return;
                            }
                            await updateDoc(doc(db,"advances",po._docId),{
                              status:"cancelled",cancelReason:why.trim(),
                              cancelledBy:user.name,cancelledAt:serverTimestamp()});
                            await notify(db,{to:"ct-main",type:"info",
                              title:"Cancelled "+po.poNum,
                              message:why.trim()||"No dahilan",
                              page:"po_monitor",ref:po.poNum,by:user.name});
                            showT(po.poNum+" cancelled","warn");
                          }catch(e){showT("Cancel failed","err");}
                        },
                        style:{padding:"4px 10px",borderRadius:7,fontSize:12,fontWeight:700,
                          border:"1px solid #FFCDD2",background:"#FFEBEE",
                          color:C.danger,cursor:"pointer"}},"Cancel")
                    ),
                    (po.status!=="received_by_main"&&po.status!=="cancelled")&&
                      h("span",{style:{fontSize:11,color:C.muted}},"🔒 locked"),
                    h("div",{style:{textAlign:"right"}},
                      h("div",{style:{fontSize:14,fontWeight:900,color:stColor}},
                        "₱"+peso(total)),
                      h("div",{style:{fontSize:12,color:paid>=total&&total>0?C.success:C.warning}},
                        paid>0?"Paid: ₱"+peso(paid)+" / ₱"+peso(total):
                        po.paymentStatus||"Unpaid")
                    )
                  )
                ),

                // Items preview
                h("div",{style:{padding:"8px 16px"}},
                  (po.deliveredItems||po. items||[]).slice(0,3).map((i,ix)=>
                    h("div",{key:ix,style:{fontSize:13,display:"flex",
                      justifyContent:"space-between",padding:"3px 0",
                      borderBottom:"1px solid #f5f5f5"}},
                      h("span",{style:{fontWeight:600}},i.name),
                      h("span",{style:{color:C.muted}},
                        (i.actualQty!=null?i.actualQty:i.qty)+" "+(i.unit||""))
                    )
                  ),
                  (po. items||[]).length>3&&h("div",{style:{fontSize:12,color:C.muted}},
                    "+"+(po. items.length-3)+" more  items")
                ),

                // Same recovery on the branch side: a manager can fix their own
                // stock without waiting for the owner to notice.
                (po.status==="completed"||po.status==="discrepancy")
                  &&!po.stockPosted&&((po.receivedItems||[]).length>0)
                  &&h("div",{style:{margin:"0 16px 10px",background:"#FFF3E0",
                    border:"1px solid #FFCC80",borderRadius:8,padding:"9px 11px",
                    display:"flex",gap:9,alignItems:"center",flexWrap:"wrap"}},
                  h("span",{style:{fontSize:14}},"📥"),
                  h("div",{style:{flex:1,minWidth:180}},
                    h("div",{style:{fontSize:13,fontWeight:800,color:"#BF360C"}},
                      "Received, but never added to stock"),
                    h("div",{style:{fontSize:12,color:C.muted,marginTop:1}},
                      (po.receivedItems||[]).length+" item/s on this DR")),
                  h("button",{
                    onClick:async()=>{
                      if(!confirm("Add the received items of "+po.poNum
                        +" into stock?\n\nRuns once — the PO is marked "
                        +"afterwards so it cannot be posted twice."))return;
                      const r=await postReceivedToStock(db,po,user.name);
                      if(r.errors.length)
                        showT("Posted "+r.added+", failed "+r.errors.length,"warn");
                      else if(r.added)
                        showT(r.added+" item/s added to stock"
                          +(r.adopted?" ("+r.adopted+" new)":"")+" ✓");
                      else showT("Nothing to post","warn");
                    },
                    style:{padding:"7px 13px",borderRadius:7,border:"none",
                      background:"#E65100",color:"#fff",fontSize:13,
                      fontWeight:800,cursor:"pointer"}},
                    "Add to stock")
                ),

                // Actions for branch
                h("div",{style:{padding:"8px 16px",borderTop:"1px solid #f5f5f5",
                  display:"flex",gap:7,flexWrap:"wrap"}},

                  // Payment gates receiving, by design: the branch confirms
                  // the delivery only after Main has recorded the payment.
                  st==="paid"&&h("button",{
                    onClick:()=>setModal("receive_"+po._docId),
                    style:{padding:"8px 16px",
                      background:"linear-gradient(135deg,"+C.primary+","+C.dark+")",
                      border:"none",borderRadius:8,color:"#fff",
                      fontSize:13,fontWeight:800,cursor:"pointer"}},
                    "📥 Receive Items"),

                  // Closed without a receipt: the goods never entered this
                  // branch's stock and no shortage could be reported. Only
                  // MAIN can reopen it, so say so instead of showing a locked
                  // card with no way forward.
                  (st==="completed"&&!((po.receivedItems||[]).length))&&h("div",{
                    style:{width:"100%",background:C.warning+"18",
                      border:"1px solid "+C.warning,borderRadius:9,
                      padding:"9px 12px",marginBottom:6}},
                    h("div",{style:{fontSize:12,fontWeight:800,color:C.warning}},
                      "Closed before you received it"),
                    h("div",{style:{fontSize:11,color:C.muted,marginTop:2,
                      lineHeight:1.5}},
                      "These items are not in your stock and no shortage can be "+
                      "reported. Ask Main to reopen it — PO Monitor, "+
                      "↩ Reopen for receiving.")),

                  // DISCREPANCY → View/edit report
                  st==="discrepancy"&&h("button",{
                    onClick:()=>setModal("receive_"+po._docId),
                    style:{padding:"8px 16px",background:"#C62828",
                      border:"none",borderRadius:8,color:"#fff",
                      fontSize:13,fontWeight:800,cursor:"pointer"}},
                    "⚠️ View Discrepancy Report"),

                  // Print DR if available
                  (po.drNum||po.deliveredItems)&&h("button",{
                    onClick:()=>renderDRDoc(po,companySettings,branches),
                    style:{padding:"8px 14px",background:"#fff",
                      border:"1px solid "+C.border,borderRadius:8,
                      fontSize:13,fontWeight:700,cursor:"pointer"}},
                    "🖨️ DR")
                )
              );
            })
          )
        ),


        // ══ STOCK RECEIVE (Branch receives DR, checks discrepancy) ══
        page==="stock_receive"&&h("div",null,
          h(SectionHeader,{title:"Receive Stocks — Check DR vs PO"}),
          h("div",{style:{background:"#FFF8E1",border:"1px solid #FFE082",borderRadius:10,padding:"10px 14px",marginBottom:13,fontSize:13,color:"#795548"}},"⚖️ Check actual delivered quantities against your PO. Flag any discrepancy before confirming receipt."),
          advances.filter(a=>a._type==="po"&&a.branch===branchId&&(a.status==="approved"||a.status==="processing")).length===0
            ?h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,padding:"30px",textAlign:"center",color:C.muted,fontSize:14}},"No pending deliveries. Orders for delivery will appear here.")
            :advances.filter(a=>a._type==="po"&&a.branch===branchId&&(a.status==="approved"||a.status==="processing")).map(po=>
              h(DRCheckForm,{key:po._docId,po,db,branchId,user,showT,INIT_INVENTORY,setAdvances,advances})
            )
        ),

        // ══ PO MONITOR (Owner sees all POs across branches) ══
        page==="po_monitor"&&h("div",null,
          h(SectionHeader,{title:"📦 PO Monitor — Main/Commissary"}),

          // KPI Stats
          h("div",{style:{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:14}},
            h(Stat,{label:"New POs",value:advances.filter(a=>a._type==="po"&&a.status==="received_by_main").length,icon:"📥",color:C.warning}),
            h(Stat,{label:"Processing",value:advances.filter(a=>a._type==="po"&&a.status==="processing").length,icon:"⚙️",color:"#6A1B9A"}),
            h(Stat,{label:"For Payment",value:advances.filter(a=>a._type==="po"&&a.status==="processing"&&a.paymentStatus!=="Paid").length,icon:"💰",color:C.info}),
            h(Stat,{label:"Discrepancy",value:advances.filter(a=>a._type==="po"&&a.status==="discrepancy").length,icon:"⚠️",color:C.danger}),
            h(Stat,{label:"Completed",value:advances.filter(a=>a._type==="po"&&a.status==="completed").length,icon:"✅",color:C.success})
          ),

          // Filter tabs
          h("div",{style:{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}},
            [["all","All"],["received_by_main","New POs"],["processing","Processing"],
             ["paid","Paid"],["discrepancy","Discrepancy"],["completed","Completed"]].map(([s,lbl])=>
              h("button",{key:s,onClick:()=>setPoFilter(s),
                style:{padding:"5px 14px",borderRadius:20,fontSize:13,cursor:"pointer",
                  border:"1px solid "+(poFilter===s?C.primary:C.border),
                  background:poFilter===s?C.primary+"15":"#fff",
                  color:poFilter===s?C.primary:C.muted,fontWeight:poFilter===s?700:400}},lbl))
          ),

          // A table, not a stack of cards: the point of a monitor is reading
          // twenty POs at a glance and spotting the one that is wrong. Cards
          // force a scroll per row and hide exactly that comparison.
          (function(){
            const rows=advances
              .filter(a=>a._type==="po"&&(poFilter==="all"||a.status===poFilter))
              .sort((a,b)=>(b.timestamp?.seconds||0)-(a.timestamp?.seconds||0));
            const COLS="150px 128px 100px 100px 96px 112px 116px 96px 96px 46px";
            const HEAD=["BRANCH","PO NUMBER","TOTAL","PAID","BALANCE","PAYMENT",
                        "STATUS","ORDERED","DELIVERY",""];
            return h("div",{style:{background:"#fff",border:"1px solid "+C.border,
              borderRadius:12,overflow:"auto",marginBottom:12}},
              h("div",{style:{minWidth:1040}},
                h("div",{style:{display:"grid",gridTemplateColumns:COLS,gap:6,
                  padding:"10px 14px",background:C.bg,
                  borderBottom:"1px solid "+C.border}},
                  HEAD.map((k,ix)=>h("div",{key:k+ix,
                    style:{fontSize:11,fontWeight:800,color:C.muted,letterSpacing:1,
                      textAlign:(ix>=2&&ix<=4)?"right":"left"}},k))),
                rows.length===0
                  ? h("div",{style:{padding:"30px",textAlign:"center",
                      color:C.muted,fontSize:13}},"No purchase orders here")
                  : rows.map(po=>{
                      const st=po.status||"pending";
                      const stC={received_by_main:C.warning,processing:C.primary,
                        paid:C.success,discrepancy:C.danger,
                        completed:C.muted,cancelled:C.muted}[st]||C.muted;
                      const stL={received_by_main:"New PO",processing:"Processing",
                        paid:"Ready to receive",discrepancy:"Discrepancy",
                        completed:"Completed",cancelled:"Cancelled"}[st]||st;
                      const paid=(po.payments||[]).reduce((a,p)=>a+(p.amount||0),0);
                      const val=poValue(po);
                      const bal=val-paid;
                      const pay=po.paymentStatus
                        ||(paid>0?(bal>0?"Partial":"Paid"):"Unpaid");
                      const payC=pay==="Paid"?C.success
                        :(pay==="Partial"?C.warning:C.muted);
                      const open=poOpen===po._docId;
                      const needsPost=(st==="completed"||st==="discrepancy")
                        &&!po.stockPosted&&((po.receivedItems||[]).length>0);
                      return h("div",{key:po._docId},
                        h("div",{onClick:()=>setPoOpen(open?"":po._docId),
                          style:{display:"grid",gridTemplateColumns:COLS,gap:6,
                            padding:"11px 14px",alignItems:"center",cursor:"pointer",
                            borderBottom:"1px solid "+C.border,
                            background:open?C.primary+"0D":"#fff"}},
                          h("div",{style:{fontSize:13,fontWeight:700,overflow:"hidden",
                            textOverflow:"ellipsis",whiteSpace:"nowrap"}},
                            po.branchName||po.branch||"—"),
                          h("div",{style:{fontSize:12,fontFamily:"monospace"}},
                            po.poNum||"—",
                            needsPost&&h("div",{style:{fontSize:10,color:C.warning,
                              fontWeight:800,fontFamily:"inherit"}},"not in stock")),
                          h("div",{style:{fontSize:13,textAlign:"right",
                            fontWeight:700}},"₱"+peso(val)),
                          h("div",{style:{fontSize:13,textAlign:"right",
                            color:paid>0?C.success:C.muted}},"₱"+peso(paid)),
                          h("div",{style:{fontSize:13,textAlign:"right",
                            fontWeight:bal>0?800:400,
                            color:bal>0?C.danger:C.muted}},
                            bal>0?"₱"+peso(bal):"—"),
                          h("div",null,h("span",{style:{fontSize:11,fontWeight:800,
                            padding:"3px 9px",borderRadius:20,
                            background:payC+"18",color:payC}},pay)),
                          h("div",null,h("span",{style:{fontSize:11,fontWeight:800,
                            padding:"3px 9px",borderRadius:20,
                            background:stC+"18",color:stC}},stL)),
                          h("div",{style:{fontSize:12,color:C.muted}},po.date||"—"),
                          h("div",{style:{fontSize:12,color:C.muted}},
                            po.deliveryDate||"—"),
                          h("div",{style:{fontSize:12,color:C.muted,
                            textAlign:"right"}},open?"▾":"▸")
                        )
                      );
                    })
              )
            );
          })(),

          // The full card still renders, but only for the row that is open —
          // the actions and the discrepancy report stay where they were.
          h("div",{style:{display:"grid",gap:10}},
            advances
            .filter(a=>a._type==="po"&&(poFilter==="all"||a.status===poFilter))
            .filter(a=>a._docId===poOpen)
            .map(po=>{
              const st=po.status||"pending";
              const stColor={received_by_main:C.warning,processing:"#6A1B9A",
                paid:C.success,discrepancy:C.danger,completed:"#888"}[st]||C.muted;
              const stLabel={received_by_main:"📥 New PO",processing:"⚙️ Processing",
                paid:"✅ Paid",discrepancy:"⚠️ Discrepancy",completed:"✓ Completed"}[st]||st;
              const totalPaid=(po.payments||[]).reduce((s,p)=>s+(p.amount||0),0);
              const balance=poValue(po)-totalPaid;

              return h("div",{key:po._docId,
                style:{background:"#fff",borderRadius:12,
                  border:"2px solid "+stColor+"33",overflow:"hidden"}},

                // Header
                h("div",{style:{padding:"10px 16px",
                  background:stColor+"10",
                  borderBottom:"1px solid "+stColor+"22",
                  display:"flex",justifyContent:"space-between",alignItems:"center"}},
                  h("div",null,
                    h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
                      h("span",{style:{fontWeight:900,color:stColor,fontSize:13}},po.poNum),
                      h("span",{style:{fontSize:12,padding:"2px 8px",
                        background:stColor,color:"#111111",borderRadius:10,fontWeight:700}},stLabel)
                    ),
                    h("div",{style:{fontSize:12,color:C.muted,marginTop:2}},
                      (po.branchName||po.branch)+" · "+po.date+
                      (po.vatType?" · "+po.vatType.toUpperCase():""))
                  ),
                  h("div",{style:{textAlign:"right"}},
                    h("div",{style:{fontSize:15,fontWeight:900,color:stColor}},
                      "₱"+peso(poValue(po))),
                    poIsEstimate(po)&&h("div",{style:{fontSize:11,color:C.muted}},
                      "estimate"),
                    totalPaid>0&&h("div",{style:{fontSize:12,
                      color:balance<=0?C.success:C.warning}},
                      "Paid: ₱"+peso(totalPaid)+
                      (balance>0?" | Bal: ₱"+peso(balance):" ✅ FULLY PAID"))
                  )
                ),

                // Items preview
                h("div",{style:{padding:"8px 16px",
                  display:"flex",gap:8,flexWrap:"wrap"}},
                  (po. items||[]).slice(0,4).map((i,ix)=>
                    h("span",{key:ix,style:{fontSize:13,padding:"2px 8px",
                      background:"#f5f5f5",borderRadius:6,color:C.text}},
                      i.name+" ×"+(i.qty||0)+" "+(i.unit||""))
                  ),
                  (po. items||[]).length>4&&h("span",{style:{fontSize:13,color:C.muted}},
                    "+"+(po. items.length-4)+" more")
                ),

                // Action buttons
                h("div",{style:{padding:"8px 16px",
                  borderTop:"1px solid #f5f5f5",
                  display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}},

                  // Only MAIN processes a PO. Without this gate a branch
                  // manager could issue their own DR from their own order,
                  // deduct MAIN's stock and skip the commissary entirely.
                  st==="received_by_main"
                    &&(user.role==="owner"||user.role==="commissary")
                    &&h("button",{
                    onClick:()=>setModal("issue_dr_"+po._docId),
                    style:{padding:"7px 14px",
                      background:"linear-gradient(135deg,#6A1B9A,#4A148C)",
                      border:"none",borderRadius:8,color:"#fff",
                      fontSize:13,fontWeight:700,cursor:"pointer"}},
                    "⚙️ Process & Issue DR"),

                  // Discrepancy report
                  ((po.discrepancyItems||[]).length>0)&&(function(){
                    const rows=po.discrepancyItems||[];
                    const open=!!openDisc[po._docId];
                    const short=rows.filter(r=>(Number(r.diff)||0)<0).length;
                    const over =rows.filter(r=>(Number(r.diff)||0)>0).length;
                    return h("div",{style:{width:"100%",background:"#FFF3E0",
                      border:"1px solid #FFCC80",borderRadius:8,
                      padding:"8px 10px",marginBottom:8}},
                      h("button",{
                        onClick:()=>setOpenDisc(p=>Object.assign({},p,
                          {[po._docId]:!open})),
                        style:{width:"100%",display:"flex",alignItems:"center",
                          gap:8,background:"none",border:"none",cursor:"pointer",
                          padding:0,textAlign:"left"}},
                        h("span",{style:{fontSize:14}},"⚠️"),
                        h("div",{style:{flex:1}},
                          h("div",{style:{fontSize:13,fontWeight:800,color:"#BF360C"}},
                            "DISCREPANCY REPORT — "+rows.length+" line"+(rows.length>1?"s":"")),
                          h("div",{style:{fontSize:12,color:C.muted,marginTop:1}},
                            (short?short+" short":"")+
                            (short&&over?" · ":"")+
                            (over?over+" over":"")+
                            (po.discrepancyStatus==="pending_approval"
                              ?"  ·  awaiting Main approval":""))),
                        h("span",{style:{fontSize:12,color:C.muted,
                          transform:open?"rotate(90deg)":"none"}},"▶")
                      ),
                      open&&h("div",{style:{marginTop:8,background:"#fff",
                        borderRadius:7,overflow:"hidden"}},
                        h("div",{style:{display:"grid",
                          gridTemplateColumns:"1fr 58px 58px 58px 1fr",gap:6,
                          padding:"6px 9px",background:"#fafafa"}},
                          ["ITEM","ORDERED","DR","RECEIVED","REMARK"].map(hh=>
                            h("div",{key:hh,style:{fontSize:12,fontWeight:700,
                              color:C.muted,letterSpacing:1}},hh))),
                        rows.map((r,ri)=>{
                          const d=Number(r.diff)||0;
                          return h("div",{key:ri,style:{display:"grid",
                            gridTemplateColumns:"1fr 58px 58px 58px 1fr",gap:6,
                            padding:"6px 9px",borderTop:"1px solid #f5f5f5",
                            alignItems:"center"}},
                            h("div",{style:{fontSize:13,fontWeight:600}},
                              r.name||r.id),
                            h("div",{style:{fontSize:13,textAlign:"right",
                              color:C.muted}},Number(r.qty)||0),
                            h("div",{style:{fontSize:13,textAlign:"right",
                              color:C.muted}},Number(r.drQty)||0),
                            h("div",{style:{fontSize:13,textAlign:"right",
                              fontWeight:800,color:d<0?C.danger:d>0?C.info:C.text}},
                              (Number(r.receivedQty)||0)+
                              (d!==0?" ("+(d>0?"+":"")+d+")":"")),
                            h("div",{style:{fontSize:12,color:C.muted}},
                              r.remark||"—")
                          );
                        })
                      ),
                      open&&po.discrepancyNotes&&h("div",{style:{fontSize:12,
                        color:C.muted,marginTop:6,fontStyle:"italic"}},
                        "Note: "+po.discrepancyNotes)
                    );
                  })(),

                  // Recovery for POs received before the receive path wrote to
                  // inventory. Shows only where the goods were never credited.
                  (st==="completed"||st==="discrepancy")&&!po.stockPosted
                    &&((po.receivedItems||[]).length>0)&&h("div",{
                    style:{width:"100%",background:"#FFF3E0",
                      border:"1px solid #FFCC80",borderRadius:8,
                      padding:"9px 11px",marginBottom:8,display:"flex",
                      gap:9,alignItems:"center",flexWrap:"wrap"}},
                    h("span",{style:{fontSize:14}},"📥"),
                    h("div",{style:{flex:1,minWidth:190}},
                      h("div",{style:{fontSize:13,fontWeight:800,color:"#BF360C"}},
                        "Received, but never added to stock"),
                      h("div",{style:{fontSize:12,color:C.muted,marginTop:1}},
                        (po.receivedItems||[]).length+" item/s on this DR · "
                        +"posts to "+(po.branchName||po.branch))),
                    h("button",{
                      onClick:async()=>{
                        if(!confirm("Add the received items of "+po.poNum
                          +" into "+(po.branchName||po.branch)+" stock?\n\n"
                          +"Runs once — the PO is marked afterwards so it "
                          +"cannot be posted twice."))return;
                        const r=await postReceivedToStock(db,po,user.name);
                        if(r.errors.length){
                          showT("Posted "+r.added+", failed "+r.errors.length
                            +": "+r.errors[0].slice(0,50),"warn");
                        }else if(r.added){
                          showT(r.added+" item/s added to stock"
                            +(r.adopted?" ("+r.adopted+" new)":"")+" ✓");
                        }else{
                          showT("Nothing to post","warn");
                        }
                      },
                      style:{padding:"7px 13px",borderRadius:7,border:"none",
                        background:"#E65100",color:"#fff",fontSize:13,
                        fontWeight:800,cursor:"pointer"}},
                      "Add to stock")
                  ),

                  // Margin — owner only. po_monitor is already owner-gated in
                  // the nav, but the check stays explicit: this is Main's
                  // markup and no branch account should ever read it.
                  (user.role==="owner"||user.role==="commissary")&&(function(){
                    const m=poMargin(po);
                    if(m.rev<=0)return null;
                    const bad=m.cost<=0;
                    return h("div",{style:{width:"100%",background:"#F1F8E9",
                      border:"1px solid #C5E1A5",borderRadius:8,
                      padding:"8px 10px",marginBottom:8}},
                      h("div",{style:{fontSize:11,fontWeight:800,color:"#33691E",
                        letterSpacing:1,marginBottom:5}},"MARGIN"),
                      [["Gross sales","₱"+peso(m.rev),C.text],
                       ["Direct cost","₱"+peso(m.cost),C.muted],
                       ["Gross profit","₱"+peso(m.margin),
                        m.margin>=0?"#2E7D32":C.danger],
                       ["Margin %",m.pct.toFixed(2)+"%",
                        m.pct>=0?"#2E7D32":C.danger]].map(([l,v,col])=>
                        h("div",{key:l,style:{display:"flex",
                          justifyContent:"space-between",fontSize:13,marginBottom:1}},
                          h("span",{style:{color:C.muted}},l),
                          h("span",{style:{fontWeight:800,color:col}},v))),
                      bad&&h("div",{style:{fontSize:12,color:"#BF360C",
                        fontWeight:700,marginTop:4}},
                        "No cost on the items — margin reads as 100%")
                    );
                  })(),

                  // Payment history — uses this block's own totalPaid/balance
                  ((po.payments||[]).length>0)&&h("div",{style:{width:"100%",
                    background:C.bg,borderRadius:8,padding:"8px 10px",marginBottom:8}},
                    h("div",{style:{display:"flex",justifyContent:"space-between",
                      alignItems:"center",marginBottom:5}},
                      h("span",{style:{fontSize:11,fontWeight:800,color:C.muted,
                        letterSpacing:1}},"PAYMENTS ("+(po.payments||[]).length+")"),
                      h("span",{style:{fontSize:13,fontWeight:900,
                        color:(balance||0)<=0?C.success:C.danger}},
                        (balance||0)<=0?"FULLY PAID":"Balance ₱"+peso(balance))
                    ),
                    (po.payments||[]).slice().reverse().map((p,pi)=>h("div",{key:pi,
                      style:{display:"flex",justifyContent:"space-between",
                        fontSize:12,marginBottom:2}},
                      h("span",{style:{color:C.muted}},
                        (p.at?String(p.at).slice(0,10):"")+
                        (p.method?" · "+p.method:"")+
                        (p.ref?" · "+p.ref:"")+
                        (p.by?" · "+p.by:"")),
                      h("span",{style:{fontWeight:800}},"₱"+peso(p.amount))
                    ))
                  ),

                  // PROCESSING → Record Payment
                  (st==="processing"||st==="approved"||st==="paid")&&h("button",{
                    onClick:()=>setModal("payment_"+po._docId),
                    style:{padding:"7px 14px",background:C.success,
                      border:"none",borderRadius:8,color:"#fff",
                      fontSize:13,fontWeight:700,cursor:"pointer"}},
                    balance<=0?"💰 View Payments":"💰 Record Payment"),

                  // Main-side cancel. Only the branch could cancel before, and
                  // only pre-processing — so a PO Main could not fulfil had no
                  // way out. Once the DR is issued Main's stock is already
                  // deducted, so cancelling has to put it back.
                  (st==="received_by_main"||st==="processing"||st==="approved")
                    &&h("button",{
                    onClick:async()=>{
                      const shipped=(st==="processing"||st==="approved");
                      const why=prompt(
                        "Reason for cancelling "+po.poNum+
                        (shipped?"\n\nThe DR was already issued — Main's stock will be restored."
                                :""),"");
                      if(why===null)return;
                      if(!why.trim()){showT("A reason is required","warn");return;}
                      try{
                        // re-read: the branch may have confirmed receipt while
                        // this card was on screen
                        const live=await getDoc(doc(db,"advances",po._docId));
                        const nowSt=live.exists()?(live.data().status||""):"";
                        if(nowSt==="completed"||nowSt==="discrepancy"){
                          showT("Already received by the branch — void it instead","err");
                          return;
                        }
                        let back=0;
                        if(live.exists()&&live.data().stockIssued){
                          for(const it of (live.data().deliveredItems||[])){
                            if(!it.id||!(it.actualQty>0))continue;
                            try{
                              let prev=null;
                              try{
                                const ds=await getDoc(doc(db,"inventory",it.id));
                                if(ds.exists())prev=Number(ds.data().stock)||0;
                              }catch(e1){}
                              const _u=lotsUnitCost(ds.exists()?ds.data().lots:null,
                                ds.exists()?(Number(ds.data().cost)||0):0);
                              const _bk=lotsAdd(ds.exists()?ds.data().lots:null,
                                it.actualQty||0,_u,"cancel:"+(po.poNum||""),Date.now());
                              await updateDoc(doc(db,"inventory",it.id),{
                                stock:increment(it.actualQty||0),
                                lastRestocked:serverTimestamp(),
                                lots:_bk
                              });
                              back++;
                              await addDoc(collection(db,"inventory_log"),{
                                itemId:it.id,itemName:it.name||it.id,unit:it.unit||"",
                                type:"add",amount:(it.actualQty||0),
                                prevStock:prev,
                                newStock:prev==null?null:Math.round((prev+(it.actualQty||0))*1000)/1000,
                                desc:"Restored from cancelled "+(po.poNum||""),
                                source:"TRANSFER",ref:po.poNum||"",
                                branch:"ct-main",by:user.name,
                                date:localDate(),timestamp:serverTimestamp()
                              ,at:serverTimestamp()});
                            }catch(e2){console.warn("restore failed",it.id,e2);}
                          }
                        }
                        await updateDoc(doc(db,"advances",po._docId),{
                          status:"cancelled",
                          deliveryStatus:"Cancelled",
                          cancelReason:why.trim(),
                          cancelledBy:user.name,
                          cancelledAt:serverTimestamp(),
                          stockIssued:false,
                          stockRestored:back
                        });
                        await notify(db,{to:po.branch,type:"discrepancy",
                          title:po.poNum+" cancelled by Main",
                          message:why.trim(),
                          page:"stock_order",ref:po.poNum,by:user.name});
                        showT(po.poNum+" cancelled"+(back?" · "+back+" item/s returned to Main":""),"warn");
                      }catch(e){
                        console.error("cancel PO:",e);
                        showT("Cancel failed: "+String(e&&e.message||e).slice(0,60),"err");
                      }
                    },
                    style:{padding:"7px 12px",background:"#fff",
                      border:"1px solid "+C.danger,borderRadius:8,color:C.danger,
                      fontSize:13,fontWeight:700,cursor:"pointer"}},
                    "✕ Cancel PO"),

                  // DISCREPANCY → Approve
                  // Approval settles the shortage: the PO lines are rewritten
                  // to what actually arrived, the bill drops to match, and only
                  // then does the stock move. Approving without correcting the
                  // figures would leave the branch billed for goods that were
                  // never delivered.
                  st==="discrepancy"&&h("button",{
                    onClick:async()=>{
                      const lines=(po.receivedItems||po.deliveredItems||po.items||[]);
                      const short=lines.filter(i=>{
                        const exp=(i.expectedQty!=null)?i.expectedQty
                          :(i.actualQty!=null?i.actualQty:(i.qty||0));
                        return (Number(i.receivedQty)||0)!==Number(exp);
                      });
                      const oldTotal=poValue(po);
                      // rewrite each line to the received quantity
                      const corrected=lines.map(i=>{
                        const got=Number(i.receivedQty)||0;
                        const exp=(i.expectedQty!=null)?i.expectedQty
                          :(i.actualQty!=null?i.actualQty:(i.qty||0));
                        return Object.assign({},i,{
                          qty:got, actualQty:got,
                          orderedQty:(i.orderedQty!=null?i.orderedQty:i.qty),
                          issuedQty:exp,
                          correctedFrom:(got!==Number(exp))?exp:undefined
                        });
                      });
                      const newTotal=corrected.reduce((a,i)=>
                        a+((Number(i.qty)||0)*(Number(i.price)||0)),0);
                      const credit=Math.round((oldTotal-newTotal)*100)/100;

                      const lines6=short.slice(0,6).map(i=>{
                        const exp=(i.expectedQty!=null)?i.expectedQty
                          :(i.actualQty!=null?i.actualQty:(i.qty||0));
                        return "  • "+(i.name||i.id)+": "+exp+" → "
                          +(Number(i.receivedQty)||0)+" "+(i.unit||"");
                      });
                      if(!confirm("Approve the shortage on "+po.poNum+"?\n\n"
                        +lines6.join("\n")
                        +(short.length>6?"\n  …and "+(short.length-6)+" more":"")
                        +"\n\nBill: ₱"+peso(oldTotal)+" → ₱"+peso(newTotal)
                        +(credit>0?"  (₱"+peso(credit)+" less)":"")
                        +"\n\nThe corrected quantities then enter "
                        +(po.branchName||po.branch)+"'s stock."))return;

                      // 1. stock, at the quantities everyone has now agreed
                      const invBr=po.branch;
                      const invCol=(invBr==="ct-main"||invBr==="main")
                        ?"inventory":"inventory_"+invBr;
                      const isMainDest=(invBr==="ct-main"||invBr==="main");
                      let added=0;
                      for(const it of corrected){
                        const qty=Number(it.qty)||0;
                        if(!it.id||qty<=0)continue;
                        try{
                          const ref=doc(db,invCol,it.id);
                          const cur=await getDoc(ref);
                          let prev=0;
                          if(!cur.exists()){
                            let meta={};
                            try{
                              const mainDoc=await getDoc(doc(db,"inventory",it.id));
                              if(mainDoc.exists())meta=mainDoc.data()||{};
                            }catch(e1){}
                            await setDoc(ref,Object.assign({},meta,{
                              name:it.name||meta.name||it.id,
                              unit:it.unit||meta.unit||"",
                              // what this branch paid, not Main's cost
                              cost:isMainDest?(Number(meta.cost)||0)
            :(Number(it.price)||Number(meta.price)||0),
                              minStock:0,stock:qty,
                              lots:lotsAdd([],qty,Number(it.price)||0,
                                  po.poNum||"",Date.now()),
                              adoptedFrom:"main",adoptedAt:serverTimestamp(),
                              lastRestocked:serverTimestamp()
                            }),{merge:true});
                          }else{
                            prev=Number(cur.data().stock)||0;
                            const nlots=lotsAdd(cur.data().lots,qty,Number(it.price)||0,
                                 po.poNum||"",Date.now());
                            await updateDoc(ref,Object.assign(
                              {stock:increment(qty),lastRestocked:serverTimestamp()}, nlots?{lots:nlots}:{}));
                          }
                          added++;
                          await addDoc(collection(db,logColFor(invBr)),{
                            itemId:it.id,itemName:it.name||it.id,
                            unit:it.unit||"",type:"add",amount:qty,
                            prevStock:prev,
                            newStock:Math.round((prev+qty)*1000)/1000,
                            desc:"Received after approved shortage: "+qty+" "
                              +(it.unit||"")+" · "+(po.drNum||po.poNum||""),
                            source:"TRANSFER",ref:po.poNum||"",
                            branch:invBr,by:user.name,
                            date:localDate(),timestamp:serverTimestamp()
                          });
                        }catch(e2){console.error("approve→stock",it.id,e2);}
                      }

                      // 2. the PO now reads as what was actually delivered
                      await updateDoc(doc(db,"advances",po._docId),{
                        status:"completed",
                        stockPosted:true,
                        items:corrected,
                        deliveredItems:corrected,
                        receivedItems:corrected,
                        totalBeforeDiscrepancy:oldTotal,
                        discrepancyCredit:credit,
                        discrepancyStatus:"approved",
                        discrepancyApprovedBy:user.name,
                        discrepancyApprovedAt:serverTimestamp()
                      });

                      await notify(db,{to:po.branch,type:"success",
                        title:"Shortage approved — "+po.poNum,
                        message:"Bill corrected to ₱"+peso(newTotal)
                          +(credit>0?" (₱"+peso(credit)+" less)":"")
                          +". "+added+" item(s) added to your stock.",
                        page:"stock_order",ref:po.poNum,by:user.name});

                      showT(po.poNum+" settled — bill ₱"+peso(newTotal)

      toast&&h(Toast,{msg:toast.msg,type:toast.type,onDone:()=>setToast(null)})
    )
  ); // end layout return
} // end App

try{
  
// Error Boundary to catch React render errors
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return {hasError:true,error};}
  componentDidCatch(error,info){console.error("React render error:",error,info);}
  render(){
    if(this.state.hasError){
      const err=this.state.error;
      return h("div",{style:{minHeight:"100vh",background:"#1a1a2e",color:"#fff",
        fontFamily:"monospace",padding:30,display:"flex",flexDirection:"column",
        alignItems:"center",justifyContent:"center"}},
        h("div",{style:{fontSize:30,marginBottom:12}},"⚠️ Render Error"),
        h("div",{style:{fontSize:13,color:"#FF8A80",marginBottom:8}},err&&err.message||"Unknown"),
        h("pre",{style:{fontSize:12,color:"#B9B9C6",background:"#0d0d1a",padding:12,
          borderRadius:8,maxWidth:700,overflow:"auto",whiteSpace:"pre-wrap"}},
          err&&err.stack||""),
        h("button",{onClick:()=>location.reload(),
          style:{marginTop:16,padding:"10px 20px",background:"#6A1B9A",border:"none",
            borderRadius:8,color:"#fff",fontWeight:700,cursor:"pointer"}},
          "🔄 Reload")
      );
    }
    return this.props.children;
  }
}

createRoot(document.getElementById("root")).render(h(ErrorBoundary,null,h(App)));
}catch(err){
  document.getElementById("err-overlay").style.display="flex"; document.getElementById("err-overlay").innerHTML=
    '<div style="font-family:monospace;padding:30px;background:#1a1a2e;min-height:100vh;color:#fff">'+
    '<div style="font-size:40px;margin-bottom:16px">⚠️</div>'+
    '<div style="font-size:20px;font-weight:900;color:#ff6b6b;margin-bottom:8px">ChowTime POS — Startup Error</div>'+
    '<div style="font-size:13px;color:#ffd93d;margin-bottom:16px">'+err.message+'</div>'+
    '<div style="font-size:11px;color:#aaa;background:#0d0d1a;padding:12px;border-radius:8px">'+
    'Steps to fix:<br>'+
    '1. Open Firebase Console → Firestore → Rules<br>'+
    '2. Set: allow read, write: if request.auth != null;<br>'+
    '3. Publish rules → refresh this page<br>'+
    '4. Make sure Authentication → Email/Password is enabled'+
    '</div></div>';
}
