// Catch any uncaught errors and show them visibly  
// The old overlay put the message at the very top, so a phone screenshot of a
// scrolled page showed only "Line: N" and no reason. Message first, full stack
// below it, and a one-tap copy so the whole thing can be pasted somewhere.
window.__showErr = function(title, msg, meta, stack){
  var esc = function(t){ return String(t==null?"":t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
  var payload = title+"\n"+msg+"\n"+meta+"\n\n"+(stack||"(no stack)");
  var el = document.getElementById("err-overlay");
  if(!el) { console.error(payload); return; }
  el.style.display="flex";
  el.innerHTML =
    '<div style="padding:16px;font-family:monospace;background:#1a1a2e;min-height:100vh;'+
      'width:100%;color:#fff;overflow:auto;box-sizing:border-box">' +
    '<div style="font-size:22px;margin-bottom:10px">\u26A0\uFE0F '+esc(title)+'</div>' +
    '<div style="background:#2b1620;border:1px solid #ff6b6b;border-radius:8px;'+
      'padding:10px;margin-bottom:10px">' +
      '<div style="color:#ff6b6b;font-size:13px;line-height:1.5;word-break:break-word">' +
      esc(msg) + '</div></div>' +
    '<div style="color:#ffd93d;font-size:11px;margin-bottom:10px;word-break:break-all">' +
      esc(meta) + '</div>' +
    '<button id="err-copy" style="padding:9px 14px;border:none;border-radius:7px;'+
      'background:#ffd93d;color:#1a1a2e;font-weight:800;font-size:12px;cursor:pointer;'+
      'margin-bottom:6px">\uD83D\uDCCB Copy error</button> ' +
    '<button id="err-reload" style="padding:9px 14px;border:1px solid #666;border-radius:7px;'+
      'background:transparent;color:#111111;font-size:12px;cursor:pointer;margin-bottom:6px">'+
      '\u21BB Reload</button>' +
    '<div style="color:#5A5A5A;font-size:9px;margin:10px 0 4px">STACK</div>' +
    '<pre style="color:#5A5A5A;font-size:10px;white-space:pre-wrap;word-break:break-word;'+
      'margin:0;line-height:1.5">' + esc(stack||"(no stack available)") + '</pre>' +
    '</div>';
  var cp=document.getElementById("err-copy");
  if(cp) cp.onclick=function(){
    try{
      navigator.clipboard.writeText(payload);
      cp.textContent="\u2713 Copied";
    }catch(e){
      var ta=document.createElement("textarea");
      ta.value=payload; document.body.appendChild(ta); ta.select();
      try{document.execCommand("copy");cp.textContent="\u2713 Copied";}catch(e2){}
      document.body.removeChild(ta);
    }
  };
  var rl=document.getElementById("err-reload");
  if(rl) rl.onclick=function(){ location.reload(); };
};

window.onerror = function(msg, src, line, col, err) {
  window.__showErr("Error", msg,
    "Line "+line+" · Col "+col+"  \u2022  "+src,
    err && err.stack);
  return false;
};
window.addEventListener("unhandledrejection", function(e) {
  var r = e.reason;
  window.__showErr("Promise Error",
    (r && r.message) || r || "Unknown error",
    (r && r.code) ? ("code: "+r.code) : "",
    r && r.stack);
});

// Create a login without disturbing whoever is signed in.
async function createLoginAccount(email,password){
  try{
    // normalise here as well: whatever the caller passes, the auth account and
    // the staff record must end up with the same string

    await createUserWithEmailAndPassword(auth2,email,password);

// ─── ESC/POS BLUETOOTH PRINTER ───────────────────────────
var _btDevice=null, _btChar=null;

var _btChunk=180;                       // adapts down if the printer rejects it
var _btSleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};

// Bind the GATT characteristic on an already-chosen device (no picker prompt).
async function _btBind(dev){
  var srv=await dev.gatt.connect();
  var svc=await srv.getPrimaryService("000018f0-0000-1000-8000-00805f9b34fb");
  _btChar=await svc.getCharacteristic("00002af1-0000-1000-8000-00805f9b34fb");
  _btDevice=dev;
  return true;
}

async function btConnect(){
  // Reconnect silently if we already picked a printer this session — the
  // cashier should not have to re-pick every time the link drops.
  if(_btDevice){
    try{ await _btBind(_btDevice); return true; }
    catch(e){ console.warn("BT reconnect:",e); _btChar=null; }
  }
  try{
    var dev=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:"Xprinter"},{namePrefix:"XP-"},
               {namePrefix:"RPP"},{namePrefix:"MTP"},
               {namePrefix:"Printer"},{namePrefix:"BlueTooth"}],
      optionalServices:["000018f0-0000-1000-8000-00805f9b34fb"]
    });
    await _btBind(dev);
    dev.addEventListener("gattserverdisconnected",function(){_btChar=null;});
    return true;
  }catch(e){console.warn("BT connect:",e);return false;}
}

// Write one chunk, preferring the unacknowledged path when the printer
// exposes it (much faster), falling back to the acknowledged write.
async function _btWrite(slice){
  if(_btChar.writeValueWithoutResponse){
    try{ await _btChar.writeValueWithoutResponse(slice); return; }
    catch(e){ /* fall through to acknowledged write */ }
  }
  await _btChar.writeValue(slice);
}

async function btPrint(bytes){
  if(!_btChar){var ok=await btConnect();if(!ok)return false;}
  // A receipt + KOT in one go is ~1-2KB. At the old 20-byte chunk size that is
  // 60-100 sequential writes; cheap thermal modules drop data or truncate.
  // Try a large chunk first and step down if the characteristic rejects it.
  var sizes=[_btChunk,100,60,20];
  for(var si=0;si<sizes.length;si++){
    var size=sizes[si];
    try{
      for(var i=0;i<bytes.length;i+=size){
        await _btWrite(bytes.slice(i,i+size));
        if(!_btChar.writeValueWithoutResponse)continue;
        await _btSleep(6);            // let the printer buffer drain
      }
      _btChunk=size;                  // remember what worked
      await _btSleep(120);            // let the last bytes flush before we return
      return true;
    }catch(e){
      console.warn("BT print @"+size+"B:",e);
      if(!_btChar){                   // link died — one silent reconnect, then retry
        var re=await btConnect();
        if(!re)return false;
      }
    }
  }
  _btChar=null;
  return false;
}

function buildEscPos(ord,bName,cs,paperSize){
  cs=cs||{};
  var isVAT=cs.vatMode!=="nonvat";
  var zerovat=cs.vatMode==="zerovat";
  var da=ord.discAmt||0, sub=ord.subtotal||0, net=sub-da;
  var vatable=isVAT&&!zerovat?net/1.12:0;
  var vatAmt=isVAT&&!zerovat?net-vatable:0;
  var W=paperSize==="58mm"?32:48;
  var NL=0x0A, ESC=0x1B, GS=0x1D;

  var enc=new TextEncoder();
  var T=function(s){return enc.encode(s);};
  var B=function(arr){return new Uint8Array(arr);};

  function pad(s,len,right){
    s=String(s||"");
    if(s.length>len)s=s.slice(0,len);
    while(s.length<len)right?s+=" ":s=" "+s;
    return s;
  }
  function row(l,r){return T(pad(l,W-String(r).length,true)+r+"\n");}
  function ln(t){return T(t+"\n");}
  function dash(){return T("-".repeat(W)+"\n");}

  var parts=[];
  var a=function(v){parts.push(v instanceof Uint8Array?v:B(v));};

  a([ESC,0x40]);         // INIT
  a([ESC,0x61,0x01]);    // CENTER
  a([ESC,0x21,0x30]);    // DOUBLE SIZE
  a(ln(cs.name||"CHOWTIME"));
  a([ESC,0x21,0x00]);    // NORMAL
  a([ESC,0x45,0x01]);    // BOLD ON
  a(ln(bName));
  a([ESC,0x45,0x00]);    // BOLD OFF
  if(cs.address)a(ln(cs.address));
  if(cs.phone)a(ln("Tel: "+cs.phone));
  if(isVAT&&!zerovat)a(ln("TIN: "+(cs.tin||"000-000-000-000")));
  a(dash());
  a([ESC,0x61,0x00]);    // LEFT
  a(row("Order #:",(ord.id||"—")));
  a(row("Date:",(ord.date||localDate())+" "+(ord.time||"")));
  a(row("Cashier:",(ord.cashier||"")));
  if(ord.custName)a(row("Customer:",ord.custName));
  a(dash());

  (ord. items||[]).forEach(function(i){
    a([ESC,0x45,0x01]);
    a(ln(i.name+(i.takeout&&ord.mixedType?(i.partialTO?" [T/O split]":" [T/O]"):"")
      +(ord.discScope===" items"&&i.discounted?" *":"")));
    a([ESC,0x45,0x00]);
    if(i.variant)a(ln("  ["+i.variant+"]"));
    (i.freebies||[]).forEach(function(f){
      var to=f.toQty||0,q=f.qty||0;
      var tag=(!i.takeout||to<=0)?"":(to>=q?"  [T/O]":"  ["+to+" T/O]");
      a(ln("  > "+f.label+" x"+q+tag));
    });
    if(i.options&&i.options.length)a(ln("  "+i.options.join(", ")));
    var p=i.lineTotal&&i.qty?(i.lineTotal/i.qty):(i.unitPrice||i.price||0);
    a(row("  x"+i.qty+" @ P"+p.toFixed(2),"P"+peso((i.lineTotal||(p*i.qty)))));
  });

  a(dash());
  if(da>0){
    a(row("Subtotal","P"+peso(sub)));
    a(row("Discount"+(ord.discRate?" "+Math.round(ord.discRate*100)+"%":"")
      +(ord.discScope===" items"?" ("+((ord.discItems||[]).length)+"  item/s)":""),
      "- P"+da.toFixed(2)));
    if(ord.discScope===" items")a(ln("* discounted  item"));
  }
  if(isVAT&&!zerovat){
    a(row("VATable Sales","P"+peso(vatable)));
    a(row("VAT-Exempt Sales","P0.00"));
    a(row("Zero-Rated Sales","P0.00"));
    a(row("VAT 12%","P"+peso(vatAmt)));
  }
  if(!isVAT&&!zerovat){
    a(ln("NON-VAT REGISTERED"));
    a(row("VAT-Exempt Sales","P"+peso(net)));
  }
  if(zerovat){
    a(ln("ZERO-RATED"));
    a(row("Zero-Rated Sales","P"+peso(net)));
  }

  a([ESC,0x45,0x01]);a([ESC,0x21,0x10]);
  a(row("TOTAL","P"+peso(net)));
  a([ESC,0x21,0x00]);a([ESC,0x45,0x00]);

  var paid=(ord.payments&&ord.payments.reduce(function(s,p){return s+(p.amount||0);},0))||parseFloat(ord.cash||0)||net;
  a(row("Payment ("+(ord.payMethod||"CASH").toUpperCase()+")","P"+peso(paid)));
  if(paid>net)a(row("CHANGE","P"+peso((paid-net))));

  a(dash());
  a([ESC,0x61,0x01]);
  a(dash());
  if(!isVAT){
    a([ESC,0x45,0x01]);
    a(ln("THIS DOCUMENT IS NOT VALID"));
    a(ln("FOR CLAIMING INPUT TAX"));
    a([ESC,0x45,0x00]);
  }
  a(ln("This serves as your Sales Invoice"));
  if(cs.ptuNo)a(ln("PTU No: "+cs.ptuNo));
  if(cs.minNo)a(ln("MIN: "+cs.minNo));
  if(cs.posSerial)a(ln("Serial No: "+cs.posSerial));
  a(B([NL]));
  a(ln(cs.receiptFooter||"Thank you for dining with us!"));
  a(B([NL]));
  a([ESC,0x45,0x01]);
  a(ln(isVAT&&!zerovat?"*** VAT RECEIPT ***":zerovat?"*** ZERO-RATED ***":"*** NON-VAT RECEIPT ***"));
  a([ESC,0x45,0x00]);
  a(B([NL,NL,NL]));
  a([GS,0x56,0x41,0x10]); // PARTIAL CUT

  var total=0;
  parts.forEach(function(p){total+=p.length;});
  var out=new Uint8Array(total), off=0;
  parts.forEach(function(p){out.set(p,off);off+=p.length;});
  return out;
}

// Kitchen ticket in ESC/POS. No prices — the cook only needs what to make.
function buildEscPosKOT(ord,bName,cs,paperSize){
  cs=cs||{};
  var W=paperSize==="58mm"?32:48;
  var NL=0x0A, ESC=0x1B, GS=0x1D;
  var enc=new TextEncoder();
  var T=function(x){return enc.encode(x);};
  var B=function(arr){return new Uint8Array(arr);};
  function ln(t){return T(t+"\n");}
  function dash(){return T("-".repeat(W)+"\n");}

  var parts=[], a=function(v){parts.push(v instanceof Uint8Array?v:B(v));};

  a([ESC,0x40]);          // INIT
  a([ESC,0x61,0x01]);     // CENTER
  a([ESC,0x21,0x30]);     // DOUBLE W+H
  a(ln("KOT"));
  a([ESC,0x21,0x00]);     // NORMAL
  a(ln("KITCHEN ORDER TICKET"));
  a(dash());
  a([ESC,0x61,0x00]);     // LEFT
  a([ESC,0x45,0x01]);
  a(ln("Order: "+(ord.id||"-")+"   "+(ord.time||"")));
  a([ESC,0x45,0x00]);
  a(ln(bName+"   "+(ord.date||"")));
  if(ord.mixedType){
    a([ESC,0x45,0x01]);
    a(ln("Type: MIXED — check each  item"));
    a([ESC,0x45,0x00]);
  }else if(ord.orderType)a(ln("Type: "+String(ord.orderType).toUpperCase()));
  if(ord.takeoutCount)a(ln("T/O: "+ord.takeoutCount+" pcs"));
  if(ord.tableNo)a(ln("Table: "+ord.tableNo));
  if(ord.custName)a(ln("Customer: "+ord.custName));
  a(dash());

  (ord. items||[]).forEach(function(i){
    var pTot=(i.freebies||[]).reduce(function(x,f){return x+(f.qty||0);},0);
    a([ESC,0x21,0x10]);   // DOUBLE HEIGHT
    a([ESC,0x45,0x01]);
    a(ln(i.qty+"x "+i.name+(pTot?"  ("+pTot+" pcs)":"")));
    a([ESC,0x21,0x00]);
    a([ESC,0x45,0x00]);
    // packing instruction has to be impossible to miss
    if(i.takeout){
      a([ESC,0x61,0x01]);a([ESC,0x45,0x01]);a([ESC,0x21,0x10]);
      a(ln(i.partialTO?">>> SPLIT - CHECK EACH <<<":">>> T/O <<<"));
      a([ESC,0x21,0x00]);a([ESC,0x45,0x00]);a([ESC,0x61,0x00]);
    }
    if(i.variant)a(ln("   ["+i.variant+"]"));
    (i.freebies||[]).forEach(function(f){
      var to=f.toQty||0, q=f.qty||0;
      var tag=to<=0?"  (dine-in)":(to>=q?"  [T/O]":"  ["+to+" T/O / "+(q-to)+" dine-in]");
      a([ESC,0x45,0x01]);
      a(ln("   > "+q+"x "+f.label+tag));
      a([ESC,0x45,0x00]);
    });
    if(i.options&&i.options.length)a(ln("   "+i.options.join(", ")));
    if(i.note){a([ESC,0x45,0x01]);a(ln("   ** "+i.note+" **"));a([ESC,0x45,0x00]);}
    a(T("\n"));
  });

  a(dash());
  if(ord.note){a([ESC,0x45,0x01]);a(ln("NOTE: "+ord.note));a([ESC,0x45,0x00]);a(dash());}
  a([ESC,0x61,0x01]);
  a(ln("Printed: "+new Date().toLocaleTimeString("en-PH")));
  a(B([NL,NL,NL]));
  a([GS,0x56,0x41,0x10]); // PARTIAL CUT

  var total=0; parts.forEach(function(p){total+=p.length;});
  var out=new Uint8Array(total), off=0;
  parts.forEach(function(p){out.set(p,off);off+=p.length;});
  return out;
}

// ── CASH DRAWER ──────────────────────────────────────────
// ESC p m t1 t2 — pulse the drawer solenoid through the printer's RJ11 port.
// m=0 -> pin 2 (near-universal), m=1 -> pin 5. t1/t2 are on/off pulse widths.
// The drawer must be cabled to the PRINTER, not the tablet: the tablet has no
// way to reach it, so this only fires on the Bluetooth path, never browser print.
function escposKick(pin){
  return new Uint8Array([0x1B,0x70,(pin===5?0x01:0x00),0x19,0xFA]);
}

function _cat(){
  var arrs=Array.prototype.slice.call(arguments).filter(Boolean);
  var n=0; arrs.forEach(function(x){n+=x.length;});
  var out=new Uint8Array(n), off=0;
  arrs.forEach(function(x){out.set(x,off);off+=x.length;});
  return out;
}

// Auto-open only makes sense when cash actually changes hands.
function shouldKick(ord,cs){
  if(cs&&cs.autoKickDrawer===false)return false;
  var m=String((ord&&ord.payMethod)||"cash").toLowerCase();
  return m==="cash";
}

function kickBytes(ord,cs){
  return shouldKick(ord,cs)?escposKick((cs&&cs.drawerPin)||2):null;
}

// Auto-open after a sale. Silent no-op when the printer is not connected —
// never prompts, never blocks the next order.
async function btKickIfConnected(ord,cs){
  if(!_btChar)return false;
  if(!shouldKick(ord,cs))return false;
  try{ return await btPrint(escposKick((cs&&cs.drawerPin)||2)); }
  catch(e){ return false; }
}

// Manual open — for no-sale, change fund, or a drawer that failed to pop.
async function btKickDrawer(cs){
  if(!_btChar){var ok=await btConnect();if(!ok)return false;}
  return await btPrint(escposKick((cs&&cs.drawerPin)||2));
}

async function printEscPos(ord,bName,cs,paperSize){
  var data=_cat(kickBytes(ord,cs),buildEscPos(ord,bName,cs,paperSize));
  return await btPrint(data);
}

async function printEscPosKOT(ord,bName,cs,paperSize){
  var data=buildEscPosKOT(ord,bName,cs,paperSize);
  return await btPrint(data);
}

// Customer receipt + kitchen ticket in ONE Bluetooth session.
// Sent as a single byte stream so the connection is not dropped between
// documents; the partial cut at the end of the receipt separates them.
async function printEscPosBoth(ord,bName,cs,paperSize){
  // kick first so the drawer pops while the receipt is still feeding
  return await btPrint(_cat(
    kickBytes(ord,cs),
    buildEscPos(ord,bName,cs,paperSize),
    buildEscPosKOT(ord,bName,cs,paperSize)
  ));
}

// Z-Reading over ESC/POS. Mirrors printZ exactly so the thermal copy and the
// browser copy can never disagree — a reading that differs by medium is worse
// than no reading at all.
function buildEscPosZ(zd,branchName,cashier,cs,paperSize,isZ){
  cs=cs||{};
  var W=paperSize==="58mm"?32:48;
  var NL=0x0A, ESC=0x1B, GS=0x1D;
  var enc=new TextEncoder();
  var T=function(x){return enc.encode(x);};
  var B=function(a){return new Uint8Array(a);};
  function ln(t){return T(t+"\n");}
  function dash(){return T("-".repeat(W)+"\n");}
  function row(l,r){
    var pad=W-l.length-r.length;
    if(pad<1)pad=1;
    return T(l+" ".repeat(pad)+r+"\n");
  }
  var parts=[], a=function(v){parts.push(v instanceof Uint8Array?v:B(v));};
  // thermal too: row() pads from actual string length, so commas do not
  // break the column alignment
  var n=function(v){return peso(v);};

  a([ESC,0x40]);
  a([ESC,0x61,0x01]);
  a([ESC,0x21,0x10]);
  a(ln(isZ?"Z-READING":"X-READING"));
  a([ESC,0x21,0x00]);
  a([ESC,0x45,0x01]);
  a(ln((cs.name||"CHOWTIME")+" - "+branchName));
  a([ESC,0x45,0x00]);
  if(cs.address)a(ln(cs.address));
  if(cs.tin)a(ln("TIN: "+cs.tin));
  a(ln(new Date().toLocaleDateString("en-PH",{year:"numeric",month:"long",day:"numeric"})));
  a(ln("Cashier: "+cashier));
  a([ESC,0x61,0x00]);
  a(dash());

  a(row("Opening Fund","P"+n(zd.opening)));
  a(row("Gross Sales","P"+n(zd.gross)));
  a(row("Discounts","- P"+n(zd.discounts)));
  a(row("Voids ("+(zd.voidCount||0)+")","- P"+n(zd.voidAmt)));
  a([ESC,0x45,0x01]);
  a(row("Net Sales","P"+n(zd.net)));
  a([ESC,0x45,0x00]);
  a(row("Cash In","P"+n(zd.cashIn)));
  a(row("Cash Out","- P"+n(zd.cashOut)));
  a(dash());
  a([ESC,0x21,0x10]);
  a(row("CASH ON HAND","P"+n(zd.totalCash)));
  a([ESC,0x21,0x00]);
  a(dash());

  a(row("Transactions",String(zd.txns||0)));
  a(row("Cancelled",String(zd.cancelled||0)));
  a(row("Total Quantity",String(zd.qtySold||0)));
  a(row("Dine-in",String(zd.dineIn||0)));
  a(row("Takeout",String(zd.takeout||0)));
  a(row("Invoice From",String(zd.siFrom||"-")));
  a(row("Invoice To",String(zd.siTo||"-")));
  a(dash());

  a(ln("BREAKDOWN OF SALES"));
  a(row("VATable Sales","P"+n(zd.vatableSales)));
  a(row("VAT Amount","P"+n(zd.vatAmount)));
  a(row("VAT-Exempt Sales","P"+n(zd.vatExempt)));
  a(row("Zero-Rated Sales","P"+n(zd.zeroSales)));
  a(dash());

  a(ln("DISCOUNT SUMMARY"));
  a(row("SC Disc. ("+(zd.scTxns||0)+")","P"+n(zd.discSC)));
  a(row("PWD Disc. ("+(zd.pwdTxns||0)+")","P"+n(zd.discPWD)));
  a(row("Employee Disc.","P"+n(zd.discEmp)));
  a(row("Other Disc.","P"+n(zd.discOther)));
  a(dash());

  a(ln("SALES ADJUSTMENT"));
  a(row("VOID ("+(zd.voidCount||0)+")","P"+n(zd.voidAmt)));
  a(dash());

  a([ESC,0x61,0x01]);
  a(ln("Generated: "+new Date().toLocaleString("en-PH")));
  a([ESC,0x45,0x01]);
  a(ln(isZ?"FINAL Z-READING FOR THE DAY":"X-READING (NOT FINAL)"));
  a([ESC,0x45,0x00]);
  a(B([NL,NL,NL]));
  a([GS,0x56,0x41,0x10]);

  var total=0; parts.forEach(function(p){total+=p.length;});
  var out=new Uint8Array(total), off=0;
  parts.forEach(function(p){out.set(p,off);off+=p.length;});
  return out;
}

async function printEscPosZ(zd,branchName,cashier,cs,paperSize,isZ){
  return await btPrint(buildEscPosZ(zd,branchName,cashier,cs,paperSize,isZ));
}

// ─── ITEM CUSTOMIZER ─────────────────────────────────────
function ItemCustomizer({ item,onAdd,onClose,optionGroups=[],priceType="retail",userRole="cashier",bomCheck=null}){
  // bomCheck is optional — without it the customizer behaves exactly as before
  const oosChoice=(gid,cid)=>{
    if(!bomCheck)return null;
    const sh=bomCheck.bomShort(bomCheck.choiceBomRows(gid,cid),1);
    return sh.length?sh:null;
  };
  const [selV,setSelV]=useState( item.variants[0]);
  // Item-level groups: always shown for all variants (Flavor, Sauce, etc.)
  const  itemGroupIds=( item.optionGroups)||[];
  // Variant-level groups: only shown when THIS variant is selected
  const variantGroupIds=(selV&&selV.optionGroups)||[];
  // Combined:  item groups always + variant-specific groups
  const allLinkedIds=[...new Set([... itemGroupIds,...variantGroupIds])];
  const linkedGroups=(optionGroups||[]).filter(function(g){return allLinkedIds.includes(g.id);});
  // FIX: Firebase writes choices[] (see BOMPage). Old code read options[] -> always empty.
  const grpChoices=function(g){return (g&&(g.choices||g.options))||[];};
  // MODEL: a picker group needs N picks PER ITEM, and a variant says how many
  //  items one ordered unit contains. Solo = 1  item, BOGO = 2  items.
  // So "1 flavor per  item" resolves to 1 pick on Solo and 2 picks on BOGO,
  // and scales again with order qty — no per-variant config needed.
  const bogoCat=/bogo|buy\s*1\s*get/i.test(String(( item&& item.category)||""));
  const bogoVar=/bogo|buy\s*1\s*get/i.test(String((selV&&selV.label)||""));
  const isBogoSel=bogoCat||bogoVar;
  const unitsPerOrder=(selV&&typeof selV. itemsPerUnit==="number")
    ? selV. itemsPerUnit
    : (isBogoSel?2:1);
  // picks required per ITEM:
  //   perItem: 1        -> explicit field on the option_groups doc (best)
  //   "Get 2"/"Pili 2"  -> from the name
  //   "[R] ..." prefix  -> required, 1 per  item
  //   otherwise         -> 0, stays a plain optional group
  const perItem=function(g){
    if(typeof g.perItem==="number")return g.perItem;
    var nm=String((g&&g.name)||"");
    var m=/(?:get|choose|pick|select|pili|kuha)\s*(\d+)/i.exec(nm);
    if(m)return parseInt(m[1],10)||0;
    if(/^\s*\[R\]/i.test(nm))return 1;
    return 0;
  };
  const getPerUnit=function(g){
    // legacy absolute field stays absolute so existing docs don't double up,
    // but only when it actually carries a value — a stored 0 must not shadow
    // perItem and silently keep a group optional.
    if(typeof g.getPerUnit==="number"&&g.getPerUnit>0)return g.getPerUnit;
    return perItem(g)*unitsPerOrder;
  };
  const isFreeGrp=function(g){return getPerUnit(g)>0;};

  const [selO,setSelO]=useState({});
  const [selP,setSelP]=useState(null);
  const [qty,setQty]=useState(1);
  const [note,setNote]=useState("");
  // When variant changes, reset linked group selections
  const changeVariant=(v)=>{
    setSelV(v);
    setSelO(function(prev){
      const newSel={};
      Object.keys(prev).forEach(function(k){
        if(!k.startsWith("og_"))newSel[k]=prev[k];
      });
      return newSel;
    });
  };
  const freeQty=(gid,cid)=>{const a=selO["og_"+gid]||[];const f=a.find(x=>x.id===cid);return f?(f.qty||0):0;};
  const freeTotal=(gid)=>(selO["og_"+gid]||[]).reduce((s,c)=>s+(c.qty||0),0);
  const bumpFree=(gid,ch,d,cap)=>setSelO(p=>{
    const k="og_"+gid;const cur=(p[k]||[]).slice();
    const i=cur.findIndex(x=>x.id===ch.id);
    const now=i>=0?(cur[i].qty||0):0;
    const tot=cur.reduce((s,c)=>s+(c.qty||0),0);
    if(d>0&&tot>=cap)return p;
    let next=now+d; if(next<0)next=0;
    if(i>=0){ if(next===0)cur.splice(i,1); else cur[i]=Object.assign({},cur[i],{qty:next}); }
    else if(next>0){ cur.push({id:ch.id,label:ch.label||ch.name,priceAdd:ch.priceAdd||0,qty:next}); }
    const r=Object.assign({},p);r[k]=cur;return r;
  });
  // qty change must re-cap freebies (4 BOGO -> 4 picks; drop to 2 -> trim to 2)
  const setQtySafe=(nq)=>{
    const q=Math.max(1,nq);
    setQty(q);
    setSelO(p=>{
      const r=Object.assign({},p);
      linkedGroups.forEach(function(g){
        if(!isFreeGrp(g))return;
        const k="og_"+g.id,cap=getPerUnit(g)*q;
        let cur=(r[k]||[]).map(function(c){return Object.assign({},c);});
        let tot=cur.reduce(function(s,c){return s+(c.qty||0);},0);
        while(tot>cap&&cur.length){
          const last=cur[cur.length-1];
          const take=Math.min(last.qty,tot-cap);
          last.qty-=take;tot-=take;
          if(last.qty<=0)cur.pop();
        }
        r[k]=cur;
      });
      return r;
    });
  };
  const tog=(oid,ch,multi)=>setSelO(p=>{
    const cur=p[oid]||[];
    if(multi){const ex=cur.find(c=>c.id===ch.id);return ex?{...p,[oid]:cur.filter(c=>c.id!==ch.id)}:{...p,[oid]:[...cur,ch]};}
    const ex=cur.find(c=>c.id===ch.id);return ex?{...p,[oid]:[]}:{...p,[oid]:[ch]};
  });
  const ck=(oid,cid)=>(selO[oid]||[]).some(c=>c.id===cid);
  // FIX: og_ groups were counted here AND again in linkedGroupsPrice = double charge
  const optsTotal=Object.entries(selO).filter(([k])=>!k.startsWith("og_"))
    .reduce((s,[,cs])=>s+(cs||[]).reduce((a,c)=>a+(c.priceAdd||0),0),0);
  // Get base price by priceType (for Main/commissary account)
  const getBase=()=>{
    if(priceType==="franchisee"&& item.franchiseePrice) return  item.franchiseePrice;
    if(priceType==="wholesale"&& item.wholesalePrice) return  item.wholesalePrice;
    return  item.basePrice||0;
  };
  // Variant price: if variant has its own price field use it, else add to base
  // If all variants have priceAdd > 0, treat variant priceAdd as TOTAL price
  const hasVariants=( item.variants||[]).length>1;
  const variantIsTotal=hasVariants&&( item.variants||[]).every(v=>v.priceAdd>0||(v.label||"").toLowerCase()==="base"||v.priceAdd===0);
  const baseForCalc=variantIsTotal?(selV?.priceAdd||getBase()):getBase();
  const variantAdd=variantIsTotal?0:(selV?.priceAdd||0);
  const unitPrice=baseForCalc+variantAdd+optsTotal+(selP?.priceAdd||0);
  // BOGO can come from a promo, the  item's category, or a variant labelled "BOGO w/ Drink"
  const isBogo=(selP&&selP.discount==="bogo")||isBogoSel;
  // normal linked groups: per-unit upcharge
  const linkedPerUnit=linkedGroups.filter(g=>!isFreeGrp(g))
    .reduce((s,g)=>s+((selO["og_"+g.id]||[]).reduce((a,c)=>a+(c.priceAdd||0),0)),0);
  // freebie upcharges: already picked N times, do NOT multiply by qty again
  const freebieAdd=linkedGroups.filter(isFreeGrp)
    .reduce((s,g)=>s+((selO["og_"+g.id]||[]).reduce((a,c)=>a+((c.priceAdd||0)*(c.qty||0)),0)),0);
  // FIX: old code returned unitPrice (qty ignored) for BOGO -> 4 BOGO charged as 1
  const lineTotal=(unitPrice+linkedPerUnit)*qty+freebieAdd;
  const missing= item.options.filter(o=>o.required&&!(selO[o.id]||[]).length).map(o=>o.label);
  const freeGaps=linkedGroups.filter(isFreeGrp).map(function(g){
    return {name:g.name,need:getPerUnit(g)*qty,got:freeTotal(g.id)};
  }).filter(function(x){return x.got!==x.need;});
  const blocked=missing.length>0||freeGaps.length>0;

  const handleAdd=()=>{
    if(blocked)return;
    const freebies=[],optionRefs=[],labels=[];
    Object.entries(selO).filter(([k])=>!k.startsWith("og_"))
      .forEach(([,cs])=>(cs||[]).forEach(c=>labels.push(c.label)));
    linkedGroups.forEach(function(g){
      const free=isFreeGrp(g);
      (selO["og_"+g.id]||[]).forEach(function(c){
        const n=free?(c.qty||0):1;
        if(n<=0)return;
        optionRefs.push({groupId:g.id,groupName:g.name,choiceId:c.id,label:c.label,qty:n,free:free});
        if(free)freebies.push({groupId:g.id,groupName:g.name,id:c.id,label:c.label,qty:n,priceAdd:c.priceAdd||0});
        else labels.push(c.label);
      });
    });
    onAdd({
      cartId:Date.now()+Math.random(),id: item.id,
      name: item.name,emoji: item.emoji,unitPrice,qty,
      variant:selV?.label,
      options:labels,
      freebies:freebies,optionRefs:optionRefs,
      freePerUnit:linkedGroups.filter(isFreeGrp).reduce((s,g)=>s+getPerUnit(g),0),
      promo:selP?.label,isBogo,note,lineTotal
    });
  };

  const s=(style)=>style;
  return h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:900},
    onClick:e=>e.target===e.currentTarget&&onClose()},
    h("div",{style:{background:"#fff",width:"100%",maxWidth:500,borderRadius:"20px 20px 0 0",maxHeight:"88vh",display:"flex",flexDirection:"column",boxShadow:"0 -8px 40px rgba(0,0,0,.2)"}},
      // Header
      h("div",{style:{background:`linear-gradient(135deg,${C.primary}12,#fff)`,padding:"16px 18px 0",position:"relative"}},
        h("button",{onClick:onClose,style:{position:"absolute",top:12,right:12,width:28,height:28,borderRadius:"50%",background:"rgba(0,0,0,.08)",border:"none",fontSize:16,cursor:"pointer"}},"×"),
        h("div",{style:{display:"flex",gap:12,alignItems:"center",paddingBottom:13,borderBottom:"1px solid "+C.border}},
          h("div",{style:{width:64,height:64,background:`${C.primary}10`,borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:34,flexShrink:0}}, item.emoji),
          h("div",null,
            h("div",{style:{fontWeight:900,fontSize:16}}, item.name),
            h("div",{style:{fontSize:13,color:C.muted,marginTop:2,lineHeight:1.4}}, item.desc),
            h("div",{style:{fontSize:14,fontWeight:900,color:C.primary,marginTop:4}},"₱"+ item.basePrice)
          )
        )
      ),
      // Scrollable body
      h("div",{style:{flex:1,overflowY:"auto",padding:"0 18px"}},
        // Promos
         item.promos.length>0&&h("div",{style:{padding:"13px 0",borderBottom:"1px solid "+C.border}},
          h("div",{style:{fontSize:13,fontWeight:800,marginBottom:8,display:"flex",gap:7,alignItems:"center"}},
            h("span",{style:{background:"#FF4B2B",color:"#fff",fontSize:12,padding:"2px 7px",borderRadius:20}},"🔥 DEALS"),
            "Promos"
          ),
           item.promos.map(p=>{
            const on=selP?.id===p.id;
            return h("button",{key:p.id,onClick:()=>setSelP(on?null:p),style:{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,border:`2px solid ${on?"#FF4B2B":C.border}`,background:on?"#FFF5F5":"#fff",cursor:"pointer",textAlign:"left",width:"100%",marginBottom:6}},
              h("div",{style:{width:19,height:19,borderRadius:"50%",border:`2px solid ${on?"#FF4B2B":C.border}`,background:on?"#FF4B2B":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
                on&&h("div",{style:{width:7,height:7,borderRadius:"50%",background:"#fff"}})
              ),
              h("div",{style:{flex:1}},
                h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
                  h("span",{style:{fontWeight:700,fontSize:14}},p.label),
                  h("span",{style:{background:"#FF4B2B",color:"#fff",fontSize:11,padding:"1px 6px",borderRadius:20}},p.tag)
                ),
                p.note&&h("div",{style:{fontSize:13,color:C.muted}},p.note)
              ),
              h("span",{style:{fontSize:13,color:p.priceAdd?C.primary:"#FF4B2B",fontWeight:700}},p.priceAdd?"+₱"+p.priceAdd:"FREE")
            );
          })
        ),
        // Variants
         item.variants.length>0&&h("div",{style:{padding:"13px 0",borderBottom:"1px solid "+C.border}},
          h("div",{style:{fontSize:13,fontWeight:800,marginBottom:8}},"Size / Quantity ",h("span",{style:{color:C.primary,fontSize:13}},"• Required")),
           item.variants.map(v=>{
            const on=selV?.id===v.id;
            return h("button",{key:v.id,onClick:()=>changeVariant(v),style:{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,border:`2px solid ${on?C.primary:C.border}`,background:on?"#F3E9F7":"#fff",cursor:"pointer",textAlign:"left",width:"100%",marginBottom:6}},
              h("div",{style:{width:19,height:19,borderRadius:"50%",border:`2px solid ${on?C.primary:C.border}`,background:on?C.primary:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
                on&&h("div",{style:{width:7,height:7,borderRadius:"50%",background:"#fff"}})
              ),
              h("div",{style:{flex:1,display:"flex",gap:7,alignItems:"center"}},
                h("span",{style:{fontWeight:700,fontSize:14}},v.label),
                v.tag&&h("span",{style:{background:`${C.primary}18`,color:C.primary,fontSize:12,padding:"1px 6px",borderRadius:20}},v.tag)
              ),
              h("span",{style:{fontSize:13,color:v.priceAdd?C.primary:C.muted,fontWeight:v.priceAdd?700:400}},v.priceAdd?"+₱"+v.priceAdd:"Base")
            );
          })
        ),
        // Options
        ... item.options.map(opt=>h("div",{key:opt.id,style:{padding:"13px 0",borderBottom:"1px solid "+C.border}},
          h("div",{style:{fontSize:13,fontWeight:800,marginBottom:4,display:"flex",gap:7,alignItems:"center"}},
            opt.label,
            h(Badge,{label:opt.required?"Required":"Optional",color:opt.required?C.danger:C.muted}),
            opt.multi&&h(Badge,{label:"Multi",color:C.info})
          ),
          missing.includes(opt.label)&&h("div",{style:{fontSize:13,color:C.danger,fontWeight:600,marginBottom:5}},"⚠️ Please choose one"),
          opt.choices.map(ch=>{
            const on=ck(opt.id,ch.id);
            return h("button",{key:ch.id,onClick:()=>tog(opt.id,ch,opt.multi),style:{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",borderRadius:9,border:`2px solid ${on?C.primary:C.border}`,background:on?"#F3E9F7":"#fff",cursor:"pointer",textAlign:"left",width:"100%",marginBottom:5}},
              opt.multi?h("div",{style:{width:18,height:18,borderRadius:4,border:`2px solid ${on?C.primary:C.border}`,background:on?C.primary:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},on&&h("span",{style:{color:"#111111",fontSize:13,fontWeight:900}},"✓"))
              :h("div",{style:{width:18,height:18,borderRadius:"50%",border:`2px solid ${on?C.primary:C.border}`,background:on?C.primary:"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},on&&h("div",{style:{width:7,height:7,borderRadius:"50%",background:"#fff"}})),
              h("span",{style:{flex:1,fontSize:14,fontWeight:on?700:400}},ch.label),
              h("span",{style:{fontSize:13,color:ch.priceAdd?C.primary:C.muted,fontWeight:ch.priceAdd?600:400}},ch.priceAdd?"+₱"+ch.priceAdd:"Free")
            );
          })
        )),
        // Note
        // Linked Option Groups (from BOM setup)
        ...linkedGroups.map(function(group){
          const groupKey="og_"+group.id;
          const selected=selO[groupKey]||[];
          const per=getPerUnit(group);
          const free=per>0;
          const cap=per*qty;
          const got=selected.reduce(function(a,c){return a+(c.qty||0);},0);
          const short=free&&got!==cap;
          const choices=grpChoices(group);
          return h("div",{key:group.id,
            style:{padding:"13px 0",borderBottom:"1px solid "+C.border}},
            h("div",{style:{fontSize:13,fontWeight:800,marginBottom:6,
              display:"flex",gap:7,alignItems:"center",flexWrap:"wrap"}},
              (function(){
                var nm=String(group.name||"").replace(/^\s*\[R\]\s*/i,"");
                if(!free)return nm;
                return /(get|choose|pick|select|pili|kuha)\s*\d+/i.test(nm)
                  ?nm.replace(/(get|choose|pick|select|pili|kuha)\s*\d+/i,"Pick "+cap)
                  :nm;
              })(),
              free
                ?h("span",{style:{background:short?C.danger:"#2E7D32",color:"#fff",fontSize:12,
                    padding:"1px 7px",borderRadius:20}},got+"/"+cap+(short?" • Required":" ✓"))
                :h("span",{style:{fontSize:12,color:C.muted,fontWeight:400}},"• Optional")
            ),
            free&&h("div",{style:{fontSize:12,color:C.muted,marginBottom:7}},
              cap===1
                ?"Pick 1 — required."
                :"Pick "+cap+" ("+(unitsPerOrder*qty)+"  item × "
                  +perItem(group)+") — the same choice may repeat."),
            choices.length===0&&h("div",{style:{fontSize:13,color:C.danger,background:"#FFEBEE",
              padding:"8px 10px",borderRadius:8}},
              "⚠️ This group has no choices. Add them in Menu & BOM → Option Groups."),
            h("div",{style:{display:"grid",
              gridTemplateColumns:"repeat(auto-fill,minmax(120px,1fr))",gap:6}},
              choices.map(function(opt){
                const lbl=opt.label||opt.name;
                if(free){
                  const n=freeQty(group.id,opt.id);
                  const oos=oosChoice(group.id,opt.id);
                  const canAdd=got<cap&&!oos;
                  return h("div",{key:opt.id,
                    style:{padding:"7px 8px",borderRadius:9,textAlign:"center",
                      border:"2px solid "+(oos?"#eee":(n>0?C.primary:C.border)),
                      background:oos?"#FAFAFA":(n>0?C.primary+"12":"#fff"),
                      opacity:oos?.55:1}},
                    h("div",{style:{fontSize:13,fontWeight:n>0?700:400,
                      color:oos?C.muted:(n>0?C.primary:C.text),marginBottom:5}},lbl),
                    oos&&h("div",{style:{fontSize:11,color:C.danger,fontWeight:800,marginBottom:3}},
                      "UBOS: "+oos[0].ingName),
                    (opt.priceAdd||0)>0&&h("div",{style:{fontSize:12,color:C.primary,
                      fontWeight:700,marginBottom:3}},"+₱"+(opt.priceAdd||0)+" ea"),
                    h("div",{style:{display:"flex",alignItems:"center",
                      justifyContent:"center",gap:8}},
                      h("button",{onClick:function(){bumpFree(group.id,opt,-1,cap);},
                        style:{width:24,height:24,borderRadius:6,border:"none",
                          background:n>0?C.primary:"#eee",color:n>0?"#fff":"#bbb",
                          fontSize:14,fontWeight:900,cursor:n>0?"pointer":"default"}},"−"),
                      h("span",{style:{minWidth:14,fontWeight:900,fontSize:14}},n),
                      h("button",{onClick:function(){bumpFree(group.id,opt,1,cap);},
                        style:{width:24,height:24,borderRadius:6,border:"none",
                          background:canAdd?C.primary:"#eee",color:canAdd?"#fff":"#bbb",
                          fontSize:14,fontWeight:900,cursor:canAdd?"pointer":"default"}},"+")
                    )
                  );
                }
                const on=selected.some(function(x){return x.id===opt.id;});
                const oos2=on?null:oosChoice(group.id,opt.id);
                return h("button",{key:opt.id,disabled:!!oos2,
                  onClick:function(){
                    if(oos2)return;
                    setSelO(function(p){
                      var cur=p[groupKey]||[];
                      var next=on
                        ?cur.filter(function(x){return x.id!==opt.id;})
                        :[...cur,{id:opt.id,label:lbl,priceAdd:opt.priceAdd||0}];
                      var r={};Object.assign(r,p);r[groupKey]=next;return r;
                    });
                  },
                  style:{padding:"8px 10px",borderRadius:9,
                    cursor:oos2?"not-allowed":"pointer",opacity:oos2?.55:1,
                    textAlign:"center",border:"2px solid "+(oos2?"#eee":(on?C.primary:C.border)),
                    background:oos2?"#FAFAFA":(on?C.primary+"12":"#fff")}},
                  h("div",{style:{fontSize:13,fontWeight:on?700:400,
                    color:oos2?C.muted:(on?C.primary:C.text)}},lbl),
                  oos2&&h("div",{style:{fontSize:11,color:C.danger,fontWeight:800}},
                    "UBOS: "+oos2[0].ingName),
                  !oos2&&(opt.priceAdd||0)>0&&h("div",{style:{fontSize:12,color:C.primary,fontWeight:700}},
                    "+₱"+(opt.priceAdd||0))
                );
              })
            )
          );
        }),
        h("div",{style:{padding:"13px 0 18px"}},
          h("div",{style:{fontSize:13,fontWeight:800,marginBottom:7}},"📝 Special Instructions ",h("span",{style:{color:C.muted,fontWeight:400}},"• Optional")),
          h("textarea",{value:note,
  onChange:e=>setNote(e.target.value),placeholder:'"Extra spicy", "No rice", "Separate sauce"',style:{width:"100%",padding:"9px 11px",border:"1px solid "+C.border,borderRadius:9,fontSize:13,outline:"none",resize:"none",fontFamily:"inherit",boxSizing:"border-box",height:58}})
        )
      ),
      // Footer
      h("div",{style:{padding:"11px 18px 16px",borderTop:"1px solid "+C.border}},
        missing.length>0&&h("div",{style:{background:"#FFEBEE",borderRadius:8,padding:"7px 11px",marginBottom:8,fontSize:13,color:C.danger,fontWeight:600}},"⚠️ Select: "+missing.join(", ")),
        freeGaps.length>0&&h("div",{style:{background:"#FFEBEE",borderRadius:8,padding:"7px 11px",marginBottom:8,fontSize:13,color:C.danger,fontWeight:600}},
          freeGaps.map(function(g){return g.name+": "+g.got+"/"+g.need;}).join(" · ")+" — selection incomplete"),
        isBogo&&h("div",{style:{background:"#FFF8E1",borderRadius:8,padding:"7px 11px",marginBottom:8,fontSize:13,color:"rgba(255,255,255,.85)",fontWeight:600}},
          "🎉 "+qty+"x BOGO = "+(qty*2)+"  items total"),
        h("div",{style:{display:"flex",gap:9,alignItems:"center"}},
          h("div",{style:{display:"flex",alignItems:"center",gap:7,background:C.bg,borderRadius:9,padding:"4px"}},
            h("button",{onClick:()=>setQtySafe(qty-1),style:{width:30,height:30,borderRadius:7,border:"none",background:qty>1?"#fff":"#eee",cursor:qty>1?"pointer":"default",fontSize:16,fontWeight:700,color:qty>1?C.primary:C.muted}},"−"),
            h("span",{style:{minWidth:20,textAlign:"center",fontWeight:900,fontSize:14}},qty),
            h("button",{onClick:()=>setQtySafe(qty+1),style:{width:30,height:30,borderRadius:7,border:"none",background:"#fff",cursor:"pointer",fontSize:16,fontWeight:700,color:C.primary}},"+")
          ),
          h("button",{onClick:handleAdd,disabled:blocked,style:{flex:1,padding:"12px",background:blocked?"#eee":`linear-gradient(135deg,${C.primary},${C.dark})`,border:"none",borderRadius:10,color:blocked?"#999":"#fff",fontWeight:800,fontSize:13,cursor:blocked?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:9}},
            "Add to Order",
            h("span",{style:{background:"rgba(255,255,255,.15)",padding:"2px 9px",borderRadius:20,fontSize:14}},"₱"+peso(lineTotal))
          )
        )
      )
    )
  );
}


// ─── PO FORM (Branch creates Purchase Order) ─────────────
function POForm({branchId,user,db,INIT_INVENTORY,onClose,showT,advances,setAdvances,branches=BRANCHES,editPO=null}){
  // Main's catalogue, loaded live. The branch is ordering FROM the commissary,
  // so the list must be Main's  items at Main's transfer price — not the
  // branch's own stock and not the hardcoded seed.
  const [mainCat,setMainCat] = useState(null);
  useEffect(()=>{
    let alive=true;
    (async()=>{
      try{
        const snap=await getDocs(collection(db,"inventory"));
        const rows=snap.docs.map(d=>({...d.data(),id:d.id}));
        if(alive)setMainCat(rows);
      }catch(e){ if(alive)setMainCat([]); }
    })();
    return()=>{alive=false;};
  },[]);

  // When editing, seed the catalogue with the quantities already ordered.
  const [ items,setItems]     = useState(()=>{
    const prev={};
    ((editPO&&editPO. items)||[]).forEach(i=>{prev[i.id]={qty:i.qty||0,note:i.note||""};});
    return INIT_INVENTORY.map(i=>({...i,
      orderQty:(prev[i.id]&&prev[i.id].qty)||0,
      note:(prev[i.id]&&prev[i.id].note)||""}));
  });
  const [deliveryReq,setDeliveryReq] = useState("");
  const [notes,setNotes]     = useState("");
  const [discount,setDiscount] = useState(0);
  const today = localDate();
  const [soNum,setSoNum] = useState("");
  // Generate branch-sequential PO number on mount
  useEffect(()=>{
    if(!branchId||!advances)return;
    const branchCode = branchId.toUpperCase().replace("CT-","");
    let alive=true;
    (async()=>{
      let highest=0;
      try{
        const snap=await getDocs(query(collection(db,"advances"),
          where("branch","==",branchId)));
        snap.docs.forEach(d=>{
          const a=d.data();
          if(a._type!=="po")return;
          const m=/-PO-(\d+)$/.exec(String(a.poNum||""));
          if(m)highest=Math.max(highest,parseInt(m[1],10)||0);
        });
      }catch(e){
        // fall back to the capped list rather than block the form
        highest=advances.filter(a=>a._type==="po"&&a.branch===branchId).length;
      }
      if(alive)setSoNum(branchCode+"-PO-"+String(highest+1).padStart(4,"0"));
    })();
    return()=>{alive=false;};
  },[branchId,advances.length]);

  // Rebuild the rows once Main's catalogue arrives, preserving any quantities
  // already typed (and any quantities from the PO being edited).
  useEffect(()=>{
    if(!mainCat)return;
    const src=mainCat.length?mainCat:INIT_INVENTORY;
    setItems(prevRows=>{
      const keep={};
      (prevRows||[]).forEach(r=>{ if(r.orderQty||r.note)keep[r.id]={qty:r.orderQty,note:r.note}; });
      ((editPO&&editPO. items)||[]).forEach(i=>{ if(!keep[i.id])keep[i.id]={qty:i.qty||0,note:i.note||""}; });
      return src.map(i=>({...i,
        orderQty:(keep[i.id]&&keep[i.id].qty)||0,
        note:(keep[i.id]&&keep[i.id].note)||""}));
    });
  },[mainCat]);

  const ordered =  items.filter(i=>i.orderQty>0);
  const [vatType,setVatType] = useState("vat"); // vat | nonvat | zerovat
  const [srch,setSrch]       = useState("");
  const [catFilter,setCat]   = useState("");
  const [onlyPicked,setOnlyPicked] = useState(false);

  // Reusable order templates. At 2-3 orders a month the same basket repeats,
  // so rebuilding it from an empty catalogue every time is the real cost.
  const [batches,setBatches]   = useState([]);
  const [batchLabel,setLabel]  = useState("");
  const [savingBatch,setSaveB] = useState(false);
  const loadBatches = async()=>{
    try{
      const snap=await getDocs(query(collection(db,"order_batches"),
        where("branch","==",branchId)));
      setBatches(snap.docs.map(d=>({...d.data(),_docId:d.id})));
    }catch(e){ setBatches([]); }
  };
  useEffect(()=>{ if(branchId)loadBatches(); },[branchId]);

  const saveBatch = async()=>{
    const label=(batchLabel||"").trim();
    if(!label){showT("Name the batch first","warn");return;}
    if(!ordered.length){showT("No  items selected","warn");return;}
    setSaveB(true);
    try{
      await addDoc(collection(db,"order_batches"),{
        branch:branchId,label:label,
        // store base-unit quantities; pack display is derived at render time
         items:ordered.map(i=>({id:i.id,name:i.name,qty:i.orderQty,note:i.note||""})),
        createdBy:user.name,at:serverTimestamp(),
        date:localDate()
      });
      setLabel(""); await loadBatches();
      showT(label+" saved \u2713");
    }catch(e){
      console.error("saveBatch:",e);
      showT("Save failed: "+String(e&&e.message||e).slice(0,60),"err");
    }
    setSaveB(false);
  };

  const applyBatch = (b)=>{
    const want={};
    (b. items||[]).forEach(i=>{want[i.id]={qty:i.qty||0,note:i.note||""};});
    let missing=0;
    setItems(rows=>rows.map(r=>{
      if(!want[r.id])return {...r,orderQty:0,note:""};
      return {...r,orderQty:want[r.id].qty,note:want[r.id].note};
    }));
    // an  item can be dropped from Main's catalogue after a batch was saved
    (b. items||[]).forEach(i=>{ if(! items.some(r=>r.id===i.id))missing++; });
    showT(b.label+" loaded"+(missing?" ("+missing+"  item no longer in catalogue)":" \u2713"),
      missing?"warn":"ok");
  };

  const deleteBatch = async(b)=>{
    if(!confirm("Delete the batch \""+b.label+"\"?"))return;
    try{ await deleteDoc(doc(db,"order_batches",b._docId)); await loadBatches();
         showT("Batch deleted","warn"); }
    catch(e){ showT("Delete failed","err"); }
  };

  // Category counts come from the WHOLE catalogue, not the filtered view —
  // the number next to a category has to say how many are in it, not how
  // many survive the current search.
  const catCounts= items.reduce((m,i)=>{
    const c=i.cat||"Uncategorized";
    m[c]=(m[c]||0)+1; return m;
  },{});
  const catList=Object.keys(catCounts).sort();

  const visible= items.filter(i=>{
    if(onlyPicked&&!(i.orderQty>0))return false;
    if(catFilter&&(i.cat||"Uncategorized")!==catFilter)return false;
    if(srch){
      const q=srch.toLowerCase();
      if(!String(i.name||"").toLowerCase().includes(q)
        &&!String(i.cat||"").toLowerCase().includes(q))return false;
    }
    return true;
  });

  const submit = async()=>{
    if(!ordered.length){showT("Add at least 1  item","warn");return;}
    const po = {
      _type:"po", poNum:soNum,
      branch:branchId,
      branchName:branches.find(b=>b.id===branchId)?.full||branchId,
       items:ordered.map(i=>({id:i.id,name:i.name,unit:i.unit,qty:i.orderQty,
        note:i.note||"",price:Number(i.price)||0,
        cost:Number(i.cost)||0,   // Main's cost at order time, for margin
        packUnit:i.packUnit||"",packSize:Number(i.packSize)||0})),
      date:today,
      deliveryRequested:deliveryReq,
      notes,
      discount:parseFloat(discount)||0,
      status:"received_by_main",
      paymentStatus:"Unpaid",
      deliveryStatus:"Pending",
      vatType,
      requestedBy:user.name,
      timestamp:serverTimestamp()
    };
    try{
      if(editPO&&editPO._docId){
        // Re-read before writing: the DR may have been issued while this form
        // was open, and a closed PO must never be rewritten behind Main's back.
        let live=null;
        try{const snap=await getDoc(doc(db,"advances",editPO._docId));
            if(snap.exists())live=snap.data();}catch(e){}
        if(live&&live.status!=="received_by_main"){
          showT("No longer editable — Main has processed it","err");
          onClose();return;
        }
        await updateDoc(doc(db,"advances",editPO._docId),{
           items:po. items,notes:po.notes,deliveryRequested:po.deliveryRequested,
          discount:po.discount,vatType:po.vatType,
          editedBy:user.name,editedAt:serverTimestamp()
        });
        await notify(db,{to:"ct-main",type:"po_new",
          title:"Na-edit na order — "+(po.branchName||branchId),
          message:ordered.length+"  item/s (binago)",
          page:"po_monitor",ref:editPO.poNum||po.poNum,by:user.name});
        showT((editPO.poNum||po.poNum)+" updated ✓");
        onClose();return;
      }
      await addDoc(collection(db,"advances"),po);
      await notify(db,{to:"ct-main",type:"po_new",
        title:"New order — "+(po.branchName||branchId),
        message:ordered.length+"  item/s requested"+(deliveryReq?" · wants "+deliveryReq:""),
        page:"po_monitor",ref:soNum,by:user.name});
      showT(soNum+" submitted to Commissary ✓");
    }catch(e){
      console.error("PO submit failed:",e);
      showT("Order NOT saved: "+String(e&&e.message||e).slice(0,70),"err");
      return;   // keep the form open so the work is not lost
    }
    onClose();
  };

  return h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:900}},
    h("div",{style:{background:"#fff",width:600,borderRadius:16,padding:"0",
      boxShadow:"0 20px 60px rgba(0,0,0,.3)",maxHeight:"90vh",display:"flex",flexDirection:"column",overflow:"hidden"}},

      // Header
      h("div",{style:{background:`linear-gradient(135deg,${C.primary},${C.dark})`,padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
        h("div",null,
          h("div",{style:{color:C.accent,fontSize:12,fontWeight:700,letterSpacing:2}},"PURCHASE ORDER / SALES ORDER"),
          h("div",{style:{color:"#fff",fontSize:16,fontWeight:900,marginTop:2}},soNum),
          h("div",{style:{color:"rgba(255,255,255,.75)",fontSize:13,marginTop:1}},
            "From: "+( branches.find(b=>b.id===branchId)?.full||branchId)+" · Date: "+today)
        ),
        h("button",{onClick:onClose,style:{background:"rgba(255,255,255,.15)",border:"none",color:"#fff",
          width:30,height:30,borderRadius:8,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}},"×")
      ),

      // SO Details bar
      h("div",{style:{background:"#F5F5F7",padding:"10px 20px",display:"grid",
        gridTemplateColumns:"1fr 1fr 1fr",gap:10,borderBottom:"1px solid #eee"}},
        h("div",null,
          h("div",{style:{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:3}},"CUSTOMER"),
          h("div",{style:{fontSize:13,fontWeight:700}},branches.find(b=>b.id===branchId)?.full||branchId)
        ),
        h("div",null,
          h("div",{style:{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:3}},"REQUESTED DELIVERY"),
          h("input",{type:"date",value:deliveryReq,onChange:e=>setDeliveryReq(e.target.value),
            style:{width:"100%",padding:"5px 8px",border:"1px solid "+C.border,borderRadius:6,
              fontSize:13,outline:"none",boxSizing:"border-box",fontWeight:600}})
        ),
        h("div",null,
          h("div",{style:{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:3}},"CHANNEL"),
          h("div",{style:{fontSize:13,fontWeight:700,color:C.info}},"BRANCH ORDER")
        )
      ),

      // Items table
      // Search / category / picked-only
      h("div",{style:{padding:"9px 20px",borderBottom:"1px solid #eee",
        display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}},
        h("input",{value:srch,onChange:e=>setSrch(e.target.value),
          placeholder:"🔍 Search  items...",
          style:{flex:1,minWidth:160,padding:"7px 10px",border:"1px solid "+C.border,
            borderRadius:8,fontSize:13,outline:"none"}}),
        h("select",{value:catFilter,onChange:e=>setCat(e.target.value),
          style:{padding:"7px 10px",border:"1px solid "+(catFilter?C.primary:C.border),
            borderRadius:8,fontSize:13,outline:"none",cursor:"pointer",
            background:catFilter?"#F3E9F7":"#fff",
            color:catFilter?C.primary:C.text,fontWeight:catFilter?700:400}},
          h("option",{value:""},"All categories ("+ items.length+")"),
          catList.map(c=>h("option",{key:c,value:c},"("+catCounts[c]+") "+c))
        ),
        h("button",{onClick:()=>setOnlyPicked(v=>!v),
          style:{padding:"7px 11px",borderRadius:8,fontSize:13,cursor:"pointer",
            fontWeight:onlyPicked?800:500,
            border:"1px solid "+(onlyPicked?C.primary:C.border),
            background:onlyPicked?"#F3E9F7":"#fff",
            color:onlyPicked?C.primary:C.text}},
          "🛒 Selected ("+ordered.length+")"),
        (srch||catFilter||onlyPicked)&&h("button",{
          onClick:()=>{setSrch("");setCat("");setOnlyPicked(false);},
          style:{padding:"7px 10px",borderRadius:8,fontSize:13,cursor:"pointer",
            border:"none",background:"none",color:C.muted,textDecoration:"underline"}},
          "Clear"),
        h("div",{style:{width:"100%",fontSize:12,color:C.muted}},
          "Showing "+visible.length+" of "+ items.length+"  item/s")
      ),

      // Saved batches
      h("div",{style:{padding:"9px 20px",borderBottom:"1px solid #eee",
        background:"#FFFDF7"}},
        h("div",{style:{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}},
          h("span",{style:{fontSize:12,fontWeight:800,color:"#BF360C",letterSpacing:1}},
            "SAVED BATCHES"),
          batches.length===0
            ? h("span",{style:{fontSize:13,color:C.muted}},
                "None yet \u2014 pick items, name it, then save")
            : batches.map(b=>h("span",{key:b._docId,
                style:{display:"inline-flex",alignItems:"center",gap:5,
                  border:"1px solid "+C.border,borderRadius:20,
                  background:"#fff",padding:"3px 5px 3px 10px"}},
                h("button",{onClick:()=>applyBatch(b),
                  style:{border:"none",background:"none",cursor:"pointer",
                    fontSize:13,fontWeight:700,color:C.text,padding:0}},
                  b.label+" ("+((b. items||[]).length)+")"),
                h("button",{onClick:()=>deleteBatch(b),
                  style:{border:"none",background:"none",cursor:"pointer",
                    color:C.muted,fontSize:13,lineHeight:1,padding:"0 2px"}},"\u00D7")
              ))
        ),
        h("div",{style:{display:"flex",gap:6,marginTop:7,alignItems:"center",flexWrap:"wrap"}},
          h("input",{value:batchLabel,onChange:e=>setLabel(e.target.value),
            onKeyDown:e=>{if(e.key==="Enter")saveBatch();},
            placeholder:"Batch name (e.g. Monthly Frozen)",
            style:{flex:1,minWidth:180,padding:"6px 10px",border:"1px solid "+C.border,
              borderRadius:8,fontSize:13,outline:"none"}}),
          h("button",{onClick:saveBatch,disabled:savingBatch||!ordered.length,
            style:{padding:"6px 13px",borderRadius:8,border:"none",
              background:(savingBatch||!ordered.length)?"#8A8A8A":"#E65100",
              color:"#fff",fontWeight:800,fontSize:13,
              cursor:(savingBatch||!ordered.length)?"not-allowed":"pointer"}},
            savingBatch?"...":"\uD83D\uDCBE Save "+ordered.length+"  item")
        )
      ),

      h("div",{style:{flex:1,overflowY:"auto",padding:"0"}},
        // Table header
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 80px 80px 1fr",
          padding:"8px 20px",background:"#fafafa",borderBottom:"1px solid #eee",position:"sticky",top:0,
          display:"grid",gridTemplateColumns:"1fr 80px 80px 70px 1fr"}},
          ["ITEM","CATEGORY","QTY","LAST PRICE","NOTE"].map(h2=>h("div",{key:h2,
            style:{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:1}},h2))
        ),
        visible.length===0&&h("div",{style:{padding:"34px 20px",textAlign:"center",
          color:C.muted,fontSize:13}},
          h("div",{style:{fontSize:26,marginBottom:7}},"🔍"),
          onlyPicked?"No  items selected yet":"No matching  items"),
        visible.map(( item)=>{const idx= items.findIndex(x=>x.id=== item.id);
          return h("div",{key: item.id,
          style:{display:"grid",gridTemplateColumns:"1fr 80px 80px 70px 1fr",
            padding:"8px 20px",borderBottom:"1px solid #f5f5f5",alignItems:"center",
            background:( item.orderQty||0)>0?"#FFF8F0":"#fff"}},
          // Item name
          h("div",null,
            h("div",{style:{fontSize:13,fontWeight:700,color:( item.orderQty||0)>0?C.primary:C.text}}, item.name),
            h("div",{style:{fontSize:12,color:C.muted}},
              packSizeOf( item)>0
                ? ("Order in "+packUnitOf( item)+" · 1 "+packUnitOf( item)+" = "+packSizeOf( item)+" "+ item.unit)
                : ("Unit: "+ item.unit))
          ),
          // Category
          h("div",{style:{fontSize:13,color:C.muted}}, item.cat),
          // Qty input — steps by pack when the  item is bought by the pack
          (function(){
            const sz=packSizeOf( item)||1;
            const step=(d)=>setItems(p=>p.map((x,i)=>i===idx
              ?{...x,orderQty:Math.max(0,(x.orderQty||0)+d*sz)}:x));
            const shownNum=sz>1?(( item.orderQty||0)/sz):( item.orderQty||0);
            const shown=shownNum?String(shownNum):"";
            return h("div",null,
              h("div",{style:{display:"flex",alignItems:"center",gap:4}},
                h("button",{onClick:()=>step(-1),
                  style:{width:22,height:22,borderRadius:5,border:"1px solid "+C.border,
                    background:"#fff",cursor:"pointer",fontSize:13,fontWeight:700,flexShrink:0}},"−"),
                h("input",{type:"number",onFocus:e=>e.target.select(),min:0,value:shown,
                  onChange:e=>{
                    const v=parseFloat(e.target.value)||0;
                    setItems(p=>p.map((x,i)=>i===idx?{...x,orderQty:Math.max(0,v*sz)}:x));
                  },
                  style:{width:40,textAlign:"center",padding:"3px",border:"1px solid "+C.border,
                    borderRadius:5,fontSize:14,fontWeight:700,outline:"none"}}),
                h("button",{onClick:()=>step(1),
                  style:{width:22,height:22,borderRadius:5,border:`1px solid ${C.primary}`,
                    background:"#F3E9F7",cursor:"pointer",fontWeight:700,color:C.primary,fontSize:13,flexShrink:0}},"+")
              ),
              sz>1&&h("div",{style:{fontSize:11,color:C.muted,marginTop:2,textAlign:"center"}},
                packUnitOf( item)+" → "+( item.orderQty||0)+" "+baseUnitOf( item))
            );
          })(),
          // Last price (from  item data)
          h("div",{style:{fontSize:13,color:C.muted,textAlign:"center"}},
            ( item.price||0)>0?"₱"+peso( item.price||0):"—"),
          // Note
          h("input",{value: item.note||"",
            onChange:e=>setItems(p=>p.map((x,i)=>i===idx?{...x,note:e.target.value}:x)),
            placeholder:"Special instruction...",
            style:{padding:"5px 8px",border:"1px solid "+C.border,borderRadius:6,
              fontSize:13,outline:"none",width:"100%",boxSizing:"border-box"}})
        );})
      ),

      // Footer summary
      h("div",{style:{borderTop:"2px solid "+C.border,padding:"12px 20px",background:"#fafafa"}},
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}},
          h("div",null,
            h("div",{style:{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:3}},"NOTES / REMARKS"),
            h("textarea",{value:notes,
  onChange:e=>setNotes(e.target.value),
              placeholder:"Additional notes for commissary...",
              style:{width:"100%",padding:"7px",border:"1px solid "+C.border,borderRadius:7,
                fontSize:13,outline:"none",resize:"none",height:44,
                boxSizing:"border-box",fontFamily:"inherit"}})
          ),
          h("div",null,
            h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:4}},
              h("span",{style:{fontSize:13,color:C.muted}},"Total Items Ordered:"),
              h("span",{style:{fontSize:13,fontWeight:700}},ordered.length+"  item/s")
            ),
            h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:4}},
              h("span",{style:{fontSize:13,color:C.muted}},"Line Items:"),
              h("span",{style:{fontSize:13,fontWeight:700}},ordered.length+"  items")
            ),
            // VAT Toggle
            h("div",{style:{marginBottom:10,padding:"8px 12px",background:"#f9f9f9",borderRadius:8}},
              h("div",{style:{fontSize:12,fontWeight:700,color:C.muted,marginBottom:6,letterSpacing:1}},"TAX TYPE"),
              h("div",{style:{display:"flex",gap:6}},
                [
                  {id:"vat",label:"VAT (12%)"},
                  {id:"nonvat",label:"Non-VAT"},
                  {id:"zerovat",label:"Zero-Rated"},
                ].map(v=>h("button",{key:v.id,
                  onClick:()=>setVatType(v.id),
                  style:{padding:"5px 12px",borderRadius:7,fontSize:13,fontWeight:700,
                    cursor:"pointer",border:"none",
                    background:vatType===v.id?C.primary:"#eee",
                    color:vatType===v.id?"#fff":C.text}},
                  v.label))
              )
            ),
            // Computed totals
            (()=>{
              const estSubtotal=ordered.reduce((s,i)=>s+(i.price||0)*(i.orderQty||0),0);
              const vatAmt=vatType==="vat"?estSubtotal*0.12:0;
              const grandTotal=estSubtotal+vatAmt;
              return h("div",{style:{background:"#fff",borderRadius:8,padding:"10px",
                border:"1px solid "+C.border}},
                h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:4}},
                  h("span",{style:{fontSize:13,color:C.muted}},"Est. Subtotal:"),
                  h("span",{style:{fontSize:13,fontWeight:700}},"₱"+peso(estSubtotal))
                ),
                vatType==="vat"&&h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:4}},
                  h("span",{style:{fontSize:13,color:C.muted}},"VAT (12%):"),
                  h("span",{style:{fontSize:13,fontWeight:700,color:"#BF360C"}},"₱"+peso(vatAmt))
                ),
                h("div",{style:{display:"flex",justifyContent:"space-between",
                  padding:"6px 0",borderTop:"2px solid "+C.primary,marginTop:4}},
                  h("span",{style:{fontSize:14,fontWeight:800}},"EST. GRAND TOTAL:"),
                  h("span",{style:{fontSize:14,fontWeight:900,color:C.primary}},"₱"+peso(grandTotal))
                ),
                h("div",{style:{fontSize:12,color:C.muted,marginTop:4}},
                  vatType==="vat"?"✓ VAT Inclusive":
                  vatType==="zerovat"?"✓ Zero-Rated VAT":"✓ Non-VAT Transaction")
              );
            })(),
            h("div",{style:{display:"flex",justifyContent:"space-between",padding:"6px 0",
              borderTop:"1px solid "+C.border}},
              h("span",{style:{fontSize:13,fontWeight:800}},"Status:"),
              h("span",{style:{fontSize:13,fontWeight:800,color:C.warning}},"PENDING COMMISSARY")
            )
          )
        ),
        h("div",{style:{display:"flex",gap:8}},
          h("button",{onClick:onClose,
            style:{flex:1,padding:"11px",background:"#fff",border:"1px solid "+C.border,
              borderRadius:9,fontWeight:700,fontSize:14,cursor:"pointer"}},"Cancel"),
          h("button",{onClick:submit,disabled:!ordered.length,
            style:{flex:2,padding:"11px",
              background:ordered.length?`linear-gradient(135deg,${C.primary},${C.dark})`:"#ddd",
              border:"none",borderRadius:9,color:ordered.length?"#fff":"#999",
              fontWeight:700,fontSize:14,cursor:ordered.length?"pointer":"not-allowed"}},
            "📤 Submit SO / Purchase Order →")
        ),

      )
    )
  );
}

// ─── DR ISSUE FORM (Commissary issues DR to branch) ──────
function DRIssueForm({po,db,user,showT,INIT_INVENTORY,advances,setAdvances}){
  const [deliveryDate,setDeliveryDate] = useState(po.deliveryDate||"");
  const [actualQtys,setActualQtys]     = useState(
    (po. items||[]).reduce((acc,i)=>({...acc,[i.id]:i.qty}),[])
  );
  const [prices,setPrices]   = useState(
    (po. items||[]).reduce((acc,i)=>({...acc,[i.id]:i.price||0}),[])
  );
  const [drNotes,setDrNotes] = useState("");
  const [expanded,setExpanded] = useState(false);
  const drNum = "DR-"+po.poNum?.replace("SO-","").replace("PO-","");
  const today = localDate();

  const totalAmt = (po. items||[]).reduce((s,i)=>{
    const qty = actualQtys[i.id]??i.qty;
    const price = prices[i.id]||0;
    return s + qty*price;
  },0);

  const issueDR = async()=>{
    if(!deliveryDate){showT("Set delivery date first","warn");return;}
    const delivered = (po. items||[]).map(i=>({
      ...i,
      actualQty: actualQtys[i.id]??i.qty,
      price: prices[i.id]||0,
      total: (actualQtys[i.id]??i.qty)*(prices[i.id]||0),
      discrepancy: (actualQtys[i.id]??i.qty) - i.qty
    }));
    const hasDisc = delivered.some(i=>i.discrepancy!==0);
    try{
      await updateDoc(doc(db,"advances",po._docId),{
        status:"processing",           // the label map and payment button key off this
        deliveryStatus:"Dispatched",   // goods have left Main
        deliveryDate, drNum,
        deliveredItems:delivered,
        totalAmount:totalAmt,
        hasDiscrepancy:hasDisc,
        drNotes,
        issuedBy:user.name, issuedAt:serverTimestamp()
      });

      // Issuing a DR moves goods OUT of main. Without this the branch gained
      // stock on receipt while main never lost any — stock from nothing.
      // stockIssued guards against a re-issue deducting twice.
      let moved=0;
      if(!po.stockIssued){
        for(const it of delivered){
          if(!it.id||!(it.actualQty>0))continue;
          try{
            let _dprev=null, _dlots=null;
            try{
              const _ds=await getDoc(doc(db,"inventory",it.id));
              if(_ds.exists()){
                _dprev=Number(_ds.data().stock)||0;
                _dlots=lotsConsume(_ds.data().lots,it.actualQty||0).lots;
              }
            }catch(e7){}
            await updateDoc(doc(db,"inventory",it.id),Object.assign({
              stock:increment(-(it.actualQty||0)),
              lastIssued:serverTimestamp()
            }, _dlots?{lots:_dlots}:{}));
            moved++;
            await addDoc(collection(db,"inventory_log"),{
               itemId:it.id, itemName:it.name||it.id,unit:it.unit||"",
              type:"deduct",amount:-(it.actualQty||0),
              prevStock:_dprev,
              newStock:_dprev==null?null:Math.round((_dprev-(it.actualQty||0))*1000)/1000,
              desc:"Issued from Main: "+(it.actualQty||0)+" "+(it.unit||"")
                +" to "+(po.branch||"")+" under "+drNum,
              source:"transfer",
              ref:drNum,
              reason:"DR "+drNum+" — issued to "+(po.branch||""),
              drNum:drNum,poId:po._docId,branch:po.branch||"",
              by:user.name,at:serverTimestamp(),timestamp:serverTimestamp()
            });
          }catch(e2){console.warn("Main stock deduct failed",it.id,e2);}
        }
        try{ await updateDoc(doc(db,"advances",po._docId),{stockIssued:true}); }catch(e3){}
      }
      await notify(db,{to:po.branch,type:"dr_issued",
        title:drNum+" — dispatched",
        message:delivered.length+"  item/s · P"+(Number(totalAmt)||0).toFixed(2)
          +(deliveryDate?" · arriving "+deliveryDate:""),
        page:"stock_order",ref:po.poNum||drNum,by:user.name});
      if(shortAtMain.length){
        showT("Not deducted (Main is short): "+shortAtMain.slice(0,2).join(" · ")
          +(shortAtMain.length>2?" +"+(shortAtMain.length-2):""),"warn");
      }
      showT(drNum+" issued ✓ · "+moved+"  item/s deducted from main");
    }catch(e){showT("Error issuing DR","err");console.error(e);}
  };

  const printDR = ()=>{

    <div class="hr"></div>
    <div class="b">Customer: ${po.branchName||po.branch}</div>
    <div>SO Ref: ${po.poNum}</div>
    <div>Issued by: ${user.name}</div>
    <div class="hr"></div>
    <table>
      <tr><th>Item</th><th class="r">PO Qty</th><th class="r">Actual</th><th class="r">Price</th><th class="r">Total</th></tr>
      ${ items.map(i=>`<tr>
        <td>${i.name}</td>
        <td class="r">${i.qty} ${i.unit}</td>
        <td class="r">${actualQtys[i.id]??i.qty} ${i.unit}</td>
        <td class="r">₱${peso((prices[i.id]||0))}</td>
        <td class="r">₱${peso(((actualQtys[i.id]??i.qty)*(prices[i.id]||0)))}</td>
      </tr>`).join("")}
    </table>
    <div class="hr"></div>
    <div class="b r">GROSS TOTAL: ₱${peso(gross)}</div>
    <div class="hr"></div>
    <div>Payment Status: UNPAID</div>
    <div>Delivery Status: PENDING</div>
    ${drNotes?`<div>Notes: ${drNotes}</div>`:""}
    <div class="hr"></div>
    <div>Received by: ________________</div>
    <div>Signature: ________________</div>
    <div>Date received: ________________</div>

      h("div",{style:{flex:1}},
        h("div",{style:{display:"flex",gap:8,alignItems:"center",marginBottom:3}},

      h("div",{style:{display:"flex",gap:6}},
        h("button",{onClick:()=>printDR(companySettings),

            color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}},"🖨️ Print DR"),
        h("button",{onClick:()=>setExpanded(!expanded),
          style:{padding:"6px 12px",background:expanded?C.primary:"#fff",
            border:"1px solid "+(expanded?C.primary:C.border),borderRadius:7,
            color:expanded?"#fff":C.text,fontSize:13,fontWeight:700,cursor:"pointer"}},
          expanded?"▲ Close":"▼ Process DR")
      )
    ),

    // Line  items preview (collapsed)
    !expanded&&h("div",{style:{padding:"8px 16px"}},
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 80px 80px 80px",
        fontSize:12,color:C.muted,fontWeight:700,letterSpacing:1,
        marginBottom:5,padding:"0 4px"}},"ITEM,PO QTY,ACTUAL,PRICE".split(",").map(h2=>
        h("div",{key:h2},h2))),
      (po. items||[]).map(i=>h("div",{key:i.id,
        style:{display:"grid",gridTemplateColumns:"1fr 80px 80px 80px",
          fontSize:13,padding:"5px 4px",borderBottom:"1px solid #f5f5f5"}},
        h("div",{style:{fontWeight:600}},i.name),
        h("div",{style:{color:C.muted}},i.qty+" "+i.unit),
        h("div",{style:{color:C.muted}},"—"),
        h("div",{style:{color:C.muted}},"—")
      ))
    ),

    // DR Processing panel (expanded)
    expanded&&h("div",{style:{padding:"14px 16px"}},

      // Delivery info
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}},
        h("div",null,
          h("div",{style:{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:4}},"DELIVERY DATE *"),
          h("input",{type:"date",value:deliveryDate,onChange:e=>setDeliveryDate(e.target.value),

          h("div",{style:{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:4}},"DR NUMBER"),

      h("div",{style:{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:6}},

      h("div",{style:{border:"1px solid "+C.border,borderRadius:8,overflow:"hidden",marginBottom:10}},
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 90px 90px 100px 90px",

            style:{display:"grid",gridTemplateColumns:"1fr 90px 90px 100px 90px",

              const asPack=(v)=>sz>1?(Math.round((v/sz)*1000)/1000):v;
              return h("div",{style:{fontSize:13,color:C.muted,fontWeight:600}},
                sz>1?h("div",null,
                      h("div",null,asPack(i.qty)+" "+pu),
                      h("div",{style:{fontSize:11,opacity:.7}},i.qty+" "+i.unit))
                    :(i.qty+" "+i.unit));
            })(),
            // Actual qty — steps by a whole pack when the  item has one
            (function(){
              const sz=Number(i.packSize)||1;
              const pu=i.packUnit||"pack";
              const step=(d)=>setActualQtys(p=>({...p,
                [i.id]:Math.max(0,(p[i.id]??i.qty)+d*sz)}));
              const shownNum=sz>1?(Math.round((actual/sz)*1000)/1000):actual;
              const shown=shownNum?String(shownNum):"";
              return h("div",{style:{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}},
                h("button",{onClick:()=>step(-1),
                  style:{width:20,height:20,borderRadius:4,border:"1px solid "+C.border,
                    background:"#fff",cursor:"pointer",fontSize:14,fontWeight:700}},"−"),
                h("input",{type:"number",onFocus:e=>e.target.select(),min:0,value:shown,
                  onChange:e=>{
                    const v=parseFloat(e.target.value)||0;
                    setActualQtys(p=>({...p,[i.id]:Math.max(0,v*sz)}));
                  },
                  style:{width:40,textAlign:"center",padding:"2px",border:"1px solid "+C.border,
                    borderRadius:5,fontSize:13,fontWeight:700,outline:"none",
                    color:diff<0?C.danger:diff>0?C.info:C.text}}),
                h("button",{onClick:()=>step(1),
                  style:{width:20,height:20,borderRadius:4,border:`1px solid ${C.primary}`,
                    background:"#F3E9F7",cursor:"pointer",fontWeight:700,color:C.primary,fontSize:14}},"+"),
                sz>1&&h("div",{style:{width:"100%",fontSize:11,color:C.muted}},
                  pu+" → "+actual+" "+i.unit),
                diff!==0&&h("span",{style:{fontSize:11,color:diff<0?C.danger:C.info,fontWeight:700}},
                  (diff>0?"+":"")+(sz>1?(Math.round((diff/sz)*1000)/1000)+" "+pu:diff))
              );
            })(),
            // Price — always per BASE unit
            h("div",{style:{display:"flex",alignItems:"center",gap:3,flexWrap:"wrap"}},
              h("span",{style:{fontSize:13,color:C.muted}},"₱"),
              h("input",{type:"number",onFocus:e=>e.target.select(),min:0,step:"0.01",value:price||"",
                onChange:e=>setPrices(p=>({...p,[i.id]:parseFloat(e.target.value)||0})),
                placeholder:"0.00",
                style:{width:65,padding:"5px",border:"1px solid "+C.border,borderRadius:6,
                  fontSize:13,fontWeight:700,outline:"none",textAlign:"right"}}),
              h("div",{style:{width:"100%",fontSize:11,color:C.muted}},
                "per "+i.unit+
                ((Number(i.packSize)||0)>1&&price
                  ?"  ·  ₱"+peso((price*Number(i.packSize)))+" per "+(i.packUnit||"pack")
                  :""))
            ),
            h("div",{style:{fontSize:13,fontWeight:800,color:C.primary,textAlign:"right"}},
              "₱"+peso((actual*price)))
          );
        }),
        // Total row
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 90px 90px 100px 90px",
          padding:"10px 12px",background:"#f9f9f9",borderTop:"2px solid "+C.border}},
          h("div",{style:{fontSize:13,fontWeight:800,gridColumn:"1/5"}},"GROSS TOTAL"),
          h("div",{style:{fontSize:13,fontWeight:900,color:C.primary,textAlign:"right"}},
            "₱"+peso(totalAmt))
        )
      ),

      // Discrepancy warning
      (po. items||[]).some(i=>(actualQtys[i.id]??i.qty)!==i.qty)&&
        h("div",{style:{background:"#FFF8E1",border:"1px solid #FFE082",borderRadius:8,
          padding:"8px 12px",marginBottom:8,fontSize:13,color:"#795548"}},
          "⚠️ Discrepancy detected — branch will be asked to confirm in Discrepancy Report."),

      // Notes
      h("div",{style:{marginBottom:10}},
        h("div",{style:{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:4}},"DR NOTES"),
        h("textarea",{value:drNotes,onChange:e=>setDrNotes(e.target.value),
          placeholder:"Remarks, substitutions, partial delivery notes...",
          style:{width:"100%",padding:"8px",border:"1px solid "+C.border,borderRadius:7,
            fontSize:13,outline:"none",resize:"none",height:48,
            boxSizing:"border-box",fontFamily:"inherit"}})
      ),

      // Actions
      h("div",{style:{display:"flex",gap:7}},
        h("button",{onClick:()=>printDR(companySettings),
          style:{padding:"10px 16px",background:"#fff",border:"1px solid "+C.border,
