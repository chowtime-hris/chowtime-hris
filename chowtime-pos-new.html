// ─── FIFO LOTS ────────────────────────────────────────────
// Each delivery becomes a lot carrying the price actually paid for it. Stock
// is consumed oldest-first, so the value of what remains is the sum of what
// each surviving lot cost — not a blended average that quietly revalues older
// stock every time a price moves.
//
// Lots live in an array on the item document, not a subcollection: a sale
// already reads and writes that one document, so FIFO adds no extra round
// trip to the hot path.
//
// `stock` stays the authoritative running total. The lots are the costing
// ledger beside it. They can drift — an old item has no lots at all — so
// every reader tolerates a short or missing lot list rather than trusting it
// blindly.

// Add a lot. qty and price are what this delivery actually brought and cost.
function lotsAdd(lots,qty,price,ref,when){
  const list=Array.isArray(lots)?lots.slice():[];
  const q=Number(qty)||0;
  if(q<=0) return list;
  list.push({
    qty:q,
    remaining:q,
    price:Number(price)||0,
    ref:ref||"",
    at:when||Date.now()
  });
  return list;
}

// Consume qty oldest-first. Returns the new list and the cost of what was
// taken, so the caller can record what that movement was actually worth.
// A shortfall is reported rather than hidden: if the lots do not cover the
// deduction, whatever is missing is priced at the last known lot price.
function lotsConsume(lots,qty){
  const list=(Array.isArray(lots)?lots:[]).map(l=>Object.assign({},l));
  let need=Number(qty)||0;
  let cost=0, taken=0;
  if(need<=0) return {lots:list,cost:0,taken:0,short:0};
  list.sort((a,b)=>(a.at||0)-(b.at||0));
  for(const l of list){
    if(need<=0)break;
    const avail=Number(l.remaining)||0;
    if(avail<=0)continue;
    const use=Math.min(avail,need);
    l.remaining=Math.round((avail-use)*10000)/10000;
    cost+=use*(Number(l.price)||0);
    taken+=use; need-=use;
  }
  const short=Math.round(need*10000)/10000;
  if(short>0){
    // more was deducted than the lots knew about — value it at the newest
    // price we have, and let the caller surface the gap
    const last=list.length?list[list.length-1]:null;
    cost+=short*((last&&Number(last.price))||0);
  }
  return {
    lots:lotsPrune(list),
    cost:Math.round(cost*10000)/10000,
    taken:Math.round(taken*10000)/10000,
    short:short
  };
}

// Drop spent lots so the array cannot grow without bound, but keep the most
// recent few even at zero — they carry the price used to value a shortfall.
function lotsPrune(lots){
  const list=(Array.isArray(lots)?lots:[]).slice()
    .sort((a,b)=>(a.at||0)-(b.at||0));
  const live=list.filter(l=>(Number(l.remaining)||0)>0.0001);
  const spent=list.filter(l=>(Number(l.remaining)||0)<=0.0001).slice(-3);
  return spent.concat(live).sort((a,b)=>(a.at||0)-(b.at||0));
}

// What the remaining stock is worth.
function lotsValue(lots){
  return Math.round((Array.isArray(lots)?lots:[])
    .reduce((a,l)=>a+((Number(l.remaining)||0)*(Number(l.price)||0)),0)*100)/100;
}

// Units the lots still account for. Compared against `stock` this is the
// drift check — they should match, and where they do not the item needs a
// physical count rather than a silent correction.
function lotsQty(lots){
  return Math.round((Array.isArray(lots)?lots:[])
    .reduce((a,l)=>a+(Number(l.remaining)||0),0)*10000)/10000;
}

// Cost per unit implied by the surviving lots. Falls back to the item's own
// cost field when there are no lots yet, so an un-seeded item still values.
function lotsUnitCost(lots,fallback){
  const q=lotsQty(lots);
  if(q>0) return Math.round((lotsValue(lots)/q)*10000)/10000;
  return Number(fallback)||0;
}

// A physical count replaces reality: one lot, at the best price we can
// justify, because the old lot structure no longer describes what is there.
function lotsReset(qty,price,ref,when){
  const q=Number(qty)||0;
  if(q<=0) return [];
  return [{qty:q,remaining:q,price:Number(price)||0,
    ref:ref||"count",at:when||Date.now()}];
}

// ─── DATE RANGES ──────────────────────────────────────────
// One definition of "this week" and "this month" for the dashboard and the
// analytics, so the two can never disagree about the period they are showing.
function rangeFor(key,customFrom,customTo){
  const t=new Date();
  const iso=(d)=>localDate(d);
  const shift=(n)=>{const d=new Date(); d.setDate(d.getDate()+n); return d;};
  if(key==="today")     return {from:iso(t),to:iso(t),label:"Today"};
  if(key==="yesterday"){const y=shift(-1); return {from:iso(y),to:iso(y),label:"Yesterday"};}
  if(key==="week"){
    // week starts Monday — a trading week reads better than a Sunday split
    const d=new Date(); const dow=(d.getDay()+6)%7;
    const mon=new Date(); mon.setDate(d.getDate()-dow);
    return {from:iso(mon),to:iso(t),label:"This week"};
  }
  if(key==="last7")     return {from:iso(shift(-6)),to:iso(t),label:"Last 7 days"};
  if(key==="month"){
    const m=new Date(t.getFullYear(),t.getMonth(),1);
    return {from:iso(m),to:iso(t),label:"This month"};
  }
  if(key==="lastmonth"){
    const a=new Date(t.getFullYear(),t.getMonth()-1,1);
    const b=new Date(t.getFullYear(),t.getMonth(),0);
    return {from:iso(a),to:iso(b),label:"Last month"};
  }
  if(key==="custom")    return {from:customFrom||iso(t),to:customTo||iso(t),label:"Custom"};
  return {from:iso(t),to:iso(t),label:"Today"};
}
const RANGE_KEYS=[["today","Today"],["yesterday","Yesterday"],["week","This week"],
  ["last7","Last 7 days"],["month","This month"],["lastmonth","Last month"],
  ["custom","Custom"]];

// Orders inside a range, excluding voids and cancellations — those are not
// sales, and counting them inflates every figure downstream.
function inRange(o,r){
  const d=String(o.date||"");
  return d>=r.from&&d<=r.to&&o.status!=="void"&&o.status!=="cancelled";
}

// Money always renders with thousands separators. Reading P330000.00 off a
// screen is guesswork; P330,000.00 is not.
const peso=(v)=>(Number(v)||0).toLocaleString("en-PH",
  {minimumFractionDigits:2,maximumFractionDigits:2});

const _n=(v)=>{const x=Math.round((Number(v)||0)*1000)/1000;return x.toLocaleString("en-PH");};
// "4,484 pc" or "4,484 pc = 149 box + 14 pc"
function fmtStock(it,base){
  const b=(base!==undefined&&base!==null)?base:(it&&it.stock);
  const sz=packSizeOf(it);
  const txt=_n(b)+" "+baseUnitOf(it);
  if(!sz)return txt;
  const s=baseToPacks(it,b);
  return txt+" = "+_n(s.packs)+" "+packUnitOf(it)+(s.loose?" + "+_n(s.loose)+" "+baseUnitOf(it):"");
}
// short form for tight rows: "149 box + 14 pc"
function fmtPacks(it,base){
  const sz=packSizeOf(it);
  if(!sz)return "";
  const s=baseToPacks(it,(base!==undefined&&base!==null)?base:(it&&it.stock));
  return _n(s.packs)+" "+packUnitOf(it)+(s.loose?" + "+_n(s.loose)+" "+baseUnitOf(it):"");
}

function BOMPage({menuItems,db,user,showT,inventory=[],optGroups=[]}){
  const [mainTab,setMainTab] = useState("products");
  // Products tab state
  const [selItem,setSelItem]     = useState(null);
  const [selVariant,setSelVar]   = useState("default");
  const [ itemBomTab,setItemBomTab] = useState("variants");
  const [boms,setBoms]           = useState({});
  const [editBom,setEditBom]     = useState([]);
  const [saving,setSaving]       = useState(false);
  const [costTab,setCostTab]     = useState("bom");
  // Item Options sub-tab state
  const [selItemOpt,setSelItemOpt]       = useState(null);
  const [editItemOptBom,setEditItemOptBom] = useState([]);
  const [savingItemOpt,setSavingItemOpt] = useState(false);
  // Option Groups tab state
  const [groups,setGroups]       = useState([]);  // [{id,name,choices:[{id,label}]}]
  const [selGroup,setSelGroup]   = useState(null);
  const [selChoice,setSelChoice] = useState(null);
  const [editOptBom,setEditOptBom] = useState([]);
  const [savingOpt,setSavingOpt] = useState(false);
  // New group/choice form
  const [newGrpName,setNewGrpName]   = useState("");
  const [newChoiceLbl,setNewChoiceLbl] = useState("");
  const [newChoicePrice,setNewChoicePrice] = useState("");
  const [showAddGrp,setShowAddGrp]   = useState(false);
  const [showAddChoice,setShowAddChoice] = useState(false);
  const [editingGrp,setEditingGrp]   = useState(null); // group id being renamed
  const [editingChoice,setEditingChoice] = useState(null); // choice id being renamed
  const [editChVal,setEditChVal]         = useState("");   // controlled label
  const [editChPrice,setEditChPrice]     = useState("");   // controlled priceAdd

  const ingredients = inventory;

  // Load BOMs
  useEffect(()=>{
    const unsub=onSnapshot(collection(db,"bom"),snap=>{
      const b={};
      snap.docs.forEach(d=>{b[d.id]={...d.data()};});
      setBoms(b);
    },()=>{});
    return()=>unsub();
  },[]);

  // Load Option Groups from Firebase option_groups collection
  useEffect(()=>{
    const unsub=onSnapshot(collection(db,"option_groups"),snap=>{
      setGroups(snap.docs.map(d=>({...d.data(),id:d.id})));
    },()=>{});
    return()=>unsub();
  },[]);

  const variantList=( item)=>{
    const v=["default"];
    ( item.variants||[]).forEach(vv=>{if(vv.label)v.push(vv.label);});
    return v;
  };
  const getVKey=( item,v)=>(!v||v==="default")? item.id: item.id+"__"+v.replace(/\s+/g,"_");
  const hasBOM=( item,v="default")=>{
    const key=getVKey( item,v);
    return !!(boms[ item.id]&&(boms[ item.id][key]||[]).length>0);
  };
  const getCost=(rows)=>rows.reduce((s,r)=>{
    const ing=ingredients.find(x=>x.id===r.ingId)||{};
    const factor=r.convFactor||1;
    return s+(ing.cost||0)*(r.qty||0)/factor*(1+(r.markup||0)/100);
  },0);

  const openBOM=( item,v="default")=>{
    setSelItem( item); setSelVar(v);
    setItemBomTab("variants"); setSelItemOpt(null);
    const key=getVKey( item,v);
    const rows=(boms[ item.id]&&boms[ item.id][key])||[];
    setEditBom(rows.length?[...rows]:[{ingId:"",ingName:"",unit:"",qty:1,convFactor:1,markup:0}]);
  };

  const saveBOM=async()=>{
    if(!selItem)return;
    setSaving(true);
    try{
      const key=getVKey(selItem,selVariant);
      const rows=editBom.filter(r=>r.ingId||r.ingName);
      await setDoc(doc(db,"bom",selItem.id),
        Object.assign({},boms[selItem.id]||{},{[key]:rows}),{merge:true});
      showT("BOM saved ✓");
    }catch(e){showT("Error saving","err");}
    setSaving(false);
  };

  // selGroup is a snapshot captured on click — it never refreshes when the
  // onSnapshot listener updates `groups`. Reading choices from it means edits
  // are computed against stale data and can silently clobber newer ones.
  // Always resolve against the live list.
  const liveGroup = selGroup ? (groups.find(g=>g.id===selGroup.id)||selGroup) : null;
  const liveChoices = (liveGroup&&liveGroup.choices)||[];

  // Save a renamed / repriced choice
  const saveChoiceEdit=async(ch)=>{
    const label=(editChVal||"").trim();
    if(!label){showT("Enter choice name","warn");return;}
    if(liveChoices.find(c=>c.id!==ch.id&&c.label===label)){
      showT(" There is ganitong choice na","warn");return;
    }
    const price=parseFloat(editChPrice)||0;
    if(label===ch.label&&price===(ch.priceAdd||0)){setEditingChoice(null);return;}
    const newChoices=liveChoices.map(c=>c.id===ch.id?Object.assign({},c,{label:label,priceAdd:price}):c);
    try{
      await updateDoc(doc(db,"option_groups",liveGroup.id),{choices:newChoices});
      setEditingChoice(null);
      showT("Saved ✓");
    }catch(err){
      console.error("Save choice failed:",err);
      showT("Save failed: "+((err&&err.message)||err).toString().slice(0,70),"err");
    }
  };

  // Create new option group
  const createGroup=async()=>{
    const name=newGrpName.trim();
    if(!name){showT("Enter group name","warn");return;}
    if(groups.find(g=>g.name===name)){showT("Group already exists","warn");return;}
    try{
      const id="grp_"+Date.now();
      await setDoc(doc(db,"option_groups",id),{id,name,choices:[],createdBy:user.name,createdAt:serverTimestamp()});
      setNewGrpName(""); setShowAddGrp(false);
      showT(name+" created ✓");
    }catch(e){showT("Error","err");}
  };

  // Add choice to group
  const addChoice=async()=>{
    const label=newChoiceLbl.trim();
    if(!label||!selGroup){showT("Enter choice name","warn");return;}
    if(liveChoices.find(c=>c.label===label)){showT("Choice already exists","warn");return;}
    const price=parseFloat(newChoicePrice)||0;
    const newChoices=[...liveChoices,{id:"ch_"+Date.now(),label,priceAdd:price}];
    try{
      await updateDoc(doc(db,"option_groups",selGroup.id),{choices:newChoices});
      setNewChoiceLbl(""); setNewChoicePrice(""); setShowAddChoice(false);
      showT(label+" added ✓");
    }catch(e){showT("Error","err");}
  };

  // Delete choice
  const deleteChoice=async(ch)=>{
    if(!confirm("Delete choice \""+ch.label+"\"?"))return;
    const newChoices=liveChoices.filter(c=>c.id!==ch.id);
    try{
      await updateDoc(doc(db,"option_groups",selGroup.id),{choices:newChoices});
      if(selChoice&&selChoice.id===ch.id){setSelChoice(null);setEditOptBom([]);}
      showT(ch.label+" deleted");
    }catch(e){showT("Error","err");}
  };

  // Delete group
  const deleteGroup=async(grp)=>{
    if(!confirm("Delete group \""+grp.name+"\" and all its BOMs?"))return;
    try{
      await deleteDoc(doc(db,"option_groups",grp.id));
      // Also delete BOM for this group
      const bomRef=doc(db,"bom","optgrp_"+grp.id);
      await deleteDoc(bomRef).catch(()=>{});
      if(selGroup&&selGroup.id===grp.id){setSelGroup(null);setSelChoice(null);setEditOptBom([]);}
      showT(grp.name+" deleted");
    }catch(e){showT("Error","err");}
  };

  // Save option group BOM
  const saveOptBOM=async()=>{
    if(!selChoice||!selGroup)return;
    setSavingOpt(true);
    try{
      const key="optgrp_"+selGroup.id+"__"+selChoice.id;
      const rows=editOptBom.filter(r=>r.ingId||r.ingName);
      const docId="optgrp_"+selGroup.id;
      await setDoc(doc(db,"bom",docId),
        Object.assign({},boms[docId]||{},{[key]:rows}),{merge:true});
      showT(selChoice.label+" BOM saved ✓");
    }catch(e){showT("Error","err");}
    setSavingOpt(false);
  };

  // BOMEditor sub-component.
  // NOTE: call this as BOMEditor({...}), NOT h(BOMEditor,{...}).
  // It is defined inside the parent, so h() would give React a new element type
  // on every render and remount the inputs (focus loss after each keystroke).

      gridTemplateColumns:"1fr 80px 70px 110px 60px 80px 36px",
      gap:6,marginBottom:6,padding:"0 2px"}},
      ["INGREDIENT","QTY/SERVING","UNIT USED","CONV (1 STK=X)","MARKUP%","DEDUCTS",""].map(h2=>
        h("div",{key:h2,style:{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:1}},h2))

      const ing=ingredients.find(x=>x.id===row.ingId)||{};

      const actualDeduct=(row.qty||0)/factor;
      const cost=(ing.cost||0)*actualDeduct*(1+(row.markup||0)/100);
      const baseU=String(ing.unit||"");
      const usedU=String(row.deductUnit||row.unit||"");
      const pSz=packSizeOf(ing);
      const pU=packUnitOf(ing);

      return h("div",{key:i,style:{marginBottom:6}},

        gridTemplateColumns:"1fr 80px 70px 110px 60px 80px 36px",

            u[i]={...u[i],ingId:e.target.value,ingName:g.name||"",unit:g.unit||"",

          " "+baseU+" lang. Should be 1."),
        h("button",{
          onClick:()=>{const u=[...rows];u[i]={...u[i],convFactor:1};setRows(u);},

      // New group form
      showAddGrp&&h("div",{style:{background:"#E8F5E9",border:"1px solid #A5D6A7",

      // 3-col layout
      h("div",{style:{display:"grid",gridTemplateColumns:"220px 200px 1fr",gap:12,minHeight:500}},

                                  try{
                                    await updateDoc(doc(db,"option_groups",grp.id),{name:newName});

                            h("div",{style:{fontSize:12,color:C.muted}},

                        h("button",{

            h("input",{type:"number",onFocus:e=>e.target.select(),min:0,max:10,

// totalAmount is only written when the DR is issued, so every incoming PO
// showed P0.00 — Main could not see the value of what was being requested.
// The branch's own lines carry the agreed price, so the estimate is available
// from the moment the PO is submitted. Confirmed amount always wins.
function poValue(po){
  const t=Number(po&&po.totalAmount)||0;
  if(t>0)return t;
  return ((po&&po.items)||[]).reduce((s,i)=>
    s+((Number(i.qty)||0)*(Number(i.price)||0)),0);
}
function poIsEstimate(po){ return !(Number(po&&po.totalAmount)>0); }

// What the transfer actually earns the commissary. Uses the DR lines once
// issued (actualQty is what really shipped), otherwise the requested lines.
function poCost(po){
  const src=((po&&po.deliveredItems)||(po&&po.items)||[]);
  return src.reduce((s,i)=>
    s+(((Number(i.actualQty)!=null&&i.actualQty!==undefined)
        ?Number(i.actualQty):Number(i.qty))||0)*(Number(i.cost)||0),0);
}
function poMargin(po){
  const rev=poValue(po), cost=poCost(po);
  return {rev:rev,cost:cost,margin:rev-cost,
          pct:rev>0?((rev-cost)/rev*100):0};
}

// ─── BUILD / UPDATE CHECK ────────────────────
// GitHub Pages caches hard, so a branch can run an old copy for hours.
// Without a visible stamp a bug report cannot be tied to a version.
// The reload button appends ?v=<timestamp> to get past the cache. Once the
// page has loaded that has done its job, and leaving it in the address bar
// means it ends up in bookmarks, shared links and history. Strip it back out
// without navigating again.
(function(){
  try{
    if(location.search && /[?&]v=\d+/.test(location.search)){
      const clean = location.pathname
        + location.search.replace(/([?&])v=\d+&?/,"$1").replace(/[?&]$/,"")
        + location.hash;
      history.replaceState(null, "", clean);
    }
  }catch(e){}
})();

const BUILD = "20260803-033747";

// Re-fetch this file with the cache bypassed and read its BUILD marker.
// The marker travels in the HTML, so no server is involved.
async function checkForUpdate(){
  try{
    const r = await fetch(location.pathname + "?v=" + Date.now(), {cache:"no-store"});
    if(!r.ok) return null;
    const txt = await r.text();
    const m = /BUILD:([0-9-]{15})/.exec(txt);
    if(!m) return null;
    return (m[1] !== BUILD) ? m[1] : null;
  }catch(e){ return null; }
}

// One-time recovery: POs received before the receive path wrote to inventory
// closed as completed with the goods never credited. This reads receivedItems
// off the PO and posts them, guarded by stockPosted so it cannot double up.
async function postReceivedToStock(db,po,byName){
  const res={added:0,adopted:0,skipped:0,errors:[]};
  if(!po||po.stockPosted){res.skipped=1;return res;}
  const invBr=po.branch||"";
  if(!invBr){res.errors.push("no branch on PO");return res;}
  const isMain=(invBr==="ct-main"||invBr==="main");
  const isMainDest=isMain;   // never overwrite Main's own buying price
  const invCol=isMain?"inventory":"inventory_"+invBr;
  const logCol=logColFor(invBr);
  const items=(po.receivedItems||po.deliveredItems||po.items||[]);

  for(const it of items){
    // receivedQty is what actually arrived; fall back through the DR and the
    // original request so an older record still posts something sensible
    const qty=Number(it.receivedQty!=null?it.receivedQty
              :(it.actualQty!=null?it.actualQty:it.qty))||0;
    if(!it.id||qty<=0)continue;
    try{
      const ref=doc(db,invCol,it.id);
      const cur=await getDoc(ref);
      let prev=null;
      if(!cur.exists()){
        let meta={};
        try{
          const m=await getDoc(doc(db,"inventory",it.id));
          if(m.exists())meta=m.data();
        }catch(e0){}
        await setDoc(ref,Object.assign({},meta,{
          id:it.id,
          name:meta.name||it.name||it.id,
          unit:meta.unit||it.unit||"pc",
          cat:meta.cat||"Other",
          packUnit:meta.packUnit||it.packUnit||"",
          packSize:Number(meta.packSize||it.packSize)||0,
          // what THIS branch paid Main, not Main's own cost
          cost:isMainDest?(Number(meta.cost)||0)
            :(Number(it.price)||Number(meta.price)||0),
          price:Number(meta.price)||0,
          minStock:0,   // branch sets its own reorder point, not Main's
          branch:invBr,stock:qty,
          lots:lotsAdd([],qty,Number(it.price)||0,po.poNum||"",Date.now()),
          adoptedFrom:"main",adoptedAt:serverTimestamp(),
          lastRestocked:serverTimestamp()
        }),{merge:true});
        prev=0; res.adopted++;
      }else{
        prev=Number(cur.data().stock)||0;
        const nlots=lotsAdd(cur.data().lots,qty,Number(it.price)||0,
             po.poNum||"",Date.now());
        await updateDoc(ref,Object.assign(
          {stock:increment(qty),lastRestocked:serverTimestamp()}, nlots?{lots:nlots}:{}));
      }
      res.added++;
      await addDoc(collection(db,logCol),{
        itemId:it.id,itemName:it.name||it.id,unit:it.unit||"",
        type:"add",amount:qty,
        prevStock:prev,newStock:Math.round((prev+qty)*1000)/1000,
        desc:"Posted from received "+(po.drNum||po.poNum||"")+" (recovery)",
        source:"TRANSFER",ref:po.poNum||"",
        branch:invBr,by:byName||"recovery",
        date:localDate(),timestamp:serverTimestamp()
      ,at:serverTimestamp()});
    }catch(e){ res.errors.push((it.name||it.id)+": "+String(e&&e.message||e)); }
  }

  if(res.added){
    try{ await updateDoc(doc(db,"advances",po._docId),
           {stockPosted:true,stockPostedAt:serverTimestamp(),
            stockPostedBy:byName||"recovery"}); }catch(e){}
  }
  return res;
}

// 13th month, ported: one twelfth of basic pay earned in the year.


// Resolve one employee's shift for one day. Ported: a date-specific override

function addMonths(iso,n){
  const [y,m,d]=String(iso||"").split("-").map(Number);
  if(!y)return iso;
  const dt=new Date(y,(m-1)+n,d);
  // clamp to end of month: Jan 31 + 1 month must not roll into March
  if(dt.getDate()!==d)dt.setDate(0);
  return localDate(dt);
}
function daysBetween(fromISO,toISO){
  const a=new Date(fromISO+"T00:00:00"), b=new Date(toISO+"T00:00:00");
  if(isNaN(a)||isNaN(b))return 0;
  return Math.round((b-a)/86400000);
}
const TRIAL_DAYS=5;   // deployment + setup window for a brand-new branch

// Order of authority: a paid period always wins; otherwise the setup trial;
// otherwise treat as active. A missing record must never strand a branch that
// has always paid.
function subState(sub){
  const today=localDate();
  if(sub&&sub.paidUntil){
    const left=daysBetween(today,sub.paidUntil);
    return {ok:left>=0,days:left,unknown:false,mode:"paid",until:sub.paidUntil};
  }
  if(sub&&sub.trialUntil){
    const left=daysBetween(today,sub.trialUntil);
    return {ok:left>=0,days:left,unknown:false,mode:"trial",until:sub.trialUntil};
  }
  return {ok:true,days:null,unknown:true,mode:"none"};
}
function addDays(iso,n){
  const d=new Date(String(iso||localDate())+"T00:00:00");
  if(isNaN(d))return iso;
  d.setDate(d.getDate()+n);
  return localDate(d);
}

// ─── DAILY SALES ROLLUP ───────────────────────────────────
// Every report today is computed live from a capped orders subscription
// (limit 300), so history scrolls out of reach within days. One document per
// branch per day keeps years of reporting readable: ~2,900 rows a year for
// eight branches, versus 100k+ raw orders.
// Business day = calendar day, midnight to midnight.

// Pure: same figures as buildZ, but from an explicit day's data.
function buildDailyRollup(dayOrders,dayCash,branch,date,vatMode){
  const bo=dayOrders||[], bc=dayCash||[];
  const voided=bo.filter(o=>o.status==="void"||o.status==="partial-void");
  const live=bo.filter(o=>o.status!=="void"&&o.status!=="cancelled");
  const num=(v)=>Number(v)||0;

  const gross=live.reduce((s2,o)=>s2+num(o.subtotal),0);
  const discounts=live.reduce((s2,o)=>s2+num(o.discAmt),0);
  const net=bo.reduce((s2,o)=>s2+num(o.total),0);
  const voidAmt=voided.reduce((s2,o)=>
    s2+((num(o.originalTotal)||num(o.subtotal))-num(o.total)),0);

  const isVATreg=vatMode!=="nonvat", zeroRated=vatMode==="zerovat";
  const payTotal=(m)=>live.filter(o=>(o.payMethod||"cash")===m)
    .reduce((s2,o)=>s2+num(o.total),0);
  const discBy=(id)=>live.filter(o=>(o.discType&&o.discType.id)===id)
    .reduce((s2,o)=>s2+num(o.discAmt),0);

  // top  items by quantity, for year-on-year product tracking
  const tally={};
  live.forEach(o=>(o. items||[]).forEach(i=>{
    const k=i.name||i.id||"?";
    tally[k]=(tally[k]||0)+num(i.qty);
  }));
  const topItems=Object.keys(tally).map(k=>({name:k,qty:tally[k]}))
    .sort((a,b)=>b.qty-a.qty).slice(0,20);

  const ids=live.map(o=>String(o.id||"")).filter(Boolean).sort();
  const opening=bc.filter(c=>c.type==="in"&&/opening/i.test(c.desc||""))
    .reduce((s2,c)=>s2+num(c.amount),0);
  const cashIn=bc.filter(c=>c.type==="in"&&!/opening/i.test(c.desc||""))
    .reduce((s2,c)=>s2+num(c.amount),0);
  const cashOut=bc.filter(c=>c.type==="out").reduce((s2,c)=>s2+num(c.amount),0);

  return {
    branch:branch,date:date,
    gross:gross,discounts:discounts,net:net,
    voidAmt:voidAmt,voidCount:voided.length,
    txns:live.length,cancelled:bo.filter(o=>o.status==="cancelled").length,
    qtySold:live.reduce((s2,o)=>s2+(o. items||[]).reduce((a,i)=>a+num(i.qty),0),0),
    dineIn:live.filter(o=>o.orderType==="dine-in").length,
    takeout:live.filter(o=>o.orderType==="takeout").length,
    delivery:live.filter(o=>o.orderType==="delivery").length,
    vatableSales:(isVATreg&&!zeroRated)?net/1.12:0,
    vatAmount:(isVATreg&&!zeroRated)?net-(net/1.12):0,
    vatExempt:!isVATreg?net:0,
    zeroSales:zeroRated?net:0,
    discSC:discBy("sc"),discPWD:discBy("pwd"),
    discEmp:discBy("emp"),discOther:discBy("promo")+discBy("custom"),
    scTxns:live.filter(o=>(o.discType&&o.discType.id)==="sc").length,
    pwdTxns:live.filter(o=>(o.discType&&o.discType.id)==="pwd").length,
    cashSales:payTotal("cash"),gcash:payTotal("gcash"),
    foodpanda:payTotal("foodpanda"),grabfood:payTotal("grabfood"),
    opening:opening,cashIn:cashIn,cashOut:cashOut,
    cashOnHand:opening+net+cashIn-cashOut,
    siFrom:ids.length?ids[0]:"",siTo:ids.length?ids[ids.length-1]:"",
    topItems:topItems
  };
}

// Fetch one day and write its rollup. Deterministic doc id + setDoc means
// several tablets closing at once converge on one row instead of duplicating.
async function rollupDay(db,branch,date,vatMode,byName){
  try{
    // Query by date only — a single equality filter needs no composite index.
    // One day across every branch is small; filter to this branch in memory.
    const oSnap=await getDocs(query(collection(db,"orders"),where("date","==",date)));
    const dayOrders=oSnap.docs.map(d=>({...d.data(),_docId:d.id}))
      .filter(o=>o.branch===branch);

    let dayCash=[];
    try{
      const cSnap=await getDocs(query(collection(db,"cash_log"),where("date","==",date)));
      dayCash=cSnap.docs.map(d=>d.data()).filter(c=>c.branch===branch);
    }catch(e){}

    // A day with no orders and no cash movement gets no row. An empty record
    // is indistinguishable from a real zero-sales day and just buries the
    // days that matter.
    if(!dayOrders.length&&!dayCash.length)return null;
    const roll=buildDailyRollup(dayOrders,dayCash,branch,date,vatMode);
    roll.closedBy=byName||"auto";
    roll.closedAt=serverTimestamp();
    roll.year=date.slice(0,4);
    roll.month=date.slice(0,7);
    await setDoc(doc(db,"daily_sales",branch+"_"+date),roll,{merge:true});
    return roll;
  }catch(e){
    console.error("rollupDay failed",branch,date,e);
    return null;
  }
}

// Roll up EVERY branch for one date from a single pair of reads.
// rollupDay() fetches the day per branch; over a 60-day backfill across eight
// branches that is 480 queries. Fetching the day once and splitting it in
// memory is 60 — which matters on the Spark plan's daily read quota.
async function rollupDateAllBranches(db,date,branchIds,vatMode,byName){
  const res={date:date,written:0,traded:0,skipped:0};
  try{
    const oSnap=await getDocs(query(collection(db,"orders"),where("date","==",date)));
    const allOrders=oSnap.docs.map(d=>({...d.data(),_docId:d.id}));
    let allCash=[];
    try{
      const cSnap=await getDocs(query(collection(db,"cash_log"),where("date","==",date)));
      allCash=cSnap.docs.map(d=>d.data());
    }catch(e){}

    for(const b of branchIds){
      const bo=allOrders.filter(o=>o.branch===b);
      const bc=allCash.filter(c=>c.branch===b);
      // a branch with no activity that day gets no row — an empty document
      // would be indistinguishable from a real zero-sales day
      if(!bo.length&&!bc.length){res.skipped++;continue;}
      const roll=buildDailyRollup(bo,bc,b,date,vatMode);
      roll.closedBy=byName||"backfill";
      roll.closedAt=serverTimestamp();
      roll.year=date.slice(0,4);
      roll.month=date.slice(0,7);
      roll.backfilled=true;
      await setDoc(doc(db,"daily_sales",b+"_"+date),roll,{merge:true});
      res.written++;
      if(roll.txns>0)res.traded++;
    }
  }catch(e){ console.error("backfill",date,e); res.error=String(e&&e.message||e); }
  return res;
}

// Inclusive list of ISO dates from `from` to `to`.
function dateRange(fromISO,toISO){
  const out=[]; const a=new Date(fromISO+"T00:00:00"), b=new Date(toISO+"T00:00:00");
  if(isNaN(a)||isNaN(b)||a>b)return out;
  for(let d=new Date(a); d<=b; d.setDate(d.getDate()+1)){
    out.push(localDate(d));
  }
  return out;
}

// Days between two ISO dates, exclusive of `to`.
function daysBefore(toISO,count){
  const out=[]; const d=new Date(toISO+"T00:00:00");
  for(let k=1;k<=count;k++){
    const x=new Date(d); x.setDate(x.getDate()-k);
    out.push(localDate(x));
  }
  return out;
}

// ─── SHARED VOID ROUTINE ──────────────────────────────────
// There were two void paths: the Orders list "Void" button (owner/manager) and
// the request/approve flow. Only the second had restock and cash reversal, and
// the owner role has neither void page in its nav — so the only void an owner
// could reach did nothing but flip a status flag.
// One implementation now, called by both.
async function performVoid(db, args){
  const order   = args.order || {};
  const  items   = args.voidedItems || order. items || [];
  const branch  = args.branch || order.branch || "";
  const byName  = args.byName || "";
  const reason  = args.reason || "";
  const partial = !!args.isPartial;
  const docId   = order._docId || args.docId;   // Firestore id, NOT the OR number
  const out={voidAmt:0,restocked:0,restockFailed:0,missingId:0,orderUpdated:false};

  out.voidAmt =  items.reduce((s,i)=>
    s+(Number(i.lineTotal)||((Number(i.unitPrice)||0)*(i.qty||1))),0);

  // 1. the order itself — status alone leaves the money in every sales total
  if(docId){
    try{
      if(partial){
        await updateDoc(doc(db,"orders",docId),{
          status:"partial-void",
          originalTotal:Number(order.originalTotal)||Number(order.total)||0,
          total:Math.max(0,(Number(order.total)||0)-out.voidAmt),
          voidedItems: items,voidedBy:byName,voidReason:reason,
          voidedAt:serverTimestamp()
        });
      }else{
        await updateDoc(doc(db,"orders",docId),{
          status:"void",
          originalTotal:Number(order.originalTotal)||Number(order.total)||0,
          total:0,
          voidedBy:byName,voidReason:reason,voidedAt:serverTimestamp()
        });
      }
      out.orderUpdated=true;
    }catch(e){console.error("Void: order update failed",e);}
  }

  // 2. put the ingredients back — mirrors the deduction exactly
  try{
    const bomSnap=await getDocs(collection(db,"bom"));
    const bomData={};
    bomSnap.docs.forEach(d=>{bomData[d.id]={...d.data()};});

    // Each branch keeps its own stock, so a void returns goods to that branch
    // only. ct-main is the commissary itself and uses the shared collection.
    const colFor=async(ingId)=>
      (!branch||branch==="ct-main"||branch==="main")
        ? "inventory" : "inventory_"+branch;

    const giveBack=async(rows,mult,label, itemName)=>{
      for(const row of rows||[]){
        if(!row.ingId||!row.qty)continue;
        const amt=((row.qty||0)*(mult||1))/(row.convFactor||1);
        try{
          const col=await colFor(row.ingId);
          const logCol=col.replace(/^inventory/,"inventory_log");
          let prev=null, back=null;
          try{
            const sn=await getDoc(doc(db,col,row.ingId));
            if(sn.exists()){
              prev=Number(sn.data().stock)||0;
              const u=lotsUnitCost(sn.data().lots,Number(sn.data().cost)||0);
              back=lotsAdd(sn.data().lots,amt,u,
                "void:"+(order.id||""),Date.now());
            }
          }catch(e){}
          await updateDoc(doc(db,col,row.ingId),Object.assign(
            {stock:increment(amt),lastUpdated:serverTimestamp()},
            back?{lots:back}:{}));
          out.restocked++;
          await addDoc(collection(db,logCol),{
             itemId:row.ingId, itemName:row.ingName||row.ingId,
            unit:row.unit||"",type:"add",amount:amt,
            prevStock:prev,
            newStock:prev==null?null:Math.round((prev+amt)*1000)/1000,
            convFactor:row.convFactor||1,invCol:col,
            desc:"Restored: "+(Math.round(amt*1000)/1000)+" "+(row.unit||"")
              +" from the void of order "+(order.id||"")+" ("+ itemName+(label?" / "+label:"")+")",
            source:"void",ref:order.id||"",branch:branch,
            reason:"VOID: "+(order.id||"")+" — "+ itemName,
            by:byName,at:serverTimestamp(),timestamp:serverTimestamp()});
        }catch(e){out.restockFailed++;console.warn("Restock failed",row.ingId,e);}
      }
    };

    for(const it of  items){
      if(!it.id&&!(it.optionRefs||[]).length){out.missingId++;continue;}
      if(it.id){
        const v=it.variant||"default";
        const vKey=(!v||v==="default")?it.id:it.id+"__"+String(v).replace(/\s+/g,"_");
        const ib=bomData[it.id]||{};
        await giveBack(ib[vKey]||ib[it.id]||[], it.qty||1,
          v!=="default"?v:"", it.name||it.id);
      }
      for(const ref of (it.optionRefs||[])){
        if(!ref.groupId||!ref.choiceId)continue;
        const d=bomData["optgrp_"+ref.groupId]||{};
        const rows=d["optgrp_"+ref.groupId+"__"+ref.choiceId]||[];
        const mult=ref.free?(ref.qty||1):((ref.qty||1)*(it.qty||1));
        await giveBack(rows, mult, ref.label, it.name||"");
      }
    }
  }catch(e){console.warn("Void restock error",e);}

  // 3. cash leaves the drawer — type "out" so Cash Monitor totals it,
  //    timestamp so the orderBy query does not drop the document
  try{
    const now=new Date();
    await addDoc(collection(db,"cash_log"),{
      // NOT "out": zeroing order.total already removes this sale from `net`,
      // and the drawer is opening + net + cashIn - cashOut. Counting it here
      // too would subtract the same peso twice.
      branch:branch,type:"void_refund",subType:"void_refund",
      amount:out.voidAmt,
      desc:"Void refund — Order #"+(order.id||"")+" (already removed from sales)",
      orderId:order.id||"",reason:"Void: "+reason,by:byName,
      time:now.toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit"}),
      date:localDate(now),
      timestamp:serverTimestamp(),at:serverTimestamp()});
  }catch(e){console.warn("Cash reversal log failed",e);}

  return out;
}

function voidSummary(r){
  return "₱"+peso(r.voidAmt)+" reversed · "+r.restocked+" ingredient/s restocked"
    +(r.restockFailed?" ("+r.restockFailed+" failed)":"")
    +(r.missingId?" ("+r.missingId+" walang BOM link)":"")
    +(!r.orderUpdated?" ⚠️ order not updated":"");
}

// ─── VOID REQUEST (Cashier submits, Manager approves) ─────
function VoidRequestPage({user,branchId,curBranch,db,orders,showT,isManager=false}){
  const [voidRequests,setVoidReqs] = useState([]);
  const [selOrder,setSelOrder]     = useState(null);
  const [selItems,setSelItems]     = useState({}); // { itemIdx: true/false}
  const [reason,setReason]         = useState("");
  const [submitting,setSubmitting] = useState(false);
  const [tab,setTab]               = useState(isManager?"pending":"new");

  useEffect(()=>{
    // where + orderBy on different fields needs a Firestore composite index.
    // Without it the query fails outright, and the old empty error handler
    // swallowed that — the bell fired but this list stayed blank forever.
    // A single equality filter needs no index; sort in memory instead.
    const q = query(
      collection(db,"void_requests"),
      where("branch","==",branchId),
      limit(100)
    );
    const unsub = onSnapshot(q,snap=>{
      const rows=snap.docs.map(d=>({...d.data(),_docId:d.id}));
      rows.sort((a,b)=>{
        const ta=(a.timestamp&&a.timestamp.seconds)||0;
        const tb=(b.timestamp&&b.timestamp.seconds)||0;
        if(tb!==ta)return tb-ta;
        return String(b.date||"").localeCompare(String(a.date||""));
      });
      setVoidReqs(rows);
    },(err)=>{
      console.error("void_requests query failed:",err);
      showT("Could not load void requests: "+String(err&&err.message||err).slice(0,60),"err");
    });
    return()=>unsub();
  },[branchId]);

  const submitVoid = async()=>{
    if(!selOrder){showT("Select an order to void","warn");return;}
    if(!reason.trim()){showT("Enter reason for void","warn");return;}
    const voidedItems = (selOrder. items||[]).filter((_,i)=>selItems[i]!==false);
    if(!voidedItems.length){showT("Select at least 1  item to void","warn");return;}
    const already=(voidRequests||[]).find(r=>
      String(r.orderId)===String(selOrder.id)&&r.status==="pending");
    if(already){
      showT("A void request for "+selOrder.id+" is already waiting for approval","warn");
      return;
    }
    if(selOrder.status==="void"){
      showT(selOrder.id+" is already voided","warn");
      return;
    }
    const isPartial = voidedItems.length < (selOrder. items||[]).length;
    // order  items store lineTotal/unitPrice — there is no `price` field,
    // so the old formula always produced 0.
    const voidAmt = voidedItems.reduce((s,i)=>
      s+(Number(i.lineTotal)||((Number(i.unitPrice)||0)*(i.qty||1))),0);
    setSubmitting(true);
    try{
      await addDoc(collection(db,"void_requests"),{
        branch:branchId,
        branchName:curBranch.full,
        orderId:selOrder.id,
        orderTotal:selOrder.total,
        voidAmount:voidAmt,
        orderItems:selOrder. items,
        voidedItems,
        isPartial,
        requestedBy:user.name,
        reason,
        status:"pending",
        timestamp:serverTimestamp(),
        date:localDate()
      });
      // the bell existed; this path never wrote to it, so a pending request
      // sat in Firestore with nothing telling the manager
      await notify(db,{to:branchId,type:"void",
        title:"Void request — "+selOrder.id,
        message:(isPartial?"Partial":"Full")+" void · ₱"+peso(voidAmt)
          +" · by "+user.name+" · "+reason,
        page:"void_requests",ref:String(selOrder.id||""),by:user.name});
      showT((isPartial?"Partial":"Full")+" void request submitted ✓");
      setSelOrder(null);setSelItems({});setReason("");setTab("history");
    }catch(e){showT("Error submitting","err");}
    setSubmitting(false);
  };

  // When order selected, default all  items to voided
  useEffect(()=>{
    if(selOrder){
      const all={};
      (selOrder. items||[]).forEach((_,i)=>{ all[i]=true; });
      setSelItems(all);
    }
  },[selOrder?.id]);

  const voidedItems = selOrder?(selOrder. items||[]).filter((_,i)=>selItems[i]!==false):[];
  const voidAmt = voidedItems.reduce((s,i)=>
    s+(Number(i.lineTotal)||((Number(i.unitPrice)||0)*(i.qty||1))),0);

  const approveVoid = async(req)=>{
    try{
      // Re-check the order itself: a second request for the same order, or a
      // double tap, would otherwise restock and reverse the cash twice.
      const tgt=(orders||[]).find(o=>String(o.id)===String(req.orderId));
      if(tgt&&(tgt.status==="void"||tgt.status==="partial-void")){
        await updateDoc(doc(db,"void_requests",req._docId),{
          status:"rejected",rejectedBy:"system",
          rejectReason:"Order was already voided",
          rejectedAt:serverTimestamp()
        });
        showT(req.orderId+" was already voided — request closed","warn");
        return;
      }
      await notify(db,{to:req.branch||branchId,type:"void",
        title:"Void approved — "+req.orderId,
        message:"₱"+peso(req.voidAmount)+" reversed by "+user.name,
        page:"void_request",ref:String(req.orderId||""),by:user.name});
      await updateDoc(doc(db,"void_requests",req._docId),{
        status:"approved",approvedBy:user.name,approvedAt:serverTimestamp()
      });
      // The request stores the human OR number; the order document has a
      // Firestore id. Resolve it or the order update silently targets nothing.
      const ord=orders.find(o=>o.id===req.orderId)||{id:req.orderId,branch:req.branch};
      const r=await performVoid(db,{
        order:ord,
        docId:ord._docId,
        voidedItems:req.voidedItems||req.orderItems||[],
        isPartial:!!req.isPartial,
        reason:req.reason||"",
        byName:user.name,
        branch:req.branch||ord.branch
      });
      showT((req.isPartial?"Partial void":"Order #"+req.orderId+" voided")
        +" · "+voidSummary(r),
        (r.restockFailed||r.missingId||!r.orderUpdated)?"warn":"ok");
    }catch(e){showT("Error approving void","err");console.error(e);}
  };

  const rejectVoid = async(req)=>{
    await notify(db,{to:req.branch||branchId,type:"void",
      title:"Void rejected — "+req.orderId,
      message:"Rejected by "+user.name,
      page:"void_request",ref:String(req.orderId||""),by:user.name});
    await updateDoc(doc(db,"void_requests",req._docId),{
      status:"rejected",
      rejectedBy:user.name,
      rejectedAt:serverTimestamp()
    });
    showT("Void request rejected");
  };

  // Today's non-voided orders for this branch
  const today = localDate();
  const todayOrders = orders.filter(o=>
    o.branch===branchId &&
    o.status!=="void" && o.status!=="cancelled" &&
    (o.timestamp?.toDate?.()?.toISOString()||"").slice(0,10)===today
  );
  const pending = voidRequests.filter(r=>r.status==="pending");

  return h("div",null,
    h(SectionHeader,{title:"🚫 "+(isManager?"Void Requests — "+curBranch.name:"Request Void Transaction")}),

    // Pending alert for manager
    isManager&&pending.length>0&&h("div",{style:{background:"#FFEBEE",border:"1px solid #FFCDD2",
      borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:13,
      color:C.danger,fontWeight:700}},
      "⚠️ "+pending.length+" void request"+(pending.length>1?"s":"")+" pending your approval!"
    ),

    // Tabs
    h("div",{style:{display:"flex",gap:0,borderBottom:"2px solid "+C.border,marginBottom:14}},
      (isManager
        ?[["pending","⏳ Pending ("+pending.length+")"],["history","📋 History"]]
        :[["new","🚫 New Request"],["history","📋 My Requests"]]
      ).map(([t,l])=>h("button",{key:t,onClick:()=>setTab(t),
        style:{padding:"9px 18px",border:"none",background:"transparent",
          color:tab===t?C.danger:C.muted,fontWeight:tab===t?800:400,
          fontSize:14,cursor:"pointer",
          borderBottom:`3px solid ${tab===t?C.danger:"transparent"}`,marginBottom:-2}},l))
    ),

    // NEW VOID REQUEST (cashier)
    !isManager&&tab==="new"&&h("div",null,
      h("div",{style:{background:"#FFEBEE",border:"1px solid #FFCDD2",borderRadius:10,
        padding:"10px 14px",marginBottom:14,fontSize:13,color:"#C62828"}},
        "⚠️ Void requests need manager approval before the transaction is cancelled."
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
        // Left: select order
        h("div",null,
          h("div",{style:{fontWeight:700,fontSize:14,marginBottom:8,color:C.danger}},"Select Order to Void"),
          todayOrders.length===0
            ?h("div",{style:{padding:"20px",textAlign:"center",color:C.muted,
                background:"#fff",borderRadius:10,border:"1px solid "+C.border,fontSize:13}},
              "No orders today yet")
            :h("div",{style:{display:"grid",gap:5,maxHeight:380,overflowY:"auto"}},
              todayOrders.map(o=>h("div",{key:o.id,
                style:{padding:"10px 13px",borderRadius:9,
                  border:`2px solid ${selOrder?.id===o.id?C.danger:C.border}`,
                  background:selOrder?.id===o.id?"#FFEBEE":"#fff"}},

                // Order header - click to select/expand
                h("div",{
                  onClick:()=>{
                    if(selOrder?.id===o.id){
                      setSelOrder(null);
                      setSelItems({});
                    } else {
                      setSelOrder(o);
                      // Auto-check all  items
                      const all={};
                      (o. items||[]).forEach((_,i)=>{ all[i]=true; });
                      setSelItems(all);
                    }
                  },
                  style:{display:"flex",justifyContent:"space-between",
                    alignItems:"center",marginBottom:selOrder?.id===o.id?8:0,cursor:"pointer"}},
                  h("span",{style:{fontSize:13,fontWeight:800,color:C.danger}},"#"+o.id),
                  h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
                    h("span",{style:{fontSize:14,fontWeight:900,color:C.primary}},

                    h("span",{style:{

                // Item checkboxes - only show when selected

                "⚡ PARTIAL VOID — "+req.voidedItems?.length+"/"+req.orderItems?.length+"  items · ₱"+peso(req.voidAmount)
              ),
              h("div",{style:{fontSize:13,color:C.muted,marginBottom:6}},
                "Void  items: "+(req.voidedItems||req.orderItems||[]).map(i=>i.qty+"x "+i.name).join(", ")),
              req.isPartial&&h("div",{style:{fontSize:12,color:C.muted,marginBottom:6}},
                "Kept  items: "+(req.orderItems||[]).filter(i=>!(req.voidedItems||[]).find(v=>v.name===i.name)).map(i=>i.qty+"x "+i.name).join(", ")||"none"),
              h("div",{style:{display:"flex",gap:8}},
                h("button",{onClick:()=>approveVoid(req),
                  style:{flex:1,padding:"10px",background:C.success,border:"none",
                    borderRadius:8,color:"#fff",fontWeight:700,fontSize:14,cursor:"pointer"}},
                  "✓ Approve Void"),
                h("button",{onClick:()=>rejectVoid(req),
                  style:{flex:1,padding:"10px",background:"#fff",
                    border:"1px solid "+C.danger,borderRadius:8,
                    color:C.danger,fontWeight:700,fontSize:14,cursor:"pointer"}},
                  "✗ Reject")
              )
            )
          ))
        )
    ),

    // HISTORY
    tab==="history"&&h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
      voidRequests.length===0
        ?h("div",{style:{textAlign:"center",padding:"30px",color:C.muted,fontSize:13}},"No void requests yet")
        :voidRequests.map(req=>h("div",{key:req._docId,
          style:{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",
            borderBottom:"1px solid #f5f5f5"}},
          h("div",{style:{width:36,height:36,borderRadius:9,flexShrink:0,
            background:{pending:"#FFF8E1",approved:"#FFEBEE",rejected:"#f5f5f5"}[req.status]||"#fff",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}},
            {pending:"⏳",approved:"🚫",rejected:"✅"}[req.status]),
          h("div",{style:{flex:1}},
            h("div",{style:{fontSize:13,fontWeight:700}},"#"+req.orderId+" · "+req.requestedBy),
            h("div",{style:{fontSize:12,color:C.muted}},req.reason+" · "+req.date)
          ),
          h("div",{style:{fontSize:14,fontWeight:800,color:C.primary}},"₱"+peso(req.orderTotal)),
          h(Badge,{label:req.status.toUpperCase(),
            color:{pending:C.warning,approved:C.danger,rejected:C.success}[req.status]||C.muted})
        ))
    )
  );
}

// ─── SALES ANALYTICS + EXPORT ────────────────────────────
function AnalyticsPage({orders,branchId,curBranch,user,db,showT,advances=[],inventory=[]}){
  const [tab,setTab]       = useState("general");
  const [period,setPeriod] = useState("today");
  const [dateFrom,setFrom] = useState(localDate());
  const [dateTo,setTo]     = useState(localDate());

  const today = localDate();
  const getWeekStart=()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());return localDate(d);};
  const getMonthStart=()=>localDate().slice(0,8)+"01";

  const inPeriod=(d)=>{
    if(!d)return false;
    if(period==="today")return d===today;
    if(period==="week")return d>=getWeekStart()&&d<=today;
    if(period==="month")return d>=getMonthStart()&&d<=today;
    if(period==="custom")return d>=dateFrom&&d<=dateTo;
    return true;
  };

  const filtOrders = orders.filter(o=>{
    if(o.status==="voided"||o.status==="void"||o.status==="cancelled")return false;
    if(o.branch!==branchId)return false;
    return inPeriod(o.date||"");
  });

  // Saved daily rollups for this branch — the only source that reaches
  // further back than the live subscription's 300-order window.
  const [rollups,setRollups]=useState([]);
  useEffect(()=>{
    let alive=true;
    (async()=>{
      try{
        const snap=await getDocs(query(collection(db,"daily_sales"),
          where("branch","==",branchId),limit(400)));
        if(alive)setRollups(snap.docs.map(d=>d.data()));
      }catch(e){ if(alive)setRollups([]); }
    })();
    return()=>{alive=false;};
  },[branchId]);

  const periodRolls=rollups.filter(r=>inPeriod(r.date)&&r.date!==today);
  // Days already rolled up come from the saved record; every other day in the
  // period still comes from live orders. Using rollups as an either/or meant a
  // day with sales but no rollup vanished from the totals entirely.
  const rollDates=new Set(periodRolls.map(r=>r.date));
  const liveRest=filtOrders.filter(o=>!rollDates.has(o.date||""));
  const todayOrders=orders.filter(o=>(o.date||"")===today
    &&o.branch===branchId
    &&o.status!=="void"&&o.status!=="voided"&&o.status!=="cancelled");
  const useRollups=period!=="today"&&periodRolls.length>0;

  const liveGross=(list)=>list.reduce((s2,o)=>s2+(o.subtotal||0),0);
  const liveDisc =(list)=>list.reduce((s2,o)=>s2+(o.discAmt||0),0);
  const rollSum=(k)=>periodRolls.reduce((s2,r)=>s2+(Number(r[k])||0),0);

  const gross   = useRollups
    ? rollSum("gross")+liveGross(liveRest)
    : liveGross(filtOrders);
  const discAmt = useRollups
    ? rollSum("discounts")+liveDisc(liveRest)
    : liveDisc(filtOrders);
  const netSales= gross-discAmt;
  const vatable = netSales/1.12;
  const vat     = netSales-vatable;
  const txnCount= useRollups
    ? rollSum("txns")+liveRest.length
    : filtOrders.length;
  const avgTxn  = txnCount>0?gross/txnCount:0;
  const daysCovered=useRollups?(periodRolls.length+(todayOrders.length?1:0)):0;

  // Item breakdown
  const  itemMap={};
  const addItem=(name,cat,qty,rev)=>{
    if(!name)return;
    if(! itemMap[name]) itemMap[name]={name:name,cat:cat||"",qty:0,rev:0};
     itemMap[name].qty+=qty||0;
     itemMap[name].rev+=rev||0;
  };
  if(useRollups){
    // rollups keep the top 20 per day; revenue per  item is not stored, so
    // quantities are exact and revenue is only shown for the live day
    periodRolls.forEach(r=>(r.topItems||[]).forEach(t=>addItem(t.name,"",t.qty,0)));
    liveRest.forEach(o=>(o. items||[]).forEach(i=>
      addItem(i.name,i.cat||i.category,i.qty||1,i.lineTotal||0)));
  }else{
    filtOrders.forEach(o=>(o. items||[]).forEach(i=>
      addItem(i.name,i.cat||i.category,i.qty||1,i.lineTotal||0)));
  }
  const  itemList=Object.values( itemMap).sort((a,b)=>b.rev-a.rev);

  // Category breakdown
  const catMap={};
   itemList.forEach(i=>{
    const c=i.cat||"Other";
    if(!catMap[c])catMap[c]={cat:c,qty:0,rev:0};
    catMap[c].qty+=i.qty; catMap[c].rev+=i.rev;
  });
  const catList=Object.values(catMap).sort((a,b)=>b.rev-a.rev);

  // Payment breakdown
  const payMap={};
  filtOrders.forEach(o=>{
    const p=o.payMethod||"cash";
    if(!payMap[p])payMap[p]={method:p,count:0,total:0};
    payMap[p].count++; payMap[p].total+=(Number(o.total)||0);
  });
  const payList=Object.values(payMap).sort((a,b)=>b.total-a.total);

  // Branch breakdown (owner)
  // deliberately NOT branch-filtered: this tab exists to compare branches
  const branchMap={};
  orders.filter(o=>o.status!=="voided"&&o.status!=="void"&&o.status!=="cancelled"
    &&inPeriod(o.date||"")).forEach(o=>{
    const b=o.branch||"unknown";
    if(!branchMap[b])branchMap[b]={branch:b,count:0,total:0};
    branchMap[b].count++; branchMap[b].total+=(o.subtotal||0);

  const branchList=Object.values(branchMap).sort((a,b)=>b.total-a.total);

  // PO/Purchasing breakdown
  const _poDate=(a)=>a.date||a.paidDate||a.createdDate||"";

    h("div",{style:{height:"100%",width:Math.min(100,pct)+"%",background:col||C.primary,borderRadius:2}}));

  const exportCSV=()=>{

    ]));
        const csv=rows.map(function(r){return r.map(function(v){var s=String(v||'');return '"'+s.split('"').join('""')+'"';}).join(',');}).join('\n');
    const a=document.createElement("a");

    tab===" item"&&h("div",null,

function VoidBadge({branchId,db,setPage,visible=true}){
  const [count,setCount] = useState(0);
  useEffect(()=>{
    if(!branchId)return;
    const q = query(collection(db,"void_requests"),
      where("branch","==",branchId),where("status","==","pending"));
    const unsub = onSnapshot(q,snap=>setCount(snap.size),()=>{});
    return()=>unsub();
  },[branchId]);
  // Always render - use display:none to avoid removeChild
  return h("button",{onClick:()=>setPage("void_requests"),
    style:{display:visible&&count>0?"flex":"none",
      padding:"4px 10px",background:"#FFEBEE",border:"1px solid #FFCDD2",
      borderRadius:20,fontSize:12,color:"#C62828",fontWeight:700,cursor:"pointer"}},
    "🚫 "+count+" void pending");
}

function StockEditModal({ item,db,user,branchId,showT,onClose,boms=[]}){
  if(! item)return null;
  var isOwner=user.role==="owner"||user.role==="commissary";
  var invCol=isOwner?"inventory":"inventory_"+branchId;
  var logCol=logColFor(isOwner?"main":branchId);

  var DEFAULT_CATS=["Frozen","Produce","Protein","Sauce","Dry Goods","Packaging","Beverage","Other"];
  var UNITS=["pc","kg","g","L","ml","pack","box","tray","sachet","EA","roll"];

  var [tab,setTab]=useState("stock"); // stock | details
  var [saving,setSaving]=useState(false);

  // Stock adjustment state
  var [mode,setMode]=useState("adjust");
  var [display,setDisplay]=useState("");
  var [reason,setReason]=useState("");

  // Details edit state
  var [details,setDetails]=useState({
    name: item.name||"",
    unit: item.unit||"pc",
    cat: item.cat||"Other",
    price: item.price||0,
    cost: item.cost||0,
    minStock: item.minStock||0,
    packUnit: item.packUnit||"",
    packSize: item.packSize||"",
  });

  var current=Math.round((Number( item.stock)||0)*1000)/1000;
  var packSz=packSizeOf( item);
  // When an  item has a pack size, physical counting is far easier in packs:
  // enter "149" packs + "14" loose instead of computing 4,484 by hand.
  var [byPack,setByPack]=useState(false);
  var [looseVal,setLooseVal]=useState("");
  var rawVal=parseFloat(display)||0;
  var isNeg=display.startsWith("-");
  var numVal=(packSz&&byPack)
    ? packsToBase( item,Math.abs(rawVal),parseFloat(looseVal)||0)
    : Math.abs(rawVal);
  var preview=mode==="adjust"
    ? Math.max(0,current+(isNeg?-numVal:numVal))
    : Math.max(0,numVal);

  // Check if  item is used in any BOM
  var usedInBOM=boms.some(function(bomDoc){
    if(!bomDoc)return false;
    var bomData=typeof bomDoc==="object"?bomDoc:{};
    return Object.values(bomData).some(function(rows){
      return Array.isArray(rows)&&rows.some(function(r){return r.ingId=== item.id||r.ingName=== item.name;});
    });
  });

  var press=function(key){
    if(key==="C"){setDisplay("");return;}
    if(key==="⌫"){setDisplay(function(p){return p.slice(0,-1)||"";});return;}
    if(key==="-"){
      if(mode==="adjust")setDisplay(function(p){return p.startsWith("-")?p.slice(1):"-"+p;});
      return;
    }
    if(key==="."){setDisplay(function(p){return p.includes(".")?p:(p||"0")+".";});return;}
    setDisplay(function(p){
      if(p==="-")return "-"+key;
      if(p==="0")return key;
      return p+key;
    });
  };

  // The combined log mixes every item together, so reading one item's story
  // means scrolling past everyone else's. Load just this item's entries.
  var [hist,setHist]=useState([]);
  var [histLoading,setHistLoading]=useState(false);
  useEffect(function(){
    if(tab!=="history"||!item||!item.id)return;
    var alive=true;
    setHistLoading(true);
    (async function(){
      try{
        var snap=await getDocs(query(collection(db,logCol),
          where("itemId","==",item.id),limit(100)));
        var rows=snap.docs.map(function(d){return Object.assign({},d.data(),{_id:d.id});});
        var t=function(r){return (r.at&&r.at.seconds)||(r.timestamp&&r.timestamp.seconds)||0;};
        rows.sort(function(a,b){
          var d=t(b)-t(a);
          if(d)return d;
          return String(b.date||"").localeCompare(String(a.date||""));
        });
        if(alive)setHist(rows);
      }catch(e){
        console.error("item history:",e);
        if(alive)setHist([]);
      }
      if(alive)setHistLoading(false);
    })();
    return function(){alive=false;};
  },[tab,item&&item.id]);

  var saveStock=async function(){
    if(!display){showT("Enter amount","warn");return;}
    if(!reason){showT("Select reason","warn");return;}
    setSaving(true);
    try{
      let _nl=null;
      try{
        const _cs=await getDoc(doc(db,invCol, item.id));
        const _cur=_cs.exists()?(_cs.data().lots):null;
        const _unit=lotsUnitCost(_cur,Number( item.cost)||0);
        if(mode==="set"){
          // a physical count is the new truth — one lot, at what the stock
          // it replaces was worth per unit
          _nl=lotsReset(preview,_unit,"count:"+reason,Date.now());
        }else if(preview>current){
          _nl=lotsAdd(_cur,preview-current,_unit,reason,Date.now());
        }else if(preview<current){
          _nl=lotsConsume(_cur,current-preview).lots;
        }
      }catch(e){}
      await updateDoc(doc(db,invCol, item.id),Object.assign({
        stock:preview,lastAdjusted:serverTimestamp(),
        adjustedBy:user.name,adjustReason:reason,
        adjustType:mode,prevStock:current
      }, _nl?{lots:_nl}:{}));
      await addDoc(collection(db,logCol),{
         itemId: item.id, itemName: item.name,unit: item.unit||"",
        type:mode==="set"?"set":isNeg?"deduct":"add",
        amount:mode==="adjust"?(isNeg?-numVal:numVal):numVal,
        prevStock:current,newStock:preview,
        reason:reason,by:user.name,at:serverTimestamp()
      });
      showT("Stock updated: "+ item.name+" → "+String(preview)+" "+( item.unit||"")+" ✓");
      onClose();
    }catch(e){showT("Error saving","err");}
    setSaving(false);
  };

      if(details.name.trim()!== item.name&&isOwner){
        try{
          const bomSnap=await getDocs(collection(db,"bom"));
          let updated=0;
          for(const bomDoc of bomSnap.docs){
            const data=bomDoc.data();
            let changed=false;
            const newData={};
            for(const [key,rows] of Object.entries(data)){
              if(!Array.isArray(rows)){newData[key]=rows;continue;}
              const newRows=rows.map(function(r){
                if(r.ingId=== item.id||r.ingName=== item.name){
                  changed=true;
                  return {...r,ingName:details.name};
                }
                return r;
              });
              newData[key]=newRows;
            }
            if(changed){
              await setDoc(doc(db,"bom",bomDoc.id),newData);
              updated++;
            }
          }
          if(updated>0)showT("✅ Updated "+updated+" BOM recipe(s) with new name","ok");

function ReceiveItemsModal({po,db,user,showT,branchId,onClose}){
  if(!po)return null;
  const drItems = po.deliveredItems||po. items||[];
  const [received,setReceived] = useState(()=>{
    const init={};
    drItems.forEach(i=>{init[i.id]=(i.actualQty!=null?i.actualQty:(i.qty||0));});
    return init;
  });
  const [remarks,setRemarks] = useState({});
  const [saving,setSaving] = useState(false);

  const discItems = drItems.filter(i=>{
    const dr=(i.actualQty!=null?i.actualQty:(i.qty||0));
    const rc=(received[i.id]!=null?received[i.id]:dr);
    return rc!==dr;
  });
  const hasDisc = discItems.length>0;

  const confirmReceipt = async()=>{
    setSaving(true);
    try{
      const finalItems = drItems.map(i=>({
        ...i,
        receivedQty:(received[i.id]!=null?received[i.id]:(i.actualQty!=null?i.actualQty:(i.qty||0))),
        remark:remarks[i.id]||""
      }));
      // This modal only ever updated the PO status. The inventory logic lives
      // in DRCheckForm, whose page is in nobody's nav — so goods were received,
      // the PO closed, and the branch's stock never moved.
      // Credit po.branch, not the signed-in branch: whoever confirms, the
      // goods belong to the branch that ordered them.
      const invBr=po.branch||branchId;
      const invCol=(invBr==="ct-main"||invBr==="main")?"inventory":"inventory_"+invBr;
      const isMainDest=(invBr==="ct-main"||invBr==="main");
      let adopted=0, added=0;

      // A reported shortage is a claim, not a settled fact. Nothing enters
      // stock until Main approves it — otherwise the branch's inventory shows
      // goods that are still in dispute, and correcting it afterwards means
      // unpicking a movement that already happened.
      if(!hasDisc){
        for(const it of finalItems){
          const qty=Number(it.receivedQty)||0;
          if(!it.id||qty<=0)continue;
          try{
            const ref=doc(db,invCol,it.id);
            const cur=await getDoc(ref);
            let prev=null;
            if(!cur.exists()){
              // first delivery of this item to this branch — adopt it from Main
              let meta={};
              try{
                const m=await getDoc(doc(db,"inventory",it.id));
                if(m.exists())meta=m.data();
              }catch(e0){}
              await setDoc(ref,Object.assign({},meta,{
                id:it.id,
                name:meta.name||it.name||it.id,
                unit:meta.unit||it.unit||"pc",
                cat:meta.cat||"Other",
                packUnit:meta.packUnit||it.packUnit||"",
                packSize:Number(meta.packSize||it.packSize)||0,
                // what THIS branch paid Main, not Main's own cost
                cost:isMainDest?(Number(meta.cost)||0)
            :(Number(it.price)||Number(meta.price)||0),
                price:Number(meta.price)||0,
                minStock:0,   // branch sets its own reorder point, not Main's
                branch:invBr,stock:qty,
                lots:lotsAdd([],qty,Number(it.price)||0,po.poNum||"",Date.now()),
                adoptedFrom:"main",adoptedAt:serverTimestamp(),
                lastRestocked:serverTimestamp()
              }),{merge:true});
              prev=0; adopted++;
            }else{
              prev=Number(cur.data().stock)||0;
              const nlots=lotsAdd(cur.data().lots,qty,Number(it.price)||0,
                   po.poNum||"",Date.now());
              await updateDoc(ref,Object.assign(
                {stock:increment(qty),lastRestocked:serverTimestamp()}, nlots?{lots:nlots}:{}));
            }
            added++;
            await addDoc(collection(db,
              logColFor(invBr)),{
              itemId:it.id,itemName:it.name||it.id,unit:it.unit||"",
              type:"add",amount:qty,
              prevStock:prev,newStock:Math.round((prev+qty)*1000)/1000,
              desc:"Received from Main: "+qty+" "+(it.unit||"")
                +" · "+(po.drNum||po.poNum||""),
              source:"TRANSFER",ref:po.poNum||"",
              branch:invBr,by:user.name,
              date:localDate(),timestamp:serverTimestamp()
            });
          }catch(e2){console.error("receive into inventory failed",it.id,e2);}
        }
      }

      if(hasDisc){
        await updateDoc(doc(db,"advances",po._docId),{
          status:"discrepancy",
          stockPosted:false,          // held until Main approves the shortage
          deliveryStatus:"Short",   // arrived, but not in full
          receivedItems:finalItems,
          receivedBy:user.name,receivedAt:serverTimestamp(),
          discrepancyItems:discItems.map(i=>({
            ...i,drQty:(i.actualQty!=null?i.actualQty:(i.qty||0)),
            receivedQty:(received[i.id]||0),
            diff:(received[i.id]||0)-(i.actualQty!=null?i.actualQty:(i.qty||0)),
            remark:remarks[i.id]||""
          })),discrepancyStatus:"pending_approval"
        });
        showT("Shortage reported — nothing enters stock until Main approves","warn");
      } else {
        await updateDoc(doc(db,"advances",po._docId),{
          status:"completed",
          stockPosted:true,
          deliveryStatus:"Delivered",
          receivedItems:finalItems,
          receivedBy:user.name,receivedAt:serverTimestamp()
        });
        showT("Items received — PO Completed · "+added+" item/s into stock"
          +(adopted?" ("+adopted+" new)":""));
      }
      onClose();
    }catch(e){
      console.error("confirmReceipt failed:",e);
      showT("Receive failed: "+String(e&&e.message||e).slice(0,60),"err");
      return;
    }
    setSaving(false);
  };

  return h("div",{style:{background:"#fff",width:640,maxHeight:"90vh",
    borderRadius:16,display:"flex",flexDirection:"column",overflow:"hidden",
    boxShadow:"0 20px 60px rgba(0,0,0,.4)"}},
    h("div",{style:{background:"linear-gradient(135deg,"+C.primary+","+C.dark+")",
      padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
      h("div",null,
        h("div",{style:{color:"rgba(255,255,255,.6)",fontSize:12,fontWeight:700,letterSpacing:2}},"RECEIVE ITEMS"),
        h("div",{style:{color:"#fff",fontSize:15,fontWeight:900}},po.drNum||po.poNum),
        h("div",{style:{color:"rgba(255,255,255,.75)",fontSize:12}},"DR Date: "+(po.deliveryDate||po.date))
      ),
      h("button",{onClick:onClose,style:{background:"rgba(255,255,255,.15)",border:"none",
        color:"#fff",width:28,height:28,borderRadius:8,fontSize:16,cursor:"pointer"}},"x")
    ),
    hasDisc&&h("div",{style:{padding:"8px 20px",background:"#FFF3E0",
      borderBottom:"1px solid #FFE0B2",fontSize:13,color:"rgba(255,255,255,.85)",fontWeight:700}},
      String(discItems.length)+"  item(s) with discrepancy — needs Main approval"),
    h("div",{style:{flex:1,overflowY:"auto"}},
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 80px 90px 60px 1fr",
        padding:"7px 20px",background:"#fafafa",borderBottom:"1px solid #eee",position:"sticky",top:0}},
        ["ITEM","DR QTY","RECEIVED","DIFF","REMARKS"].map(function(lbl){
          return h("div",{key:lbl,style:{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:1}},lbl);
        })
      ),
      drItems.map(function(i){
        const drQty=(i.actualQty!=null?i.actualQty:(i.qty||0));
        const rcvQty=(received[i.id]!=null?received[i.id]:drQty);
        const diff=rcvQty-drQty;
        return h("div",{key:i.id,
          style:{display:"grid",gridTemplateColumns:"1fr 80px 90px 60px 1fr",
            padding:"8px 20px",borderBottom:"1px solid #f5f5f5",alignItems:"center",
            background:diff!==0?"#FFF8E1":"#fff"}},
          h("div",null,
            h("div",{style:{fontSize:13,fontWeight:700}},i.name),
            h("div",{style:{fontSize:12,color:"rgba(255,255,255,.75)"}},i.unit||"")
          ),
          h("div",{style:{fontSize:13,color:C.muted}},String(drQty)+" "+(i.unit||"")),
          h("div",{style:{display:"flex",alignItems:"center",gap:3}},
            h("button",{onClick:function(){setReceived(function(p){var r={};Object.assign(r,p);r[i.id]=Math.max(0,(p[i.id]!=null?p[i.id]:drQty)-1);return r;});},
              style:{width:20,height:20,borderRadius:4,border:"1px solid #ddd",background:"#fff",cursor:"pointer",fontSize:14}},"-"),
            h("input",{type:"number",onFocus:e=>e.target.select(),min:0,
              value:(received[i.id]!=null?received[i.id]:drQty),
              onChange:function(e){var v=parseFloat(e.target.value)||0;setReceived(function(p){var r={};Object.assign(r,p);r[i.id]=v;return r;});},
              style:{width:36,textAlign:"center",padding:"2px",
                border:"1px solid "+(diff!==0?C.warning:"#ddd"),
                borderRadius:4,fontSize:13,fontWeight:700,outline:"none",
                color:diff<0?C.danger:diff>0?"#1565C0":"#333"}}),
            h("button",{onClick:function(){setReceived(function(p){var r={};Object.assign(r,p);r[i.id]=(p[i.id]!=null?p[i.id]:drQty)+1;return r;});},
              style:{width:20,height:20,borderRadius:4,border:"1px solid "+C.primary,background:"#f5f5f5",cursor:"pointer",fontSize:14}},"+")
          ),
          h("div",{style:{fontSize:13,fontWeight:700,
            color:diff<0?C.danger:diff>0?"#1565C0":"#888"}},
            diff===0?"OK":(diff>0?"+":"")+String(diff)),
          diff!==0
            ? h("input",{value:remarks[i.id]||"",
                onChange:function(e){var v=e.target.value;setRemarks(function(p){var r={};Object.assign(r,p);r[i.id]=v;return r;});},
                placeholder:"Reason...",
                style:{width:"100%",padding:"4px 7px",border:"1px solid "+C.warning,
                  borderRadius:6,fontSize:13,outline:"none",boxSizing:"border-box"}})
            : h("span",{style:{fontSize:12,color:C.success}},"OK")
        );
      })
    ),
    h("div",{style:{padding:"12px 20px",
      borderTop:"2px solid "+(hasDisc?C.warning:C.primary),
      background:"#fafafa",display:"flex",gap:8,alignItems:"center"}},
      hasDisc
        ? h("div",{style:{fontSize:13,color:"rgba(255,255,255,.85)",flex:1}},"Will be reported to Main for approval")
        : h("div",{style:{fontSize:13,color:C.success,flex:1}},"No discrepancy — PO will be completed"),
      h("button",{onClick:onClose,
        style:{padding:"9px 16px",background:"#fff",border:"1px solid "+C.border,
          borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer"}},"Cancel"),
      h("button",{onClick:confirmReceipt,disabled:saving,
        style:{padding:"10px 20px",
          background:hasDisc?"linear-gradient(135deg,#E65100,#BF360C)":
            "linear-gradient(135deg,"+C.primary+","+C.dark+")",
          border:"none",borderRadius:9,color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}},
        saving?"Saving...":(hasDisc?"Report Discrepancy":"Confirm Receipt"))
    )
  );
}

  const [ref,setRef]=useState("");
  const [saving,setSaving]=useState(false);

  const payments=po.payments||[];
  const totalPaid=payments.reduce((s,p)=>s+(p.amount||0),0);
  const grandTotal=poValue(po);
  const balance=grandTotal-totalPaid;
  const newPaid=totalPaid+(parseFloat(amount)||0);
  const newBalance=grandTotal-newPaid;
  const payStatus=newPaid>=grandTotal?"Paid":newPaid>0?"Partial":"Unpaid";

  const savePayment=async()=>{
    if(!amount||parseFloat(amount)<=0){showT("Enter payment amount","warn");return;}
    setSaving(true);
    try{
      const newPayment={
        amount:parseFloat(amount),
        method,ref,
        by:user.name,
        at:new Date().toISOString()
      };
      const newPayments=[...payments,newPayment];
      const newTotalPaid=newPayments.reduce((s,p)=>s+(p.amount||0),0);
      const newStatus=newTotalPaid>=grandTotal?"paid":"processing";
      const newPayStatus=newTotalPaid>=grandTotal?"Paid":newTotalPaid>0?"Partial":"Unpaid";
      await updateDoc(doc(db,"advances",po._docId),{
        payments:newPayments,
        totalPaid:newTotalPaid,
        paymentStatus:newPayStatus,
        status:newStatus,
        ...(newStatus==="paid"?{paidAt:serverTimestamp(),paidBy:user.name}:{})

    h("div",{style:{padding:"16px 20px"}},

      // Summary

        h("div",{style:{background:"#f9f9f9",borderRadius:8,padding:"10px",textAlign:"center"}},

// ─── DR PROCESS MODAL ────────────────────────────────────
function DRProcessModal({po,db,user,showT,onClose,companySettings={},branches=[]}){
  if(!po) return null;
  const [prices,setPrices]   = useState({});
  const [actualQtys,setActual] = useState({});
  const [deliveryDate,setDD]  = useState(localDate());
  const [notes,setNotes]      = useState("");
  const [saving,setSaving]    = useState(false);

  // Init from existing DR data if any
  useEffect(()=>{
    const p={}, q={};
    (po. items||[]).forEach(i=>{
      p[i.id]=i.price||0;
      q[i.id]=i.actualQty!=null?i.actualQty:i.qty;
    });
    setPrices(p); setActual(q);
  },[po._docId]);

  const  items = po. items||[];
  const total =  items.reduce((s,i)=>
    s+((prices[i.id]||0)*((actualQtys[i.id]!=null?actualQtys[i.id]:i.qty)||0)),0);

  const printDR = (cs)=>{
    const w=window.open("","_blank","width=800,height=900");
    // Group  items by category
    const cats={};
     items.forEach(i=>{
      const cat=i.cat||i.category||"Others";
      if(!cats[cat])cats[cat]=[];
      const aq=actualQtys[i.id]!=null?actualQtys[i.id]:i.qty;
      const p=prices[i.id]||0;
      cats[cat].push({...i,aq,p,lineTotal:aq*p});
    });
    let  itemNo=1;
    let tableRows="";
    Object.keys(cats).forEach(cat=>{
      const catItems=cats[cat];
      const catTotal=catItems.reduce((s,i)=>s+i.lineTotal,0);
      const catQty=catItems.reduce((s,i)=>s+i.aq,0);
      const catPk=catItems.reduce((s,i)=>{
        const sz=Number(i.packSize)||0;
        return s+(sz>1?(i.aq/sz):0);
      },0);
      catItems.forEach(i=>{
        const sz=Number(i.packSize)||0;
        const pu=i.packUnit||"";
        // no pack size configured -> leave the pack columns blank rather than
        // printing a misleading "1 pack"
        const perPk = sz>1 ? (sz+" "+(i.unit||"")) : "—";
        const totPk = sz>1 ? (Math.round((i.aq/sz)*1000)/1000)+" "+pu : "—";
        tableRows+=`<tr>
          <td>${ itemNo++}</td>
          <td style="color:#5A5A5A;font-size:10px">${i.id||""}</td>
          <td>${cat}</td>
          <td>${i.name}</td>

  const issueDR = async()=>{
    setSaving(true);

        ...i,
        actualQty: actualQtys[i.id]!=null?actualQtys[i.id]:i.qty,
        price: prices[i.id]||0,
        total: ((actualQtys[i.id]!=null?actualQtys[i.id]:i.qty)||0)*(prices[i.id]||0),
        discrepancy: ((actualQtys[i.id]!=null?actualQtys[i.id]:i.qty)||0)-(i.qty||0)
      }));
      const hasDisc = delivered.some(i=>i.discrepancy!==0);
      await updateDoc(doc(db,"advances",po._docId),{
        status:"processing",
        deliveryStatus:"Dispatched",
        drNum:"DR-"+po.poNum,
        deliveredItems:delivered,
        totalAmount:total,
        deliveryDate,
        drNotes:notes,
        hasDiscrepancy:hasDisc,
        issuedBy:user.name,
        issuedAt:serverTimestamp()
      });

      // This is the second DR path. The other one deducts Main's stock, sets
      // deliveryStatus and notifies the branch — this one did none of the
      // three, so goods left Main's book untouched and the branch was never
      // told. Everything below mirrors that path.
      let moved=0; const shortAtMain=[];
      if(!po.stockIssued){
        for(const it of delivered){
          if(!it.id||!(it.actualQty>0))continue;
          try{
            let prev=null, _mlots=null;
            try{
              const ds=await getDoc(doc(db,"inventory",it.id));
              if(ds.exists()){
                prev=Number(ds.data().stock)||0;
                _mlots=lotsConsume(ds.data().lots,it.actualQty||0).lots;
              }
            }catch(e1){}
            if(prev!=null&&prev<(it.actualQty||0)){
              shortAtMain.push((it.name||it.id)+": has "+prev+", needed "+it.actualQty);
              continue;
            }
            await updateDoc(doc(db,"inventory",it.id),Object.assign({
              stock:increment(-(it.actualQty||0)),
              lastIssued:serverTimestamp()
            }, _mlots?{lots:_mlots}:{}));
            moved++;
            await addDoc(collection(db,"inventory_log"),{
              itemId:it.id,itemName:it.name||it.id,unit:it.unit||"",
              type:"deduct",amount:-(it.actualQty||0),
              prevStock:prev,
              newStock:prev==null?null:Math.round((prev-(it.actualQty||0))*1000)/1000,
              desc:"Issued from Main: "+(it.actualQty||0)+" "+(it.unit||"")+
                " to "+(po.branchName||po.branch),
              source:"TRANSFER",ref:po.poNum||"",
              branch:"ct-main",by:user.name,
              date:localDate(),timestamp:serverTimestamp()
            ,at:serverTimestamp()});
          }catch(e2){console.warn("main deduct failed",it.id,e2);}
        }
        try{ await updateDoc(doc(db,"advances",po._docId),{stockIssued:true}); }catch(e3){}
      }

      await notify(db,{to:po.branch,type:"dr_issued",
        title:"DR-"+po.poNum+" dispatched",
        message:delivered.length+" item/s · ₱"+peso(total)
          +(deliveryDate?" · arriving "+deliveryDate:""),
        page:"stock_order",ref:po.poNum,by:user.name});

      if(shortAtMain.length){
        showT("Not deducted (Main is short): "+shortAtMain.slice(0,2).join(" · ")
          +(shortAtMain.length>2?" +"+(shortAtMain.length-2):""),"warn");
      }
      showT("DR issued ✓ — "+po.poNum+" now PROCESSING · "+moved+" item/s deducted");
      renderDRDoc(Object.assign({},po,{deliveredItems:delivered,deliveryDate:deliveryDate}),companySettings,branches);
      onClose();
    }catch(e){showT("Error issuing DR","err");console.error(e);}
    setSaving(false);
  };

  return h("div",{style:{background:"#fff",width:620,maxHeight:"90vh",borderRadius:16,

    ),

    // Delivery date + notes
    h("div",{style:{padding:"12px 20px",background:"#f9f9f9",borderBottom:"1px solid #eee",
      display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
      h("div",null,
        h("div",{style:{fontSize:12,fontWeight:700,color:"#6A1B9A",marginBottom:4,letterSpacing:1}},
          "DELIVERY DATE *"),
        h("input",{type:"date",value:deliveryDate,onChange:e=>setDD(e.target.value),
          style:{width:"100%",padding:"7px",border:"2px solid #6A1B9A",borderRadius:7,

      ),
      h("div",null,

          style:{width:"100%",padding:"7px",border:"1px solid #ddd",borderRadius:7,

      )
    ),

    // Items table

        ["ITEM","PO QTY","ACTUAL QTY","PRICE/UNIT","TOTAL"].map(h2=>
          h("div",{key:h2,style:{fontSize:11,fontWeight:700,color:"#6A1B9A",letterSpacing:1}},h2))
      ),
       items.map(i=>{
        const aq = actualQtys[i.id]!=null?actualQtys[i.id]:i.qty;

          h("div",{style:{display:"flex",alignItems:"center",gap:4}},

              style:{width:38,textAlign:"center",padding:"3px",border:"1px solid #ddd",
                borderRadius:4,fontSize:13,fontWeight:700,outline:"none",
                color:diff<0?"#C62828":diff>0?"#1565C0":"#333"}}),
            h("button",{onClick:()=>setActual(p=>({...p,[i.id]:(p[i.id]!=null?p[i.id]:i.qty)+1})),
              style:{width:20,height:20,borderRadius:4,border:"1px solid #6A1B9A",
                background:"#F3E5F5",cursor:"pointer",fontSize:14,color:"#6A1B9A"}},"+"),
            diff!==0&&h("span",{style:{fontSize:11,color:diff<0?"#C62828":"#1565C0",fontWeight:700}},

          ),
          // Price
