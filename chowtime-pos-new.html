// ─── HRIS: CA / LOAN REQUEST PAGE ────────────────────────
function CALoanPage({user,branchId,curBranch,db,hrisDB,showT,mode,hrisEmps=[]}){
  const isCA = mode === "ca";
  const [amount, setAmount]     = useState("");
  const [reason, setReason]     = useState("");
  const [installments, setInst] = useState("2");
  const [myRequests, setMyReqs] = useState([]);
  const [loading, setLoading]   = useState(true);
  const today = new Date().toISOString().slice(0,10);

  useEffect(()=>{ setLoading(false); },[hrisEmps]);

  // Load my requests from POS Firestore
  useEffect(()=>{
    const q = query(
      collection(db,"hris_requests"),
      where("staffName","==",user.name),
      where("type","==",isCA?"Cash Advance":"Cash Loan"),
      orderBy("timestamp","desc"),
      limit(20)
    );
    const unsub = onSnapshot(q, snap=>{
      setMyReqs(snap.docs.map(d=>({...d.data(),_docId:d.id})));
    }, ()=>{});
    return()=>unsub();
  },[user.name, isCA]);

  // Find matching HRIS employee record
  const hrisEmp = hrisEmps.find(e=>
    e.name?.toLowerCase().trim()===user.name.toLowerCase().trim() ||
    e.name?.toLowerCase().includes(user.name.split(" ")[0].toLowerCase())
  );

  const submit = async()=>{
    if(!amount||parseFloat(amount)<=0){showT("Enter amount","warn");return;}
    if(!reason.trim()){showT("Enter reason","warn");return;}
    const amt = parseFloat(amount);
    const cutoffDeduct = isCA ? amt : Math.ceil(amt/parseInt(installments));

    // 1. Save request to POS Firestore (for approval tracking)
    const reqRef = await addDoc(collection(db,"hris_requests"),{
      type: isCA?"Cash Advance":"Cash Loan",
      staffName: user.name,
      branch: branchId,
      branchName: curBranch.full,
      amount: amt,
      reason,
      installments: isCA?1:parseInt(installments),
      cutoffDeduct,
      status: "pending",
      hrisEmpId: hrisEmp?.id||null,
      date: today,
      timestamp: serverTimestamp(),
    });

    showT((isCA?"Cash Advance":"Cash Loan")+" request submitted! Waiting for approval ✓");
    setAmount(""); setReason(""); setInst("2");
  };

  const pendingOwn  = myRequests.filter(r=>r.status==="pending");
  const approvedOwn = myRequests.filter(r=>r.status==="approved");
  const totalOwed   = myRequests.filter(r=>r.status==="approved"&&r.balance>0)
                        .reduce((s,r)=>s+(r.balance||0),0);

  if(loading) return h("div",{style:{textAlign:"center",padding:"40px",color:C.muted}},"Loading...");

  return h("div",null,
    // Header
    h("div",{style:{background:isCA?`linear-gradient(135deg,${C.primary},${C.dark})`:`linear-gradient(135deg,#1565C0,#0D47A1)`,borderRadius:13,padding:"16px 18px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}},
      h("div",null,
        h("div",{style:{color:C.accent,fontSize:9,fontWeight:700,letterSpacing:2}},isCA?"CASH ADVANCE REQUEST":"CASH LOAN REQUEST"),
        h("div",{style:{color:"#fff",fontSize:15,fontWeight:900,marginTop:2}},user.name),
        h("div",{style:{color:"rgba(255,255,255,.6)",fontSize:9,marginTop:1}},curBranch.full+" · "+today),
        hrisEmp
          ?h("div",{style:{color:"#4ade80",fontSize:9,marginTop:3}},"✅ HRIS linked: "+hrisEmp.name+" ("+hrisEmp.pos+")")
          :h("div",{style:{color:"#fbbf24",fontSize:9,marginTop:3}},"⚠️ Name not found in HRIS — admin will link manually")
      ),
      h("div",{style:{textAlign:"right"}},
        h("div",{style:{color:"rgba(255,255,255,.5)",fontSize:9}},"OUTSTANDING BALANCE"),
        h("div",{style:{color:totalOwed>0?C.warning:"#4ade80",fontSize:20,fontWeight:900}},"₱"+peso(totalOwed))
      )
    ),

    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},

      // LEFT: Request form
      h("div",null,
        h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,padding:"16px"}},
          h("div",{style:{fontWeight:800,fontSize:13,marginBottom:14,color:isCA?C.primary:"#1565C0"}},
            isCA?"💵 New Cash Advance":"💸 New Cash Loan"),

          // Amount
          h("div",{style:{marginBottom:11}},
            h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,marginBottom:5,letterSpacing:1}},"AMOUNT REQUESTED (₱)"),
            h("input",{type:"number",onFocus:e=>e.target.select(),value:amount,onChange:e=>setAmount(e.target.value),
              placeholder:"0.00",
              style:{width:"100%",padding:"12px",border:`2px solid ${isCA?C.primary:"#1565C0"}`,
                borderRadius:9,fontSize:20,fontWeight:700,outline:"none",
                boxSizing:"border-box",color:isCA?C.primary:"#1565C0"}})
          ),

          // Reason
          h("div",{style:{marginBottom:11}},
            h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,marginBottom:5,letterSpacing:1}},"REASON / PURPOSE"),
            h("textarea",{value:reason,onChange:e=>setReason(e.target.value),
              placeholder:isCA?"e.g. Emergency medical expense, school fees...":"e.g. House repair, tuition fee, medical...",
              style:{width:"100%",padding:"10px 12px",border:"1px solid "+C.border,borderRadius:9,
                fontSize:12,outline:"none",resize:"none",height:80,boxSizing:"border-box",fontFamily:"inherit"}})
          ),

          // Installments (loan only)
          !isCA&&h("div",{style:{marginBottom:11}},
            h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,marginBottom:5,letterSpacing:1}},"NUMBER OF CUTOFFS TO PAY"),
            h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}},
              ["2","3","4","6"].map(n=>h("button",{key:n,onClick:()=>setInst(n),
                style:{padding:"10px 0",borderRadius:8,border:`2px solid ${installments===n?"#1565C0":C.border}`,
                  background:installments===n?"#E3F2FD":"#fff",
                  color:installments===n?"#1565C0":C.muted,fontWeight:700,fontSize:12,cursor:"pointer"}},
                n+" cutoffs"))
            ),
            amount&&parseFloat(amount)>0&&h("div",{style:{marginTop:8,padding:"9px 12px",background:"#E3F2FD",borderRadius:8,fontSize:11,color:"#1565C0",fontWeight:600}},
              "₱"+peso(Math.ceil(parseFloat(amount)/parseInt(installments)))+" deducted per cutoff × "+installments+" = ₱"+peso(parseFloat(amount))
            )
          ),

          // CA deduction note
          isCA&&amount&&parseFloat(amount)>0&&h("div",{style:{marginBottom:11,padding:"9px 12px",background:"#FFF8E1",borderRadius:8,fontSize:11,color:"#795548",fontWeight:600}},
            "💡 Full ₱"+peso(parseFloat(amount))+" will be deducted on your NEXT CUTOFF payroll"
          ),

          h("button",{onClick:submit,
            style:{width:"100%",padding:"13px",
              background:isCA?`linear-gradient(135deg,${C.primary},${C.dark})`:`linear-gradient(135deg,#1565C0,#0D47A1)`,
              border:"none",borderRadius:10,color:"#fff",fontWeight:800,fontSize:13,cursor:"pointer"}},
            isCA?"📤 Submit CA Request":"📤 Submit Loan Request")
        )
      ),

      // RIGHT: My requests history
      h("div",null,
        h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,padding:"14px",marginBottom:10}},
          h("div",{style:{fontWeight:800,fontSize:12,marginBottom:10}},"📋 My Requests"),
          myRequests.length===0
            ?h("div",{style:{textAlign:"center",padding:"20px",color:C.muted,fontSize:11}},"No requests yet")
            :myRequests.map(r=>h("div",{key:r._docId,style:{padding:"10px 12px",borderRadius:9,border:"1px solid "+C.border,marginBottom:8,background:{"pending":"#FFF8E1","approved":"#E8F5E9","rejected":"#FFEBEE","released":"#E3F2FD"}[r.status]||"#fff"}},
              h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:4}},
                h("div",{style:{fontSize:12,fontWeight:800,color:{"pending":C.warning,"approved":C.success,"rejected":C.danger,"released":C.info}[r.status]||C.text}},
                  "₱"+peso(r.amount)),
                h(Badge,{label:r.status.toUpperCase(),color:{"pending":C.warning,"approved":C.success,"rejected":C.danger,"released":C.info}[r.status]||C.muted})
              ),
              h("div",{style:{fontSize:10,color:C.muted}},r.reason),
              h("div",{style:{fontSize:9,color:C.muted,marginTop:3}},r.date+" · "+r.type),
              r.status==="approved"&&r.balance>0&&h("div",{style:{fontSize:10,fontWeight:700,color:C.warning,marginTop:3}},"Balance: ₱"+peso((r.balance||r.amount))),
              r.status==="rejected"&&r.rejectReason&&h("div",{style:{fontSize:10,color:C.danger,marginTop:3}},"Reason: "+r.rejectReason),
              r.status==="approved"&&h("div",{style:{fontSize:9,color:C.success,marginTop:3}},"✅ Auto-deducted sa next cutoff payroll")
            ))
        )
      )
    )
  );
}

// ─── HRIS: ADMIN APPROVAL DASHBOARD ──────────────────────
function HRISDashPage({user,db,hrisDB,showT,branches:BRANCHES,hrisEmps=[]}){
  const [requests, setRequests] = useState([]);
  const [filterStatus, setFilter] = useState("pending");
  const [filterBranch, setFilterBranch] = useState("all");
  const [rejectModal, setRejectModal] = useState(null);
  const [rejectReason, setRejectReason] = useState("");

  useEffect(()=>{
    const q = query(collection(db,"hris_requests"), orderBy("timestamp","desc"), limit(200));
    const unsub = onSnapshot(q, snap=>{
      setRequests(snap.docs.map(d=>({...d.data(),_docId:d.id})));
    }, ()=>{});
    return()=>unsub();
  },[]);

  const approve = async(req)=>{
    // 1. Update POS Firestore status
    await updateDoc(doc(db,"hris_requests",req._docId),{
      status:"approved",
      approvedBy: user.name,
      approvedAt: serverTimestamp(),
      balance: req.amount,
    });

    // 2. Push to HRIS Realtime DB as loan deduction entry
    if(hrisDB && req.hrisEmpId){
      try{
        // Load current loans
        const snap = await get(ref(hrisDB,"loans"));
        const existing = snap.val();
        const loans = existing ? (Array.isArray(existing)?existing:Object.values(existing)) : [];
        const newLoan = {
          emp:      req.hrisEmpId,
          empName:  req.staffName,
          type:     req.type==="Cash Advance"?"Cash Advance":"Company Loan",
          amount:   req.amount,
          monthly:  req.cutoffDeduct,
          start:    req.date,
          status:   "Active",
          balance:  req.amount,
          posReqId: req._docId,
          branch:   req.branch,
          reason:   req.reason,
        };
        loans.push(newLoan);
        await set(ref(hrisDB,"loans"), loans);
        showT("Approved & synced to HRIS payroll ✓");
      }catch(e){
        console.warn("HRIS sync failed:",e);
        showT("Approved in POS — HRIS sync failed, add manually","warn");
      }
    } else {
      showT("Approved! No HRIS link — add deduction manually in HRIS","warn");
    }
  };

  const reject = async(req)=>{
    await updateDoc(doc(db,"hris_requests",req._docId),{
      status:"rejected",
      rejectedBy: user.name,
      rejectedAt: serverTimestamp(),
      rejectReason,
    });
    setRejectModal(null);
    setRejectReason("");
    showT("Request rejected");
  };

  const filtered = requests
    .filter(r=>filterStatus==="all"||r.status===filterStatus)
    .filter(r=>filterBranch==="all"||r.branch===filterBranch);

  const pending  = requests.filter(r=>r.status==="pending");
  const approved = requests.filter(r=>r.status==="approved");
  const totalCA  = approved.filter(r=>r.type==="Cash Advance").reduce((s,r)=>s+r.amount,0);
  const totalLoan= approved.filter(r=>r.type==="Cash Loan").reduce((s,r)=>s+r.amount,0);

  return h("div",null,
    h(SectionHeader,{title:"HRIS — CA & Loan Approvals"}),

    // KPI cards
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}},
      h(Stat,{label:"Pending Approval",value:pending.length,icon:"⏳",color:C.warning}),
      h(Stat,{label:"Approved CA",value:"₱"+totalCA.toLocaleString(),icon:"💵",color:C.primary}),
      h(Stat,{label:"Approved Loans",value:"₱"+totalLoan.toLocaleString(),icon:"💸",color:C.info}),
      h(Stat,{label:"HRIS Linked",value:hrisEmps.length+" employees",icon:"🔗",color:C.success})
    ),

    // HRIS link status
    h("div",{style:{background:hrisDB?"#E8F5E9":"#FFF8E1",border:"1px solid "+(hrisDB?"#A5D6A7":"#FFE082"),borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:11,color:hrisDB?"#1B5E20":"#795548"}},
      hrisDB
        ?"✅ Connected to HRIS (chowtime-hris) — approved CAs will auto-sync to payroll deductions"
        :"⚠️ HRIS connection unavailable — approvals will save to POS only"
    ),

    // Filters
    h("div",{style:{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}},
      h("div",{style:{display:"flex",gap:5}},
        ["pending","approved","rejected","all"].map(s=>h("button",{key:s,onClick:()=>setFilter(s),
          style:{padding:"5px 12px",borderRadius:20,border:`1px solid ${filterStatus===s?C.primary:C.border}`,
            background:filterStatus===s?"#FFF0F0":"#fff",color:filterStatus===s?C.primary:C.muted,
            fontSize:10,fontWeight:filterStatus===s?700:400,cursor:"pointer"}},
          s.toUpperCase()+" "+(s==="all"?requests.length:requests.filter(r=>r.status===s).length)))
      ),
      h("select",{value:filterBranch,onChange:e=>setFilterBranch(e.target.value),
        style:{padding:"5px 10px",border:"1px solid "+C.border,borderRadius:7,fontSize:11,outline:"none"}},
        h("option",{value:"all"},"All Branches"),
        ...branches.map(b=>h("option",{key:b.id,value:b.id},b.name))
      )
    ),

    // Requests table
    h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
      h("div",{style:{display:"grid",gridTemplateColumns:"100px 130px 1fr 80px 90px 110px 110px",padding:"8px 14px",background:"#f9f9f9",borderBottom:"1px solid #eee"}},
        ["Type","Staff","Reason / Branch","Amount","Cutoff Ded.","Status","Action"].map(h2=>
          h("div",{key:h2,style:{fontSize:8,fontWeight:700,color:C.muted,textTransform:"uppercase"}},h2))
      ),
      filtered.length===0
        ?h("div",{style:{textAlign:"center",padding:"30px",color:C.muted,fontSize:12}},"No requests")
        :filtered.map(req=>h("div",{key:req._docId,
            style:{display:"grid",gridTemplateColumns:"100px 130px 1fr 80px 90px 110px 110px",
              padding:"10px 14px",borderBottom:"1px solid #f5f5f5",alignItems:"center",
              background:req.status==="pending"?"#FFFDE7":"#fff"}},
          h("div",null,
            h(Badge,{label:req.type==="Cash Advance"?"💵 CA":"💸 Loan",
              color:req.type==="Cash Advance"?C.primary:"#1565C0",
              bg:req.type==="Cash Advance"?"#FFF0F0":"#E3F2FD"})
          ),
          h("div",null,
            h("div",{style:{fontSize:11,fontWeight:700}},req.staffName),
            h("div",{style:{fontSize:9,color:C.muted}},branches.find(b=>b.id===req.branch)?.name||req.branch),
            req.hrisEmpId
              ?h("div",{style:{fontSize:8,color:C.success,fontWeight:600}},"🔗 HRIS linked")
              :h("div",{style:{fontSize:8,color:C.warning,fontWeight:600}},"⚠️ No HRIS link")
          ),
          h("div",{style:{fontSize:10,color:C.muted}},req.reason||"—"),
          h("div",{style:{fontSize:12,fontWeight:800,color:C.primary}},"₱"+peso(req.amount)),
          h("div",null,
            h("div",{style:{fontSize:11,fontWeight:700,color:"#1565C0"}},"₱"+peso(req.cutoffDeduct)),
            h("div",{style:{fontSize:8,color:C.muted}},req.type==="Cash Advance"?"Full @ cutoff":req.installments+"x cutoffs")
          ),
          h("div",null,h(Badge,{label:req.status.toUpperCase(),
            color:{pending:C.warning,approved:C.success,rejected:C.danger,released:C.info}[req.status]||C.muted})),
          h("div",{style:{display:"flex",gap:5}},
            req.status==="pending"&&h("button",{onClick:()=>approve(req),
              style:{padding:"4px 10px",background:"#E8F5E9",border:"none",borderRadius:6,
                color:C.success,fontSize:10,fontWeight:700,cursor:"pointer"}},"✓ Approve"),
            req.status==="pending"&&h("button",{onClick:()=>setRejectModal(req),
              style:{padding:"4px 9px",background:"#FFEBEE",border:"none",borderRadius:6,
                color:C.danger,fontSize:10,fontWeight:700,cursor:"pointer"}},"✗"),
            req.status==="approved"&&h("div",{style:{fontSize:9,color:C.success,fontWeight:600}},"✅ In payroll")
          )
        ))
    ),

    // Reject modal
    rejectModal&&h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:900}},
      h("div",{style:{background:"#fff",width:360,borderRadius:14,padding:"20px",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}},
        h("div",{style:{fontWeight:800,fontSize:14,marginBottom:4}},"✗ Reject Request"),
        h("div",{style:{fontSize:11,color:C.muted,marginBottom:14}},"Rejecting CA/Loan of "+rejectModal.staffName+" (₱"+rejectModal.amount+")"),
        h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,marginBottom:5,letterSpacing:1}},"REASON FOR REJECTION"),
        h("textarea",{value:rejectReason,onChange:e=>setRejectReason(e.target.value),
          placeholder:"e.g. Outstanding balance not yet paid, over limit...",
          style:{width:"100%",padding:"9px",border:"1px solid "+C.border,borderRadius:8,
            fontSize:12,outline:"none",resize:"none",height:72,boxSizing:"border-box",fontFamily:"inherit"}}),
        h("div",{style:{display:"flex",gap:8,marginTop:12}},
          h("button",{onClick:()=>reject(rejectModal),
            style:{flex:1,padding:"10px",background:C.danger,border:"none",borderRadius:8,color:"#fff",fontWeight:700,cursor:"pointer"}},"Reject"),
          h("button",{onClick:()=>{setRejectModal(null);setRejectReason("");},
            style:{flex:1,padding:"10px",background:C.bg,border:"1px solid "+C.border,borderRadius:8,fontWeight:700,cursor:"pointer"}},"Cancel")
        )
      )
    )
  );
}

// ─── HRIS: BRANCH TEAM VIEW ───────────────────────────────
function HRISBranchPage({user,branchId,curBranch,db,hrisDB,showT}){
  const [myTeamReqs, setTeamReqs] = useState([]);
  const [hrisEmps, setHrisEmps]   = useState([]);

  useEffect(()=>{
    const q = query(collection(db,"hris_requests"),
      where("branch","==",branchId),orderBy("timestamp","desc"),limit(50));
    const unsub = onSnapshot(q, snap=>{
      setTeamReqs(snap.docs.map(d=>({...d.data(),_docId:d.id})));
    }, ()=>{});
    return()=>unsub();
  },[branchId]);

  useEffect(()=>{
    if(!hrisDB)return;
    onValue(ref(hrisDB,"employees"), snap=>{
      const data=snap.val();
      if(data) setHrisEmps(Array.isArray(data)?data:Object.values(data));
    });
  },[hrisDB]);

  const branchEmps = hrisEmps.filter(e=>
    e.branch===branchId||e.branch===curBranch.name||e.branch===curBranch.full||
    BRANCHES?.find(b=>b.id===branchId)?.name===e.branch
  );

  return h("div",null,
    h(SectionHeader,{title:"My Team — "+curBranch.name}),
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}},
      h(Stat,{label:"Pending CA/Loan",value:myTeamReqs.filter(r=>r.status==="pending").length,icon:"⏳",color:C.warning}),
      h(Stat,{label:"Approved This Month",value:myTeamReqs.filter(r=>r.status==="approved").length,icon:"✅",color:C.success}),
      h(Stat,{label:"Total Approved",value:"₱"+myTeamReqs.filter(r=>r.status==="approved").reduce((s,r)=>s+r.amount,0).toLocaleString(),icon:"💵",color:C.primary})
    ),
    h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
      h("div",{style:{padding:"10px 14px",background:"#f9f9f9",borderBottom:"1px solid #eee",fontSize:10,fontWeight:700,color:C.muted}},"TEAM CA & LOAN REQUESTS"),
      myTeamReqs.length===0
        ?h("div",{style:{textAlign:"center",padding:"30px",color:C.muted,fontSize:12}},"No requests from your branch yet")
        :myTeamReqs.map(r=>h("div",{key:r._docId,style:{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderBottom:"1px solid #f9f9f9",background:r.status==="pending"?"#FFFDE7":"#fff"}},
          h("div",{style:{width:36,height:36,borderRadius:9,background:r.type==="Cash Advance"?"#FFF0F0":"#E3F2FD",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}},
            r.type==="Cash Advance"?"💵":"💸"),
          h("div",{style:{flex:1}},
            h("div",{style:{fontSize:11,fontWeight:700}},r.staffName+" · "+r.type),
            h("div",{style:{fontSize:9,color:C.muted}},r.reason+" · "+r.date),
            r.status==="approved"&&h("div",{style:{fontSize:9,color:C.success,fontWeight:600}},"✅ In payroll · ₱"+r.cutoffDeduct+"/cutoff")
          ),
          h("div",{style:{fontSize:13,fontWeight:900,color:r.type==="Cash Advance"?C.primary:"#1565C0"}},"₱"+peso(r.amount)),
          h(Badge,{label:r.status.toUpperCase(),color:{pending:C.warning,approved:C.success,rejected:C.danger}[r.status]||C.muted})
        ))
    )
  );
}

// ─── MENU EDITOR COMPONENT ───────────────────────────────
const EMOJI_LIST = ["🍗","🥩","🐟","🍖","🌭","🥟","🍝","🍚","🧋","🥤","🍌","🍳","🍱","🥗","🍜","🍛","🍲","🫔","🌮","🌯","🥪","🧆","🧇","🥞","🍔","🍟","🌽","🥕","🧅","🍄"];
const CAT_LIST = ["Bestsellers","Silog Meals","Rice Toppings","Merienda","Drinks","Add-ons","Specials"];

function MenuEditor({menuItems,setMenuItems,db,user,showT}){
  const [view,setView]         = useState("list");
  const [editItem,setEditItem] = useState(null);
  const [filterCat,setFilter]  = useState("All");
  const [srch,setSrch]         = useState("");
  const [saving,setSaving]     = useState(false);
  const [optGroups,setOptGrps] = useState([]);

  useEffect(()=>{
    const unsub=onSnapshot(collection(db,"option_groups"),snap=>{
      setOptGrps(snap.docs.map(d=>({...d.data(),id:d.id})));
    },()=>{});
    return()=>unsub();
  },[]);

  // ── blank template for new item
  const blankItem = ()=>({
    id:"m"+Date.now(),
    name:"",basePrice:0,emoji:"🍗",cat:"Bestsellers",
    desc:"",avail:true,
    variants:[{id:"v"+Date.now(),label:"Regular",priceAdd:0}],
    options:[],promos:[]
  });

  const openEdit = (item)=>{ setEditItem(JSON.parse(JSON.stringify(item))); setView("edit"); };
  const openAdd  = ()=>{ setEditItem(blankItem()); setView("additem"); };

  const saveItem = async(item)=>{
    setSaving(true);
    const isNew = view==="additem";
    // Save to Firestore
    try{
      await setDoc(doc(db,"menu",item.id),{...item,updatedBy:user.name,updatedAt:serverTimestamp()});
    }catch(e){ console.warn("Menu save:",e); }
    // Update local state
    if(isNew){
      setMenuItems(p=>[...p,item]);
      showT(item.name+" added to menu ✓");
    } else {
      setMenuItems(p=>p.map(m=>m.id===item.id?item:m));
      showT(item.name+" updated ✓");
    }
    setSaving(false);
    setView("list");
    setEditItem(null);
  };

  const deleteItem = async(item)=>{
    if(!confirm("Delete "+item.name+"? This cannot be undone."))return;
    try{ await deleteDoc(doc(db,"menu",item.id)); }catch(e){}
    setMenuItems(p=>p.filter(m=>m.id!==item.id));
    showT(item.name+" deleted","warn");
    setView("list");setEditItem(null);
  };

  const toggleAvail = async(item)=>{
    const updated={...item,avail:!item.avail};
    try{ await updateDoc(doc(db,"menu",item.id),{avail:updated.avail,updatedBy:user.name}); }catch(e){}
    setMenuItems(p=>p.map(m=>m.id===item.id?updated:m));
    showT(item.name+" "+(updated.avail?"enabled ✓":"hidden 🚫"));
  };

  const filtered = menuItems
    .filter(i=>filterCat==="All"||i.cat===filterCat)
    .filter(i=>i.name.toLowerCase().includes(srch.toLowerCase()));

  // ── LIST VIEW ──
  if(view==="list") return h("div",null,
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
      h("div",null,
        h("h2",{style:{margin:0,fontSize:17,fontWeight:800}},"🍽️ Menu Management"),
        h("div",{style:{fontSize:10,color:C.muted,marginTop:2}},menuItems.length+" items · "+menuItems.filter(i=>i.avail).length+" active")
      ),
      h("div",{style:{display:"flex",gap:7}},
        h("div",{style:{position:"relative"}},
          h("span",{style:{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",fontSize:11,color:C.muted}},"🔍"),
          h("input",{value:srch,onChange:e=>setSrch(e.target.value),placeholder:"Search...",
            style:{padding:"7px 9px 7px 26px",border:"1px solid "+C.border,borderRadius:7,fontSize:11,outline:"none",width:140}})
        ),
        h("button",{onClick:openAdd,
          style:{padding:"8px 16px",background:`linear-gradient(135deg,${C.primary},${C.dark})`,border:"none",borderRadius:8,color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}},
          "+ Add Item")
      )
    ),
    // Category filter tabs
    h("div",{style:{display:"flex",gap:0,borderBottom:"1px solid "+C.border,marginBottom:14,overflowX:"auto"}},
      ["All",...CAT_LIST].map(c=>h("button",{key:c,onClick:()=>setFilter(c),
        style:{padding:"8px 14px",border:"none",background:"transparent",
          color:filterCat===c?C.primary:C.muted,
          fontWeight:filterCat===c?700:400,fontSize:11,cursor:"pointer",
          borderBottom:`2px solid ${filterCat===c?C.primary:"transparent"}`,
          whiteSpace:"nowrap"}},
        c+" ("+(c==="All"?menuItems.length:menuItems.filter(i=>i.cat===c).length)+")"
      ))
    ),
    // Item cards grid
    filtered.length===0
      ?h("div",{style:{textAlign:"center",padding:"40px",color:C.muted}},
          h("div",{style:{fontSize:40,marginBottom:8}},"🍽️"),
          h("div",null,"No items found. "),
          h("button",{onClick:openAdd,style:{color:C.primary,background:"none",border:"none",cursor:"pointer",fontWeight:700,fontSize:12}},"+ Add your first item")
        )
      :h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:9}},
        filtered.map(item=>h("div",{key:item.id,
          style:{background:"#fff",borderRadius:12,border:`2px solid ${item.avail?C.border:"#eee"}`,
            overflow:"hidden",opacity:item.avail?1:.65,position:"relative"}},
          // Top: emoji + availability toggle
          h("div",{style:{height:80,background:item.avail?`${C.primary}0D`:"#f5f5f5",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:40,position:"relative"}},
            item.emoji,
            h("div",{style:{position:"absolute",top:7,right:7}},
              h("button",{onClick:()=>toggleAvail(item),
                style:{width:34,height:19,borderRadius:10,border:"none",
                  background:item.avail?C.success:"#ccc",
                  cursor:"pointer",position:"relative",transition:"all .2s"}},
                h("div",{style:{width:13,height:13,borderRadius:"50%",background:"#fff",
                  position:"absolute",top:3,transition:"all .2s",
                  left:item.avail?"calc(100% - 16px)":"3px",
                  boxShadow:"0 1px 3px rgba(0,0,0,.25)"}})
              )
            ),
            !item.avail&&h("div",{style:{position:"absolute",inset:0,background:"rgba(255,255,255,.5)",
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}},"🚫")
          ),
          h("div",{style:{padding:"9px 11px"}},
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}},
              h("div",{style:{fontWeight:800,fontSize:12,color:item.avail?C.text:"#999",flex:1,marginRight:4}},item.name),
              h("div",{style:{fontSize:13,fontWeight:900,flexShrink:0,color:item.avail?C.primary:"#bbb"}},
                "₱"+item.basePrice)
            ),
            h("div",{style:{fontSize:8,color:C.muted,marginBottom:3}},item.cat),
            item.desc&&h("div",{style:{fontSize:9,color:C.muted,lineHeight:1.4,marginBottom:6,
              whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},item.desc),
            // Badges
            h("div",{style:{display:"flex",gap:4,flexWrap:"wrap",marginBottom:8}},
              item.variants.length>0&&h("span",{style:{fontSize:8,padding:"2px 6px",background:"#E3F2FD",color:C.info,borderRadius:20,fontWeight:600}},item.variants.length+" sizes"),
              item.options.length>0&&h("span",{style:{fontSize:8,padding:"2px 6px",background:"#F3E5F5",color:"#6A1B9A",borderRadius:20,fontWeight:600}},item.options.length+" options"),
              item.promos.length>0&&h("span",{style:{fontSize:8,padding:"2px 6px",background:"#FFF0F0",color:C.primary,borderRadius:20,fontWeight:600}},"🔥 "+item.promos.length+" promo"),
            ),
            h("button",{onClick:()=>openEdit(item),
              style:{width:"100%",padding:"7px",background:C.bg,border:"1px solid "+C.border,
                borderRadius:7,fontSize:11,fontWeight:600,cursor:"pointer",color:C.text}},
              "✏️ Edit Item")
          )
        ))
      )
  );

  // ── ITEM EDITOR (Edit or Add) ──
  if(view==="edit"||view==="additem"){
    const item = editItem;
    const isNew = view==="additem";
    const setField = (k,v)=>setEditItem(p=>({...p,[k]:v}));

    // Variant helpers
    const addVariant  = ()=>setEditItem(p=>({...p,variants:[...p.variants,{id:"v"+Date.now(),label:"",priceAdd:0}]}));
    const rmVariant   = (id)=>setEditItem(p=>({...p,variants:p.variants.filter(v=>v.id!==id)}));
    const setVariant  = (id,k,v)=>setEditItem(p=>({...p,variants:p.variants.map(vv=>vv.id===id?{...vv,[k]:v}:vv)}));

    // Option group helpers
    const addOptionGroup = ()=>setEditItem(p=>({...p,options:[...p.options,{id:"o"+Date.now(),label:"",required:false,multi:false,choices:[{id:"c"+Date.now(),label:"",priceAdd:0}]}]}));
    const rmOptionGroup  = (oid)=>setEditItem(p=>({...p,options:p.options.filter(o=>o.id!==oid)}));
    const setOpt         = (oid,k,v)=>setEditItem(p=>({...p,options:p.options.map(o=>o.id===oid?{...o,[k]:v}:o)}));
    const addChoice      = (oid)=>setEditItem(p=>({...p,options:p.options.map(o=>o.id===oid?{...o,choices:[...o.choices,{id:"c"+Date.now(),label:"",priceAdd:0}]}:o)}));
    const rmChoice       = (oid,cid)=>setEditItem(p=>({...p,options:p.options.map(o=>o.id===oid?{...o,choices:o.choices.filter(c=>c.id!==cid)}:o)}));
    const setChoice      = (oid,cid,k,v)=>setEditItem(p=>({...p,options:p.options.map(o=>o.id===oid?{...o,choices:o.choices.map(c=>c.id===cid?{...c,[k]:v}:c)}:o)}));

    // Promo helpers
    const addPromo  = ()=>setEditItem(p=>({...p,promos:[...p.promos,{id:"p"+Date.now(),label:"",discount:"bogo",tag:"BOGO",priceAdd:0}]}));
    const rmPromo   = (pid)=>setEditItem(p=>({...p,promos:p.promos.filter(pr=>pr.id!==pid)}));
    const setPromo  = (pid,k,v)=>setEditItem(p=>({...p,promos:p.promos.map(pr=>pr.id===pid?{...pr,[k]:v}:pr)}));

    const canSave = item.name.trim()&&item.basePrice>0;

    return h("div",null,
      // Header
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},
        h("div",{style:{display:"flex",alignItems:"center",gap:10}},
          h("button",{onClick:()=>{setView("list");setEditItem(null);},
            style:{padding:"6px 12px",background:C.bg,border:"1px solid "+C.border,borderRadius:7,fontSize:11,cursor:"pointer"}},"← Back"),
          h("h2",{style:{margin:0,fontSize:16,fontWeight:800}},isNew?"➕ Add New Item":"✏️ Edit — "+item.name)
        ),
        h("div",{style:{display:"flex",gap:7}},
          !isNew&&h("button",{onClick:()=>deleteItem(item),
            style:{padding:"8px 14px",background:"#FFEBEE",border:"1px solid #FFCDD2",borderRadius:8,color:C.danger,fontWeight:700,fontSize:12,cursor:"pointer"}},
            "🗑️ Delete"),
          h("button",{onClick:()=>saveItem(item),disabled:!canSave||saving,
            style:{padding:"8px 18px",background:canSave?`linear-gradient(135deg,${C.primary},${C.dark})`:"#ddd",
              border:"none",borderRadius:8,color:canSave?"#fff":"#999",fontWeight:700,fontSize:12,cursor:canSave?"pointer":"not-allowed"}},
            saving?"Saving...":"💾 Save Item")
        ),

        // ── OPTION GROUPS SECTION ──
        h("div",{style:{marginTop:12,background:"#fff",borderRadius:10,
          border:"1px solid "+C.border,padding:"12px 16px"}},
          h("div",{style:{fontSize:11,fontWeight:800,marginBottom:8,
            display:"flex",justifyContent:"space-between",alignItems:"center"}},
            h("span",null,"⚙️ Linked Option Groups"),
            h("span",{style:{fontSize:9,color:C.muted,fontWeight:400}},
              "Options shown to cashier during ordering")
          ),
          optGroups.length===0
            ? h("div",{style:{fontSize:10,color:C.muted,padding:"8px 0"}},
                "No option groups yet — create them in BOM → Option Groups")
            : h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}},
                optGroups.map(g=>{
                  const linked=(item.optionGroups||[]).includes(g.id);
                  return h("div",{key:g.id,
                    onClick:()=>{
                      const cur=item.optionGroups||[];
                      setField("optionGroups",
                        linked?cur.filter(function(x){return x!==g.id;}):[...cur,g.id]);
                    },
                    style:{display:"flex",alignItems:"center",gap:7,
                      padding:"7px 10px",borderRadius:8,cursor:"pointer",
                      border:"1px solid "+(linked?C.primary:C.border),
                      background:linked?C.primary+"12":"#fafafa"}},
                    h("div",{style:{width:16,height:16,borderRadius:4,
                      border:"2px solid "+(linked?C.primary:C.muted),
                      background:linked?C.primary:"#fff",
                      display:"flex",alignItems:"center",justifyContent:"center",
                      flexShrink:0}},
                      linked&&h("span",{style:{color:"#fff",fontSize:10,fontWeight:900}},"✓")),
                    h("div",null,
                      h("div",{style:{fontSize:11,fontWeight:linked?700:400,
                        color:linked?C.primary:C.text}},g.name),
                      h("div",{style:{fontSize:9,color:C.muted}},
                        (g.options||[]).length+" options")
                    )
                  );
                })
              )
        )
      ),

      h("div",{style:{display:"grid",gridTemplateColumns:"300px 1fr",gap:12,alignItems:"start"}},

        // LEFT COLUMN — basic info
        h("div",null,
          // Basic info card
          h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,padding:"16px",marginBottom:10}},
            h("div",{style:{fontWeight:800,fontSize:12,marginBottom:12,color:C.primary}},"📋 Basic Info"),

            // Emoji picker
            h("div",{style:{marginBottom:10}},
              h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,marginBottom:5,letterSpacing:1}},"EMOJI"),
              h("div",{style:{display:"flex",gap:6,alignItems:"center",marginBottom:6}},
                h("div",{style:{width:48,height:48,background:`${C.primary}10`,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}},item.emoji),
                h("input",{value:item.emoji,onChange:e=>setField("emoji",e.target.value),
                  style:{width:60,padding:"8px",border:"1px solid "+C.border,borderRadius:7,fontSize:20,textAlign:"center",outline:"none"}})
              ),
              h("div",{style:{display:"flex",flexWrap:"wrap",gap:4}},
                EMOJI_LIST.map(e=>h("button",{key:e,onClick:()=>setField("emoji",e),
                  style:{width:30,height:30,border:`1px solid ${item.emoji===e?C.primary:C.border}`,
                    background:item.emoji===e?"#FFF0F0":"#fff",borderRadius:6,fontSize:16,cursor:"pointer"}},e))
              )
            ),

            // Name
            h("div",{style:{marginBottom:10}},
              h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,marginBottom:4,letterSpacing:1}},"ITEM NAME *"),
              h("input",{value:item.name,onChange:e=>setField("name",e.target.value),
                placeholder:"e.g. Chicken Fillet",
                style:{width:"100%",padding:"9px",border:`1px solid ${item.name?C.border:C.danger}`,borderRadius:7,fontSize:13,fontWeight:700,outline:"none",boxSizing:"border-box"}})
            ),

            // Base price
            h("div",{style:{marginBottom:10}},
              h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,marginBottom:4,letterSpacing:1}},"RETAIL PRICE (₱) *"),
              h("input",{type:"number",onFocus:e=>e.target.select(),value:item.basePrice||"",onChange:e=>setField("basePrice",parseFloat(e.target.value)||0),
                placeholder:"0",
                style:{width:"100%",padding:"9px",border:`1px solid ${item.basePrice>0?C.border:C.danger}`,borderRadius:7,fontSize:16,fontWeight:700,outline:"none",boxSizing:"border-box",color:C.primary}})
            ),
            // Franchisee + Wholesale prices
            h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}},
              h("div",null,
                h("div",{style:{fontSize:9,fontWeight:700,color:"#E65100",marginBottom:4,letterSpacing:1}},"FRANCHISEE PRICE (₱)"),
                h("input",{type:"number",onFocus:e=>e.target.select(),value:item.franchiseePrice||"",
                  onChange:e=>setField("franchiseePrice",parseFloat(e.target.value)||0),
                  placeholder:"Optional",
                  style:{width:"100%",padding:"9px",border:"1px solid #FFE0B2",borderRadius:7,
                    fontSize:14,fontWeight:700,outline:"none",boxSizing:"border-box",color:"#E65100"}})
              ),
              h("div",null,
                h("div",{style:{fontSize:9,fontWeight:700,color:"#6A1B9A",marginBottom:4,letterSpacing:1}},"WHOLESALE PRICE (₱)"),
                h("input",{type:"number",onFocus:e=>e.target.select(),value:item.wholesalePrice||"",
                  onChange:e=>setField("wholesalePrice",parseFloat(e.target.value)||0),
                  placeholder:"Optional",
                  style:{width:"100%",padding:"9px",border:"1px solid #E1BEE7",borderRadius:7,
                    fontSize:14,fontWeight:700,outline:"none",boxSizing:"border-box",color:"#6A1B9A"}})
              )
            ),

            // Category
            h("div",{style:{marginBottom:10}},
              h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,marginBottom:4,letterSpacing:1}},"CATEGORY"),
              h("select",{value:item.cat,onChange:e=>setField("cat",e.target.value),
                style:{width:"100%",padding:"9px",border:"1px solid "+C.border,borderRadius:7,fontSize:12,outline:"none"}},
                CAT_LIST.map(c=>h("option",{key:c,value:c},c)))
            ),

            // Description
            h("div",{style:{marginBottom:10}},
              h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,marginBottom:4,letterSpacing:1}},"DESCRIPTION"),
              h("textarea",{value:item.desc,onChange:e=>setField("desc",e.target.value),
                placeholder:"Short description shown on menu...",
                style:{width:"100%",padding:"9px",border:"1px solid "+C.border,borderRadius:7,fontSize:11,outline:"none",resize:"none",height:60,boxSizing:"border-box",fontFamily:"inherit"}})
            ),

            // Availability toggle
            h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",background:C.bg,borderRadius:8}},
              h("div",null,
                h("div",{style:{fontSize:11,fontWeight:700}},"Available on POS"),
                h("div",{style:{fontSize:9,color:C.muted}},"Toggle to hide from ordering screen")
              ),
              h("button",{onClick:()=>setField("avail",!item.avail),
                style:{width:42,height:23,borderRadius:12,border:"none",
                  background:item.avail?C.success:"#ccc",cursor:"pointer",position:"relative"}},
                h("div",{style:{width:17,height:17,borderRadius:"50%",background:"#fff",
                  position:"absolute",top:3,transition:"all .2s",
                  left:item.avail?"calc(100% - 20px)":"3px",boxShadow:"0 1px 3px rgba(0,0,0,.3)"}})
              )
            )
          ),

          // Preview card
          h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,padding:"14px"}},
            h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:10}},"PREVIEW"),
            h("div",{style:{background:`${C.primary}0D`,borderRadius:10,padding:"14px",textAlign:"center"}},
              h("div",{style:{fontSize:44,marginBottom:6}},item.emoji),
              h("div",{style:{fontWeight:800,fontSize:13}},item.name||"Item Name"),
              h("div",{style:{fontSize:11,color:C.muted,margin:"3px 0 6px"}},item.desc||"Description"),
              h("div",{style:{fontSize:17,fontWeight:900,color:C.primary}},"₱"+(item.basePrice||0)),
              h("div",{style:{fontSize:9,color:C.muted,marginTop:3}},item.cat)
            )
          )
        ),

        // RIGHT COLUMN — variants, options, promos
        h("div",null,

          // VARIANTS / SIZES
          h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,padding:"16px",marginBottom:10}},
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
              h("div",null,
                h("div",{style:{fontWeight:800,fontSize:12,color:C.info}},"📦 Sizes / Variants"),
                h("div",{style:{fontSize:9,color:C.muted,marginTop:1}},"e.g. Solo, +Drink, 1pc, 2pcs, Regular, Large")
              ),
              h("button",{onClick:addVariant,

  return null;
}

// ─── BRANCH MENU PAGE (toggle + price override) ──────────
function BranchMenuPage({menuItems,setMenuItems,branchId,curBranch,user,db,showT,branches=BRANCHES}){
  const [overrides,setOverrides] = useState({});
  const [exclusives,setExclusives] = useState([]); // branch-only items
  const [filterCat,setFilter]    = useState("All");
  const [saving,setSaving]       = useState(null);
  const [showAddExclusive,setShowAddExclusive] = useState(false);
  const [newExItem,setNewExItem] = useState({name:"",basePrice:"",cat:"",emoji:"🍽️",desc:""});
  const [srch,setSrch]           = useState("");

  // Load overrides for this branch
  useEffect(()=>{
    const q=query(collection(db,"menu_overrides"),where("branch","==",branchId));
    const unsub=onSnapshot(q,snap=>{
      const ov={};
      const ex=[];
      snap.docs.forEach(d=>{
        const data={...d.data(),_docId:d.id};
        if(data.isExclusive){
          ex.push(data);
        } else {
          ov[data.itemId]={avail:data.avail,price:data.price,docId:d.id};
        }
      });
      setOverrides(ov);
      setExclusives(ex);
    },()=>{});
    return()=>unsub();
  },[branchId]);

  const getAvail=(item)=>overrides[item.id]?.avail!==false;
  const getPrice=(item)=>overrides[item.id]?.price??item.basePrice;

  const saveOverride=async(item,payload)=>{
    setSaving(item.id);
    try{
      await setDoc(doc(db,"menu_overrides",branchId+"_"+item.id),
        {itemId:item.id,branch:branchId,...payload},
        {merge:true});
      showT(item.name+" updated ✓");
    }catch(e){showT("Save failed","err");}
    setSaving(null);
  };

  const toggleAvail=async(item)=>{
    const newAvail=!getAvail(item);
    await saveOverride(item,{avail:newAvail});
  };

  const savePrice=async(item,price)=>{
    await saveOverride(item,{price:parseFloat(price)||item.basePrice});
  };

  const resetItem=async(item)=>{
    if(!overrides[item.id]?.docId)return;
    await deleteDoc(doc(db,"menu_overrides",overrides[item.id].docId));
    showT(item.name+" reset to main menu ✓");
  };

  const addExclusive=async()=>{
    if(!newExItem.name||!newExItem.basePrice){showT("Fill name and price","warn");return;}
    try{
      const id="ex_"+branchId+"_"+Date.now();
      await setDoc(doc(db,"menu_overrides",id),{
        isExclusive:true,
        branch:branchId,
        id,
        name:newExItem.name,
        basePrice:parseFloat(newExItem.basePrice)||0,
        cat:newExItem.cat||"Others",
        emoji:newExItem.emoji||"🍽️",
        desc:newExItem.desc||"",
        avail:true,
        createdAt:serverTimestamp(),
        createdBy:user.name
      });
      showT(newExItem.name+" added as branch-exclusive ✓");
      setNewExItem({name:"",basePrice:"",cat:"",emoji:"🍽️",desc:""});
      setShowAddExclusive(false);
    }catch(e){showT("Error","err");}
  };

  const deleteExclusive=async(ex)=>{
    if(!confirm("Remove "+ex.name+" from branch menu?"))return;
    await deleteDoc(doc(db,"menu_overrides",ex._docId));
    showT(ex.name+" removed ✓");
  };

  const cats=["All",...new Set(menuItems.map(i=>i.cat).filter(Boolean))];
  const filtered=menuItems.filter(i=>{
    if(filterCat!=="All"&&i.cat!==filterCat)return false;
    if(srch&&!i.name.toLowerCase().includes(srch.toLowerCase()))return false;
    return true;
  });

  const overrideCount=Object.keys(overrides).length;
  const hiddenCount=Object.values(overrides).filter(o=>o.avail===false).length;
  const priceCount=Object.values(overrides).filter(o=>o.price!=null).length;

  return h("div",null,
    h(SectionHeader,{title:"🍽️ Branch Menu — "+curBranch.name}),

    // Stats
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:12}},
      h(Stat,{label:"Main Menu Items",value:menuItems.length,icon:"📋",color:C.primary}),
      h(Stat,{label:"Hidden Items",value:hiddenCount,icon:"🚫",color:C.danger}),
      h(Stat,{label:"Price Overrides",value:priceCount,icon:"💰",color:C.warning}),
      h(Stat,{label:"Branch Exclusive",value:exclusives.length,icon:"⭐",color:C.success})
    ),

    // Action buttons
    h("div",{style:{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}},
      h("button",{onClick:()=>setShowAddExclusive(!showAddExclusive),
        style:{padding:"8px 16px",background:C.success,border:"none",
          borderRadius:8,color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}},
        "⭐ Add Branch-Exclusive Item"),
      h("button",{
        onClick:async()=>{
          if(!confirm("Reset ALL overrides to main menu defaults?"))return;
          const q2=query(collection(db,"menu_overrides"),where("branch","==",branchId));
          const snap=await getDocs(q2);
          for(const d of snap.docs) await deleteDoc(d.ref);
          showT("All overrides reset ✓");
        },
        style:{padding:"8px 16px",background:"#fff",border:"1px solid "+C.danger,
          borderRadius:8,color:C.danger,fontWeight:700,fontSize:12,cursor:"pointer"}},
        "🔄 Reset to Main Menu")
    ),

    // Add Exclusive Item form
    showAddExclusive&&h("div",{style:{background:"#E8F5E9",borderRadius:12,
      padding:"14px",marginBottom:12,border:"1px solid #A5D6A7"}},
      h("div",{style:{fontSize:12,fontWeight:800,marginBottom:10,color:C.success}},
        "⭐ Add Branch-Exclusive Item ("+curBranch.name+" only)"),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}},
        h("input",{value:newExItem.name,onChange:e=>setNewExItem(p=>({...p,name:e.target.value})),
          placeholder:"Item name",
          style:{padding:"8px",border:"1px solid "+C.border,borderRadius:7,fontSize:12,outline:"none"}}),
        h("input",{type:"number",onFocus:e=>e.target.select(),value:newExItem.basePrice,
          onChange:e=>setNewExItem(p=>({...p,basePrice:e.target.value})),
          placeholder:"Price",
          style:{padding:"8px",border:"1px solid "+C.border,borderRadius:7,fontSize:12,outline:"none"}}),
        h("input",{value:newExItem.cat,onChange:e=>setNewExItem(p=>({...p,cat:e.target.value})),
          placeholder:"Category",
          style:{padding:"8px",border:"1px solid "+C.border,borderRadius:7,fontSize:12,outline:"none"}})
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"80px 1fr",gap:8,marginBottom:8}},
        h("input",{value:newExItem.emoji,onChange:e=>setNewExItem(p=>({...p,emoji:e.target.value})),
          placeholder:"Emoji",
          style:{padding:"8px",border:"1px solid "+C.border,borderRadius:7,fontSize:16,outline:"none",textAlign:"center"}}),
        h("input",{value:newExItem.desc,onChange:e=>setNewExItem(p=>({...p,desc:e.target.value})),
          placeholder:"Description (optional)",
          style:{padding:"8px",border:"1px solid "+C.border,borderRadius:7,fontSize:12,outline:"none"}})
      ),
      h("div",{style:{display:"flex",gap:8}},
        h("button",{onClick:addExclusive,
          style:{padding:"9px 20px",background:C.success,border:"none",
            borderRadius:8,color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}},
          "✅ Add Item"),
        h("button",{onClick:()=>setShowAddExclusive(false),
          style:{padding:"9px 16px",background:"#fff",border:"1px solid "+C.border,
            borderRadius:8,fontSize:12,cursor:"pointer"}},"Cancel")
      )
    ),

    // Search + filter
    h("div",{style:{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}},
      h("input",{value:srch,onChange:e=>setSrch(e.target.value),
        placeholder:"🔍 Search menu...",
        style:{flex:1,padding:"8px 14px",border:"1px solid "+C.border,
          borderRadius:20,fontSize:12,outline:"none",minWidth:180}}),
      cats.map(c=>h("button",{key:c,onClick:()=>setFilter(c),
        style:{padding:"5px 12px",borderRadius:20,fontSize:10,border:"none",
          cursor:"pointer",fontWeight:filterCat===c?700:400,
          background:filterCat===c?C.primary:"#eee",
          color:filterCat===c?"#fff":C.muted}},c))
    ),

    // Branch-exclusive items section
    exclusives.length>0&&h("div",{style:{marginBottom:14}},
      h("div",{style:{fontSize:10,fontWeight:700,color:C.success,
        letterSpacing:1,marginBottom:6,display:"flex",alignItems:"center",gap:6}},
        "⭐ BRANCH-EXCLUSIVE ITEMS ("+curBranch.name+" only)"),
      h("div",{style:{background:"#fff",borderRadius:10,border:"2px solid "+C.success,overflow:"hidden"}},
        exclusives.map((ex,i)=>h("div",{key:ex._docId,
          style:{display:"grid",gridTemplateColumns:"40px 1fr 80px 80px 80px",
            padding:"10px 14px",alignItems:"center",
            borderBottom:i<exclusives.length-1?"1px solid #f5f5f5":"none",
            background:"#F1F8E9"}},
          h("div",{style:{fontSize:24}},ex.emoji||"🍽️"),
          h("div",null,
            h("div",{style:{fontWeight:700,fontSize:12}},ex.name),
            h("div",{style:{fontSize:9,color:C.muted}},ex.cat+" · "+ex.desc)
          ),
          h("div",{style:{fontWeight:800,color:C.success,fontSize:13}},
            "₱"+parseFloat(ex.basePrice||0).toFixed(0)),
          h("div",{style:{fontSize:9,padding:"2px 8px",background:C.success+"20",
            color:C.success,borderRadius:10,fontWeight:700}},"Exclusive"),
          h("button",{onClick:()=>deleteExclusive(ex),
            style:{background:"none",border:"none",color:C.danger,
              cursor:"pointer",fontSize:14,fontWeight:700}},"×")
        ))
      )
    ),

    // Main menu items with overrides
    h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
      h("div",{style:{display:"grid",
        gridTemplateColumns:"36px 1fr 120px 100px 80px 80px",
        padding:"8px 14px",background:"#f5f5f5",
        fontSize:9,fontWeight:700,color:C.muted,letterSpacing:1}},
        "","ITEM","BRANCH PRICE","MAIN PRICE","STATUS","RESET"),
      filtered.map((item,i)=>{
        const avail=getAvail(item);
        const price=getPrice(item);
        const hasOverride=overrides[item.id]!=null;
        const priceChanged=overrides[item.id]?.price!=null&&overrides[item.id].price!==item.basePrice;
        return h("div",{key:item.id,
          style:{display:"grid",
            gridTemplateColumns:"36px 1fr 120px 100px 80px 80px",
            padding:"10px 14px",alignItems:"center",
            borderBottom:i<filtered.length-1?"1px solid #f5f5f5":"none",
            background:!avail?"#FFEBEE":priceChanged?"#FFF8E1":"#fff",
            opacity:avail?1:0.7}},
          h("div",{style:{fontSize:22}},item.emoji||"🍽️"),
          h("div",null,
            h("div",{style:{fontWeight:700,fontSize:12,color:avail?C.text:"#999"}},
              item.name+(hasOverride?" ✏️":"")),
            h("div",{style:{fontSize:9,color:C.muted}},item.cat)
          ),
          // Branch price (editable)
          h("div",{style:{display:"flex",gap:4,alignItems:"center"}},
            h("span",{style:{color:C.muted,fontSize:11}},"₱"),
            h("input",{type:"number",onFocus:e=>e.target.select(),
              value:price||"",
              onChange:e=>{savePrice(item,e.target.value);},
              style:{width:70,padding:"5px 6px",
                border:"1px solid "+(priceChanged?C.warning:C.border),
                borderRadius:6,fontSize:12,fontWeight:priceChanged?700:400,
                color:priceChanged?C.warning:C.text,outline:"none",
                background:priceChanged?"#FFFDE7":"#fff"}})
          ),
          // Main price (reference)
          h("div",{style:{fontSize:11,color:C.muted}},"₱"+item.basePrice),
          // Toggle
          h("button",{onClick:()=>toggleAvail(item),
            style:{padding:"5px 10px",borderRadius:20,border:"none",
              cursor:"pointer",fontSize:10,fontWeight:700,
              background:avail?C.success+"20":C.danger+"20",
              color:avail?C.success:C.danger}},
            saving===item.id?"...":(avail?"✅ ON":"🚫 OFF")),
          // Reset
          hasOverride?h("button",{onClick:()=>resetItem(item),
            style:{padding:"4px 8px",background:"#fff",border:"1px solid "+C.border,
              borderRadius:6,fontSize:9,cursor:"pointer",color:C.muted}},"↺ Reset")
          :h("div",{style:{fontSize:9,color:"#ddd"}},"—")
        );
      })
    )
  );
}


function IngredientsPage({db,user,showT}){
  const [ings,setIngs]       = useState([]);
  const [editing,setEditing] = useState(null); // null | "new" | {id,...}
  const [srch,setSrch]       = useState("");
  const [saving,setSaving]   = useState(false);
  const UNITS=["pc","kg","g","L","ml","pack","box","tray","sachet","tbsp","tsp","cup","roll","sheet","EA"];
  const CATS=["Protein","Produce","Frozen","Sauce","Dairy","Dry Goods","Packaging","Beverage","Other"];

  const blank=()=>({
    id:"ing_"+Date.now(),
    name:"",unit:"pc",cat:"Other",
    cost:0,   // cost per unit
    stock:0,  // current stock (optional - can sync with inventory)
    supplier:"",notes:""
  });

  useEffect(()=>{
    const unsub=onSnapshot(collection(db,"ingredients"),snap=>{
      setIngs(snap.docs.map(d=>({...d.data(),id:d.id}))
        .sort((a,b)=>(a.name||"").localeCompare(b.name||"")));
    },()=>{});
    return()=>unsub();
  },[]);

  const save=async()=>{
    if(!editing||!editing.name.trim()){showT("Enter ingredient name","warn");return;}
    if(!editing.unit){showT("Select unit","warn");return;}
    setSaving(true);
    try{
      if(editing._isNew){
        const {_isNew,...data}=editing;
        await setDoc(doc(db,"ingredients",editing.id),{
          ...data,createdAt:serverTimestamp(),by:user.name
        });
      } else {
        await updateDoc(doc(db,"ingredients",editing.id),{
          ...editing,updatedAt:serverTimestamp(),by:user.name
        });
      }
      showT(editing.name+" saved ✓");
      setEditing(null);
    }catch(e){showT("Error saving","err");}
    setSaving(false);
  };

  const del=async(ing)=>{
    if(!confirm("Delete "+ing.name+"?"))return;
    try{
      await deleteDoc(doc(db,"ingredients",ing.id));
      showT(ing.name+" deleted");
      if(editing&&editing.id===ing.id)setEditing(null);
    }catch(e){showT("Error","err");}
  };

  const filtered=ings.filter(i=>
    !srch||(i.name||"").toLowerCase().includes(srch.toLowerCase())
  );

  // Group by category
  const grouped={};
  filtered.forEach(i=>{
    const c=i.cat||"Other";
    if(!grouped[c])grouped[c]=[];
    grouped[c].push(i);
  });

  return h("div",null,
    h("div",{style:{display:"flex",justifyContent:"space-between",
      alignItems:"center",marginBottom:14}},
      h("div",null,
        h("div",{style:{fontSize:17,fontWeight:900}},"🥩 Ingredients Master List"),
        h("div",{style:{fontSize:10,color:C.muted}},
          ings.length+" ingredients · Used for BOM costing & deduction")
      ),
      h("button",{onClick:()=>setEditing({...blank(),_isNew:true}),
        style:{padding:"8px 16px",background:C.primary,border:"none",
          borderRadius:9,color:"#fff",fontWeight:800,fontSize:12,cursor:"pointer"}},
        "+ Add Ingredient")
    ),

    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 360px",gap:14}},

      // LEFT: ingredient list
      h("div",null,
        // Search
        h("input",{value:srch,onChange:e=>setSrch(e.target.value),
          placeholder:"🔍 Search ingredients...",
          style:{width:"100%",padding:"9px 14px",border:"1px solid "+C.border,
            borderRadius:9,fontSize:12,outline:"none",
            boxSizing:"border-box",marginBottom:12}}),

        // Grouped list
        Object.keys(grouped).sort().map(cat=>
          h("div",{key:cat,style:{marginBottom:12}},
            h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,
              letterSpacing:1,marginBottom:6,
              paddingLeft:4,borderLeft:"3px solid "+C.primary}},
              cat.toUpperCase()+" ("+grouped[cat].length+")"),
            h("div",{style:{background:"#fff",borderRadius:10,
              border:"1px solid "+C.border,overflow:"hidden"}},
              grouped[cat].map((ing,i)=>
                h("div",{key:ing.id,
                  style:{display:"grid",
                    gridTemplateColumns:"1fr 80px 80px 100px 80px",
                    padding:"9px 14px",alignItems:"center",
                    borderBottom:i<grouped[cat].length-1?"1px solid #f5f5f5":"none",
                    background:editing&&editing.id===ing.id?"#FFF8F0":"#fff",
                    cursor:"pointer"},
                  onClick:()=>setEditing({...ing})},
                  h("div",{style:{fontWeight:600,fontSize:12}},ing.name),
                  h("div",{style:{fontSize:10,color:C.muted}},ing.unit),
                  h("div",{style:{fontSize:11,fontWeight:700,color:C.primary}},
                    "₱"+peso(ing.cost||0)),
                  h("div",{style:{fontSize:9,color:C.muted}},ing.supplier||"—"),
                  h("div",{style:{display:"flex",gap:4}},
                    h("button",{onClick:e=>{e.stopPropagation();setEditing({...ing});},
                      style:{padding:"3px 8px",background:"#f0f0f0",border:"none",
                        borderRadius:5,fontSize:10,cursor:"pointer"}},"✏️"),
                    h("button",{onClick:e=>{e.stopPropagation();del(ing);},
                      style:{padding:"3px 8px",background:"#FFEBEE",border:"none",
                        borderRadius:5,fontSize:10,cursor:"pointer",color:C.danger}},"×")
                  )
                )
              )
            )
          )
        ),

        filtered.length===0&&h("div",{style:{padding:"40px",textAlign:"center",
          color:C.muted,background:"#fff",borderRadius:10,
          border:"1px solid "+C.border}},
          h("div",{style:{fontSize:32,marginBottom:8}},"🥩"),
          h("div",{style:{fontWeight:700,fontSize:13}},
            srch?"No ingredients found":"No ingredients yet"),
          h("div",{style:{fontSize:11,marginTop:4}},
            "Click + Add Ingredient to start adding")
        )
      ),

      // RIGHT: edit form
      !editing
        ? h("div",{style:{background:"#fff",borderRadius:12,
            border:"1px solid "+C.border,padding:"40px",
            textAlign:"center",color:C.muted}},
            h("div",{style:{fontSize:32,marginBottom:8}},"👈"),
            h("div",{style:{fontWeight:700}},"Select an ingredient to edit"),
            h("div",{style:{fontSize:11,marginTop:4}},
              "or click + Add Ingredient"))
        : h("div",{style:{background:"#fff",borderRadius:12,
            border:"1px solid "+C.border,overflow:"hidden",
            position:"sticky",top:0}},
            h("div",{style:{padding:"12px 16px",
              background:"linear-gradient(135deg,"+C.primary+"15,#fff)",
              borderBottom:"1px solid "+C.border,
              display:"flex",justifyContent:"space-between",alignItems:"center"}},
              h("div",{style:{fontSize:13,fontWeight:900}},
                editing._isNew?"New Ingredient":"Edit: "+editing.name),
              h("button",{onClick:()=>setEditing(null),
                style:{background:"none",border:"none",fontSize:18,
                  cursor:"pointer",color:C.muted}},"×")
            ),
            h("div",{style:{padding:"16px"}},
              // Name
              h("div",{style:{marginBottom:10}},
                h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,
                  letterSpacing:1,marginBottom:4}},"INGREDIENT NAME *"),
                h("input",{value:editing.name||"",
                  onChange:e=>setEditing(p=>({...p,name:e.target.value})),
                  placeholder:"e.g. Chicken Fillet, Buffalo Sauce...",
                  style:{width:"100%",padding:"9px",border:"2px solid "+C.primary,
                    borderRadius:8,fontSize:13,fontWeight:700,
                    outline:"none",boxSizing:"border-box"}})
              ),

              // Unit + Category
              h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",
                gap:8,marginBottom:10}},
                h("div",null,
                  h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,
                    letterSpacing:1,marginBottom:4}},"UNIT *"),
                  h("select",{value:editing.unit||"",
                    onChange:e=>setEditing(p=>({...p,unit:e.target.value})),
                    style:{width:"100%",padding:"8px",border:"1px solid "+C.border,
                      borderRadius:8,fontSize:12,outline:"none"}},
                    UNITS.map(u=>h("option",{key:u,value:u},u)))
                ),
                h("div",null,
                  h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,
                    letterSpacing:1,marginBottom:4}},"CATEGORY"),
                  h("select",{value:editing.cat||"Other",
                    onChange:e=>setEditing(p=>({...p,cat:e.target.value})),
                    style:{width:"100%",padding:"8px",border:"1px solid "+C.border,
                      borderRadius:8,fontSize:12,outline:"none"}},
                    CATS.map(c=>h("option",{key:c,value:c},c)))
                )
              ),

              // Cost per unit
              h("div",{style:{marginBottom:10}},
                h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,
                  letterSpacing:1,marginBottom:4}},"COST PER UNIT (₱) *"),
                h("input",{type:"number",onFocus:e=>e.target.select(),min:0,step:"0.01",
                  value:editing.cost||"",
                  onChange:e=>setEditing(p=>({...p,cost:parseFloat(e.target.value)||0})),
                  placeholder:"0.00",
                  style:{width:"100%",padding:"9px",border:"1px solid "+C.border,
                    borderRadius:8,fontSize:14,fontWeight:700,
                    outline:"none",boxSizing:"border-box",
                    color:C.primary}})
              ),

              // Supplier
              h("div",{style:{marginBottom:14}},
                h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,
                  letterSpacing:1,marginBottom:4}},"SUPPLIER (optional)"),
                h("input",{value:editing.supplier||"",
                  onChange:e=>setEditing(p=>({...p,supplier:e.target.value})),
                  placeholder:"e.g. San Miguel Foods, local market...",
                  style:{width:"100%",padding:"8px",border:"1px solid "+C.border,
                    borderRadius:8,fontSize:12,outline:"none",boxSizing:"border-box"}})
              ),

              // Cost preview
              editing.cost>0&&h("div",{style:{padding:"10px 14px",
                background:"#E8F5E9",borderRadius:8,marginBottom:12,
                display:"flex",justifyContent:"space-between"}},
                h("span",{style:{fontSize:11,color:C.muted}},
                  "Cost per "+editing.unit+":"),
                h("span",{style:{fontSize:14,fontWeight:900,color:C.success}},
                  "₱"+peso(editing.cost||0))
              ),

              h("div",{style:{display:"flex",gap:8}},
                h("button",{onClick:()=>setEditing(null),
                  style:{padding:"9px 16px",background:"#fff",
                    border:"1px solid "+C.border,borderRadius:8,
                    fontSize:12,fontWeight:700,cursor:"pointer"}},"Cancel"),
                h("button",{onClick:save,disabled:saving,
                  style:{flex:1,padding:"10px",
                    background:saving?"#ccc":C.primary,
                    border:"none",borderRadius:8,color:"#fff",
                    fontWeight:800,fontSize:13,cursor:"pointer"}},
                  saving?"Saving...":"💾 Save Ingredient")
              )
            )
          )
    )
  );
}

// ─── BOM MANAGER COMPONENT ───────────────────────────────
const UNITS = ["pc","pack","box","sack","kg","g","L","mL","cup","gal","tray","dozen","set","sheet","bottle","can","bag"];

// ── PACK MODEL ─────────────────────────────────────────────────────
// `stock` is ALWAYS carried in the item's base unit (item.unit) — deduction
// never has to convert, so the hot path stays as it is today.
// packSize/packUnit describe how the item is BOUGHT and COUNTED, and are used
// only at the edges: receiving, physical count, PO, and display.
// Items without packSize behave exactly as before.
function packSizeOf(it){ const n=Number(it&&it.packSize)||0; return n>1?n:0; }
function packUnitOf(it){ return (it&&it.packUnit)||"pack"; }
function baseUnitOf(it){ return (it&&it.unit)||""; }
// packs + loose base units -> base units
function packsToBase(it,packs,loose){
  const sz=packSizeOf(it)||1;
  return (Number(packs)||0)*sz+(Number(loose)||0);
}
// base units -> {packs, loose}
function baseToPacks(it,base){
  const sz=packSizeOf(it);
  const b=Number(base)||0;
  if(!sz)return {packs:0,loose:b,hasPacks:false};
  return {packs:Math.floor(b/sz),loose:Math.round((b%sz)*1000)/1000,hasPacks:true};
}
// Money always renders with thousands separators. Reading P330000.00 off a
// screen is guesswork; P330,000.00 is not.
const peso=(v)=>(Number(v)||0).toLocaleString("en-PH",
  {minimumFractionDigits:2,maximumFractionDigits:2});

const _n=(v)=>{const x=Math.round((Number(v)||0)*1000)/1000;return x.toLocaleString("en-PH");};
// "4,484 pc" or "4,484 pc = 149 box + 14 pc"
function fmtStock(it,base){
  const b=(base!==undefined&&base!==null)?base:(it&&it.stock);
  const sz=packSizeOf(it);
  const txt=_n(b)+" "+baseUnitOf(it);
  if(!sz)return txt;
  const s=baseToPacks(it,b);
  return txt+" = "+_n(s.packs)+" "+packUnitOf(it)+(s.loose?" + "+_n(s.loose)+" "+baseUnitOf(it):"");
}
// short form for tight rows: "149 box + 14 pc"
function fmtPacks(it,base){
  const sz=packSizeOf(it);
  if(!sz)return "";
  const s=baseToPacks(it,(base!==undefined&&base!==null)?base:(it&&it.stock));
  return _n(s.packs)+" "+packUnitOf(it)+(s.loose?" + "+_n(s.loose)+" "+baseUnitOf(it):"");
}

function BOMPage({menuItems,db,user,showT,inventory=[],optGroups=[]}){
  const [mainTab,setMainTab] = useState("products");
  // Products tab state
  const [selItem,setSelItem]     = useState(null);
  const [selVariant,setSelVar]   = useState("default");
  const [itemBomTab,setItemBomTab] = useState("variants");
  const [boms,setBoms]           = useState({});
  const [editBom,setEditBom]     = useState([]);
  const [saving,setSaving]       = useState(false);
  const [costTab,setCostTab]     = useState("bom");
  // Item Options sub-tab state
  const [selItemOpt,setSelItemOpt]       = useState(null);
  const [editItemOptBom,setEditItemOptBom] = useState([]);
  const [savingItemOpt,setSavingItemOpt] = useState(false);
  // Option Groups tab state
  const [groups,setGroups]       = useState([]);  // [{id,name,choices:[{id,label}]}]
  const [selGroup,setSelGroup]   = useState(null);
  const [selChoice,setSelChoice] = useState(null);
  const [editOptBom,setEditOptBom] = useState([]);
  const [savingOpt,setSavingOpt] = useState(false);
  // New group/choice form
  const [newGrpName,setNewGrpName]   = useState("");
  const [newChoiceLbl,setNewChoiceLbl] = useState("");
  const [newChoicePrice,setNewChoicePrice] = useState("");
  const [showAddGrp,setShowAddGrp]   = useState(false);
  const [showAddChoice,setShowAddChoice] = useState(false);
  const [editingGrp,setEditingGrp]   = useState(null); // group id being renamed
  const [editingChoice,setEditingChoice] = useState(null); // choice id being renamed
  const [editChVal,setEditChVal]         = useState("");   // controlled label
  const [editChPrice,setEditChPrice]     = useState("");   // controlled priceAdd

  const ingredients = inventory;

  // Load BOMs
  useEffect(()=>{
    const unsub=onSnapshot(collection(db,"bom"),snap=>{
      const b={};
      snap.docs.forEach(d=>{b[d.id]={...d.data()};});
      setBoms(b);
    },()=>{});
    return()=>unsub();
  },[]);

  // Load Option Groups from Firebase option_groups collection
  useEffect(()=>{
    const unsub=onSnapshot(collection(db,"option_groups"),snap=>{
      setGroups(snap.docs.map(d=>({...d.data(),id:d.id})));
    },()=>{});
    return()=>unsub();
  },[]);

  const variantList=(item)=>{
    const v=["default"];
    (item.variants||[]).forEach(vv=>{if(vv.label)v.push(vv.label);});
    return v;
  };
  const getVKey=(item,v)=>(!v||v==="default")?item.id:item.id+"__"+v.replace(/\s+/g,"_");
  const hasBOM=(item,v="default")=>{
    const key=getVKey(item,v);
    return !!(boms[item.id]&&(boms[item.id][key]||[]).length>0);
  };
  const getCost=(rows)=>rows.reduce((s,r)=>{
    const ing=ingredients.find(x=>x.id===r.ingId)||{};
    const factor=r.convFactor||1;
    return s+(ing.cost||0)*(r.qty||0)/factor*(1+(r.markup||0)/100);
  },0);

  const openBOM=(item,v="default")=>{
    setSelItem(item); setSelVar(v);
    setItemBomTab("variants"); setSelItemOpt(null);
    const key=getVKey(item,v);
    const rows=(boms[item.id]&&boms[item.id][key])||[];
    setEditBom(rows.length?[...rows]:[{ingId:"",ingName:"",unit:"",qty:1,convFactor:1,markup:0}]);
  };

  const saveBOM=async()=>{
    if(!selItem)return;
    setSaving(true);
    try{
      const key=getVKey(selItem,selVariant);
      const rows=editBom.filter(r=>r.ingId||r.ingName);
      await setDoc(doc(db,"bom",selItem.id),
        Object.assign({},boms[selItem.id]||{},{[key]:rows}),{merge:true});
      showT("BOM saved ✓");
    }catch(e){showT("Error saving","err");}
    setSaving(false);
  };

  // selGroup is a snapshot captured on click — it never refreshes when the
  // onSnapshot listener updates `groups`. Reading choices from it means edits
  // are computed against stale data and can silently clobber newer ones.
  // Always resolve against the live list.
  const liveGroup = selGroup ? (groups.find(g=>g.id===selGroup.id)||selGroup) : null;
  const liveChoices = (liveGroup&&liveGroup.choices)||[];

  // Save a renamed / repriced choice
  const saveChoiceEdit=async(ch)=>{
    const label=(editChVal||"").trim();
    if(!label){showT("Enter choice name","warn");return;}
    if(liveChoices.find(c=>c.id!==ch.id&&c.label===label)){
      showT("May ganitong choice na","warn");return;
    }
    const price=parseFloat(editChPrice)||0;
    if(label===ch.label&&price===(ch.priceAdd||0)){setEditingChoice(null);return;}
    const newChoices=liveChoices.map(c=>c.id===ch.id?Object.assign({},c,{label:label,priceAdd:price}):c);
    try{
      await updateDoc(doc(db,"option_groups",liveGroup.id),{choices:newChoices});
      setEditingChoice(null);
      showT("Saved ✓");
    }catch(err){
      console.error("Save choice failed:",err);
      showT("Save failed: "+((err&&err.message)||err).toString().slice(0,70),"err");
    }
  };

  // Create new option group
  const createGroup=async()=>{
    const name=newGrpName.trim();
    if(!name){showT("Enter group name","warn");return;}
    if(groups.find(g=>g.name===name)){showT("Group already exists","warn");return;}
    try{
      const id="grp_"+Date.now();
      await setDoc(doc(db,"option_groups",id),{id,name,choices:[],createdBy:user.name,createdAt:serverTimestamp()});
      setNewGrpName(""); setShowAddGrp(false);
      showT(name+" created ✓");
    }catch(e){showT("Error","err");}
  };

  // Add choice to group
  const addChoice=async()=>{
    const label=newChoiceLbl.trim();
    if(!label||!selGroup){showT("Enter choice name","warn");return;}
    if(liveChoices.find(c=>c.label===label)){showT("Choice already exists","warn");return;}
    const price=parseFloat(newChoicePrice)||0;
    const newChoices=[...liveChoices,{id:"ch_"+Date.now(),label,priceAdd:price}];
    try{
      await updateDoc(doc(db,"option_groups",selGroup.id),{choices:newChoices});
      setNewChoiceLbl(""); setNewChoicePrice(""); setShowAddChoice(false);
      showT(label+" added ✓");
    }catch(e){showT("Error","err");}
  };

  // Delete choice
  const deleteChoice=async(ch)=>{
    if(!confirm("Delete choice \""+ch.label+"\"?"))return;
    const newChoices=liveChoices.filter(c=>c.id!==ch.id);
    try{
      await updateDoc(doc(db,"option_groups",selGroup.id),{choices:newChoices});
      if(selChoice&&selChoice.id===ch.id){setSelChoice(null);setEditOptBom([]);}
      showT(ch.label+" deleted");
    }catch(e){showT("Error","err");}
  };

  // Delete group
  const deleteGroup=async(grp)=>{
    if(!confirm("Delete group \""+grp.name+"\" and all its BOMs?"))return;
    try{
      await deleteDoc(doc(db,"option_groups",grp.id));
      // Also delete BOM for this group
      const bomRef=doc(db,"bom","optgrp_"+grp.id);
      await deleteDoc(bomRef).catch(()=>{});
      if(selGroup&&selGroup.id===grp.id){setSelGroup(null);setSelChoice(null);setEditOptBom([]);}
      showT(grp.name+" deleted");
    }catch(e){showT("Error","err");}
  };

  // Save option group BOM
  const saveOptBOM=async()=>{
    if(!selChoice||!selGroup)return;
    setSavingOpt(true);
    try{
      const key="optgrp_"+selGroup.id+"__"+selChoice.id;
      const rows=editOptBom.filter(r=>r.ingId||r.ingName);
      const docId="optgrp_"+selGroup.id;
      await setDoc(doc(db,"bom",docId),
        Object.assign({},boms[docId]||{},{[key]:rows}),{merge:true});
      showT(selChoice.label+" BOM saved ✓");
    }catch(e){showT("Error","err");}
    setSavingOpt(false);
  };

  // BOMEditor sub-component.
  // NOTE: call this as BOMEditor({...}), NOT h(BOMEditor,{...}).
  // It is defined inside the parent, so h() would give React a new element type
  // on every render and remount the inputs (focus loss after each keystroke).
  const BOMEditor=({rows,setRows,onSave,saving:sv})=>h("div",null,
    h("div",{style:{display:"grid",
      gridTemplateColumns:"1fr 80px 70px 110px 60px 80px 36px",
      gap:6,marginBottom:6,padding:"0 2px"}},
      ["INGREDIENT","QTY/SERVING","UNIT USED","CONV (1 STK=X)","MARKUP%","DEDUCTS",""].map(h2=>
        h("div",{key:h2,style:{fontSize:8,fontWeight:700,color:C.muted,letterSpacing:1}},h2))
    ),
    rows.map((row,i)=>{
      const ing=ingredients.find(x=>x.id===row.ingId)||{};
      const factor=row.convFactor||1;
      const actualDeduct=(row.qty||0)/factor;
      const cost=(ing.cost||0)*actualDeduct*(1+(row.markup||0)/100);
      const baseU=String(ing.unit||"");
      const usedU=String(row.deductUnit||row.unit||"");
      const pSz=packSizeOf(ing);
      const pU=packUnitOf(ing);
      const mismatch=!!(baseU&&usedU&&usedU.toLowerCase()!==baseU.toLowerCase());
      const usesPack=!!(mismatch&&pSz>0&&pU&&usedU.toLowerCase()===String(pU).toLowerCase());
      return h("div",{key:i,style:{marginBottom:6}},
      h("div",{style:{display:"grid",
        gridTemplateColumns:"1fr 80px 70px 110px 60px 80px 36px",
        gap:6,alignItems:"center"}},
        h("select",{value:row.ingId||"",
          onChange:e=>{
            const g=ingredients.find(x=>x.id===e.target.value)||{};
            // Seed the recipe in the ingredient's OWN unit so conv stays 1.
            // packSize is deliberately NOT used here — it converts pack<->base
            // for buying and counting, not recipe<->stock.
            const u=[...rows];
            u[i]={...u[i],ingId:e.target.value,ingName:g.name||"",unit:g.unit||"",
              deductUnit:g.unit||"",convUnit:g.unit||"",convFactor:1};
            setRows(u);
          },
          style:{padding:"5px",border:"1px solid "+C.border,borderRadius:6,fontSize:10,outline:"none"}},
          h("option",{value:""},"— Select —"),
          ingredients.map(x=>h("option",{key:x.id,value:x.id},x.name+(x.unit?" ("+x.unit+")":"")))
        ),
        h("input",{type:"number",onFocus:e=>e.target.select(),min:0,step:"0.01",
          defaultValue:row.qty||"",key:"qty-"+i+"-"+row.ingId,
          onBlur:e=>{const u=[...rows];u[i]={...u[i],qty:parseFloat(e.target.value)||0};setRows(u);},

        h("input",{
          defaultValue:row.deductUnit||row.unit||"",key:"unit-"+i+"-"+row.ingId,placeholder:"pcs",

        h("div",{style:{display:"flex",alignItems:"center",gap:2,background:"#f0f4ff",borderRadius:6,padding:"3px 4px"}},
          h("span",{style:{fontSize:8,color:C.muted}},"1"),
          h("input",{defaultValue:row.convUnit||ing.unit||"",key:"cvu-"+i+"-"+row.ingId,placeholder:ing.unit||"stk",
