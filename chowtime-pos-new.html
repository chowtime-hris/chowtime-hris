          h("span",{style:{fontSize:8,color:C.muted}},"="),
          h("input",{type:"number",onFocus:e=>e.target.select(),min:1,defaultValue:row.convFactor||"",key:"cvf-"+i+"-"+row.ingId,placeholder:"1",
            onBlur:e=>{const u=[...rows];u[i]={...u[i],convFactor:parseFloat(e.target.value)||1};setRows(u);},
            style:{width:22,padding:"2px",border:"1px solid "+C.border,borderRadius:4,fontSize:9,outline:"none",textAlign:"center"}})
        ),
        h("div",{style:{display:"flex",alignItems:"center",gap:2}},
          h("input",{type:"number",onFocus:e=>e.target.select(),min:0,max:999,defaultValue:row.markup||"",key:"mkp-"+i+"-"+row.ingId,placeholder:"0",
            onBlur:e=>{const u=[...rows];u[i]={...u[i],markup:parseFloat(e.target.value)||0};setRows(u);},
            style:{width:32,padding:"3px",border:"1px solid "+C.border,borderRadius:5,fontSize:10,outline:"none",textAlign:"center"}}),
          h("span",{style:{fontSize:9,color:C.muted}},"%")
        ),
        h("div",{style:{fontSize:9}},
          h("div",{style:{color:C.primary,fontWeight:700}},cost>0?"₱"+peso(cost):"—"),
          h("div",{style:{color:C.muted,fontSize:8}},
            actualDeduct>0?(actualDeduct.toFixed(3).replace(/\.?0+$/,"")+" "+(row.convUnit||ing.unit||"")):"—")
        ),
        h("button",{onClick:()=>setRows(rows.filter((_,j)=>j!==i)),
          style:{background:"none",border:"none",color:C.danger,fontSize:16,cursor:"pointer",lineHeight:1}},
          "×")
      ),
      // Same unit on both sides but CONV != 1 divides the recipe amount for no
      // reason — the money still looks right, only the quantity is wrong.
      (!mismatch&&row.ingId&&factor!==1)&&h("div",{style:{background:"#FFEBEE",
        border:"1px solid #FFCDD2",borderRadius:6,padding:"5px 8px",marginTop:3,
        display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}},
        h("div",{style:{flex:1,minWidth:180,fontSize:9,color:C.danger,fontWeight:700}},
          "⚠️ Parehong "+baseU+" ang recipe at stock, pero CONV = "+factor+
          " — "+(row.qty||0)+" "+baseU+" ay nagiging "+actualDeduct.toFixed(3).replace(/\.?0+$/,"")+
          " "+baseU+" lang. Dapat 1."),
        h("button",{
          onClick:()=>{const u=[...rows];u[i]={...u[i],convFactor:1};setRows(u);},
          style:{padding:"4px 9px",borderRadius:6,border:"none",background:C.danger,
            color:"#fff",fontSize:9,fontWeight:800,cursor:"pointer"}},
          "Ibalik sa 1")
      ),
      // Cost basis is the other half people get wrong: a pack price entered as
      // a per-piece cost inflates every recipe by the pack size.
      (row.ingId&&pSz>0&&(ing.cost||0)>0)&&h("div",{style:{background:"#E3F2FD",
        borderRadius:6,padding:"5px 8px",marginTop:3,fontSize:9,color:"#1565C0"}},
        h("b",null,"Cost check: "),
        "₱"+peso(ing.cost||0)+" kada "+baseU+
        "  →  ₱"+peso(((ing.cost||0)*pSz))+" kada "+pU+" ("+pSz+" "+baseU+")",
        h("div",{style:{marginTop:2}},
          "Kung hindi ito ang bayad mo kada "+pU+", ang naka-set na cost ay presyo ng buong "+pU+

      ),
      // Stock is held in the ingredient's base unit. A recipe written in any
      // other unit silently deducts the wrong amount unless CONV is set by hand.
      mismatch&&h("div",{style:{background:usesPack?"#FFF8E1":"#FFEBEE",

        h("div",{style:{flex:1,minWidth:180,fontSize:9,
          color:usesPack?"#E65100":C.danger,fontWeight:700}},
          usesPack

            : ("⚠️ Recipe naka-"+usedU+", stock naka-"+baseU+" — itakda ang CONV nang manu-mano o mali ang mababawas.")),
        usesPack&&h("button",{
          onClick:()=>{
            const u=[...rows];
            u[i]={...u[i],qty:(parseFloat(row.qty)||0)*pSz,
              deductUnit:baseU,convUnit:baseU,convFactor:1};

    }),
    h("div",{style:{display:"flex",gap:8,marginTop:10}},
      h("button",{

      h("button",{onClick:onSave,disabled:sv,
        style:{flex:1,padding:"8px",borderRadius:8,border:"none",

          color:"#fff",fontWeight:700,fontSize:12,cursor:sv?"not-allowed":"pointer"}},
        sv?"Saving...":"💾 Save BOM")
    ),
    rows.length>0&&h("div",{style:{marginTop:8,padding:"6px 10px",background:"#f5f5f5",
      borderRadius:8,fontSize:10,fontWeight:700}},

  return h("div",null,
    // Main tab buttons
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}},

      h("div",{style:{display:"flex",gap:0,border:"1px solid "+C.border,borderRadius:9,overflow:"hidden"}},

            onClick:()=>{setMainTab(id);setSelItem(null);setSelGroup(null);setSelChoice(null);},
            style:{padding:"7px 16px",border:"none",cursor:"pointer",fontSize:11,

              background:mainTab===id?C.primary:"#fff",
              color:mainTab===id?"#fff":C.text}},lbl))
      )
    ),

    // ══ PRODUCTS TAB ══════════════════════════════════════
    mainTab==="products"&&h("div",null,
      h("div",{style:{display:"flex",gap:8,marginBottom:10}},
        [["bom","BOM Editor"],["costing","Costing Report"]].map(([id,lbl])=>
          h("button",{key:id,onClick:()=>setCostTab(id),
            style:{padding:"5px 14px",borderRadius:7,border:"none",cursor:"pointer",
              fontSize:11,fontWeight:costTab===id?700:400,
              background:costTab===id?"#333":"#eee",
              color:costTab===id?"#fff":C.text}},lbl))
      ),
      costTab==="bom"&&h("div",{style:{display:"grid",gridTemplateColumns:"260px 1fr",gap:12}},
        // Left: menu items
        h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
          h("div",{style:{padding:"10px 14px",borderBottom:"1px solid "+C.border,fontSize:11,fontWeight:800}},"Menu Items"),
          h("div",{style:{overflowY:"auto",maxHeight:"70vh"}},
            menuItems.map(item=>{
              const isSel=selItem&&selItem.id===item.id;
              const vList=variantList(item);
              return h("div",{key:item.id},
                h("div",{style:{padding:"8px 14px",cursor:"pointer",
                  background:isSel&&selVariant==="default"?"#FFF0F0":"#fff",
                  borderBottom:"1px solid #f5f5f5",
                  display:"flex",justifyContent:"space-between",alignItems:"center"},
                  onClick:()=>openBOM(item,"default")},
                  h("div",{style:{fontSize:11,fontWeight:isSel?700:400}},

                  h("span",{style:{fontSize:9,fontWeight:700,
                    color:hasBOM(item)?C.success:C.muted}},
                    hasBOM(item)?"✓":"—")
                ),
                vList.length>1&&vList.slice(1).map(v=>
                  h("div",{key:v,onClick:()=>openBOM(item,v),
                    style:{padding:"5px 14px 5px 26px",cursor:"pointer",
                      background:isSel&&selVariant===v?"#FFF8F0":"#fafafa",
                      borderBottom:"1px solid #f5f5f5",
                      display:"flex",justifyContent:"space-between"}},
                    h("div",{style:{fontSize:10,color:C.muted}},"↳ "+v),
                    h("span",{style:{fontSize:8,color:hasBOM(item,v)?C.success:C.muted}},
                      hasBOM(item,v)?"✓":"—")
                  ))
              );
            })
          )
        ),
        // Right: BOM editor
        !selItem
          ? h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,
              padding:"40px",textAlign:"center",color:C.muted}},
              h("div",{style:{fontSize:32,marginBottom:8}},"🧪"),
              h("div",{style:{fontWeight:700,fontSize:13}},"Select a menu item"))
          : h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
              h("div",{style:{padding:"10px 16px",borderBottom:"1px solid "+C.border,

                h("div",{style:{fontSize:13,fontWeight:900}},selItem.name),
                h("div",{style:{display:"flex",gap:4}},
                  [["variants","Variants/Base"],["options","Item Options"]].map(([id,lbl])=>
                    h("button",{key:id,
                      onClick:()=>{setItemBomTab(id);setSelItemOpt(null);},
                      style:{padding:"4px 12px",borderRadius:6,border:"none",cursor:"pointer",
                        fontSize:10,fontWeight:700,
                        background:itemBomTab===id?"#333":"#eee",
                        color:itemBomTab===id?"#fff":C.text}},lbl))
                )
              ),
              // Variants sub-tab
              itemBomTab==="variants"&&h("div",null,
                variantList(selItem).length>1&&h("div",{style:{display:"flex",gap:4,
                  padding:"8px 16px",borderBottom:"1px solid "+C.border,background:"#f9f9f9"}},
                  variantList(selItem).map(v=>
                    h("button",{key:v,onClick:()=>openBOM(selItem,v),
                      style:{padding:"4px 10px",borderRadius:6,border:"none",cursor:"pointer",
                        fontSize:10,fontWeight:700,
                        background:selVariant===v?C.primary:"#eee",
                        color:selVariant===v?"#fff":C.text}},
                      v==="default"?"Base":v))
                ),
                h("div",{style:{padding:"14px 16px"}},
                  BOMEditor({rows:editBom,setRows:setEditBom,onSave:saveBOM,saving:saving}))
              ),
              // Item Options sub-tab
              itemBomTab==="options"&&h("div",{style:{display:"grid",gridTemplateColumns:"200px 1fr",minHeight:300}},
                h("div",{style:{borderRight:"1px solid "+C.border,overflowY:"auto"}},
                  (selItem.options||[]).length===0
                    ? h("div",{style:{padding:"20px",textAlign:"center",color:C.muted,fontSize:11}},
                        "No options.",h("br",null),"Add in Menu Editor.")
                    : (selItem.options||[]).map(opt=>h("div",{key:opt.id},
                        h("div",{style:{padding:"5px 14px",background:"#f5f5f5",
                          fontSize:9,fontWeight:700,color:C.muted,letterSpacing:1}},
                          opt.label.toUpperCase()),
                        (opt.choices||[]).map(ch=>{
                          const key=selItem.id+"__opt_"+opt.id+"__"+ch.id;
                          const isSel=selItemOpt&&selItemOpt.key===key;
                          const has=!!(boms[selItem.id]&&(boms[selItem.id][key]||[]).length>0);
                          return h("div",{key:ch.id,
                            onClick:()=>{
                              const rows=(boms[selItem.id]&&boms[selItem.id][key])||[];
                              setSelItemOpt({key,optLabel:opt.label,choiceLabel:ch.label});
                              setEditItemOptBom(rows.length?[...rows]:[{ingId:"",ingName:"",unit:"",qty:1,convFactor:1,markup:0}]);
                            },
                            style:{padding:"7px 14px",cursor:"pointer",
                              background:isSel?"#FFF0F0":"#fff",
                              borderBottom:"1px solid #f5f5f5",
                              display:"flex",justifyContent:"space-between",alignItems:"center"}},
                            h("span",{style:{fontSize:11,fontWeight:isSel?700:400}},
                              ch.label+(ch.priceAdd>0?" +₱"+ch.priceAdd:"")),
                            h("span",{style:{fontSize:9,fontWeight:700,color:has?C.success:C.muted}},
                              has?"✓":"—")
                          );
                        })
                      ))
                ),
                h("div",{style:{overflowY:"auto"}},
                  !selItemOpt
                    ? h("div",{style:{padding:"30px",textAlign:"center",color:C.muted}},
                        h("div",{style:{fontSize:24,marginBottom:6}},"⚙️"),
                        h("div",{style:{fontSize:12,fontWeight:700}},"Select a choice"))
                    : h("div",null,
                        h("div",{style:{padding:"8px 12px",background:"#FFF0F0",fontSize:11,
                          fontWeight:700,color:C.primary,borderBottom:"1px solid "+C.border}},
                          selItemOpt.optLabel+" → "+selItemOpt.choiceLabel),
                        h("div",{style:{padding:"10px 12px"}},
                          BOMEditor({
                            rows:editItemOptBom,setRows:setEditItemOptBom,saving:savingItemOpt,
                            onSave:async()=>{
                              setSavingItemOpt(true);
                              try{
                                const rows=editItemOptBom.filter(r=>r.ingId||r.ingName);
                                await setDoc(doc(db,"bom",selItem.id),
                                  Object.assign({},boms[selItem.id]||{},{[selItemOpt.key]:rows}),{merge:true});
                                showT("Option BOM saved ✓");
                              }catch(e){showT("Error","err");}
                              setSavingItemOpt(false);
                            }
                          })
                        )
                      )
                )
              )
            )
      ),
      // Costing Report
      costTab==="costing"&&h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
        h("div",{style:{padding:"11px 16px",borderBottom:"1px solid "+C.border,fontSize:12,fontWeight:800}},"💰 Costing Report"),
        h("div",{style:{display:"grid",gridTemplateColumns:"1.5fr 90px 90px 90px 70px",
          padding:"7px 16px",background:"#fafafa",borderBottom:"1px solid "+C.border}},
          ["ITEM","SELL","COST","MARGIN","MARGIN %"].map(h2=>
            h("div",{key:h2,style:{fontSize:8,fontWeight:700,color:C.muted,letterSpacing:1}},h2))
        ),
        menuItems.flatMap(item=>
          variantList(item).map((v,vi)=>{
            const vObj=item.variants&&item.variants.find(vv=>(vv.label||vv.name)===v);
            const sell=vi===0?(item.basePrice||0):(item.basePrice||0)+((vObj&&vObj.priceAdd)||0);
            const key=getVKey(item,v);
            const rows=(boms[item.id]&&boms[item.id][key])||[];
            const cost=getCost(rows);
            const margin=sell-cost;
            const pct=sell>0?margin/sell*100:0;
            return h("div",{key:item.id+v,
              style:{display:"grid",gridTemplateColumns:"1.5fr 90px 90px 90px 70px",
                padding:"8px 16px",borderBottom:"1px solid #f5f5f5",alignItems:"center",
                background:vi===0?"#fff":"#fafafa"}},
              h("div",{style:{fontWeight:vi===0?700:400,fontSize:11,paddingLeft:vi===0?0:14}},
                vi===0?item.name:"↳ "+v),
              h("div",{style:{fontSize:11,fontWeight:700}},"₱"+peso(sell)),
              h("div",{style:{fontSize:11,color:cost>0?C.danger:C.muted}},cost>0?"₱"+peso(cost):"—"),
              h("div",{style:{fontSize:11,fontWeight:700,color:margin>0?C.success:C.danger}},cost>0?"₱"+peso(margin):"—"),
              h("div",{style:{fontSize:11,fontWeight:700,
                color:pct>50?C.success:pct>30?C.warning:C.danger}},
                cost>0?pct.toFixed(1)+"%":"—")
            );
          })
        )
      )
    ),

    // ══ OPTION GROUPS TAB ════════════════════════════════
    mainTab==="options"&&h("div",null,
      // Header with + Add Group button
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
        h("div",{style:{fontSize:13,fontWeight:800,color:C.text}},
          "Option Groups ("+groups.length+")"),
        h("button",{onClick:()=>setShowAddGrp(!showAddGrp),
          style:{padding:"7px 16px",background:C.primary,border:"none",borderRadius:8,
            color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}},
          showAddGrp?"✕ Cancel":"+ New Group")
      ),

      // New group form
      showAddGrp&&h("div",{style:{background:"#E8F5E9",border:"1px solid #A5D6A7",
        borderRadius:10,padding:"12px 14px",marginBottom:12,
        display:"flex",gap:8,alignItems:"center"}},
        h("input",{value:newGrpName,onChange:e=>setNewGrpName(e.target.value),
          onKeyDown:e=>e.key==="Enter"&&createGroup(),
          placeholder:"e.g. Choice of Flavor, Cooking Style, Serving Size...",
          style:{flex:1,padding:"9px 12px",border:"2px solid "+C.primary,
            borderRadius:8,fontSize:12,outline:"none"}}),
        h("button",{onClick:createGroup,
          style:{padding:"9px 20px",background:C.primary,border:"none",
            borderRadius:8,color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}},
          "Create")
      ),

      // 3-col layout
      h("div",{style:{display:"grid",gridTemplateColumns:"220px 200px 1fr",gap:12,minHeight:500}},

        // LEFT: Groups list
        h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
          h("div",{style:{padding:"10px 14px",borderBottom:"1px solid "+C.border,
            fontSize:11,fontWeight:800,color:C.text}},"Option Groups"),
          h("div",{style:{overflowY:"auto",maxHeight:"65vh"}},
            groups.length===0
              ? h("div",{style:{padding:"30px",textAlign:"center",color:C.muted,fontSize:11}},
                  "No groups yet.",h("br",null),
                  h("span",{style:{color:C.primary,cursor:"pointer",fontWeight:700},
                    onClick:()=>setShowAddGrp(true)},"+ Create one"))
              : groups.map(grp=>{
                  const isSel=selGroup&&selGroup.id===grp.id;
                  const bomDocId="optgrp_"+grp.id;
                  const hasAnyBOM=boms[bomDocId]&&Object.keys(boms[bomDocId]).length>0;
                  return h("div",{key:grp.id,
                    style:{borderBottom:"1px solid #f5f5f5"}},
                    h("div",{
                      onClick:()=>{setSelGroup(grp);setSelChoice(null);setEditOptBom([]);setEditingGrp(null);},
                      style:{padding:"10px 14px",cursor:"pointer",
                        background:isSel?"#FFF0F0":"#fff",
                        display:"flex",justifyContent:"space-between",alignItems:"center"}},
                      editingGrp===grp.id
                        ? h("div",{style:{display:"flex",gap:6,flex:1},
                            onClick:e=>e.stopPropagation()},
                            h("input",{
                              defaultValue:grp.name,
                              key:"edit-grp-"+grp.id,
                              autoFocus:true,
                              onKeyDown:async e=>{
                                if(e.key==="Enter"){
                                  const newName=e.target.value.trim();
                                  if(newName&&newName!==grp.name){
                                    try{
                                      await updateDoc(doc(db,"option_groups",grp.id),{name:newName});
                                      showT("Renamed to "+newName+" ✓");
                                    }catch(err){showT("Error","err");}
                                  }
                                  setEditingGrp(null);
                                }
                                if(e.key==="Escape")setEditingGrp(null);
                              },
                              style:{flex:1,padding:"5px 8px",border:"2px solid "+C.primary,
                                borderRadius:6,fontSize:12,outline:"none"}}),
                            h("button",{
                              onClick:async e=>{
                                e.stopPropagation();
                                const inp=e.target.closest("div").querySelector("input");
                                const newName=inp?inp.value.trim():"";
                                if(newName&&newName!==grp.name){
                                  try{
                                    await updateDoc(doc(db,"option_groups",grp.id),{name:newName});
                                    showT("Renamed ✓");
                                  }catch(err){showT("Error","err");}
                                }
                                setEditingGrp(null);
                              },
                              style:{background:C.primary,border:"none",borderRadius:5,
                                color:"#fff",fontSize:10,fontWeight:700,cursor:"pointer",
                                padding:"3px 8px"}},
                              "Save"),
                            h("button",{onClick:e=>{e.stopPropagation();setEditingGrp(null);},
                              style:{background:"none",border:"none",color:C.muted,
                                fontSize:14,cursor:"pointer",padding:"0 4px"}},
                              "✕")
                          )
                        : h("div",null,
                            h("div",{style:{fontSize:12,fontWeight:isSel?800:500,color:isSel?C.primary:C.text}},
                              grp.name),
                            h("div",{style:{fontSize:9,color:C.muted}},
                              (grp.choices||[]).length+" choices"+(hasAnyBOM?" · has BOM":"")),
                            (function(){
                              const pi=(typeof grp.perItem==="number")
                                ? grp.perItem
                                : (/(?:get|choose|pick|select|pili|kuha)\s*(\d+)/i.test(grp.name||"")
                                    ? parseInt(/(?:get|choose|pick|select|pili|kuha)\s*(\d+)/i.exec(grp.name)[1],10)
                                    : (/^\s*\[R\]/i.test(grp.name||"")?1:0));
                              return h("span",{style:{fontSize:8,fontWeight:800,padding:"1px 6px",
                                borderRadius:20,marginLeft:5,
                                background:pi>0?"#E8F5E9":"#F5F5F5",
                                color:pi>0?"#1B5E20":"#999"}},
                                pi>0?("REQUIRED "+pi+"/item"):"OPTIONAL");
                            })()
                          ),
                      !editingGrp&&h("div",{style:{display:"flex",gap:4},
                        onClick:e=>e.stopPropagation()},

// ─── DAILY SALES ROLLUP ───────────────────────────────────
// Every report today is computed live from a capped orders subscription
// (limit 300), so history scrolls out of reach within days. One document per
// branch per day keeps years of reporting readable: ~2,900 rows a year for
// eight branches, versus 100k+ raw orders.
// Business day = calendar day, midnight to midnight.

// Pure: same figures as buildZ, but from an explicit day's data.
function buildDailyRollup(dayOrders,dayCash,branch,date,vatMode){
  const bo=dayOrders||[], bc=dayCash||[];
  const voided=bo.filter(o=>o.status==="void"||o.status==="partial-void");
  const live=bo.filter(o=>o.status!=="void"&&o.status!=="cancelled");
  const num=(v)=>Number(v)||0;

  const gross=live.reduce((s2,o)=>s2+num(o.subtotal),0);
  const discounts=live.reduce((s2,o)=>s2+num(o.discAmt),0);
  const net=bo.reduce((s2,o)=>s2+num(o.total),0);
  const voidAmt=voided.reduce((s2,o)=>
    s2+((num(o.originalTotal)||num(o.subtotal))-num(o.total)),0);

  const isVATreg=vatMode!=="nonvat", zeroRated=vatMode==="zerovat";
  const payTotal=(m)=>live.filter(o=>(o.payMethod||"cash")===m)
    .reduce((s2,o)=>s2+num(o.total),0);
  const discBy=(id)=>live.filter(o=>(o.discType&&o.discType.id)===id)
    .reduce((s2,o)=>s2+num(o.discAmt),0);

  // top items by quantity, for year-on-year product tracking
  const tally={};
  live.forEach(o=>(o.items||[]).forEach(i=>{
    const k=i.name||i.id||"?";
    tally[k]=(tally[k]||0)+num(i.qty);
  }));
  const topItems=Object.keys(tally).map(k=>({name:k,qty:tally[k]}))
    .sort((a,b)=>b.qty-a.qty).slice(0,20);

  const ids=live.map(o=>String(o.id||"")).filter(Boolean).sort();
  const opening=bc.filter(c=>c.type==="in"&&/opening/i.test(c.desc||""))
    .reduce((s2,c)=>s2+num(c.amount),0);
  const cashIn=bc.filter(c=>c.type==="in"&&!/opening/i.test(c.desc||""))
    .reduce((s2,c)=>s2+num(c.amount),0);
  const cashOut=bc.filter(c=>c.type==="out").reduce((s2,c)=>s2+num(c.amount),0);

  return {
    branch:branch,date:date,
    gross:gross,discounts:discounts,net:net,
    voidAmt:voidAmt,voidCount:voided.length,
    txns:live.length,cancelled:bo.filter(o=>o.status==="cancelled").length,
    qtySold:live.reduce((s2,o)=>s2+(o.items||[]).reduce((a,i)=>a+num(i.qty),0),0),
    dineIn:live.filter(o=>o.orderType==="dine-in").length,
    takeout:live.filter(o=>o.orderType==="takeout").length,
    delivery:live.filter(o=>o.orderType==="delivery").length,
    vatableSales:(isVATreg&&!zeroRated)?net/1.12:0,
    vatAmount:(isVATreg&&!zeroRated)?net-(net/1.12):0,
    vatExempt:!isVATreg?net:0,
    zeroSales:zeroRated?net:0,
    discSC:discBy("sc"),discPWD:discBy("pwd"),
    discEmp:discBy("emp"),discOther:discBy("promo")+discBy("custom"),
    scTxns:live.filter(o=>(o.discType&&o.discType.id)==="sc").length,
    pwdTxns:live.filter(o=>(o.discType&&o.discType.id)==="pwd").length,
    cashSales:payTotal("cash"),gcash:payTotal("gcash"),
    foodpanda:payTotal("foodpanda"),grabfood:payTotal("grabfood"),
    opening:opening,cashIn:cashIn,cashOut:cashOut,
    cashOnHand:opening+net+cashIn-cashOut,
    siFrom:ids.length?ids[0]:"",siTo:ids.length?ids[ids.length-1]:"",
    topItems:topItems
  };
}

// Fetch one day and write its rollup. Deterministic doc id + setDoc means
// several tablets closing at once converge on one row instead of duplicating.
async function rollupDay(db,branch,date,vatMode,byName){
  try{
    // Query by date only — a single equality filter needs no composite index.
    // One day across every branch is small; filter to this branch in memory.
    const oSnap=await getDocs(query(collection(db,"orders"),where("date","==",date)));
    const dayOrders=oSnap.docs.map(d=>({...d.data(),_docId:d.id}))
      .filter(o=>o.branch===branch);

    let dayCash=[];
    try{
      const cSnap=await getDocs(query(collection(db,"cash_log"),where("date","==",date)));
      dayCash=cSnap.docs.map(d=>d.data()).filter(c=>c.branch===branch);
    }catch(e){}

    const roll=buildDailyRollup(dayOrders,dayCash,branch,date,vatMode);
    roll.closedBy=byName||"auto";
    roll.closedAt=serverTimestamp();
    roll.year=date.slice(0,4);
    roll.month=date.slice(0,7);
    await setDoc(doc(db,"daily_sales",branch+"_"+date),roll,{merge:true});
    return roll;
  }catch(e){
    console.error("rollupDay failed",branch,date,e);
    return null;
  }
}

// Days between two ISO dates, exclusive of `to`.
function daysBefore(toISO,count){
  const out=[]; const d=new Date(toISO+"T00:00:00");
  for(let k=1;k<=count;k++){
    const x=new Date(d); x.setDate(x.getDate()-k);
    out.push(x.toISOString().slice(0,10));
  }
  return out;
}

// ─── NOTIFICATIONS ────────────────────────────────────────
// One row per event, addressed to a single branch id via `to`. Everything is
// best-effort: a failed notify must never block the action that caused it.
async function notify(db,n){
  try{
    await addDoc(collection(db,"notifications"),{
      to:(n&&n.to)||"",
      type:(n&&n.type)||"info",
      title:(n&&n.title)||"",
      message:(n&&n.message)||"",
      page:(n&&n.page)||"",
      ref:(n&&n.ref)||"",
      by:(n&&n.by)||"",
      read:false,
      date:new Date().toISOString().slice(0,10),
      at:serverTimestamp()
    });
  }catch(e){console.warn("notify failed:",e);}

// ─── SHARED VOID ROUTINE ──────────────────────────────────
// There were two void paths: the Orders list "Void" button (owner/manager) and
// the request/approve flow. Only the second had restock and cash reversal, and
// the owner role has neither void page in its nav — so the only void an owner
// could reach did nothing but flip a status flag.
// One implementation now, called by both.
async function performVoid(db, args){
  const order   = args.order || {};
  const items   = args.voidedItems || order.items || [];
  const branch  = args.branch || order.branch || "";
  const byName  = args.byName || "";
  const reason  = args.reason || "";
  const partial = !!args.isPartial;
  const docId   = order._docId || args.docId;   // Firestore id, NOT the OR number
  const out={voidAmt:0,restocked:0,restockFailed:0,missingId:0,orderUpdated:false};

  out.voidAmt = items.reduce((s,i)=>
    s+(Number(i.lineTotal)||((Number(i.unitPrice)||0)*(i.qty||1))),0);

  // 1. the order itself — status alone leaves the money in every sales total
  if(docId){
    try{
      if(partial){
        await updateDoc(doc(db,"orders",docId),{
          status:"partial-void",
          originalTotal:Number(order.originalTotal)||Number(order.total)||0,
          total:Math.max(0,(Number(order.total)||0)-out.voidAmt),
          voidedItems:items,voidedBy:byName,voidReason:reason,
          voidedAt:serverTimestamp()
        });
      }else{
        await updateDoc(doc(db,"orders",docId),{
          status:"void",
          originalTotal:Number(order.originalTotal)||Number(order.total)||0,
          total:0,
          voidedBy:byName,voidReason:reason,voidedAt:serverTimestamp()
        });
      }
      out.orderUpdated=true;
    }catch(e){console.error("Void: order update failed",e);}
  }

  // 2. put the ingredients back — mirrors the deduction exactly
  try{
    const bomSnap=await getDocs(collection(db,"bom"));
    const bomData={};
    bomSnap.docs.forEach(d=>{bomData[d.id]={...d.data()};});

    const colFor=async(ingId)=>{
      try{
        if(branch){
          const b=await getDoc(doc(db,"inventory_"+branch,ingId));
          if(b.exists())return "inventory_"+branch;
        }
        const m=await getDoc(doc(db,"inventory",ingId));
        if(m.exists())return "inventory";
      }catch(e){}
      return branch?("inventory_"+branch):"inventory";
    };

    const giveBack=async(rows,mult,label,itemName)=>{
      for(const row of rows||[]){
        if(!row.ingId||!row.qty)continue;
        const amt=((row.qty||0)*(mult||1))/(row.convFactor||1);
        try{
          const col=await colFor(row.ingId);
          const logCol=col.replace(/^inventory/,"inventory_log");
          let prev=null;
          try{const sn=await getDoc(doc(db,col,row.ingId));
              if(sn.exists())prev=Number(sn.data().stock)||0;}catch(e){}
          await updateDoc(doc(db,col,row.ingId),{
            stock:increment(amt),lastUpdated:serverTimestamp()});
          out.restocked++;
          await addDoc(collection(db,logCol),{
            itemId:row.ingId,itemName:row.ingName||row.ingId,
            unit:row.unit||"",type:"add",amount:amt,
            prevStock:prev,
            newStock:prev==null?null:Math.round((prev+amt)*1000)/1000,
            convFactor:row.convFactor||1,invCol:col,
            desc:"Naibalik: "+(Math.round(amt*1000)/1000)+" "+(row.unit||"")
              +" mula sa void ng order "+(order.id||"")+" ("+itemName+(label?" / "+label:"")+")",
            source:"void",ref:order.id||"",branch:branch,
            reason:"VOID: "+(order.id||"")+" — "+itemName,
            by:byName,at:serverTimestamp(),timestamp:serverTimestamp()});
        }catch(e){out.restockFailed++;console.warn("Restock failed",row.ingId,e);}
      }
    };

    for(const it of items){
      if(!it.id&&!(it.optionRefs||[]).length){out.missingId++;continue;}
      if(it.id){
        const v=it.variant||"default";
        const vKey=(!v||v==="default")?it.id:it.id+"__"+String(v).replace(/\s+/g,"_");
        const ib=bomData[it.id]||{};
        await giveBack(ib[vKey]||ib[it.id]||[], it.qty||1,
          v!=="default"?v:"", it.name||it.id);
      }
      for(const ref of (it.optionRefs||[])){
        if(!ref.groupId||!ref.choiceId)continue;
        const d=bomData["optgrp_"+ref.groupId]||{};
        const rows=d["optgrp_"+ref.groupId+"__"+ref.choiceId]||[];
        const mult=ref.free?(ref.qty||1):((ref.qty||1)*(it.qty||1));
        await giveBack(rows, mult, ref.label, it.name||"");
      }
    }
  }catch(e){console.warn("Void restock error",e);}

  // 3. cash leaves the drawer — type "out" so Cash Monitor totals it,
  //    timestamp so the orderBy query does not drop the document
  try{
    const now=new Date();
    await addDoc(collection(db,"cash_log"),{
      // NOT "out": zeroing order.total already removes this sale from `net`,
      // and the drawer is opening + net + cashIn - cashOut. Counting it here
      // too would subtract the same peso twice.
      branch:branch,type:"void_refund",subType:"void_refund",
      amount:out.voidAmt,
      desc:"Void refund — Order #"+(order.id||"")+" (naalis na sa sales)",
      orderId:order.id||"",reason:"Void: "+reason,by:byName,
      time:now.toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit"}),
      date:now.toISOString().slice(0,10),
      timestamp:serverTimestamp(),at:serverTimestamp()});
  }catch(e){console.warn("Cash reversal log failed",e);}

  return out;
}

function voidSummary(r){
  return "₱"+peso(r.voidAmt)+" reversed · "+r.restocked+" ingredient/s restocked"
    +(r.restockFailed?" ("+r.restockFailed+" failed)":"")
    +(r.missingId?" ("+r.missingId+" walang BOM link)":"")
    +(!r.orderUpdated?" ⚠️ order hindi na-update":"");
}

// ─── VOID REQUEST (Cashier submits, Manager approves) ─────
function VoidRequestPage({user,branchId,curBranch,db,orders,showT,isManager=false}){
  const [voidRequests,setVoidReqs] = useState([]);
  const [selOrder,setSelOrder]     = useState(null);
  const [selItems,setSelItems]     = useState({}); // {itemIdx: true/false}
  const [reason,setReason]         = useState("");
  const [submitting,setSubmitting] = useState(false);
  const [tab,setTab]               = useState(isManager?"pending":"new");

  useEffect(()=>{
    const q = query(
      collection(db,"void_requests"),
      where("branch","==",branchId),
      orderBy("timestamp","desc"),
      limit(50)
    );
    const unsub = onSnapshot(q,snap=>{
      setVoidReqs(snap.docs.map(d=>({...d.data(),_docId:d.id})));
    },()=>{});
    return()=>unsub();
  },[branchId]);

  const submitVoid = async()=>{
    if(!selOrder){showT("Select an order to void","warn");return;}
    if(!reason.trim()){showT("Enter reason for void","warn");return;}
    const voidedItems = (selOrder.items||[]).filter((_,i)=>selItems[i]!==false);
    if(!voidedItems.length){showT("Select at least 1 item to void","warn");return;}
    const isPartial = voidedItems.length < (selOrder.items||[]).length;
    // order items store lineTotal/unitPrice — there is no `price` field,
    // so the old formula always produced 0.
    const voidAmt = voidedItems.reduce((s,i)=>
      s+(Number(i.lineTotal)||((Number(i.unitPrice)||0)*(i.qty||1))),0);
    setSubmitting(true);
    try{
      await addDoc(collection(db,"void_requests"),{
        branch:branchId,
        branchName:curBranch.full,
        orderId:selOrder.id,
        orderTotal:selOrder.total,
        voidAmount:voidAmt,
        orderItems:selOrder.items,
        voidedItems,
        isPartial,
        requestedBy:user.name,
        reason,
        status:"pending",
        timestamp:serverTimestamp(),
        date:new Date().toISOString().slice(0,10)
      });
      showT((isPartial?"Partial":"Full")+" void request submitted ✓");
      setSelOrder(null);setSelItems({});setReason("");setTab("history");
    }catch(e){showT("Error submitting","err");}
    setSubmitting(false);
  };

  // When order selected, default all items to voided
  useEffect(()=>{
    if(selOrder){
      const all={};
      (selOrder.items||[]).forEach((_,i)=>{ all[i]=true; });
      setSelItems(all);
    }
  },[selOrder?.id]);

  const voidedItems = selOrder?(selOrder.items||[]).filter((_,i)=>selItems[i]!==false):[];
  const voidAmt = voidedItems.reduce((s,i)=>
    s+(Number(i.lineTotal)||((Number(i.unitPrice)||0)*(i.qty||1))),0);

  const approveVoid = async(req)=>{
    try{
      await updateDoc(doc(db,"void_requests",req._docId),{
        status:"approved",approvedBy:user.name,approvedAt:serverTimestamp()
      });
      // The request stores the human OR number; the order document has a
      // Firestore id. Resolve it or the order update silently targets nothing.
      const ord=orders.find(o=>o.id===req.orderId)||{id:req.orderId,branch:req.branch};
      const r=await performVoid(db,{
        order:ord,
        docId:ord._docId,
        voidedItems:req.voidedItems||req.orderItems||[],
        isPartial:!!req.isPartial,
        reason:req.reason||"",
        byName:user.name,
        branch:req.branch||ord.branch
      });
      showT((req.isPartial?"Partial void":"Order #"+req.orderId+" voided")
        +" · "+voidSummary(r),
        (r.restockFailed||r.missingId||!r.orderUpdated)?"warn":"ok");
    }catch(e){showT("Error approving void","err");console.error(e);}
  };

  const rejectVoid = async(req)=>{
    await updateDoc(doc(db,"void_requests",req._docId),{
      status:"rejected",
      rejectedBy:user.name,
      rejectedAt:serverTimestamp()
    });
    showT("Void request rejected");
  };

  // Today's non-voided orders for this branch
  const today = new Date().toISOString().slice(0,10);
  const todayOrders = orders.filter(o=>
    o.branch===branchId &&
    o.status!=="void" && o.status!=="cancelled" &&
    (o.timestamp?.toDate?.()?.toISOString()||"").slice(0,10)===today
  );
  const pending = voidRequests.filter(r=>r.status==="pending");

  return h("div",null,
    h(SectionHeader,{title:"🚫 "+(isManager?"Void Requests — "+curBranch.name:"Request Void Transaction")}),

    // Pending alert for manager
    isManager&&pending.length>0&&h("div",{style:{background:"#FFEBEE",border:"1px solid #FFCDD2",
      borderRadius:10,padding:"10px 14px",marginBottom:12,fontSize:11,
      color:C.danger,fontWeight:700}},
      "⚠️ "+pending.length+" void request"+(pending.length>1?"s":"")+" pending your approval!"
    ),

    // Tabs
    h("div",{style:{display:"flex",gap:0,borderBottom:"2px solid "+C.border,marginBottom:14}},
      (isManager
        ?[["pending","⏳ Pending ("+pending.length+")"],["history","📋 History"]]
        :[["new","🚫 New Request"],["history","📋 My Requests"]]
      ).map(([t,l])=>h("button",{key:t,onClick:()=>setTab(t),
        style:{padding:"9px 18px",border:"none",background:"transparent",
          color:tab===t?C.danger:C.muted,fontWeight:tab===t?800:400,
          fontSize:12,cursor:"pointer",
          borderBottom:`3px solid ${tab===t?C.danger:"transparent"}`,marginBottom:-2}},l))
    ),

    // NEW VOID REQUEST (cashier)
    !isManager&&tab==="new"&&h("div",null,
      h("div",{style:{background:"#FFEBEE",border:"1px solid #FFCDD2",borderRadius:10,
        padding:"10px 14px",marginBottom:14,fontSize:11,color:"#C62828"}},
        "⚠️ Void requests need manager approval before the transaction is cancelled."
      ),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
        // Left: select order
        h("div",null,
          h("div",{style:{fontWeight:700,fontSize:12,marginBottom:8,color:C.danger}},"Select Order to Void"),
          todayOrders.length===0
            ?h("div",{style:{padding:"20px",textAlign:"center",color:C.muted,
                background:"#fff",borderRadius:10,border:"1px solid "+C.border,fontSize:11}},
              "No orders today yet")
            :h("div",{style:{display:"grid",gap:5,maxHeight:380,overflowY:"auto"}},
              todayOrders.map(o=>h("div",{key:o.id,
                style:{padding:"10px 13px",borderRadius:9,
                  border:`2px solid ${selOrder?.id===o.id?C.danger:C.border}`,
                  background:selOrder?.id===o.id?"#FFEBEE":"#fff"}},

                // Order header - click to select/expand
                h("div",{
                  onClick:()=>{
                    if(selOrder?.id===o.id){
                      setSelOrder(null);
                      setSelItems({});
                    } else {
                      setSelOrder(o);
                      // Auto-check all items
                      const all={};
                      (o.items||[]).forEach((_,i)=>{ all[i]=true; });
                      setSelItems(all);
                    }
                  },
                  style:{display:"flex",justifyContent:"space-between",
                    alignItems:"center",marginBottom:selOrder?.id===o.id?8:0,cursor:"pointer"}},
                  h("span",{style:{fontSize:11,fontWeight:800,color:C.danger}},"#"+o.id),
                  h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
                    h("span",{style:{fontSize:12,fontWeight:900,color:C.primary}},
                      "₱"+peso(o.total)),
                    h("span",{style:{
                      fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:10,
                      background:selOrder?.id===o.id?"#FFCDD2":"#f5f5f5",
                      color:selOrder?.id===o.id?C.danger:C.muted}},
                      selOrder?.id===o.id?"▲ Close":"▼ Select items")
                  )
                ),

                // Item checkboxes - only show when selected
                selOrder?.id===o.id
                  ?h("div",null,
                    h("div",{style:{fontSize:8,fontWeight:700,color:C.muted,
                      letterSpacing:1,marginBottom:5}},"✅ SELECT ITEMS TO VOID:"),
                    (o.items||[]).map((item,itemIdx)=>
                      h("label",{key:itemIdx,
                        style:{display:"flex",alignItems:"center",gap:8,
                          padding:"6px 8px",borderRadius:7,marginBottom:3,cursor:"pointer",
                          background:selItems[itemIdx]!==false?"#FFEBEE":"#f5f5f5",
                          border:`1px solid ${selItems[itemIdx]!==false?"#FFCDD2":"#eee"}`}},
                        h("input",{
                          type:"checkbox",
                          checked:selItems[itemIdx]!==false,
                          onChange:e=>{
                            e.stopPropagation();
                            setSelItems(p=>({...p,[itemIdx]:e.target.checked}));
                          },
                          style:{width:15,height:15,accentColor:C.danger,flexShrink:0,cursor:"pointer"}
                        }),
                        h("div",{style:{flex:1}},
                          h("span",{style:{fontSize:11,fontWeight:700,
                            color:selItems[itemIdx]!==false?C.danger:C.muted}},
                            item.qty+"x "+item.name),
                          item.variant&&h("span",{style:{fontSize:9,color:C.muted}},
                            " · "+item.variant)
                        ),
                        h("span",{style:{fontSize:11,fontWeight:700,
                          color:selItems[itemIdx]!==false?C.primary:C.muted}},
                          "₱"+peso(((item.price||0)*(item.qty||1))))
                      )
                    ),
                    // Summary
                    h("div",{style:{marginTop:6,padding:"6px 10px",
                      background:"#FFEBEE",borderRadius:6,
                      display:"flex",justifyContent:"space-between",alignItems:"center"}},
                      h("span",{style:{fontSize:10,color:C.danger,fontWeight:600}},
                        voidedItems.length+"/"+(o.items||[]).length+" items selected"),
                      h("span",{style:{fontSize:12,fontWeight:900,color:C.danger}},
                        "Void: ₱"+peso(voidAmt))
                    )
                  )
                  :h("div",{onClick:()=>setSelOrder(o),style:{cursor:"pointer"}},
                    h("div",{style:{fontSize:9,color:C.muted}},
                      (o.items||[]).map(i=>i.qty+"x "+i.name).join(", ").slice(0,60)),
                    h("div",{style:{fontSize:8,color:C.muted,marginTop:2}},
                      o.cashier+" · "+(o.payMethod||"cash").toUpperCase())
                  )
              ))
            )
        ),
        // Right: reason + submit
        h("div",null,
          h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,padding:"16px"}},
            // Selected order summary
            selOrder
              ?h("div",{style:{background:"#FFEBEE",borderRadius:9,padding:"12px",marginBottom:14}},
                h("div",{style:{fontSize:10,fontWeight:700,color:C.muted,marginBottom:6}},"SELECTED ORDER"),
                h("div",{style:{fontSize:14,fontWeight:900,color:C.danger}},"#"+selOrder.id),
                h("div",{style:{fontSize:18,fontWeight:900,color:C.primary,marginTop:2}},"₱"+peso(selOrder.total)),
                h("div",{style:{fontSize:10,color:C.muted,marginTop:3}},
                  (selOrder.items||[]).map(i=>i.qty+"x "+i.name).join(", "))
              )
              :h("div",{style:{background:"#f5f5f5",borderRadius:9,padding:"16px",
                  textAlign:"center",color:C.muted,fontSize:11,marginBottom:14}},

            ),

              ),

              req.isPartial&&h("div",{style:{background:"#FFF8E1",border:"1px solid #FFE082",

    ),

    // HISTORY
    tab==="history"&&h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
      voidRequests.length===0
        ?h("div",{style:{textAlign:"center",padding:"30px",color:C.muted,fontSize:11}},"No void requests yet")
        :voidRequests.map(req=>h("div",{key:req._docId,
          style:{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",
            borderBottom:"1px solid #f5f5f5"}},
          h("div",{style:{width:36,height:36,borderRadius:9,flexShrink:0,
            background:{pending:"#FFF8E1",approved:"#FFEBEE",rejected:"#f5f5f5"}[req.status]||"#fff",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}},
            {pending:"⏳",approved:"🚫",rejected:"✅"}[req.status]),
          h("div",{style:{flex:1}},
            h("div",{style:{fontSize:11,fontWeight:700}},"#"+req.orderId+" · "+req.requestedBy),
            h("div",{style:{fontSize:9,color:C.muted}},req.reason+" · "+req.date)
          ),
          h("div",{style:{fontSize:12,fontWeight:800,color:C.primary}},"₱"+peso(req.orderTotal)),
          h(Badge,{label:req.status.toUpperCase(),
            color:{pending:C.warning,approved:C.danger,rejected:C.success}[req.status]||C.muted})
        ))
    )
  );
}

// ─── SALES ANALYTICS + EXPORT ────────────────────────────
function AnalyticsPage({orders,branchId,curBranch,user,db,showT,advances=[],inventory=[]}){
  const [tab,setTab]       = useState("general");
  const [period,setPeriod] = useState("today");
  const [dateFrom,setFrom] = useState(new Date().toISOString().slice(0,10));
  const [dateTo,setTo]     = useState(new Date().toISOString().slice(0,10));

  const today = new Date().toISOString().slice(0,10);
  const getWeekStart=()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());return d.toISOString().slice(0,10);};
  const getMonthStart=()=>new Date().toISOString().slice(0,8)+"01";

  const filtOrders = orders.filter(o=>{
    if(o.status==="voided")return false;
    const d=o.date||"";
    if(period==="today")return d===today;
    if(period==="week")return d>=getWeekStart();
    if(period==="month")return d>=getMonthStart();
    if(period==="custom")return d>=dateFrom&&d<=dateTo;
    return true;
  });

  const gross   = filtOrders.reduce((s,o)=>s+(o.subtotal||0),0);
  const discAmt = filtOrders.reduce((s,o)=>s+(o.discAmt||0),0);
  const netSales= gross-discAmt;
  const vatable = netSales/1.12;
  const vat     = netSales-vatable;
  const txnCount= filtOrders.length;
  const avgTxn  = txnCount>0?gross/txnCount:0;

  // Item breakdown
  const itemMap={};
  filtOrders.forEach(o=>(o.items||[]).forEach(i=>{
    if(!itemMap[i.name])itemMap[i.name]={name:i.name,cat:i.cat||i.category||"",qty:0,rev:0};
    itemMap[i.name].qty+=(i.qty||1);
    itemMap[i.name].rev+=(i.lineTotal||0);
  }));
  const itemList=Object.values(itemMap).sort((a,b)=>b.rev-a.rev);

  // Category breakdown
  const catMap={};
  itemList.forEach(i=>{
    const c=i.cat||"Other";
    if(!catMap[c])catMap[c]={cat:c,qty:0,rev:0};
    catMap[c].qty+=i.qty; catMap[c].rev+=i.rev;
  });
  const catList=Object.values(catMap).sort((a,b)=>b.rev-a.rev);

  // Payment breakdown
  const payMap={};
  filtOrders.forEach(o=>{
    const p=o.payMethod||"cash";
    if(!payMap[p])payMap[p]={method:p,count:0,total:0};
    payMap[p].count++; payMap[p].total+=(o.subtotal||0);
  });
  const payList=Object.values(payMap).sort((a,b)=>b.total-a.total);

  // Branch breakdown (owner)
  const branchMap={};
  orders.filter(o=>o.status!=="voided").forEach(o=>{
    const b=o.branch||"unknown";
    if(!branchMap[b])branchMap[b]={branch:b,count:0,total:0};
    branchMap[b].count++; branchMap[b].total+=(o.subtotal||0);
  });
  const branchList=Object.values(branchMap).sort((a,b)=>b.total-a.total);

  // PO/Purchasing breakdown
  const poPaid=advances.filter(a=>a._type==="po"&&a.paymentStatus==="Paid");
  const poTotal=poPaid.reduce((s,a)=>s+(a.totalAmount||0),0);

  // Inventory value
  const invValue=inventory.reduce((s,i)=>s+(i.cost||0)*(i.stock||0),0);
  const invValueSell=inventory.reduce((s,i)=>s+(i.price||0)*(i.stock||0),0);

  const tabs=["general","item","category","payment","branch","purchasing"];
  if(user.role!=="owner")tabs.splice(tabs.indexOf("branch"),1);

  const pctBar=(pct,col)=>h("div",{style:{height:4,background:"#f0f0f0",borderRadius:2,marginTop:3}},
    h("div",{style:{height:"100%",width:Math.min(100,pct)+"%",background:col||C.primary,borderRadius:2}}));

  const exportCSV=()=>{
    const rows=[["Date","Order ID","Branch","Items","Subtotal","Discount","Payment","Cashier"]];
    filtOrders.forEach(o=>rows.push([
      o.date,o.id,o.branch,
      (o.items||[]).map(i=>i.qty+"x "+i.name).join("; "),
      (o.subtotal||0).toFixed(2),(o.discAmt||0).toFixed(2),
      o.payMethod,o.cashier||""
    ]));
        const csv=rows.map(function(r){return r.map(function(v){var s=String(v||'');return '"'+s.split('"').join('""')+'"';}).join(',');}).join('\n');
    const a=document.createElement("a");
    a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download="analytics-"+today+".csv";a.click();
  };

  return h("div",null,
    // Header
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
      h("div",null,
        h("div",{style:{fontSize:17,fontWeight:900}},"📊 Sales Analytics"),

      ),
      h("button",{onClick:exportCSV,
        style:{padding:"7px 14px",background:C.success,border:"none",borderRadius:8,
          color:"#fff",fontWeight:700,fontSize:11,cursor:"pointer"}},

            border:"1px solid "+(period===id?C.primary:C.border),

            color:period===id?"#fff":C.muted,

        {general:"General",item:"Item",category:"Category",

          h("div",{style:{fontSize:10,color:C.muted,marginBottom:4}},"TRANSACTIONS"),
          h("div",{style:{fontSize:22,fontWeight:900}},""+txnCount),

        ),
        h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,padding:"16px"}},
          h("div",{style:{fontSize:10,color:C.muted,marginBottom:4}},"VAT (12%)"),

        ),
        h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,padding:"16px"}},
          h("div",{style:{fontSize:10,color:C.muted,marginBottom:4}},"VOID ORDERS"),
          h("div",{style:{fontSize:22,fontWeight:900,color:C.danger}},
            ""+orders.filter(o=>o.status==="voided"&&(o.date||"")===today).length),
          h("div",{style:{fontSize:10,color:C.muted,marginTop:4}},"Today's voids")
        )
      )
    ),

    // ── ITEM TAB ──
    tab==="item"&&h("div",null,
      h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
        h("div",{style:{display:"grid",gridTemplateColumns:"2fr 80px 80px 100px 80px",

          ["ITEM","QTY SOLD","REVENUE","% OF SALES","RANK"].map(h2=>

        itemList.length===0&&h("div",{style:{padding:"30px",textAlign:"center",color:C.muted}},
          "No sales data for this period"),
        itemList.map((it,i)=>h("div",{key:it.name,
          style:{display:"grid",gridTemplateColumns:"2fr 80px 80px 100px 80px",
            padding:"10px 16px",borderBottom:"1px solid #f5f5f5",alignItems:"center"}},
          h("div",null,
            h("div",{style:{fontWeight:700,fontSize:12}},it.name),
            h("div",{style:{fontSize:9,color:C.muted}},it.cat),

          h("div",{style:{fontSize:12,fontWeight:700,color:C.primary}},"₱"+peso(it.rev)),
          h("div",{style:{fontSize:11,color:C.muted}},(gross>0?(it.rev/gross*100).toFixed(1):0)+"%"),
          h("div",{style:{fontSize:12,fontWeight:900,color:i<3?C.warning:C.muted}},"#"+(i+1))

          ["CATEGORY","QTY","REVENUE","% SHARE"].map(h2=>

        catList.map((c,i)=>{

        payList.map(p=>h("div",{key:p.method,

          h("div",{style:{fontSize:10,color:C.muted,marginBottom:4,textTransform:"uppercase"}},p.method),
          h("div",{style:{fontSize:20,fontWeight:900,color:C.primary}},"₱"+peso(p.total)),

          pctBar(gross>0?p.total/gross*100:0)

        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 80px 100px 80px",
          padding:"8px 16px",background:"#fafafa",borderBottom:"1px solid "+C.border}},

            h("div",{key:h2,style:{fontSize:8,fontWeight:700,color:C.muted,letterSpacing:1}},h2))

            style:{display:"grid",gridTemplateColumns:"1fr 80px 100px 80px",

              h("div",{style:{fontWeight:700,fontSize:12}},

function VoidBadge({branchId,db,setPage,visible=true}){
  const [count,setCount] = useState(0);
  useEffect(()=>{
    if(!branchId)return;
    const q = query(collection(db,"void_requests"),
      where("branch","==",branchId),where("status","==","pending"));
    const unsub = onSnapshot(q,snap=>setCount(snap.size),()=>{});
    return()=>unsub();
  },[branchId]);
  // Always render - use display:none to avoid removeChild
  return h("button",{onClick:()=>setPage("void_requests"),
    style:{display:visible&&count>0?"flex":"none",
      padding:"4px 10px",background:"#FFEBEE",border:"1px solid #FFCDD2",
      borderRadius:20,fontSize:9,color:"#C62828",fontWeight:700,cursor:"pointer"}},
    "🚫 "+count+" void pending");
}

function StockEditModal({item,db,user,branchId,showT,onClose,boms=[]}){
  if(!item)return null;
  var isOwner=user.role==="owner"||user.role==="commissary";
  var invCol=isOwner?"inventory":"inventory_"+branchId;
  var logCol=isOwner?"inventory_log":"inventory_log_"+branchId;

  var DEFAULT_CATS=["Frozen","Produce","Protein","Sauce","Dry Goods","Packaging","Beverage","Other"];
  var UNITS=["pc","kg","g","L","ml","pack","box","tray","sachet","EA","roll"];

  var [tab,setTab]=useState("stock"); // stock | details
  var [saving,setSaving]=useState(false);

  // Stock adjustment state
  var [mode,setMode]=useState("adjust");
  var [display,setDisplay]=useState("");
  var [reason,setReason]=useState("");

  // Details edit state
  var [details,setDetails]=useState({
    name:item.name||"",
    unit:item.unit||"pc",
    cat:item.cat||"Other",
    price:item.price||0,
    cost:item.cost||0,
    minStock:item.minStock||10,
    packUnit:item.packUnit||"",
    packSize:item.packSize||"",
  });

  var current=Math.round((Number(item.stock)||0)*1000)/1000;
  var packSz=packSizeOf(item);
  // When an item has a pack size, physical counting is far easier in packs:
  // enter "149" packs + "14" loose instead of computing 4,484 by hand.
  var [byPack,setByPack]=useState(false);
  var [looseVal,setLooseVal]=useState("");
  var rawVal=parseFloat(display)||0;
  var isNeg=display.startsWith("-");
  var numVal=(packSz&&byPack)
    ? packsToBase(item,Math.abs(rawVal),parseFloat(looseVal)||0)
    : Math.abs(rawVal);
  var preview=mode==="adjust"
    ? Math.max(0,current+(isNeg?-numVal:numVal))
    : Math.max(0,numVal);

  // Check if item is used in any BOM
  var usedInBOM=boms.some(function(bomDoc){
    if(!bomDoc)return false;
    var bomData=typeof bomDoc==="object"?bomDoc:{};
    return Object.values(bomData).some(function(rows){
      return Array.isArray(rows)&&rows.some(function(r){return r.ingId===item.id||r.ingName===item.name;});
    });
  });

  var press=function(key){
    if(key==="C"){setDisplay("");return;}
    if(key==="⌫"){setDisplay(function(p){return p.slice(0,-1)||"";});return;}
    if(key==="-"){
      if(mode==="adjust")setDisplay(function(p){return p.startsWith("-")?p.slice(1):"-"+p;});
      return;
    }
    if(key==="."){setDisplay(function(p){return p.includes(".")?p:(p||"0")+".";});return;}
    setDisplay(function(p){
      if(p==="-")return "-"+key;
      if(p==="0")return key;
      return p+key;
    });
  };

  var saveStock=async function(){
    if(!display){showT("Enter amount","warn");return;}
    if(!reason){showT("Select reason","warn");return;}
    setSaving(true);
    try{
      await updateDoc(doc(db,invCol,item.id),{
        stock:preview,lastAdjusted:serverTimestamp(),
        adjustedBy:user.name,adjustReason:reason,
        adjustType:mode,prevStock:current
      });
      await addDoc(collection(db,logCol),{
        itemId:item.id,itemName:item.name,unit:item.unit||"",
        type:mode==="set"?"set":isNeg?"deduct":"add",
        amount:mode==="adjust"?(isNeg?-numVal:numVal):numVal,
        prevStock:current,newStock:preview,
        reason:reason,by:user.name,at:serverTimestamp()
      });
      showT("Stock updated: "+item.name+" → "+String(preview)+" "+(item.unit||"")+" ✓");
      onClose();
    }catch(e){showT("Error saving","err");}
    setSaving(false);
  };

  var saveDetails=async function(){
    if(!details.name.trim()){showT("Enter item name","warn");return;}
    setSaving(true);
    try{
      await updateDoc(doc(db,invCol,item.id),{
        name:details.name,
        unit:details.unit,
        cat:details.cat,
        packUnit:details.packUnit||"",
        packSize:parseFloat(details.packSize)||0,
        price:parseFloat(details.price)||0,
        cost:parseFloat(details.cost)||0,
        minStock:parseFloat(details.minStock)||10,
        margin:details.price>0?Math.round((details.price-details.cost)/details.price*100):0,
        updatedAt:serverTimestamp(),
        updatedBy:user.name
      });
      // If name changed, update all BOM references
      if(details.name.trim()!==item.name&&isOwner){
        try{
          const bomSnap=await getDocs(collection(db,"bom"));
          let updated=0;
          for(const bomDoc of bomSnap.docs){
            const data=bomDoc.data();
            let changed=false;
            const newData={};
            for(const [key,rows] of Object.entries(data)){
              if(!Array.isArray(rows)){newData[key]=rows;continue;}
              const newRows=rows.map(function(r){
                if(r.ingId===item.id||r.ingName===item.name){
                  changed=true;
                  return {...r,ingName:details.name};
                }
                return r;
              });
              newData[key]=newRows;
            }
            if(changed){
              await setDoc(doc(db,"bom",bomDoc.id),newData);
              updated++;
            }
          }
          if(updated>0)showT("✅ Updated "+updated+" BOM recipe(s) with new name","ok");
        }catch(e){console.warn("BOM sync:",e);}
      }
      // Log details edit
