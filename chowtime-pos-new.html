function ReceiveItemsModal({po,db,user,showT,branchId,onClose}){
  if(!po)return null;
  const drItems = po.deliveredItems||po.items||[];
  const [received,setReceived] = useState(()=>{
    const init={};
    drItems.forEach(i=>{init[i.id]=(i.actualQty!=null?i.actualQty:(i.qty||0));});
    return init;
  });
  const [remarks,setRemarks] = useState({});
  const [saving,setSaving] = useState(false);

  const discItems = drItems.filter(i=>{
    const dr=(i.actualQty!=null?i.actualQty:(i.qty||0));
    const rc=(received[i.id]!=null?received[i.id]:dr);
    return rc!==dr;
  });
  const hasDisc = discItems.length>0;

  const confirmReceipt = async()=>{
    setSaving(true);
    try{
      const finalItems = drItems.map(i=>({
        ...i,
        receivedQty:(received[i.id]!=null?received[i.id]:(i.actualQty!=null?i.actualQty:(i.qty||0))),
        remark:remarks[i.id]||""
      }));
      if(hasDisc){
        await updateDoc(doc(db,"advances",po._docId),{
          status:"discrepancy",receivedItems:finalItems,
          receivedBy:user.name,receivedAt:serverTimestamp(),
          discrepancyItems:discItems.map(i=>({
            ...i,drQty:(i.actualQty!=null?i.actualQty:(i.qty||0)),
            receivedQty:(received[i.id]||0),
            diff:(received[i.id]||0)-(i.actualQty!=null?i.actualQty:(i.qty||0)),
            remark:remarks[i.id]||""
          })),discrepancyStatus:"pending_approval"
        });
        showT("Discrepancy reported — awaiting Main approval","warn");
      } else {
        await updateDoc(doc(db,"advances",po._docId),{
          status:"completed",receivedItems:finalItems,
          receivedBy:user.name,receivedAt:serverTimestamp()
        });
        showT("Items received — PO Completed");
      }
      onClose();
    }catch(e){showT("Error","err");}
    setSaving(false);
  };

  return h("div",{style:{background:"#fff",width:640,maxHeight:"90vh",
    borderRadius:16,display:"flex",flexDirection:"column",overflow:"hidden",
    boxShadow:"0 20px 60px rgba(0,0,0,.4)"}},
    h("div",{style:{background:"linear-gradient(135deg,"+C.primary+","+C.dark+")",
      padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
      h("div",null,
        h("div",{style:{color:"rgba(255,255,255,.6)",fontSize:9,fontWeight:700,letterSpacing:2}},"RECEIVE ITEMS"),
        h("div",{style:{color:"#fff",fontSize:15,fontWeight:900}},po.drNum||po.poNum),
        h("div",{style:{color:"rgba(255,255,255,.5)",fontSize:9}},"DR Date: "+(po.deliveryDate||po.date))
      ),
      h("button",{onClick:onClose,style:{background:"rgba(255,255,255,.15)",border:"none",
        color:"#fff",width:28,height:28,borderRadius:8,fontSize:16,cursor:"pointer"}},"x")
    ),
    hasDisc&&h("div",{style:{padding:"8px 20px",background:"#FFF3E0",
      borderBottom:"1px solid #FFE0B2",fontSize:11,color:"#E65100",fontWeight:700}},
      String(discItems.length)+" item(s) with discrepancy — needs Main approval"),
    h("div",{style:{flex:1,overflowY:"auto"}},
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 80px 90px 60px 1fr",
        padding:"7px 20px",background:"#fafafa",borderBottom:"1px solid #eee",position:"sticky",top:0}},
        ["ITEM","DR QTY","RECEIVED","DIFF","REMARKS"].map(function(lbl){
          return h("div",{key:lbl,style:{fontSize:8,fontWeight:700,color:C.muted,letterSpacing:1}},lbl);
        })
      ),
      drItems.map(function(i){
        const drQty=(i.actualQty!=null?i.actualQty:(i.qty||0));
        const rcvQty=(received[i.id]!=null?received[i.id]:drQty);
        const diff=rcvQty-drQty;
        return h("div",{key:i.id,
          style:{display:"grid",gridTemplateColumns:"1fr 80px 90px 60px 1fr",
            padding:"8px 20px",borderBottom:"1px solid #f5f5f5",alignItems:"center",
            background:diff!==0?"#FFF8E1":"#fff"}},
          h("div",null,
            h("div",{style:{fontSize:11,fontWeight:700}},i.name),
            h("div",{style:{fontSize:9,color:"#888"}},i.unit||"")
          ),
          h("div",{style:{fontSize:11,color:C.muted}},String(drQty)+" "+(i.unit||"")),
          h("div",{style:{display:"flex",alignItems:"center",gap:3}},
            h("button",{onClick:function(){setReceived(function(p){var r={};Object.assign(r,p);r[i.id]=Math.max(0,(p[i.id]!=null?p[i.id]:drQty)-1);return r;});},
              style:{width:20,height:20,borderRadius:4,border:"1px solid #ddd",background:"#fff",cursor:"pointer",fontSize:12}},"-"),
            h("input",{type:"number",onFocus:e=>e.target.select(),min:0,
              value:(received[i.id]!=null?received[i.id]:drQty),
              onChange:function(e){var v=parseFloat(e.target.value)||0;setReceived(function(p){var r={};Object.assign(r,p);r[i.id]=v;return r;});},
              style:{width:36,textAlign:"center",padding:"2px",
                border:"1px solid "+(diff!==0?C.warning:"#ddd"),
                borderRadius:4,fontSize:11,fontWeight:700,outline:"none",
                color:diff<0?C.danger:diff>0?"#1565C0":"#333"}}),
            h("button",{onClick:function(){setReceived(function(p){var r={};Object.assign(r,p);r[i.id]=(p[i.id]!=null?p[i.id]:drQty)+1;return r;});},
              style:{width:20,height:20,borderRadius:4,border:"1px solid "+C.primary,background:"#f5f5f5",cursor:"pointer",fontSize:12}},"+")
          ),
          h("div",{style:{fontSize:11,fontWeight:700,
            color:diff<0?C.danger:diff>0?"#1565C0":"#888"}},
            diff===0?"OK":(diff>0?"+":"")+String(diff)),
          diff!==0
            ? h("input",{value:remarks[i.id]||"",
                onChange:function(e){var v=e.target.value;setRemarks(function(p){var r={};Object.assign(r,p);r[i.id]=v;return r;});},
                placeholder:"Reason...",
                style:{width:"100%",padding:"4px 7px",border:"1px solid "+C.warning,
                  borderRadius:6,fontSize:10,outline:"none",boxSizing:"border-box"}})
            : h("span",{style:{fontSize:9,color:C.success}},"OK")
        );
      })
    ),
    h("div",{style:{padding:"12px 20px",
      borderTop:"2px solid "+(hasDisc?C.warning:C.primary),
      background:"#fafafa",display:"flex",gap:8,alignItems:"center"}},
      hasDisc
        ? h("div",{style:{fontSize:10,color:"#E65100",flex:1}},"Will be reported to Main for approval")
        : h("div",{style:{fontSize:10,color:C.success,flex:1}},"No discrepancy — PO will be completed"),
      h("button",{onClick:onClose,
        style:{padding:"9px 16px",background:"#fff",border:"1px solid "+C.border,
          borderRadius:9,fontSize:11,fontWeight:700,cursor:"pointer"}},"Cancel"),
      h("button",{onClick:confirmReceipt,disabled:saving,
        style:{padding:"10px 20px",
          background:hasDisc?"linear-gradient(135deg,#E65100,#BF360C)":
            "linear-gradient(135deg,"+C.primary+","+C.dark+")",
          border:"none",borderRadius:9,color:"#fff",fontWeight:800,fontSize:12,cursor:"pointer"}},
        saving?"Saving...":(hasDisc?"Report Discrepancy":"Confirm Receipt"))
    )
  );
}

function PaymentModal({po,db,user,showT,onClose}){
  if(!po)return null;
  const [amount,setAmount]=useState("");
  const [method,setMethod]=useState("cash");
  const [ref,setRef]=useState("");
  const [saving,setSaving]=useState(false);

  const payments=po.payments||[];
  const totalPaid=payments.reduce((s,p)=>s+(p.amount||0),0);
  const grandTotal=po.totalAmount||0;
  const balance=grandTotal-totalPaid;
  const newPaid=totalPaid+(parseFloat(amount)||0);
  const newBalance=grandTotal-newPaid;
  const payStatus=newPaid>=grandTotal?"Paid":newPaid>0?"Partial":"Unpaid";

  const savePayment=async()=>{
    if(!amount||parseFloat(amount)<=0){showT("Enter payment amount","warn");return;}
    setSaving(true);
    try{
      const newPayment={
        amount:parseFloat(amount),
        method,ref,
        by:user.name,
        at:new Date().toISOString()
      };
      const newPayments=[...payments,newPayment];
      const newTotalPaid=newPayments.reduce((s,p)=>s+(p.amount||0),0);
      const newStatus=newTotalPaid>=grandTotal?"paid":"processing";
      const newPayStatus=newTotalPaid>=grandTotal?"Paid":newTotalPaid>0?"Partial":"Unpaid";
      await updateDoc(doc(db,"advances",po._docId),{
        payments:newPayments,
        totalPaid:newTotalPaid,
        paymentStatus:newPayStatus,
        status:newStatus,
        ...(newStatus==="paid"?{paidAt:serverTimestamp(),paidBy:user.name}:{})
      });
      showT("Payment recorded ✓ — "+newPayStatus);
      onClose();
    }catch(e){showT("Error saving payment","err");}
    setSaving(false);
  };

  return h("div",{style:{background:"#fff",width:460,borderRadius:16,
    overflow:"hidden",boxShadow:"0 20px 60px rgba(0,0,0,.4)"}},

    // Header
    h("div",{style:{background:`linear-gradient(135deg,${C.success},#1B5E20)`,
      padding:"14px 20px",display:"flex",justifyContent:"space-between"}},
      h("div",null,
        h("div",{style:{color:"rgba(255,255,255,.6)",fontSize:9,fontWeight:700,letterSpacing:2}},
          "RECORD PAYMENT"),
        h("div",{style:{color:"#fff",fontSize:15,fontWeight:900,marginTop:2}},po.poNum),
        h("div",{style:{color:"rgba(255,255,255,.5)",fontSize:9}},po.branchName||po.branch)
      ),
      h("button",{onClick:onClose,style:{background:"rgba(255,255,255,.15)",border:"none",
        color:"#fff",width:28,height:28,borderRadius:8,fontSize:16,cursor:"pointer"}},"×")
    ),

    h("div",{style:{padding:"16px 20px"}},

      // Summary
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}},
        h("div",{style:{background:"#f9f9f9",borderRadius:8,padding:"10px",textAlign:"center"}},
          h("div",{style:{fontSize:9,color:C.muted,marginBottom:3}},"GRAND TOTAL"),
          h("div",{style:{fontSize:14,fontWeight:900,color:C.text}},"₱"+peso(grandTotal))
        ),
        h("div",{style:{background:"#E8F5E9",borderRadius:8,padding:"10px",textAlign:"center"}},
          h("div",{style:{fontSize:9,color:C.muted,marginBottom:3}},"TOTAL PAID"),
          h("div",{style:{fontSize:14,fontWeight:900,color:C.success}},"₱"+peso(totalPaid))
        ),
        h("div",{style:{background:balance>0?"#FFEBEE":"#E8F5E9",borderRadius:8,
          padding:"10px",textAlign:"center"}},
          h("div",{style:{fontSize:9,color:C.muted,marginBottom:3}},"BALANCE"),
          h("div",{style:{fontSize:14,fontWeight:900,color:balance>0?C.danger:C.success}},
            "₱"+peso(balance))
        )
      ),

      // Payment history
      payments.length>0&&h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:6}},
          "PAYMENT HISTORY"),
        payments.map((p,i)=>
          h("div",{key:i,style:{display:"flex",justifyContent:"space-between",
            padding:"6px 10px",background:"#f9f9f9",borderRadius:7,marginBottom:4,
            fontSize:11}},
            h("div",null,
              h("span",{style:{fontWeight:700}},"₱"+peso(p.amount)),
              h("span",{style:{color:C.muted,marginLeft:8}},
                p.method.toUpperCase()+(p.ref?" · Ref: "+p.ref:""))
            ),
            h("div",{style:{fontSize:9,color:C.muted}},p.by+" · "+p.at.slice(0,10))
          )
        )
      ),

      // New payment input
      h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:6}},
        "ADD PAYMENT"),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}},
        h("div",null,
          h("div",{style:{fontSize:9,color:C.muted,marginBottom:3}},"AMOUNT (₱)"),
          h("input",{type:"number",onFocus:e=>e.target.select(),value:amount,onChange:e=>setAmount(e.target.value),
            placeholder:"0.00",
            style:{width:"100%",padding:"9px",border:"2px solid "+C.success,
              borderRadius:8,fontSize:15,fontWeight:700,outline:"none",
              boxSizing:"border-box",color:C.success}})
        ),
        h("div",null,
          h("div",{style:{fontSize:9,color:C.muted,marginBottom:3}},"METHOD"),
          h("div",{style:{display:"flex",gap:4}},
            ["cash","bank","gcash","maya"].map(m=>
              h("button",{key:m,onClick:()=>setMethod(m),
                style:{flex:1,padding:"5px 2px",borderRadius:6,fontSize:9,
                  fontWeight:700,cursor:"pointer",border:"none",
                  background:method===m?C.primary:"#eee",
                  color:method===m?"#fff":C.text}},
                m.toUpperCase()))
          )
        )
      ),
      (method==="bank"||method==="gcash"||method==="maya")&&
        h("div",{style:{marginBottom:8}},
          h("div",{style:{fontSize:9,color:C.muted,marginBottom:3}},"REFERENCE NUMBER"),
          h("input",{value:ref,onChange:e=>setRef(e.target.value),
            placeholder:"Transaction ref...",
            style:{width:"100%",padding:"8px",border:"1px solid "+C.border,
              borderRadius:7,fontSize:11,outline:"none",boxSizing:"border-box"}})
        ),

      // Preview new status
      amount&&parseFloat(amount)>0&&h("div",{style:{padding:"8px 12px",marginBottom:10,
        background:payStatus==="Paid"?"#E8F5E9":payStatus==="Partial"?"#FFF8E1":"#FFEBEE",
        borderRadius:8,display:"flex",justifyContent:"space-between",fontSize:11}},
        h("span",null,"After payment:"),
        h("div",{style:{textAlign:"right"}},
          h("div",{style:{fontWeight:800,color:payStatus==="Paid"?C.success:payStatus==="Partial"?C.warning:C.danger}},
            payStatus==="Paid"?"✅ FULLY PAID":payStatus==="Partial"?"⚡ PARTIAL — Balance: ₱"+peso(newBalance):"Unpaid"),
          h("div",{style:{fontSize:9,color:C.muted}},"New total paid: ₱"+peso(newPaid))
        )
      ),

      h("button",{onClick:savePayment,disabled:saving,
        style:{width:"100%",padding:"11px",background:C.success,border:"none",
          borderRadius:9,color:"#fff",fontWeight:800,fontSize:13,cursor:"pointer"}},
        saving?"Saving...":"💰 Save Payment")
    )
  );
}

// ─── DR PROCESS MODAL ────────────────────────────────────
function DRProcessModal({po,db,user,showT,onClose,companySettings={},branches=[]}){
  if(!po) return null;
  const [prices,setPrices]   = useState({});
  const [actualQtys,setActual] = useState({});
  const [deliveryDate,setDD]  = useState(new Date().toISOString().slice(0,10));
  const [notes,setNotes]      = useState("");
  const [saving,setSaving]    = useState(false);

  // Init from existing DR data if any
  useEffect(()=>{
    const p={}, q={};
    (po.items||[]).forEach(i=>{
      p[i.id]=i.price||0;
      q[i.id]=i.actualQty!=null?i.actualQty:i.qty;
    });
    setPrices(p); setActual(q);
  },[po._docId]);

  const items = po.items||[];
  const total = items.reduce((s,i)=>
    s+((prices[i.id]||0)*((actualQtys[i.id]!=null?actualQtys[i.id]:i.qty)||0)),0);

  const printDR = (cs)=>{
    const w=window.open("","_blank","width=800,height=900");
    // Group items by category
    const cats={};
    items.forEach(i=>{
      const cat=i.cat||i.category||"Others";
      if(!cats[cat])cats[cat]=[];
      const aq=actualQtys[i.id]!=null?actualQtys[i.id]:i.qty;
      const p=prices[i.id]||0;
      cats[cat].push({...i,aq,p,lineTotal:aq*p});
    });
    let itemNo=1;
    let tableRows="";
    Object.keys(cats).forEach(cat=>{
      const catItems=cats[cat];
      const catTotal=catItems.reduce((s,i)=>s+i.lineTotal,0);
      const catQty=catItems.reduce((s,i)=>s+i.aq,0);
      catItems.forEach(i=>{
        tableRows+=`<tr>
          <td>${itemNo++}</td>
          <td style="color:#888;font-size:10px">${i.id||""}</td>
          <td>${cat}</td>
          <td>${i.name}</td>
          <td>${i.aq} ${i.unit||""}</td>
          <td class="r">₱${i.p.toFixed(2)}</td>
          <td class="r">₱${i.lineTotal.toFixed(2)}</td>
          <td>—</td>
        </tr>`;
      });
      tableRows+=`<tr class="cat-total">
        <td colspan="3"></td>
        <td class="b">Total ${cat}</td>
        <td class="b">${catQty}</td>
        <td></td>
        <td class="r b">₱${catTotal.toFixed(2)}</td>
        <td></td>
      </tr>`;
    });
    tableRows+=`<tr class="grand-total">
      <td colspan="3"></td>
      <td class="b">Total Quantity</td>
      <td class="b">${items.reduce((s,i)=>s+(actualQtys[i.id]!=null?actualQtys[i.id]:i.qty),0)}</td>
      <td></td>
      <td class="r b">₱${total.toFixed(2)}</td>
      <td></td>
    </tr>`;

    const drNum="DR-"+po.poNum;
    const branchInfo=po.branchName||po.branch;
    const cs2=cs||{name:"CHOWTIME FAST-FOOD CHAIN",email:"",address:"",
      bankName:"BPI",bankAccount:"Chowtime Fast Food Chain",bankNumber:"",bankQR:""};

    w.document.write(`<!DOCTYPE html><html><head><title>${drNum}</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      body{font-family:Arial,sans-serif;font-size:11px;padding:24px;color:#222;}
      .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
      .logo-area{display:flex;align-items:center;gap:12px;}
      .logo{width:52px;height:52px;background:#C8151B;border-radius:10px;
        display:flex;align-items:center;justify-content:center;
        color:#fff;font-weight:900;font-size:20px;flex-shrink:0;}
      .dr-title{font-size:20px;font-weight:900;color:#C8151B;}
      .dr-sub{font-size:11px;color:#888;margin-top:2px;}
      .qr-box{text-align:center;}
      .qr-box img{width:80px;height:80px;object-fit:contain;}
      .to-from{display:grid;grid-template-columns:1fr 1fr;gap:0;
        border:1px solid #ddd;border-radius:8px;overflow:hidden;margin-bottom:14px;}
      .to-box{padding:10px 14px;border-right:1px solid #ddd;}
      .from-box{padding:10px 14px;background:#f9f9f9;}
      .box-label{font-size:9px;font-weight:700;color:#888;letter-spacing:1px;margin-bottom:4px;}
      .box-name{font-size:13px;font-weight:800;margin-bottom:4px;}
      .box-detail{font-size:10px;color:#555;line-height:1.6;}
      table{width:100%;border-collapse:collapse;margin-bottom:14px;}
      th{background:#f5f5f5;padding:6px 8px;text-align:left;
        border:1px solid #ddd;font-size:10px;font-weight:700;}
      td{padding:5px 8px;border:1px solid #eee;font-size:11px;}
      .r{text-align:right;} .b{font-weight:700;}
      .cat-total{background:#f0f0f0;}
      .grand-total{background:#e8e8e8;font-weight:900;}
      .sigs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0;}
      .sig-box{text-align:center;padding-top:36px;border-top:1px solid #333;font-size:10px;}
      .payment-section{border:1px solid #ddd;border-radius:8px;padding:12px 16px;
        display:flex;justify-content:space-between;align-items:center;}
      .pay-label{font-size:9px;font-weight:700;color:#888;letter-spacing:1px;margin-bottom:6px;}
      .pay-detail{font-size:11px;line-height:1.8;}
      .footer{margin-top:12px;font-size:9px;color:#aaa;text-align:center;}
      @media print{body{padding:12px;}}
    </style></head><body>

    <!-- HEADER -->
    <div class="header">
      <div class="logo-area">
        <div class="logo">CT</div>
        <div>
          <div class="dr-title">Delivery Receipt – ${po.poNum}</div>
          <div class="dr-sub">Delivery date: ${deliveryDate}</div>
        </div>
      </div>
      ${cs2.bankQR?`<div class="qr-box"><img src="${cs2.bankQR}" alt="QR"/><div style="font-size:9px;color:#888;margin-top:2px">Scan to Pay</div></div>`:""}
    </div>

    <!-- TO / FROM -->
    <div class="to-from">
      <div class="to-box">
        <div class="box-label">To</div>
        <div class="box-name">${branchInfo}</div>
        <div class="box-detail">
          Client PO Number: ${po.poNum}<br>
          Sales Invoice Number: ${drNum}
        </div>
      </div>
      <div class="from-box">
        <div class="box-label">From</div>
        <div class="box-name">${cs2.name}</div>
        <div class="box-detail">
          ${cs2.phone?"Phone: "+cs2.phone+"<br>":""}
          ${cs2.email?"Email: "+cs2.email+"<br>":""}
          ${cs2.address?"Address: "+cs2.address:""}
        </div>
      </div>
    </div>

    <!-- LINE ITEMS -->
    <div style="font-size:10px;font-weight:700;color:#C8151B;margin-bottom:6px;">Line items</div>
    <table>
      <tr>
        <th>Item No.</th><th>SKU</th><th>Category</th><th>Description</th>
        <th>Quantity</th><th class="r">Unit Price</th><th class="r">Total Price</th><th>Remarks</th>
      </tr>
      ${tableRows}
    </table>

    <!-- SIGNATURES -->
    <div class="sigs">
      <div class="sig-box">Prepared by</div>
      <div class="sig-box">Approved by</div>
      <div class="sig-box">Delivered by</div>
      <div class="sig-box">Received by</div>
    </div>

    <!-- PAYMENT METHOD -->
    <div class="payment-section">
      <div>
        <div class="pay-label">PAYMENT METHOD</div>
        <div class="pay-detail">
          Bank Name: <b>${cs2.bankName}</b><br>
          Bank Account Name: <b>${cs2.bankAccount}</b><br>
          Bank Account Number: <b>${cs2.bankNumber}</b>
        </div>
      </div>
      ${cs2.bankQR?`<img src="${cs2.bankQR}" style="width:80px;height:80px;object-fit:contain;">`:""}
    </div>

    <div class="footer">Powered by Chowtime POS v5.0</div>
    </body></html>`);
    w.document.close();
    setTimeout(()=>w.print(),500);
  };

  const issueDR = async()=>{
    setSaving(true);
    try{
      const delivered = items.map(i=>({
        ...i,
        actualQty: actualQtys[i.id]!=null?actualQtys[i.id]:i.qty,
        price: prices[i.id]||0,
        total: ((actualQtys[i.id]!=null?actualQtys[i.id]:i.qty)||0)*(prices[i.id]||0),
        discrepancy: ((actualQtys[i.id]!=null?actualQtys[i.id]:i.qty)||0)-(i.qty||0)
      }));
      const hasDisc = delivered.some(i=>i.discrepancy!==0);
      await updateDoc(doc(db,"advances",po._docId),{
        status:"processing",
        drNum:"DR-"+po.poNum,
        deliveredItems:delivered,
        totalAmount:total,
        deliveryDate,
        drNotes:notes,
        hasDiscrepancy:hasDisc,
        issuedBy:user.name,
        issuedAt:serverTimestamp()
      });
      showT("DR issued ✓ — "+po.poNum+" now PROCESSING");
      printDR(companySettings);
      onClose();
    }catch(e){showT("Error issuing DR","err");console.error(e);}
    setSaving(false);
  };

  return h("div",{style:{background:"#fff",width:620,maxHeight:"90vh",borderRadius:16,
    display:"flex",flexDirection:"column",overflow:"hidden",
    boxShadow:"0 20px 60px rgba(0,0,0,.4)"}},

    // Header
    h("div",{style:{background:`linear-gradient(135deg,#6A1B9A,#4A148C)`,
      padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
      h("div",null,
        h("div",{style:{color:"rgba(255,255,255,.6)",fontSize:9,fontWeight:700,letterSpacing:2}},
          "PROCESS & ISSUE DELIVERY RECEIPT"),
        h("div",{style:{color:"#fff",fontSize:15,fontWeight:900,marginTop:2}},po.poNum),
        h("div",{style:{color:"rgba(255,255,255,.5)",fontSize:9,marginTop:1}},
          po.branchName||po.branch)

      h("button",{onClick:onClose,style:{background:"rgba(255,255,255,.15)",border:"none",
        color:"#fff",width:28,height:28,borderRadius:8,fontSize:16,cursor:"pointer"}},
        "×")

    // Delivery date + notes
    h("div",{style:{padding:"12px 20px",background:"#f9f9f9",borderBottom:"1px solid #eee",
      display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
      h("div",null,
        h("div",{style:{fontSize:9,fontWeight:700,color:"#6A1B9A",marginBottom:4,letterSpacing:1}},
          "DELIVERY DATE *"),
        h("input",{type:"date",value:deliveryDate,onChange:e=>setDD(e.target.value),
          style:{width:"100%",padding:"7px",border:"2px solid #6A1B9A",borderRadius:7,
            fontSize:12,fontWeight:700,color:"#6A1B9A",outline:"none",boxSizing:"border-box"}})
      ),
      h("div",null,
        h("div",{style:{fontSize:9,fontWeight:700,color:"#6A1B9A",marginBottom:4,letterSpacing:1}},
          "DR NOTES"),
        h("input",{value:notes,onChange:e=>setNotes(e.target.value),
          placeholder:"Remarks, substitutions...",
          style:{width:"100%",padding:"7px",border:"1px solid #ddd",borderRadius:7,
            fontSize:11,outline:"none",boxSizing:"border-box"}})
      )

// ─── PRINT DR HELPER ────────────────────────────────────
function printPODR(po){
  const w=window.open("","_blank","width=800,height=900");
  const items=po.deliveredItems||po.items||[];
  const grouped={};
  items.forEach(function(i){
    const cat=i.category||i.cat||"Other";
    if(!grouped[cat])grouped[cat]=[];
    grouped[cat].push(i);
  });
  let rows="",grand=0,itemNo=1;
  Object.keys(grouped).sort().forEach(function(cat){
    const cItems=grouped[cat];
    const cTotal=cItems.reduce(function(s,i){
      return s+(i.price||0)*(i.actualQty!=null?i.actualQty:(i.qty||0));
    },0);
    grand+=cTotal;
    cItems.forEach(function(i){
      const q=i.actualQty!=null?i.actualQty:(i.qty||0);
      rows+="<tr><td>"+itemNo+++"</td><td>"+cat+"</td><td>"+i.name+"</td>"+
        "<td>"+q+" "+(i.unit||"")+"</td>"+
        "<td style='text-align:right'>"+"₱"+peso(i.price||0)+"</td>"+
        "<td style='text-align:right'>"+"₱"+peso(((i.price||0)*q))+"</td></tr>";
    });
    rows+="<tr style='background:#f5f5f5;font-weight:bold'>"+
      "<td colspan='2'></td><td>Total "+cat+"</td>"+
      "<td></td><td></td><td style='text-align:right'>"+"₱"+peso(cTotal)+"</td></tr>";
  });
  const html="<!DOCTYPE html><html><head><title>"+(po.drNum||po.poNum)+"</title>"+
    "<style>body{font-family:Arial;font-size:11px;padding:20px;}"+
    "table{width:100%;border-collapse:collapse;}"+
    "th{background:#C8151B;color:#fff;padding:5px;}"+
    "td{padding:4px 6px;border-bottom:1px solid #eee;}</style></head><body>"+
    "<h2 style='color:#C8151B'>"+(po.drNum||"DR-"+po.poNum)+"</h2>"+
    "<p>Branch: "+(po.branchName||po.branch)+" &middot; Date: "+(po.deliveryDate||po.date)+"</p>"+
    "<table><tr><th>#</th><th>Category</th><th>Item</th>"+
    "<th>Qty</th><th>Price</th><th>Total</th></tr>"+
    rows+
    "<tr style='background:#C8151B;color:#fff;font-weight:bold'>"+
    "<td colspan='5' style='text-align:right'>GRAND TOTAL</td>"+
    "<td>"+"₱"+peso(grand)+"</td></tr></table>"+
    "<div style='margin-top:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px'>"+
    ["Prepared by","Approved by","Delivered by","Received by"].map(function(s){
      return "<div style='text-align:center;border-top:1px solid #000;padding-top:4px'>"+s+"</div>";
    }).join("")+"</div></body></html>";
  w.document.write(html);
  w.document.close();
  setTimeout(function(){w.print();},400);
}



// ─── PERMISSIONS TAB ──────────────────────────────────────
function PermissionsTab({db,showT,companySettings,setCompanySettings}){
  // Default permissions per role
  const DEFAULT_PERMS = {
    cashier: {
      pos:true, orders:true, x_reading:true, z_reading:true,
      cash_count:true, expenses:true, inventory:true,
      ca_request:true, loan_request:true,
      void_request:true, kiosk:true

    crew: {
      kitchen:true, pos:true, orders:true,
      ca_request:true, loan_request:true, kiosk:true
    },
    stockclerk: {
      inventory:true, stock_order:true, stock_receive:true,
      pos:true, orders:true, expenses:true,
      ca_request:true, loan_request:true, kiosk:true
    }
  };

  const [perms,setPerms] = useState(()=>{
    return companySettings.rolePerms || DEFAULT_PERMS;
  });
  const [saving,setSaving] = useState(false);

  // Nav items per role with labels
  const ROLE_NAVS = {
    cashier: [
      {key:"pos",label:"🛒 POS"},
      {key:"orders",label:"📋 Orders"},
      {key:"x_reading",label:"📊 X-Reading"},
      {key:"z_reading",label:"📊 Z-Reading"},
      {key:"cash_count",label:"💵 Cash Count"},
      {key:"expenses",label:"💸 Expenses"},
      {key:"inventory",label:"📦 Inventory"},
      {key:"ca_request",label:"💵 Cash Advance"},
      {key:"loan_request",label:"🏦 Loan Request"},
      {key:"void_request",label:"🚫 Void Request"},
    ],
    crew: [
      {key:"kitchen",label:"🍳 Kitchen"},
      {key:"ca_request",label:"💵 Cash Advance"},
      {key:"loan_request",label:"🏦 Loan Request"},
      {key:"kiosk",label:"📺 Kiosk"},
    ],
    stockclerk: [
      {key:"inventory",label:"📦 Inventory"},
      {key:"stock_order",label:"🚚 Stock Order"},
      {key:"stock_receive",label:"📥 Receive Stock"},
      {key:"ca_request",label:"💵 Cash Advance"},
      {key:"loan_request",label:"🏦 Loan Request"},
    ]
  };

  const ROLE_COLORS = {
    cashier:"#34C759",
    crew:"#FF9500", stockclerk:"#AF52DE"
  };
  const ROLE_LABELS = {
    cashier:"💳 Cashier",
    crew:"🧑‍🍳 Crew / Kitchen", stockclerk:"📦 Stock Clerk"
  };

  const toggle=(role,key)=>{
    setPerms(p=>({
      ...p,
      [role]:{...p[role],[key]:!p[role]?.[key]}
    }));
  };

  const save=async()=>{
    setSaving(true);
    try{
      await setDoc(doc(db,"settings","company"),
        {rolePerms:perms},{merge:true});
      setCompanySettings(p=>({...p,rolePerms:perms}));
      showT("Permissions saved ✓ — takes effect on next login","ok");
    }catch(e){showT("Error saving","err");}
    setSaving(false);
  };

  const resetRole=(role)=>{
    setPerms(p=>({...p,[role]:{...DEFAULT_PERMS[role]}}));
  };

  return h("div",null,
    h("div",{style:{background:"#E3F2FD",borderRadius:10,
      padding:"10px 14px",marginBottom:8,fontSize:11,color:"#1565C0"}},
      "👔 Branch Manager — always has FULL ACCESS to all features. Cannot be restricted."),
    h("div",{style:{background:"#fff3cd",borderRadius:10,
      padding:"10px 14px",marginBottom:14,fontSize:11,color:"#856404"}},
      "⚠️ All features are ON by default. I-OFF lang ang hindi kailangan. Changes take effect on next login."),

    h("div",{style:{display:"grid",gap:12}},
      Object.keys(ROLE_NAVS).map(role=>
        h("div",{key:role,style:{background:"#fff",borderRadius:12,
          border:"2px solid "+(ROLE_COLORS[role]||C.border),overflow:"hidden"}},

          // Role header
          h("div",{style:{
            background:ROLE_COLORS[role]||C.primary,
            padding:"10px 16px",
            display:"flex",justifyContent:"space-between",alignItems:"center"}},
            h("div",{style:{color:"#fff",fontWeight:800,fontSize:13}},
              ROLE_LABELS[role]||role),
            h("div",{style:{display:"flex",gap:8}},
              h("button",{onClick:()=>resetRole(role),
                style:{padding:"4px 10px",background:"rgba(255,255,255,.2)",
                  border:"none",borderRadius:6,color:"#fff",
                  fontSize:10,fontWeight:700,cursor:"pointer"}},
                "↺ Reset"),
              h("button",{
                onClick:()=>{
                  // Enable all
                  const all={};
                  ROLE_NAVS[role].forEach(n=>all[n.key]=true);
                  setPerms(p=>({...p,[role]:all}));
                },
                style:{padding:"4px 10px",background:"rgba(255,255,255,.2)",
                  border:"none",borderRadius:6,color:"#fff",
                  fontSize:10,fontWeight:700,cursor:"pointer"}},
                "✅ All On"),
              h("button",{
                onClick:()=>{
                  // Disable optional ones (keep pos for cashier)
                  const none={};
                  ROLE_NAVS[role].forEach(n=>none[n.key]=
                    (role==="cashier"&&n.key==="pos")?true:false);
                  setPerms(p=>({...p,[role]:none}));
                },
                style:{padding:"4px 10px",background:"rgba(255,255,255,.2)",
                  border:"none",borderRadius:6,color:"#fff",
                  fontSize:10,fontWeight:700,cursor:"pointer"}},
                "🚫 All Off")
            )
          ),

          // Toggle grid
          h("div",{style:{padding:"12px 16px",
            display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",
            gap:8}},
            ROLE_NAVS[role].map(nav=>{
              const isOn=perms[role]?.[nav.key]!==false;
              const isRequired=
                (role==="cashier"&&nav.key==="pos")||
                (role==="crew"&&nav.key==="kitchen");
              return h("button",{key:nav.key,
                onClick:()=>!isRequired&&toggle(role,nav.key),
                style:{padding:"8px 12px",borderRadius:8,
                  border:"2px solid "+(isOn?ROLE_COLORS[role]:C.border),
                  background:isOn?(ROLE_COLORS[role]+"15"):"#f9f9f9",
                  cursor:isRequired?"not-allowed":"pointer",
                  display:"flex",alignItems:"center",gap:6,
                  fontSize:11,fontWeight:isOn?700:400,
                  color:isOn?ROLE_COLORS[role]:C.muted,
                  opacity:isRequired?0.7:1}},
                h("span",null,isOn?"✅":"⬜"),
                h("span",null,nav.label),
                isRequired&&h("span",{style:{fontSize:8,color:C.muted}}," (required)")
              );
            })
          )
        )
      )
    ),

    h("div",{style:{marginTop:14,display:"flex",gap:8}},
      h("button",{onClick:()=>setPerms(DEFAULT_PERMS),
        style:{padding:"10px 20px",background:"#fff",
          border:"1px solid "+C.border,borderRadius:9,
          fontSize:12,fontWeight:700,cursor:"pointer"}},
        "↺ Reset All to Default"),
      h("button",{onClick:save,disabled:saving,
        style:{flex:1,padding:"11px",
          background:saving?"#ccc":"linear-gradient(135deg,"+C.primary+","+C.dark+")",
          border:"none",borderRadius:9,color:"#fff",
          fontWeight:800,fontSize:13,cursor:"pointer"}},
        saving?"Saving...":"💾 Save Permissions")
    )
  );
}


// ─── INV CATEGORIES TAB ───────────────────────────────────
function InvCatsTab({db,showT}){
  const DEFAULT_CATS=["Frozen","Produce","Protein","Sauce","Dry Goods","Packaging","Beverage","Other"];
  const [cats,setCats]=useState([]);
  const [newCat,setNewCat]=useState("");
  const [saving,setSaving]=useState(false);
  const [loaded,setLoaded]=useState(false);

  useEffect(()=>{
    try{
      const unsub=onSnapshot(doc(db,"settings","inv_cats"),snap=>{
        if(snap.exists()&&snap.data().cats){
          const custom=snap.data().cats.filter(c=>typeof c==="string"&&c.trim());
          const merged=[...DEFAULT_CATS,...custom.filter(c=>!DEFAULT_CATS.includes(c))];
          setCats(merged);
        } else {
          setCats([...DEFAULT_CATS]);
        }
        setLoaded(true);
      },()=>{setCats([...DEFAULT_CATS]);setLoaded(true);});
      return()=>unsub();
    }catch(e){setCats([...DEFAULT_CATS]);setLoaded(true);}
  },[]);

  const saveToFirebase=async(newList)=>{
    const custom=newList.filter(c=>!DEFAULT_CATS.includes(c));
    try{
      await setDoc(doc(db,"settings","inv_cats"),{cats:custom},{merge:true});
    }catch(e){showT("Save failed","err");}
  };

  const addCat=async()=>{
    const t=newCat.trim();
    if(!t){showT("Enter a category name","warn");return;}
    if(cats.some(c=>c.toLowerCase()===t.toLowerCase())){showT("Category already exists","warn");return;}
    const newList=[...cats,t];
    setCats(newList);
    setNewCat("");
    await saveToFirebase(newList);
    showT(t+" added ✓");
  };

  const deleteCat=async(cat)=>{
    if(DEFAULT_CATS.includes(cat)){showT("Cannot delete default categories","warn");return;}
    const newList=cats.filter(c=>c!==cat);
    setCats(newList);
    await saveToFirebase(newList);
    showT(cat+" deleted ✓");
  };

  if(!loaded) return h("div",{style:{padding:20,color:C.muted}},"Loading...");
  const customCats=cats.filter(c=>!DEFAULT_CATS.includes(c));

  return h("div",null,
    h("div",{style:{fontSize:12,fontWeight:800,marginBottom:12,color:C.text}},"📦 Inventory Categories"),

    // Add new
    h("div",{style:{display:"flex",gap:8,marginBottom:16}},
      h("input",{value:newCat,
        onChange:e=>setNewCat(e.target.value),
        onKeyDown:e=>e.key==="Enter"&&addCat(),
        placeholder:"New category name...",
        style:{flex:1,padding:"9px 12px",border:"2px solid "+C.primary,
          borderRadius:8,fontSize:12,outline:"none"}}),
      h("button",{onClick:addCat,
        style:{padding:"9px 18px",background:C.primary,border:"none",
          borderRadius:8,color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}},
        "+ Add")
    ),

    // Default categories
    h("div",{style:{marginBottom:14}},
      h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:6}},"DEFAULT CATEGORIES (cannot delete)"),
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
        DEFAULT_CATS.map(c=>h("span",{key:c,
          style:{padding:"5px 12px",background:"#f0f0f0",borderRadius:20,
            fontSize:11,color:C.muted,fontWeight:600}},c))
      )
    ),

    // Custom categories
    h("div",null,
      h("div",{style:{fontSize:9,fontWeight:700,color:C.muted,letterSpacing:1,marginBottom:6}},
        "CUSTOM CATEGORIES ("+customCats.length+")"),
      customCats.length===0
        ? h("div",{style:{color:C.muted,fontSize:11,fontStyle:"italic"}},"No custom categories yet")
        : h("div",{style:{display:"flex",flexDirection:"column",gap:6}},
          customCats.map(c=>h("div",{key:c,
            style:{display:"flex",justifyContent:"space-between",alignItems:"center",
              padding:"8px 12px",background:"#E3F2FD",borderRadius:8,
              border:"1px solid #90CAF9"}},
            h("span",{style:{fontSize:12,fontWeight:600,color:"#1565C0"}},c),
            h("button",{onClick:()=>deleteCat(c),
              style:{padding:"4px 12px",background:C.danger,border:"none",
                borderRadius:6,color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer"}},
              "Delete")
          ))
        )
    ),

    h("div",{style:{marginTop:12,fontSize:10,color:C.muted}},
      "💡 Custom categories appear in Add Item form and inventory filters.")
  );
}

// ─── INVENTORY LOG PAGE ───────────────────────────────────
function InvLogPage({db,user,branchId,branches,showT}){
  const [logs,setLogs]     = useState([]);
  const [loading,setLoading] = useState(true);
  const [filter,setFilter]   = useState("all"); // all,deduct,add,created,edited,deleted
  const [selBranch,setSelBranch] = useState(branchId);
  const [srch,setSrch]     = useState("");

  const isOwner = user.role==="owner"||user.role==="commissary";

  useEffect(()=>{
    setLoading(true);
    const col = selBranch==="main"||isOwner&&selBranch==="main"
      ? "inventory_log"
      : "inventory_log_"+selBranch;
    try{
      const q = query(
        collection(db,col),
        orderBy("at","desc"),
        limit(200)
      );
      const unsub = onSnapshot(q, snap=>{
        setLogs(snap.docs.map(d=>({...d.data(),_id:d.id})));
        setLoading(false);
      },()=>setLoading(false));
      return()=>unsub();
    }catch(e){setLoading(false);}
  },[selBranch]);

  const TYPE_CONFIG = {
    deduct:  {label:"Deducted",    color:"#C62828", bg:"#FFEBEE", icon:"➖"},
    add:     {label:"Added",       color:"#1B5E20", bg:"#E8F5E9", icon:"➕"},
    set:     {label:"Set",         color:"#1565C0", bg:"#E3F2FD", icon:"="},
    adjust:  {label:"Adjusted",    color:"#E65100", bg:"#FFF3E0", icon:"✏️"},
    created: {label:"New Item",    color:"#6A1B9A", bg:"#F3E5F5", icon:"🆕"},
    edited:  {label:"Edited",      color:"#1565C0", bg:"#E3F2FD", icon:"✏️"},
    deleted: {label:"Deleted",     color:"#C62828", bg:"#FFEBEE", icon:"🗑️"},
  };

  const filtered = logs.filter(l=>{
    if(filter!=="all"&&l.type!==filter)return false;
    if(srch&&!(
      (l.itemName||"").toLowerCase().includes(srch.toLowerCase())||
      (l.orderId||"").toLowerCase().includes(srch.toLowerCase())||
      (l.reason||"").toLowerCase().includes(srch.toLowerCase())
    ))return false;
    return true;
  });

  const totalDeducted = filtered.filter(l=>l.type==="deduct").reduce((s,l)=>s+Math.abs(l.amount||0),0);
  const totalAdded = filtered.filter(l=>l.type==="add"||l.type==="set").reduce((s,l)=>s+(l.amount||0),0);

  return h("div",null,
    h(SectionHeader,{title:"📋 Inventory Log"}),

    // Branch selector (owner)
    isOwner&&h("div",{style:{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}},
      h("button",{onClick:()=>setSelBranch("main"),
        style:{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",
          fontSize:11,fontWeight:700,
          background:selBranch==="main"?C.primary:"#eee",
          color:selBranch==="main"?"#fff":C.text}},"Main"),
      branches.filter(b=>b.id!=="ct-main").map(b=>
        h("button",{key:b.id,onClick:()=>setSelBranch(b.id),
          style:{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",
            fontSize:11,fontWeight:700,
            background:selBranch===b.id?C.primary:"#eee",
            color:selBranch===b.id?"#fff":C.text}},b.name||b.id))
    ),

    // Stats
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}},
      h(Stat,{label:"Total Entries",value:filtered.length,icon:"📋",color:C.primary}),
      h(Stat,{label:"Total Deducted",value:totalDeducted.toFixed(1),icon:"➖",color:C.danger}),
      h(Stat,{label:"Total Added",value:totalAdded.toFixed(1),icon:"➕",color:C.success})
    ),

    // Search + filter
    h("div",{style:{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}},
      h("div",{style:{position:"relative",flex:1}},
        h("input",{value:srch,onChange:e=>setSrch(e.target.value),
          placeholder:"🔍 Search item, order ID...",
          style:{width:"100%",padding:"8px 14px",border:"1px solid "+C.border,
            borderRadius:20,fontSize:12,outline:"none",boxSizing:"border-box"}})
      ),
      ["all","deduct","add","created","edited","deleted"].map(f=>
        h("button",{key:f,onClick:()=>setFilter(f),
          style:{padding:"5px 12px",borderRadius:20,fontSize:10,border:"none",
            cursor:"pointer",fontWeight:filter===f?700:400,
            background:filter===f?C.primary:"#eee",
            color:filter===f?"#fff":C.muted}},
          f==="all"?"All":TYPE_CONFIG[f]?.label||f))
    ),

    // Log table
    loading?h("div",{style:{textAlign:"center",padding:40,color:C.muted}},"Loading..."):
    h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
      // Header
      h("div",{style:{display:"grid",
        gridTemplateColumns:"140px 1fr 80px 80px 120px 100px",
        padding:"8px 14px",background:"#f5f5f5",
        fontSize:9,fontWeight:700,color:C.muted,letterSpacing:1}},
        "DATE/TIME","ITEM","TYPE","AMOUNT","TRANSACTION","BY"
      ),
      filtered.length===0&&h("div",{style:{padding:"30px",textAlign:"center",color:C.muted}},
        "No log entries found"),
      filtered.map((log,i)=>{
        const tc=TYPE_CONFIG[log.type]||{label:log.type,color:C.muted,bg:"#f5f5f5",icon:"•"};
        const dt=log.at?.toDate?log.at.toDate():new Date();
        const dateStr=dt.toLocaleDateString("en-PH",{month:"short",day:"numeric"});
        const timeStr=dt.toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit"});
        return h("div",{key:log._id||i,
          style:{display:"grid",
            gridTemplateColumns:"140px 1fr 80px 80px 120px 100px",
            padding:"10px 14px",
            borderBottom:i<filtered.length-1?"1px solid #f5f5f5":"none",
            alignItems:"center",
            background:i%2===0?"#fff":"#fafafa"}},
          // Date/Time
          h("div",null,
            h("div",{style:{fontSize:11,fontWeight:600}},dateStr),
            h("div",{style:{fontSize:9,color:C.muted}},timeStr)
          ),
          // Item + reason
          h("div",null,
            h("div",{style:{fontWeight:700,fontSize:12}},log.itemName||"—"),
            h("div",{style:{fontSize:9,color:C.muted}},log.reason||"")
          ),
          // Type badge
          h("div",null,
            h("span",{style:{background:tc.bg,color:tc.color,
              padding:"2px 7px",borderRadius:10,
              fontSize:9,fontWeight:700}},
              tc.icon+" "+tc.label)
          ),
          // Amount
          h("div",{style:{fontWeight:700,
            color:log.type==="deduct"||log.type==="deleted"?C.danger:C.success,
            fontSize:12}},
            (log.amount>0?"+":"")+parseFloat(log.amount||0).toFixed(1)+" "+(log.unit||"")
          ),
          // Transaction ID (order ref)
          log.orderId
            ?h("div",null,
                h("span",{style:{background:"#E3F2FD",color:"#1565C0",
                  padding:"2px 8px",borderRadius:8,fontSize:9,fontWeight:700}},
                  "🛒 "+log.orderId))
            :h("div",{style:{fontSize:9,color:C.muted}},log.transactionId||"—"),
          // By
          h("div",{style:{fontSize:10,color:C.muted}},log.by||"—")
        );
      })
    )
  );
}

// ─── PAYROLL PAGE ─────────────────────────────────────────
function PayrollPage({db,hrisDB,user,showT,branches,branchId,staff,advances}){
  const [cutoff,setCutoff]   = useState(()=>{
    const now=new Date();
    const day=now.getDate();
    const m=String(now.getMonth()+1).padStart(2,"0");
    const y=now.getFullYear();
    return day<=15?y+"-"+m+"-15":y+"-"+m+"-30";
  });
  const [selBranch,setSelBranch] = useState(branchId);
  const [requests,setRequests]   = useState([]);
  const [processing,setProcessing] = useState(false);

  // Load all CA/Loan requests
  useEffect(()=>{
    try{
      const unsub=onSnapshot(
        query(collection(db,"hris_requests"),orderBy("timestamp","desc"),limit(500)),
        snap=>setRequests(snap.docs.map(d=>({...d.data(),_docId:d.id}))),
        ()=>{}
      );
      return()=>unsub();
    }catch(e){}
  },[]);

  // Filter staff for selected branch
  const isOwner=user.role==="owner"||user.role==="commissary";
  const viewBranch=isOwner?selBranch:branchId;
  const branchStaff=staff.filter(s=>s.branch===viewBranch&&s.role!=="owner");

  // Get approved deductions per staff
  const getDeductions=(staffName)=>{
    return requests.filter(r=>
      r.staffName===staffName&&
      r.status==="approved"&&
      (r.balance||0)>0
    );
  };

  // Calculate payroll for a staff member
  const calcPay=(s)=>{
    const deductions=getDeductions(s.name);
    const totalDeduct=deductions.reduce((sum,r)=>sum+(r.cutoffDeduct||0),0);
    const dailyRate=s.dailyRate||0;
    const daysWorked=s.daysWorked||0;
    const grossPay=dailyRate*daysWorked;
    const netPay=Math.max(0,grossPay-totalDeduct);
    return {grossPay,totalDeduct,netPay,deductions,dailyRate,daysWorked};
  };

  // Process payroll - mark deductions as deducted
  const processPayroll=async()=>{
    if(!confirm("Process payroll for "+cutoff+"? This will mark all deductions as deducted."))return;
    setProcessing(true);
    let count=0;
    for(const s of branchStaff){
      const deductions=getDeductions(s.name);
      for(const d of deductions){
        try{
          const newBalance=Math.max(0,(d.balance||d.amount||0)-(d.cutoffDeduct||0));
          await updateDoc(doc(db,"hris_requests",d._docId),{
            balance:newBalance,
            lastDeductDate:cutoff,
            status:newBalance<=0?"completed":"approved",
            updatedAt:serverTimestamp()
          });
          count++;
        }catch(e){}
      }
    }
    showT("Payroll processed! "+count+" deduction(s) updated ✓","ok");
    setProcessing(false);
  };

  return h("div",{style:{maxWidth:900}},
    h(SectionHeader,{title:"💹 Payroll & CA Deductions"}),

    // Controls
    h("div",{style:{display:"flex",gap:10,marginBottom:14,
      flexWrap:"wrap",alignItems:"center"}},
      // Branch selector (owner only)
      isOwner&&h("div",{style:{display:"flex",gap:6}},
        branches.filter(b=>b.id!=="ct-main").map(b=>
          h("button",{key:b.id,onClick:()=>setSelBranch(b.id),
            style:{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",
              fontSize:11,fontWeight:700,
              background:selBranch===b.id?C.primary:"#eee",
              color:selBranch===b.id?"#fff":C.text}},b.name||b.id))
      ),
      // Cutoff date
      h("div",{style:{display:"flex",gap:8,alignItems:"center",marginLeft:"auto"}},
        h("div",{style:{fontSize:11,fontWeight:700,color:C.muted}},"Cutoff:"),
        h("select",{value:cutoff,onChange:e=>setCutoff(e.target.value),
          style:{padding:"7px 12px",border:"1px solid "+C.border,
            borderRadius:8,fontSize:11,outline:"none"}},
          ["-15","-30"].map(d=>{
            const now=new Date();
            return [0,1,2].map(mo=>{
              const dt=new Date(now.getFullYear(),now.getMonth()-mo,1);
              const y=dt.getFullYear();
              const m=String(dt.getMonth()+1).padStart(2,"0");
              return y+"-"+m+(d);
            });
          }).flat().map(v=>h("option",{key:v,value:v},v))
        ),

function NewInventoryItemForm({db,user,branchId,showT,onClose,invBranch}){
  const UNITS=["pc","kg","g","L","ml","pack","box","tray","sachet","EA","roll"];
  const DEFAULT_CATS=["Frozen","Produce","Protein","Sauce","Dry Goods","Packaging","Beverage","Other"];
  const [cats,setCats]=useState(DEFAULT_CATS);
  const [newCat,setNewCat]=useState("");
  const [showAddCat,setShowAddCat]=useState(false);
  const [form,setForm]=useState({name:"",unit:"pc",cat:"Other",stock:"0",minStock:"10",price:"0",cost:"0",packUnit:"",packSize:""});
  const [saving,setSaving]=useState(false);

  // Load custom categories
  useEffect(()=>{
    try{
      const unsub=onSnapshot(doc(db,"settings","inv_cats"),snap=>{
        if(snap.exists()&&snap.data().cats){
          const custom=snap.data().cats.filter(c=>typeof c==="string");
          setCats([...DEFAULT_CATS,...custom.filter(c=>!DEFAULT_CATS.includes(c))]);
        }
      },()=>{});
      return()=>unsub();
    }catch(e){}
  },[]);

  const addCat=async()=>{
    const t=newCat.trim();
    if(!t)return;
    if(cats.includes(t)){showT("Already exists","warn");return;}
    const newList=[...cats,t];
    setCats(newList);
    setForm(p=>({...p,cat:t}));
    setNewCat("");
    setShowAddCat(false);
    try{
      const custom=newList.filter(c=>!DEFAULT_CATS.includes(c));
      await setDoc(doc(db,"settings","inv_cats"),{cats:custom},{merge:true});
    }catch(e){}
  };

  const save=async()=>{
    if(!form.name.trim()){showT("Enter item name","warn");return;}
    setSaving(true);
    const isOwner=user.role==="owner"||user.role==="commissary";
    const col=isOwner?(invBranch==="main"?"inventory":"inventory_"+invBranch):"inventory_"+branchId;
    try{
      const id="inv_"+Date.now();
      await setDoc(doc(db,col,id),{
        id,name:form.name,unit:form.unit,cat:form.cat,
        packUnit:form.packUnit||"",
        packSize:parseFloat(form.packSize)||0,
        stock:parseFloat(form.stock)||0,
        minStock:parseFloat(form.minStock)||10,
        price:parseFloat(form.price)||0,
        cost:parseFloat(form.cost)||0,
        margin:parseFloat(form.price)>0?Math.round((parseFloat(form.price)-parseFloat(form.cost))/parseFloat(form.price)*100):0,
        createdAt:serverTimestamp(),createdBy:user.name
      });
      const logC=isOwner?(invBranch==="main"?"inventory_log":"inventory_log_"+invBranch):"inventory_log_"+branchId;
      await addDoc(collection(db,logC),{
        itemId:id,itemName:form.name,unit:form.unit,
        type:"created",amount:parseFloat(form.stock)||0,
        prevStock:0,newStock:parseFloat(form.stock)||0,
        reason:"New item",by:user.name,at:serverTimestamp()
      });
      showT(form.name+" added ✓");
      onClose();
    }catch(e){showT("Error: "+e.message,"err");}
    setSaving(false);
  };

  const fld=(label,key,type)=>h("div",{style:{marginBottom:10}},
    h("div",{style:{fontSize:9,fontWeight:700,color:"#888",letterSpacing:1,marginBottom:4}},label),
    h("input",{type:type||"text",value:form[key],
      onChange:e=>setForm(p=>({...p,[key]:e.target.value})),
      placeholder:label,
      style:{width:"100%",padding:"8px",border:"1px solid #ddd",
        borderRadius:7,fontSize:12,outline:"none",boxSizing:"border-box"}})
  );

  return h("div",null,
    fld("Item Name *","name"),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
      h("div",{style:{marginBottom:10}},
        h("div",{style:{fontSize:9,fontWeight:700,color:"#888",letterSpacing:1,marginBottom:4}},"UNIT"),
        h("select",{value:form.unit,onChange:e=>setForm(p=>({...p,unit:e.target.value})),
          style:{width:"100%",padding:"8px",border:"1px solid #ddd",borderRadius:7,fontSize:12,outline:"none"}},
          UNITS.map(u=>h("option",{key:u,value:u},u)))
      ),
      h("div",{style:{marginBottom:10}},
        h("div",{style:{fontSize:9,fontWeight:700,color:"#888",letterSpacing:1,marginBottom:4,
          display:"flex",justifyContent:"space-between",alignItems:"center"}},
          h("span",null,"CATEGORY"),
          h("button",{onClick:()=>setShowAddCat(!showAddCat),
            style:{fontSize:9,color:C.primary,background:"none",border:"none",cursor:"pointer",fontWeight:700}},
            showAddCat?"✕":"+ New")
        ),
        showAddCat&&h("div",{style:{display:"flex",gap:4,marginBottom:6}},
          h("input",{value:newCat,onChange:e=>setNewCat(e.target.value),
            placeholder:"Category name",
            onKeyDown:e=>e.key==="Enter"&&addCat(),
            style:{flex:1,padding:"6px",border:"1px solid #ddd",
              borderRadius:6,fontSize:11,outline:"none"}}),
          h("button",{onClick:addCat,
            style:{padding:"6px 10px",background:C.primary,border:"none",
              borderRadius:6,color:"#fff",fontSize:11,cursor:"pointer",fontWeight:700}},
            "Add")
        ),
        h("select",{value:form.cat,onChange:e=>setForm(p=>({...p,cat:e.target.value})),
          style:{width:"100%",padding:"8px",border:"1px solid #ddd",borderRadius:7,fontSize:12,outline:"none"}},
          cats.map(c=>h("option",{key:c,value:c},c)))
      )
    ),
    // Pack detail — how it is bought/counted vs how it is consumed
    h("div",{style:{background:"#FFFDE7",border:"1px solid #FFE082",borderRadius:8,
      padding:"9px 10px",marginBottom:10}},
      h("div",{style:{fontSize:9,fontWeight:800,color:"#E65100",letterSpacing:1,marginBottom:6}},
        "PACK DETAIL (optional)"),
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
        h("div",null,
          h("div",{style:{fontSize:9,fontWeight:700,color:"#888",letterSpacing:1,marginBottom:4}},"PACK UNIT"),
          h("select",{value:form.packUnit||"",
            onChange:e=>setForm(p=>({...p,packUnit:e.target.value})),
            style:{width:"100%",padding:"8px",border:"1px solid #ddd",borderRadius:7,fontSize:12,outline:"none"}},
            h("option",{value:""},"— wala —"),
            UNITS.map(u=>h("option",{key:u,value:u},u)))
        ),
        h("div",null,
          h("div",{style:{fontSize:9,fontWeight:700,color:"#888",letterSpacing:1,marginBottom:4}},
            "ILAN KADA PACK"),
          h("input",{type:"number",onFocus:e=>e.target.select(),min:0,value:form.packSize||"",
            onChange:e=>setForm(p=>({...p,packSize:e.target.value})),
            placeholder:"hal. 30",
            style:{width:"100%",padding:"8px",border:"1px solid #ddd",
              borderRadius:7,fontSize:12,outline:"none",boxSizing:"border-box"}})
        )
      ),
      h("div",{style:{fontSize:9,color:"#888",marginTop:5}},
        (Number(form.packSize)>1&&form.packUnit)
          ? ("1 "+form.packUnit+" = "+form.packSize+" "+(form.unit||"pc")
             +". Ang stock ay laging naka-"+(form.unit||"pc")+"; pack ang gamit sa receiving at bilangan.")
          : "Iwanang blangko kung iisa lang ang unit. Hindi nito binabago ang BOM deduction.")
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
      fld("Current Stock ("+(form.unit||"pc")+")","stock","number"),
      fld("Min Stock ("+(form.unit||"pc")+")","minStock","number")
    ),
    Number(form.packSize)>1&&h("div",{style:{background:"#E3F2FD",borderRadius:7,
      padding:"7px 9px",marginBottom:10,fontSize:10,color:"#1565C0",fontWeight:700}},
      "Stock "+fmtPacks({unit:form.unit,packUnit:form.packUnit,packSize:Number(form.packSize)},
        Number(form.stock)||0)
      +"  ·  Alert sa "+((Number(form.minStock)||0)/Number(form.packSize)).toFixed(2)
      +" "+(form.packUnit||"pack")),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
      fld("Selling Price (₱)","price","number"),
      fld("Cost Price (₱)","cost","number")
    ),
    h("div",{style:{display:"flex",gap:8,marginTop:14}},
      h("button",{onClick:onClose,
        style:{flex:1,padding:"10px",borderRadius:8,border:"1px solid #ddd",
          background:"#fff",fontSize:12,cursor:"pointer"}},"Cancel"),
      h("button",{onClick:save,disabled:saving,
        style:{flex:2,padding:"10px",borderRadius:8,border:"none",
          background:saving?"#ccc":"linear-gradient(135deg,#C8151B,#9B0F14)",
          color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer"}},
        saving?"Saving...":"💾 Add Item")
    )
  );
}

    (async()=>{

  // ── COMPUTED FROM USER ────────────────────────────────────
  const role=user?ROLES[user.role]:null;
  // Which branch a transaction is filed against. Every account resolves to
  // exactly one, so there is nothing to choose at runtime:
  //   manager / cashier / crew -> user.branch (their own branch)
  //   commissary               -> Main
  //   owner (branch:"all")     -> Main, where the owner actually sells
  // Reporting is unaffected: buildZ(bid) takes a branch and the dashboard
  // loops every branch, so an owner still sees the whole chain.
  const isOwnerAll=(user?.branch==="all");
  const isCommAcct=(user?.branch==="comm");
  const branchId=(isOwnerAll||isCommAcct)?"ct-main":(user?.branch||"ct-wsfp");
  const curBranch=branches.find(b=>b.id===branchId)||BRANCHES[0];
  // One rule for every stock collection, driven by the SAME branch the order
  // is filed under. Previously this keyed off role, so an owner's sale was
  // tagged WSFP but deducted from Main.
  const invColFor=(bid)=>(bid==="ct-main"||bid==="main")?"inventory":"inventory_"+bid;
  const logColFor=(bid)=>(bid==="ct-main"||bid==="main")?"inventory_log":"inventory_log_"+bid;
  // Get price based on type
  const getPriceByType=(item)=>{
    if(priceType==="franchisee"&&item.franchiseePrice) return item.franchiseePrice;
    if(priceType==="wholesale"&&item.wholesalePrice) return item.wholesalePrice;
    return item.unitPrice||item.basePrice||0;
  };
  const priceMultiplier=1; // kept for compatibility
  // one place for a line's money value (incl. premium-pick upcharges)
  const lineAmt=(i)=>getPriceByType(i)*(i.qty||1)
    +(i.freebies||[]).reduce((a,f)=>a+((f.priceAdd||0)*(f.qty||0)),0);
  const cartTotal=cart.reduce((s,i)=>s+lineAmt(i),0);
  const cartCount=cart.reduce((s,i)=>s+i.qty,0);
  const chkSub=cartTotal;
  // Discount = % rate, applied to the whole order OR to selected lines only
  const discRate=chkDisc.custom
    ? Math.min(100,Math.max(0,parseFloat(chkDiscPct)||0))/100
    : (chkDisc.rate||0);
  const discTargets=(chkDiscTargets||[]).filter(cid=>cart.some(i=>i.cartId===cid));
  const discAll=discTargets.length===0;
  const chkDiscBase=discAll?chkSub
    :cart.filter(i=>discTargets.includes(i.cartId)).reduce((s,i)=>s+lineAmt(i),0);
  const chkDiscAmt=Math.round(chkDiscBase*discRate*100)/100;
  const chkTotal=chkSub-chkDiscAmt;
  // Take-out can apply to the whole order (follows ORDER TYPE) or to chosen lines.
  const toTargets=(chkToTargets||[]).filter(cid=>cart.some(i=>i.cartId===cid));
  const toAll=chkToMode==="all";
  const orderIsTO=chkType!=="dine-in";
  // A BOGO line holds 2+ picks and they can split — one T/O, one dine-in.
  const hasPicks=(i)=>((i.freebies||[]).length>0);
  const pickTot=(i)=>(i.freebies||[]).reduce((a,f)=>a+(f.qty||0),0);
  const pickTO=(i,fi)=>((chkToPicks[i.cartId]||{})[fi])||0;
  const linePickTO=(i)=>(i.freebies||[]).reduce((a,f,fi)=>a+pickTO(i,fi),0);
  // how many PIECES of this line go out the door
  const lineTOQty=(i)=>{
    if(toAll)return orderIsTO?(hasPicks(i)?pickTot(i):(i.qty||1)):0;
    if(hasPicks(i))return linePickTO(i);
    return toTargets.includes(i.cartId)?(i.qty||1):0;
  };
  const isTO=(i)=>lineTOQty(i)>0;
  const isPartial=(i)=>{
    const t=lineTOQty(i), full=hasPicks(i)?pickTot(i):(i.qty||1);
    return t>0&&t<full;
  };
  const toCount=cart.reduce((a,i)=>a+lineTOQty(i),0);
  const mixedType=!toAll&&cart.length>0
    &&(cart.some(isPartial)||(!cart.every(isTO)&&!cart.every(i=>!isTO(i))));
  // label a cart line so two lines of the same item are tellable apart
  const lineLabel=(i)=>(i.qty+"x "+i.name);
  const lineSub=(i)=>[i.variant||"",
    (i.freebies||[]).map(f=>f.label+" ×"+f.qty).join(", ")].filter(Boolean).join(" · ");
  const myOrders=user?.role==="owner"?orders:orders.filter(o=>o.branch===branchId);
  const menuWithOverrides=[
    // Main menu items with branch overrides
    ...menuItems.map(i=>({
      ...i,
      avail:(branchOverrides[i.id]?.avail??i.avail)!==false,
      basePrice:branchOverrides[i.id]?.price??i.basePrice
    })),
    // Branch-exclusive items (from menu_overrides where isExclusive:true)
    ...(branchExclusives||[]).map(ex=>({
      ...ex,
      avail:true,
      variants:[{label:"Regular",price:ex.basePrice}],
      options:[],promos:[]
    }))
  ];
  const filtMenu=menuWithOverrides.filter(i=>(menuCat==="All"||i.cat===menuCat)&&i.name.toLowerCase().includes(menuSrch.toLowerCase())&&i.avail);
  const sBg={pending:"#FFF8E1",preparing:"#E3F2FD",served:"#E8F5E9",cancelled:"#FFEBEE"};
  const sCol={pending:C.warning,preparing:C.info,served:C.success,cancelled:C.danger};

  // ── CART ACTIONS ─────────────────────────────────────────
  const addToCart=ci=>{setCart(p=>[...p,ci]);setCustomizing(null);showT(ci.name+" added!");};
  const rmCart=cid=>setCart(p=>p.filter(i=>i.cartId!==cid));
  // FIX: old code froze lineTotal at unitPrice for BOGO -> 4 BOGO billed as 1.
  // Also rescales freebie picks so count always matches qty.
  const chgQty=(cid,d)=>setCart(p=>p.map(i=>{
    if(i.cartId!==cid)return i;
    const q=Math.max(1,(i.qty||1)+d);
    const per=i.freePerUnit||0;
    let fr=(i.freebies||[]).map(f=>Object.assign({},f));
    if(per>0){
      const cap=per*q;
      let tot=fr.reduce((a,f)=>a+(f.qty||0),0);
      while(tot>cap&&fr.length){                      // qty down -> trim from the end
        const last=fr[fr.length-1];
        const take=Math.min(last.qty,tot-cap);
        last.qty-=take;tot-=take;
        if(last.qty<=0)fr.pop();
      }
      if(tot<cap&&fr.length){fr[0].qty+=(cap-tot);}   // qty up -> top up the first pick
    }
    const freeAdd=fr.reduce((a,f)=>a+((f.priceAdd||0)*(f.qty||0)),0);
    return Object.assign({},i,{qty:q,freebies:fr,lineTotal:(i.unitPrice||0)*q+freeAdd});
  }));

  // Firestore rejects the WHOLE document if any field is `undefined`.
  // Cart items carry variant/promo/emoji straight from the customizer, and those
  // are undefined whenever nothing was selected — placeOrder normalised them with
  // ||"" but a raw cart write does not, which is what broke Hold.
  // Recurses only into plain objects/arrays so FieldValue sentinels
  // (serverTimestamp) and Dates pass through untouched.
  const stripUndef=(v)=>{
    if(Array.isArray(v))return v.map(stripUndef).filter(x=>x!==undefined);
    if(v&&typeof v==="object"
       &&(v.constructor===Object||v.constructor===undefined)){
      const o={};
      Object.keys(v).forEach(k=>{
        const c=stripUndef(v[k]);
        if(c!==undefined)o[k]=c;
      });
      return o;
    }
    return v;
  };

  // ── BOM STOCK CHECKS ─────────────────────────────────────
  // An ingredient with no inventory record is treated as untracked and never
  // blocks a sale — only things you actually count can stop an order.
  const stockOf=(ingId)=>{
    const it=inventory.find(x=>x.id===ingId);
    return it?(Number(it.stock)||0):null;
  };
  const vKeyOf=(itemId,vLabel)=>(!vLabel||vLabel==="default")
    ? itemId : itemId+"__"+String(vLabel).replace(/\s+/g,"_");
  const itemBomRows=(itemId,vLabel)=>{
    const d=posBoms[itemId]||{};
    return d[vKeyOf(itemId,vLabel)]||d[itemId]||[];
  };
  const choiceBomRows=(gid,cid)=>{
    const d=posBoms["optgrp_"+gid]||{};
    return d["optgrp_"+gid+"__"+cid]||[];
  };
  // rows x multiplier -> [{ingName,need,have,unit}] for anything that falls short
  const bomShort=(rows,mult)=>{
    const out=[];
    (rows||[]).forEach(r=>{
      if(!r.ingId||!r.qty)return;
      const need=((r.qty||0)*(mult||1))/(r.convFactor||1);
      const have=stockOf(r.ingId);
      if(have===null)return;
      if(have<need)out.push({ingName:r.ingName||r.ingId,need:need,have:have,unit:r.unit||""});
    });
    return out;
  };
  // Aggregate across the WHOLE cart. One BOGO may pass on its own while four of
  // them do not, so per-tap checks are not enough — this is the real guard.
  const cartShort=()=>{
    const need={};
    const bump=(rows,mult,label)=>{
      (rows||[]).forEach(r=>{
        if(!r.ingId||!r.qty)return;
        const amt=((r.qty||0)*(mult||1))/(r.convFactor||1);
        if(!need[r.ingId])need[r.ingId]={name:r.ingName||r.ingId,unit:r.unit||"",amt:0,from:[]};
        need[r.ingId].amt+=amt;
        if(label&&need[r.ingId].from.indexOf(label)<0)need[r.ingId].from.push(label);
      });
    };
    cart.forEach(i=>{
      bump(itemBomRows(i.id,i.variant),i.qty||1,i.name);
      (i.optionRefs||[]).forEach(ref=>{
        if(!ref.groupId||!ref.choiceId)return;
        const mult=ref.free?(ref.qty||1):((ref.qty||1)*(i.qty||1));
        bump(choiceBomRows(ref.groupId,ref.choiceId),mult,ref.label);
      });
    });
    const short=[];
    Object.keys(need).forEach(id=>{
      const have=stockOf(id);
      if(have===null)return;
      if(have<need[id].amt)short.push(Object.assign({},need[id],{have:have,id:id}));
    });
    return short;

  // ── PLACE ORDER (Firebase) ───────────────────────────────
  const placeOrder=async()=>{
    // Sequential order number per branch — starts at 01
    let orderNum=1;
    try{
      const settRef=doc(db,"settings","ordcounter_"+branchId);
      const snap=await getDoc(settRef);
      if(snap.exists())orderNum=(snap.data().count||0)+1;
      await setDoc(settRef,{count:orderNum});
    }catch(e){orderNum=ordCounter+1;}
    const id=branchId.replace("ct-","").toUpperCase()+"-"+String(orderNum).padStart(4,"0");
    const now=new Date().toLocaleTimeString("en-PH",{hour:"2-digit",minute:"2-digit"});
    const ord={
      id,branch:branchId,
      items:cart.map(i=>({id:i.id,qty:i.qty,name:i.name,emoji:i.emoji,
        variant:i.variant||"",options:i.options||[],
        freebies:(i.freebies||[]).map((f,fi)=>Object.assign({},f,{
          toQty:toAll?(orderIsTO?(f.qty||0):0):pickTO(i,fi)})),
        optionRefs:i.optionRefs||[],freePerUnit:i.freePerUnit||0,
        discounted:discAll?discRate>0:discTargets.includes(i.cartId),
        takeout:isTO(i),partialTO:isPartial(i),toQty:lineTOQty(i),
        unitPrice:getPriceByType(i),
        lineTotal:getPriceByType(i)*(i.qty||1)
          +(i.freebies||[]).reduce((a,f)=>a+((f.priceAdd||0)*(f.qty||0)),0),
        isBogo:i.isBogo||false,promo:i.promo||"",note:i.note||""})),
      subtotal:chkSub,discAmt:chkDiscAmt,
      discType:{id:chkDisc.id,label:chkDisc.label,rate:discRate},
      discRate:discRate,discBase:chkDiscBase,discScope:discAll?"order":"items",
      discItems:discAll?[]:cart.filter(i=>discTargets.includes(i.cartId)).map(i=>i.name),
      discId:chkDiscId,custName:chkCust,tableNo:chkTable,
      cash:chkCash,total:chkTotal,time:now,date:new Date().toISOString().slice(0,10),
      status:"pending",orderType:chkType,mixedType:mixedType,
      takeoutCount:toCount,
      payMethod:chkPay,priceType,cashier:user.name,
      bomDeducted:false,
      timestamp:serverTimestamp()
    };
    try{
      await addDoc(collection(db,"orders"),ord);

      // ── BOM AUTO-DEDUCT ──────────────────────────────────
      try{
        const bomSnap = await getDocs(collection(db,"bom"));
        const bomData = {};
        bomSnap.docs.forEach(d=>{ bomData[d.id]={...d.data()}; });
        const isOwnerRole = user.role==="owner"||user.role==="commissary";
        const logCol = logColFor(branchId);
        let totalDeductions = 0;

        for(const cartItem of cart){
          const itemId = cartItem.id;
          const variant = cartItem.variant||"default";
          const vKey = (!variant||variant==="default")
            ? itemId
            : itemId+"__"+variant.replace(/\s+/g,"_");

          const itemBOM = bomData[itemId]||{};
          const rows = itemBOM[vKey]||itemBOM[itemId]||[];

          for(const row of rows){
            if(!row.ingId||!row.qty)continue;
            const convFactor = row.convFactor||1;
            const deductAmt = ((row.qty||0)*(cartItem.qty||1))/convFactor;
            
            // Determine correct inventory collection
            const branchInvCol = invColFor(branchId);
            const mainInvCol = "inventory";
            let deductCol = branchInvCol;

            // Fall back to main only when the branch does not carry the item
            if(branchInvCol!==mainInvCol){
              try{
                const branchInvDoc = await getDoc(doc(db,branchInvCol,row.ingId));
                if(!branchInvDoc.exists()){
                  const mainInvDoc = await getDoc(doc(db,mainInvCol,row.ingId));
                  if(mainInvDoc.exists()) deductCol = mainInvCol;
                }
              }catch(e){ deductCol = branchInvCol; }
            }
            
            try{
              // Read first so the log can carry before -> after. increment() is
              // atomic server-side, so `next` is computed, not read back; it can
              // drift only if two terminals hit the same ingredient at once.
              let _prev=null;
              try{
                const _s=await getDoc(doc(db,deductCol,row.ingId));
                if(_s.exists())_prev=Number(_s.data().stock)||0;
              }catch(e4){}
              await updateDoc(doc(db,deductCol,row.ingId),{
                stock: increment(-deductAmt),
                lastDeducted: serverTimestamp()
              });
              totalDeductions++;
              await addDoc(collection(db,logCol),{
                itemId:row.ingId,
                itemName:row.ingName||row.ingId,
                unit:row.unit||"",
                type:"deduct",
                amount:-deductAmt,
                convFactor:convFactor,
                invCol:deductCol,
                prevStock:_prev,
                newStock:_prev==null?null:Math.round((_prev-deductAmt)*1000)/1000,
                desc:"Nabawas sa "+(curBranch&&curBranch.full||branchId)+": "
                  +(Math.round(deductAmt*1000)/1000)+" "+(row.unit||"")
                  +" para sa order "+ord.id+" ("+cartItem.name
                  +(variant!=="default"?" – "+variant:"")+" ×"+(cartItem.qty||1)+")",
                source:"sales",
                ref:ord.id,
                transactionId:ord.id,
                orderId:ord.id,
                menuItem:cartItem.name,
                menuVariant:variant!=="default"?variant:null,
                qty:cartItem.qty,
                branch:branchId,
                reason:"Order: "+ord.id+" — "+cartItem.name+(variant!=="default"?" ("+variant+")":"")+" x"+cartItem.qty,
                by:user.name,
                at:serverTimestamp()
              });
            }catch(e2){console.warn("BOM deduct failed for",row.ingId,e2);}
          }
        }

        // ── Deduct Item Option Choice BOMs ──────────────────
        for(const cartItem of cart){
          const selectedOpts = cartItem.options||[];
          const itemBomDoc = bomData[cartItem.id]||{};
          // Check item's own options (choices with BOM)
          for(const optKey of Object.keys(itemBomDoc)){
            if(!optKey.includes("__opt_"))continue;
            // Format: itemId__opt_optId__choiceId
            const parts=optKey.split("__opt_");
            if(parts.length<2)continue;
            const [,rest]=parts;
            const [optId,choiceId]=rest.split("__");
            // Check if this choice was selected
            const menuItem=cart.find(function(c){return c.id===cartItem.id;});
            // We don't have optId/choiceId in cart, just labels
            // Match by checking if choice label is in options array
            const rows=itemBomDoc[optKey]||[];
            // TODO: need choice label to match - skip for now, use option group matching
          }
        }

        // ── Deduct Option Group BOMs (flavors, drinks, freebies) ──
        // FIX: old code read group.options (Firebase writes choices[]) and looked for
        // an embedded opt.bom — BOMs actually live in bom/optgrp_<groupId>.
        // Result: option-group ingredients were NEVER deducted. Now keyed by ID.
        const bomCache={};
        for(const cartItem of cart){
          for(const ref of (cartItem.optionRefs||[])){
            if(!ref.groupId||!ref.choiceId)continue;
            const docId="optgrp_"+ref.groupId;
            if(!(docId in bomCache)){
              try{const bs=await getDoc(doc(db,"bom",docId));bomCache[docId]=bs.exists()?bs.data():{};}
              catch(e2){bomCache[docId]={};}
            }
            const rows=bomCache[docId][docId+"__"+ref.choiceId]||[];
            // freebie qty already counts every free unit; paid options scale with line qty
            const mult=ref.free?(ref.qty||1):((ref.qty||1)*(cartItem.qty||1));
            for(const row of rows){
              if(!row.ingId||!row.qty)continue;
              const actualDeduct=((row.qty||0)*mult)/(row.convFactor||1);
              try{
                // invCol was never declared in this scope -> ReferenceError,
                // swallowed by the catch below, so picks were never deducted.
                let pCol = invColFor(branchId);
                if(pCol!=="inventory"){
                  try{
                    const bd=await getDoc(doc(db,pCol,row.ingId));
                    if(!bd.exists()){
                      const md=await getDoc(doc(db,"inventory",row.ingId));
                      if(md.exists())pCol="inventory";
                    }
                  }catch(e3){}
                }
                let _pprev=null;
                try{
                  const _ps=await getDoc(doc(db,pCol,row.ingId));
                  if(_ps.exists())_pprev=Number(_ps.data().stock)||0;
                }catch(e5){}
                await updateDoc(doc(db,pCol,row.ingId),{
                  stock:increment(-actualDeduct),
                  lastDeducted:serverTimestamp()
                });
                await addDoc(collection(db,logCol),{
                  itemId:row.ingId,itemName:row.ingName||row.ingId,
                  unit:row.unit||"",type:"deduct",amount:-actualDeduct,
                  prevStock:_pprev,
                  newStock:_pprev==null?null:Math.round((_pprev-actualDeduct)*1000)/1000,
                  convFactor:row.convFactor||1,invCol:pCol,
                  desc:"Nabawas sa "+(curBranch&&curBranch.full||branchId)+": "
                    +(Math.round(actualDeduct*1000)/1000)+" "+(row.unit||"")
                    +" para sa order "+ord.id+" ("+cartItem.name+" → "+ref.label
                    +" ×"+(ref.qty||1)+")",
                  source:"sales",
                  ref:ord.id,
                  transactionId:ord.id,
                  orderId:ord.id,
                  menuItem:cartItem.name,
                  optionLabel:ref.label+(ref.free?" (x"+ref.qty+")":""),
                  branch:branchId,
                  reason:"Order: "+ord.id+" — "+cartItem.name+" ["+ref.label+"]",
                  by:user.name,at:serverTimestamp()
                });
              }catch(e2){console.warn("Option BOM deduct failed",e2);}
            }
          }
        }
        if(totalDeductions>0){
          await updateDoc(doc(db,"orders",ord._docId||ord.id),{
            bomDeducted:true,deductedAt:serverTimestamp()
          }).catch(()=>{});
        }
      }catch(bomErr){console.warn("BOM deduction error:",bomErr);}
      // ────────────────────────────────────────────────────

      setCurOrd(ord);setOrdCounter(c=>c+1);
      setCart([]);setChkCash("");setChkCust("");setChkTable("");
      setChkDisc(DISCS[0]);setChkDiscId("");setChkPay("cash");
      setCartOpen(false);setModal("receipt");
      // Cash drawer opens on its own for cash sales, before the receipt is
      // even printed — the cashier needs it open to make change.
      btKickIfConnected(ord,companySettings);
      showT("Order "+id+" placed! ✓");
    }catch(e){
      showT("Saved offline — will sync","warn");
      setCurOrd(ord);setModal("receipt");
      setCart([]);setCartOpen(false);
    }
  };

  // ── Z-READING DATA ───────────────────────────────────────
  const buildZ=(bid)=>{
    const bo=orders.filter(o=>o.branch===bid);
    const bc=cashLog.filter(c=>c.branch===bid);
    const voided=bo.filter(o=>o.status==="void"||o.status==="partial-void");
    const live=bo.filter(o=>o.status!=="void");
    const gross=live.reduce((s,o)=>s+(o.subtotal||0),0);
    const discounts=live.reduce((s,o)=>s+(o.discAmt||0),0);
    const net=bo.reduce((s,o)=>s+(o.total||0),0);
    // a void leaves subtotal intact and total at 0, so the drop has to be
    // stated or the reading simply does not add up
    const voidAmt=voided.reduce((s,o)=>
      s+((Number(o.originalTotal)||Number(o.subtotal)||0)-(Number(o.total)||0)),0);
    const voidCount=voided.length;

    // Discount breakdown by type — BIR wants these stated separately, and we
    // already store discType.id on every order.
    const discBy=(id)=>live.filter(o=>(o.discType&&o.discType.id)===id)
      .reduce((s,o)=>s+(Number(o.discAmt)||0),0);
    const discCount=(id)=>live.filter(o=>(o.discType&&o.discType.id)===id).length;
    const discSC=discBy("sc"), discPWD=discBy("pwd");
    const discEmp=discBy("emp"), discOther=discBy("promo")+discBy("custom");
    const scTxns=discCount("sc"), pwdTxns=discCount("pwd");

    // VAT split off net
    const vatMode=(companySettings&&companySettings.vatMode)||"vat";
    const isVATreg=vatMode!=="nonvat", zeroRated=vatMode==="zerovat";
    const vatableSales=(isVATreg&&!zeroRated)?net/1.12:0;
    const vatAmount=(isVATreg&&!zeroRated)?net-vatableSales:0;
    const vatExempt=!isVATreg?net:0;
    const zeroSales=zeroRated?net:0;

    // Invoice number range for the day
    const ids=live.map(o=>String(o.id||"")).filter(Boolean).sort();
    const siFrom=ids.length?ids[0]:"—", siTo=ids.length?ids[ids.length-1]:"—";
    const qtySold=live.reduce((s,o)=>
      s+(o.items||[]).reduce((a,i)=>a+(Number(i.qty)||0),0),0);
    const cancelled=bo.filter(o=>o.status==="cancelled").length;
    const opening=bc.filter(c=>c.type==="in"&&(c.desc||"").includes("Opening")).reduce((s,c)=>s+(c.amount||0),0);
    const cashIn=bc.filter(c=>c.type==="in"&&!(c.desc||"").includes("Opening")).reduce((s,c)=>s+(c.amount||0),0);
    const cashOut=bc.filter(c=>c.type==="out").reduce((s,c)=>s+(c.amount||0),0);
    return{gross,discounts,net,voidAmt,voidCount,opening,cashIn,cashOut,
      discSC,discPWD,discEmp,discOther,scTxns,pwdTxns,
      vatableSales,vatAmount,vatExempt,zeroSales,isVATreg,zeroRated,
      siFrom,siTo,qtySold,cancelled,
      totalCash:opening+net+cashIn-cashOut,
      dineIn:bo.filter(o=>o.orderType==="dine-in").length,
      takeout:bo.filter(o=>o.orderType==="takeout").length,
      scPwd:bo.filter(o=>o.discType?.id==="sc"||o.discType?.id==="pwd").length,
      txns:bo.length};
  };
