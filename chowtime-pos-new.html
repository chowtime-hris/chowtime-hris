        // ══ REPORTS ARCHIVE ══
        page==="reports"&&(()=>{
          const mine=(user.role==="owner"||user.role==="commissary")
            ? zHistAll : zHistAll.filter(r=>r.branch===branchId);
          const months=[...new Set(mine.map(r=>(r.date||"").slice(0,7)))].sort().reverse();
          const rows=mine
            .filter(r=>!repMonth||(r.date||"").slice(0,7)===repMonth)
            .filter(r=>!repSrch||(r.date||"").includes(repSrch)
              ||String(r.branch||"").toLowerCase().includes(repSrch.toLowerCase()))
            .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
          const bName=(id)=>(branches.find(b=>b.id===id)||{}).full||id;

          // One row per day, exactly the figures the Z-Reading shows.
          const CSV=[
            ["Date","Branch","Gross","Discounts","Voids","VoidAmt","Net",
             "VATable","VAT","VATExempt","Txns","DineIn","Takeout",
             "CashSales","GCash","FoodPanda","GrabFood",
             "Opening","CashIn","CashOut","CashOnHand","SIFrom","SITo","ClosedBy"]
          ];
          const toCSV=(list)=>{
            const out=CSV.slice();
            list.forEach(r=>out.push([r.date,bName(r.branch),r.gross,r.discounts,
              r.voidCount,r.voidAmt,r.net,r.vatableSales,r.vatAmount,r.vatExempt,
              r.txns,r.dineIn,r.takeout,r.cashSales,r.gcash,r.foodpanda,r.grabfood,
              r.opening,r.cashIn,r.cashOut,r.cashOnHand,r.siFrom,r.siTo,r.closedBy]
              .map(v=>{
                const t=(v===undefined||v===null)?"":String(v);
                return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
              }).join(",")));
            return out.join("\n");
          };
          const download=(name,text)=>{
            try{
              const blob=new Blob([text],{type:"text/csv;charset=utf-8;"});
              const url=URL.createObjectURL(blob);
              const a=document.createElement("a");
              a.href=url; a.download=name; document.body.appendChild(a); a.click();
              document.body.removeChild(a); URL.revokeObjectURL(url);
              showT(name+" downloaded ✓");
            }catch(e){ showT("Download failed","err"); }
          };

          return h("div",null,
            h(SectionHeader,{title:"🗂️ Reports — Saved Daily Records"}),

            h("div",{style:{display:"flex",gap:8,marginBottom:12,alignItems:"center",
              flexWrap:"wrap"}},
              h("input",{value:repSrch,onChange:e=>setRepSrch(e.target.value),
                placeholder:"🔍 Search date or branch...",
                style:{flex:1,minWidth:170,padding:"8px 11px",

              h("select",{value:repMonth,onChange:e=>setRepMonth(e.target.value),

                months.map(m=>h("option",{key:m,value:m},m+

              h("button",{onClick:()=>download(
                  "chowtime-daily-"+(repMonth||"lahat")+".csv",toCSV(rows)),
                disabled:!rows.length,
                style:{padding:"8px 14px",borderRadius:8,border:"none",
                  background:rows.length?"#2E7D32":"#8A8A8A",color:"#fff",
                  fontWeight:800,fontSize:13,
                  cursor:rows.length?"pointer":"not-allowed"}},
                "⬇ Download CSV ("+rows.length+")")
            ),

            rows.length===0
              ? h("div",{style:{background:"#fff",border:"1px dashed "+C.border,
                  borderRadius:12,padding:"36px 20px",textAlign:"center"}},
                  h("div",{style:{fontSize:34,marginBottom:9}},"🗂️"),
                  h("div",{style:{fontSize:13,fontWeight:800,marginBottom:5}},
                    "No saved days yet"),
                  h("div",{style:{fontSize:13,color:C.muted,lineHeight:1.6}},
                    "Close Day and Backfill on the Z-Reading page create records."))
              : h("div",{style:{background:"#fff",borderRadius:12,
                  border:"1px solid "+C.border,overflow:"hidden"}},
                  h("div",{style:{display:"grid",
                    gridTemplateColumns:"96px 1fr 90px 60px 90px 130px",gap:8,
                    padding:"9px 14px",background:"#fafafa",
                    borderBottom:"1px solid "+C.border}},
                    ["DATE","BRANCH","NET","TXNS","CASH ON HAND",""].map(hh=>
                      h("div",{key:hh,style:{fontSize:11,fontWeight:700,
                        color:C.muted,letterSpacing:1}},hh))),
                  rows.slice(0,200).map(r=>h("div",{key:r.branch+"_"+r.date,
                    style:{display:"grid",
                      gridTemplateColumns:"96px 1fr 90px 60px 90px 130px",gap:8,
                      padding:"9px 14px",borderBottom:"1px solid #f5f5f5",
                      alignItems:"center"}},
                    h("div",{style:{fontSize:13,fontWeight:700}},r.date),
                    h("div",null,
                      h("div",{style:{fontSize:13}},bName(r.branch)),
                      h("div",{style:{fontSize:11,color:C.muted}},
                        "12:00 AM – 11:59 PM"+(r.backfilled?" · backfill":"")+
                        (r.closedBy?" · "+r.closedBy:""))),
                    h("div",{style:{fontSize:13,fontWeight:800,textAlign:"right"}},
                      "₱"+peso(r.net)),
                    h("div",{style:{fontSize:13,textAlign:"right"}},r.txns||0),
                    h("div",{style:{fontSize:13,textAlign:"right",color:C.info}},
                      "₱"+peso(r.cashOnHand)),
                    h("div",{style:{display:"flex",gap:5,justifyContent:"flex-end"}},
                      h("button",{onClick:()=>{setZSel(r.date);setPage("z_reading");},
                        style:{padding:"5px 9px",borderRadius:6,fontSize:12,
                          border:"1px solid "+C.border,background:"#fff",
                          cursor:"pointer",fontWeight:700}},"Open"),
                      h("button",{onClick:()=>download(
                          "z-"+r.branch+"-"+r.date+".csv",toCSV([r])),
                        style:{padding:"5px 9px",borderRadius:6,fontSize:12,
                          border:"1px solid "+C.border,background:"#fff",
                          cursor:"pointer"}},"⬇")
                    )
                  )),
                  rows.length>200&&h("div",{style:{padding:"10px 14px",fontSize:13,
                    color:C.muted,textAlign:"center"}},
                    "Showing the first 200 of "+rows.length+" — use the month filter")
                )
          );
        })(),

        // ══ Z/X READING ══
        (page==="z_reading"||page==="x_reading")&&(()=>{
          const isZ=page==="z_reading";
          const live=buildZ(branchId,zSel||localDate());
          const saved=zSel?zHist.find(x=>x.date===zSel):null;
          // a chosen day with no saved rollup is still readable from the live
          // orders if they are within the subscription window; only fall back
          // to an empty state when there is genuinely nothing
          const noData=!!zSel&&!saved&&(live.txns||0)===0;
          // A saved rollup stores cashOnHand; buildZ calls the same figure
          // totalCash. Map it so one renderer serves both.
          // buildZ and the rollup name two figures differently. Map them here
          // so one renderer serves both — a second renderer would eventually
          // drift and the live and saved readings would disagree.
          const zd=saved
            ? Object.assign({},saved,{
                totalCash:saved.cashOnHand,
                scPwd:(Number(saved.scTxns)||0)+(Number(saved.pwdTxns)||0)})
            : live;
          const isSaved=!!saved;
          return h("div",null,
            // Which day am I looking at
            isZ&&h("div",{style:{display:"flex",gap:8,alignItems:"center",
              marginBottom:11,flexWrap:"wrap"}},
              h("span",{style:{fontSize:12,fontWeight:800,color:C.muted,letterSpacing:1}},
                "DATE"),
              h("button",{onClick:()=>setZSel(""),
                style:{padding:"6px 12px",borderRadius:8,fontSize:13,cursor:"pointer",
                  fontWeight:!zSel?800:500,
                  border:"1px solid "+(!zSel?C.primary:C.border),
                  background:!zSel?"#F3E9F7":"#fff",
                  color:!zSel?C.primary:C.text}},
                "Today (live)"),
              h("input",{type:"date",value:zSel,
                max:localDate(),
                min:zHist.length?zHist[zHist.length-1].date:undefined,
                onChange:e=>setZSel(e.target.value),
                style:{padding:"6px 10px",borderRadius:8,fontSize:13,outline:"none",
                  cursor:"pointer",
                  border:"1px solid "+(zSel?C.primary:C.border),
                  background:zSel?"#F3E9F7":"#fff",
                  color:zSel?C.primary:C.text,fontWeight:zSel?700:400}}),
              // A date input cannot grey out days without data, so say so
              // plainly rather than showing an empty reading.
              zSel&&!saved&&h("span",{style:{fontSize:13,
                color:noData?C.danger:C.muted,fontWeight:700}},
                noData?("No transactions on "+zSel)
                     :("Not yet saved: "+zSel+"  — still counting live")),
              // jump straight to the days that actually traded
              zHist.filter(r=>(r.txns||0)>0).slice(0,4).map(r=>
                h("button",{key:r.date,onClick:()=>setZSel(r.date),
                  style:{padding:"5px 10px",borderRadius:20,fontSize:13,cursor:"pointer",
                    fontWeight:zSel===r.date?800:500,
                    border:"1px solid "+(zSel===r.date?C.primary:C.border),
                    background:zSel===r.date?"#F3E9F7":"#fff",
                    color:zSel===r.date?C.primary:C.text}},
                  r.date.slice(5)+" · ₱"+peso(r.net))),
              // The red header already states saved-vs-live and who closed it,
              // and it is inside the reading itself so it survives printing.
              // A second copy beside the date chips said nothing new.
            ),
            h(SectionHeader,{title:isZ?"Z-Reading (End of Day)":"X-Reading (Current)"}),
            h("div",{style:{background:`linear-gradient(135deg,${C.primary},${C.dark})`,borderRadius:13,padding:"16px 18px",marginBottom:13,display:"flex",justifyContent:"space-between",alignItems:"center"}},
              h("div",null,
                h("div",{style:{color:C.accent,fontSize:11,fontWeight:700,letterSpacing:2}},isZ?"Z-READING":"X-READING"),
                h("div",{style:{color:"#fff",fontSize:15,fontWeight:900,marginTop:2}},curBranch.full),
                h("div",{style:{color:"rgba(255,255,255,.75)",fontSize:12,marginTop:1}},
                  isSaved
                    ? ("Saved · "+saved.date+" · ni "+(saved.closedBy||"?"))
                    : ("Cashier: "+user.name+" · "+new Date().toLocaleDateString("en-PH"))),
                h("div",{style:{color:"rgba(255,255,255,.75)",fontSize:11,marginTop:2}},dbReady?"✓ From Firebase ("+orders.length+" orders)":"Loading Firebase data...")
              ),
              h("div",{style:{textAlign:"right"}},
                h("div",{style:{color:C.accent,fontSize:11}},"CASH ON HAND"),
                h("div",{style:{color:"#111111",fontSize:24,fontWeight:900}},"₱"+peso(zd.totalCash))
              )
            ),
            h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}},
              h("div",{style:{background:"#fff",borderRadius:12,padding:"13px 15px",border:"1px solid "+C.border}},
                h("b",{style:{fontSize:14}},"Sales Summary"),
                h("div",{style:{marginTop:9}},
                  [["Opening Fund","₱"+peso(zd.opening),C.success],
                   ["Gross Sales","₱"+peso(zd.gross),C.primary],
                   ["Discounts","-₱"+peso(zd.discounts),C.danger],
                   ["Voids ("+(zd.voidCount||0)+")","-₱"+peso(zd.voidAmt||0),C.danger],
                   ["Net Sales","₱"+peso(zd.net),C.success],
                   ["Cash In","₱"+peso(zd.cashIn),C.info],
                   ["Cash Out","-₱"+peso(zd.cashOut),C.warning],
                   ["TOTAL CASH","₱"+peso(zd.totalCash),C.primary]
                  ].map(([l,v,col])=>h("div",{key:l,style:{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f5f5f5"}},
                    h("span",{style:{fontSize:13,color:C.muted}},l),
                    h("span",{style:{fontSize:13,fontWeight:800,color:col}},v)
                  ))
                )
              ),
              h("div",{style:{background:"#fff",borderRadius:12,padding:"13px 15px",border:"1px solid "+C.border}},
                h("b",{style:{fontSize:14}},"Transaction Summary"),
                h("div",{style:{marginTop:9}},
                  [["Total Transactions",zd.txns],["Dine-in",zd.dineIn],["Takeout",zd.takeout],
                   ["SC/PWD",zd.scPwd+" txns"],["Avg Transaction","₱"+(zd.txns>0?peso(zd.net/zd.txns):"0.00")],
                   ["Cash Sales","₱"+peso(zd.cashSales)],
                   ["GCash","₱"+peso(zd.gcash)],
                   ["FoodPanda","₱"+peso(zd.foodpanda)],
                   ["GrabFood","₱"+peso(zd.grabfood)]
                  ].map(([l,v])=>h("div",{key:l,style:{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f5f5f5"}},
                    h("span",{style:{fontSize:13,color:C.muted}},l),
                    h("span",{style:{fontSize:14,fontWeight:800,color:C.text}},v)
                  ))
                )
              )
            ),
            h("div",{style:{display:"flex",gap:8}},
              // Bluetooth first — the browser copy stays as a fallback
              h("button",{
                onClick:async()=>{
                  const ps=(companySettings&&companySettings.paperSize)||"80mm";
                  showT("Sending to printer...","ok");
                  const ok=await printEscPosZ(zd,curBranch.full,user.name,companySettings,ps,isZ);
                  if(ok)showT((isZ?"Z":"X")+"-Reading printed ✓");
                  else{
                    showT("BT failed — printing via browser","warn");
                    printZ(zd,curBranch.full,user.name);
                  }
                },
                style:{padding:"10px 22px",background:"#1565C0",border:"none",borderRadius:9,
                  color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}},
                "📡 BT Print "+(isZ?"Z":"X")+"-Reading"),
              h("button",{onClick:()=>printZ(zd,curBranch.full,user.name),style:{padding:"10px 22px",background:"#fff",border:"1px solid "+C.border,borderRadius:9,color:C.text,fontWeight:600,fontSize:14,cursor:"pointer"}},"🖨️ Browser"),
              // Close Day used to only show a toast — nothing was ever written,
              // so yesterday's Z-Reading became unrecoverable once the orders
              // subscription scrolled past it.
              isZ&&!isSaved&&h("button",{
                onClick:async()=>{
                  const d=localDate();
                  if(!confirm("Close "+d+" for "+curBranch.name+"?\n"
                    +"The Z-Reading will be saved as a permanent record."))return;
                  setClosing(true);
                  const r=await rollupDay(db,branchId,d,
                    (companySettings&&companySettings.vatMode)||"vat",user.name);
                  setClosing(false);
                  if(r)showT("Closed "+d+" · "+r.txns+" txns · ₱"
                    +peso(r.net)+" net","ok");
                  else showT("Close failed — try again","err");
                },
                disabled:closing,
                style:{padding:"10px 22px",background:closing?"#ccc":"#E3F2FD",
                  border:"none",borderRadius:9,color:closing?"#888":C.info,
                  fontWeight:700,fontSize:14,cursor:closing?"wait":"pointer"}},
                closing?"Saving...":"✓ Close Day")
            ),

            // Backfill — auto-close only reaches 7 days back, and a branch
            // that stops opening the app never rolls up at all.
            isZ&&!isSaved&&(user.role==="owner"||user.role==="commissary")&&h("div",{
              style:{background:"#fff",border:"1px solid "+C.border,borderRadius:12,
                padding:"14px 16px",marginTop:14}},
              h("div",{style:{fontSize:14,fontWeight:800,marginBottom:3}},
                "🗄️ Backfill Daily Records"),
              h("div",{style:{fontSize:13,color:C.muted,marginBottom:10,lineHeight:1.5}},
                "Builds a daily_sales record for past days. "+
                "Required for Analytics and Z-Reading history to have data. "+
                "Safe to repeat — it overwrites the same day rather than duplicating."),
              h("div",{style:{display:"flex",gap:8,alignItems:"flex-end",flexWrap:"wrap"}},
                h("div",null,
                  h("div",{style:{fontSize:11,fontWeight:700,color:C.muted,
                    letterSpacing:1,marginBottom:3}},"FROM"),
                  h("input",{type:"date",value:bfFrom,onChange:e=>setBfFrom(e.target.value),
                    style:{padding:"7px 9px",border:"1px solid "+C.border,
                      borderRadius:7,fontSize:13,outline:"none"}})),
                h("div",null,
                  h("div",{style:{fontSize:11,fontWeight:700,color:C.muted,
                    letterSpacing:1,marginBottom:3}},"TO"),
                  h("input",{type:"date",value:bfTo,onChange:e=>setBfTo(e.target.value),
                    style:{padding:"7px 9px",border:"1px solid "+C.border,
                      borderRadius:7,fontSize:13,outline:"none"}})),
                h("button",{
                  onClick:async()=>{
                    const days=dateRange(bfFrom,bfTo);
                    if(!days.length){showT("Pick tamang range","warn");return;}
                    if(days.length>120){showT("Too long — 120 days maximum","warn");return;}
                    if(!confirm(days.length+" days × "+branches.length+" branch.\n"
                      +"Tatagal ng ilang sandali. Ituloy?"))return;
                    setBfBusy(true);setBfLog({total:days.length,done:0,written:0,traded:0});
                    const ids=branches.map(b=>b.id);
                    let written=0,traded=0,done=0;
                    for(const d of days){
                      const r=await rollupDateAllBranches(db,d,ids,
                        (companySettings&&companySettings.vatMode)||"vat",user.name);
                      written+=r.written;traded+=r.traded;done++;
                      setBfLog({total:days.length,done:done,written:written,traded:traded});
                    }
                    setBfBusy(false);
                    showT("Backfill done · "+written+" records ("+traded+" with sales)","ok");
                  },
                  disabled:bfBusy||!bfFrom,
                  style:{padding:"9px 16px",borderRadius:8,border:"none",
                    background:(bfBusy||!bfFrom)?"#8A8A8A":C.primary,color:"#fff",
                    fontWeight:800,fontSize:13,
                    cursor:(bfBusy||!bfFrom)?"not-allowed":"pointer"}},
                  bfBusy?"Working...":"▶ Start"),
                // Clean up the empty rows the old auto-close wrote before it
                // learned to skip quiet days.
                zHist.some(r=>!(r.txns||0)&&!(r.net||0))&&h("button",{
                  onClick:async()=>{
                    const junk=zHist.filter(r=>!(r.txns||0)&&!(r.net||0)&&!(r.cashOnHand||0));
                    if(!junk.length)return;
                    if(!confirm("Delete "+junk.length+" empty records?\n"
                      +"These have no sales and no cash movement."))return;
                    let n2=0;
                    for(const r of junk){
                      try{await deleteDoc(doc(db,"daily_sales",r._docId));n2++;}catch(e){}
                    }
                    showT(n2+" empty records deleted","warn");
                  },
                  style:{padding:"7px 11px",borderRadius:20,fontSize:13,cursor:"pointer",
                    border:"1px solid "+C.danger,background:"#fff",color:C.danger}},
                  "🧹 Clean up empty ("+zHist.filter(r=>!(r.txns||0)&&!(r.net||0)).length+")"),
                [["7 days",7],["30 days",30],["90 days",90]].map(([lbl,n])=>
                  h("button",{key:lbl,onClick:()=>{
                      const t=new Date();const f=new Date();f.setDate(f.getDate()-n);
                      setBfFrom(localDate(f));
                      setBfTo(localDate(t));
                    },
                    style:{padding:"7px 11px",borderRadius:20,fontSize:13,cursor:"pointer",
                      border:"1px solid "+C.border,background:"#fff",color:C.text}},lbl))
              ),
              bfLog&&h("div",{style:{marginTop:11,background:C.bg,borderRadius:8,
                padding:"9px 11px"}},
                h("div",{style:{height:6,background:"#e0e0e0",borderRadius:4,
                  overflow:"hidden",marginBottom:6}},
                  h("div",{style:{height:"100%",width:(bfLog.done/bfLog.total*100)+"%",
                    background:C.primary,transition:"width .2s"}})),
                h("div",{style:{fontSize:13,color:C.text}},
                  bfLog.done+" / "+bfLog.total+" days  ·  "+
                  bfLog.written+" records written  ·  "+
                  bfLog.traded+" days with sales")
              )
            )
          );
        })(),

        // ══ EXPENSES ══
        page==="expenses"&&(()=>{
          const mine=expenses.filter(e=>user.role==="owner"||e.branch===branchId);
          const months=[...new Set(mine.map(e=>String(e.date||"").slice(0,7)))]
            .filter(Boolean).sort().reverse();
          const rows=mine
            .filter(e=>!expMonth||String(e.date||"").slice(0,7)===expMonth)
            .filter(e=>!expCat||e.cat===expCat)
            .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
          const total=rows.reduce((s2,e)=>s2+(Number(e.amount)||0),0);
          const byCat={};
          rows.forEach(e=>{byCat[e.cat||"Others"]=(byCat[e.cat||"Others"]||0)+(Number(e.amount)||0);});
          const bName=(id)=>(branches.find(b=>b.id===id)||{}).full||id;

          const dlCSV=()=>{
            try{
              const head=["Date","Branch","Category","Description","Amount",
                          "Status","EnteredBy","EnteredOn"];
              const esc=(v)=>{const t=(v===undefined||v===null)?"":String(v);
                return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
              const lines=[head.join(",")].concat(rows.map(e=>
                [e.date,bName(e.branch),e.cat,e.desc,e.amount,e.status,e.by,
                 e.enteredOn||""].map(esc).join(",")));
              // a total row so the file reconciles without a formula
              lines.push(["","","","TOTAL",total.toFixed(2),"","",""].map(esc).join(","));
              const blob=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8;"});
              const url=URL.createObjectURL(blob);
              const a=document.createElement("a");
              a.href=url; a.download="chowtime-expenses-"+(expMonth||"lahat")+".csv";
              document.body.appendChild(a); a.click(); document.body.removeChild(a);
              URL.revokeObjectURL(url);
              showT(rows.length+" expenses downloaded ✓");
            }catch(e){ showT("Download failed","err"); }
          };

          return h("div",null,
          h(SectionHeader,{title:"Expenses",action:()=>setModal("add_exp"),actionLabel:"Add Expense"}),

          h("div",{style:{display:"flex",gap:8,marginBottom:12,alignItems:"center",
            flexWrap:"wrap"}},
            h("select",{value:expMonth,onChange:e=>setExpMonth(e.target.value),
              style:{padding:"8px 11px",borderRadius:8,fontSize:13,outline:"none",
                cursor:"pointer",border:"1px solid "+(expMonth?C.primary:C.border),
                background:expMonth?"#F3E9F7":"#fff",
                color:expMonth?C.primary:C.text,fontWeight:expMonth?700:400}},
              h("option",{value:""},"All months ("+mine.length+")"),
              months.map(m=>h("option",{key:m,value:m},m+
                " ("+mine.filter(e=>String(e.date||"").slice(0,7)===m).length+")"))),
            h("select",{value:expCat,onChange:e=>setExpCat(e.target.value),
              style:{padding:"8px 11px",borderRadius:8,fontSize:13,outline:"none",
                cursor:"pointer",border:"1px solid "+(expCat?C.primary:C.border),
                background:expCat?"#F3E9F7":"#fff",
                color:expCat?C.primary:C.text,fontWeight:expCat?700:400}},
              h("option",{value:""},"All categories"),
              EXPENSE_CATS.map(c=>h("option",{key:c,value:c},c))),
            h("button",{onClick:dlCSV,disabled:!rows.length,
              style:{padding:"8px 14px",borderRadius:8,border:"none",
                background:rows.length?"#2E7D32":"#8A8A8A",color:"#fff",
                fontWeight:800,fontSize:13,
                cursor:rows.length?"pointer":"not-allowed"}},
              "⬇ Download CSV ("+rows.length+")"),
            h("div",{style:{marginLeft:"auto",fontSize:13,fontWeight:900,color:C.danger}},
              "₱"+peso(total))
          ),

          Object.keys(byCat).length>1&&h("div",{style:{display:"flex",gap:6,
            marginBottom:12,flexWrap:"wrap"}},
            Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]).map(c=>
              h("button",{key:c,onClick:()=>setExpCat(expCat===c?"":c),
                style:{padding:"5px 10px",borderRadius:20,fontSize:13,cursor:"pointer",
                  fontWeight:expCat===c?800:500,
                  border:"1px solid "+(expCat===c?C.primary:C.border),
                  background:expCat===c?"#F3E9F7":"#fff",
                  color:expCat===c?C.primary:C.text}},
                c+" · ₱"+peso(byCat[c])))
          ),
          h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:12}},
            h(Stat,{label:"Total",value:"₱"+expenses.filter(e=>user.role==="owner"||e.branch===branchId).reduce((s,e)=>s+(e.amount||0),0).toLocaleString(),icon:"💸",color:C.danger}),
            h(Stat,{label:"Approved",value:expenses.filter(e=>e.status==="approved"&&(user.role==="owner"||e.branch===branchId)).length,icon:"✅",color:C.success}),
            h(Stat,{label:"Pending",value:expenses.filter(e=>e.status==="pending"&&(user.role==="owner"||e.branch===branchId)).length,icon:"⏳",color:C.warning})
          ),
          h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,overflow:"hidden"}},
            rows.length===0&&h("div",{style:{padding:"32px",textAlign:"center",
              color:C.muted,fontSize:14}},"No expenses match the filter"),
            rows.map(e=>h("div",{key:e._docId||e.id,style:{display:"flex",alignItems:"center",gap:9,padding:"10px 14px",borderBottom:"1px solid #f9f9f9"}},
              h("div",{style:{width:32,height:32,background:"#FFEBEE",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}},"💸"),
              h("div",{style:{flex:1}},
                h("div",{style:{fontSize:13,fontWeight:700}},e.desc),
                h("div",{style:{fontSize:12,color:C.muted}},e.cat+" · "+e.by+" · "+e.date+" · "+(branches.find(b=>b.id===e.branch)?.name||e.branch))
              ),
              h("div",{style:{fontSize:14,fontWeight:800,color:C.danger,marginRight:7}},"₱"+(e.amount||0).toLocaleString()),
              h(Badge,{label:e.status,color:e.status==="approved"?C.success:C.warning}),
              e.status==="pending"&&user.role==="owner"&&h("button",{
                onClick:async()=>{
                  if(e._docId)await updateDoc(doc(db,"expenses",e._docId),{status:"approved",approvedBy:user.name,approvedAt:serverTimestamp()});
                  showT("Expense approved");
                },
                style:{padding:"3px 9px",background:"#E8F5E9",border:"none",borderRadius:6,color:C.success,fontSize:12,fontWeight:700,cursor:"pointer"}},"Approve")
            )),

                    return h("div",{style:{display:"grid",
                      gridTemplateColumns:"1fr 1fr",gap:3,marginTop:3}},
                      box("packUnit","pack unit"),
                      box("packSize","per pack","number"));
                  })()
                ),
                // In batch mode these three cells become inputs. The edited
                // value lives in batchEdits until Save, so nothing is written
                // per keystroke and a mistake is discardable.
                (function(){
                  const ed=batchEdits[ item.id]||{};
                  const val=(f)=>ed[f]!==undefined?ed[f]:( item[f]!==undefined? item[f]:"");
                  const set=(f,v)=>setBatchEdits(p=>{
                    const cur=Object.assign({},p[ item.id]||{});
                    const orig= item[f]!==undefined? item[f]:"";
                    if(String(v)===String(orig)) delete cur[f]; else cur[f]=v;
                    const next=Object.assign({},p);
                    if(Object.keys(cur).length) next[ item.id]=cur; else delete next[ item.id];
                    return next;
                  });
                  const cell=(f,step)=>h("input",{type:"number",min:0,step:step||"0.01",
                    onFocus:e=>e.target.select(),
                    value:val(f),onChange:e=>set(f,e.target.value),
                    style:{width:"100%",padding:"4px 6px",fontSize:13,
                      borderRadius:5,textAlign:"right",boxSizing:"border-box",
                      border:"1px solid "+(ed[f]!==undefined?"#E65100":C.border),
                      background:ed[f]!==undefined?"#FFF8E1":"#fff"}});
                  if(!batchMode){
                    const pc=Number( item.price)||0, cs=Number( item.cost)||0;
                    // A branch does not sell ingredients — it turns them into
                    // menu items, and the BOM is where that cost lands. So a
                    // selling price and a margin here mean nothing.
                    if(!isMainInv) return [
                      h("div",{key:"p",style:{fontSize:13,color:C.border}},"—"),
                      h("div",{key:"c",style:{fontSize:13,fontWeight:700}},
                        "₱"+peso(cs)),
                      h("div",{key:"m",style:{fontSize:12,color:C.muted}},
                        "in BOM")
                    ];
                    return [
                      h("div",{key:"p",style:{fontSize:13}},"₱"+peso(pc)),
                      h("div",{key:"c",style:{fontSize:13}},"₱"+peso(cs)),
                      h("div",{key:"m",style:{fontSize:13,color:C.success,fontWeight:700}},
                        ( item.margin||0)+"%")
                    ];
                  }
                  const pc=Number(val("price"))||0, cs=Number(val("cost"))||0;
                  const mg=pc>0?Math.round(((pc-cs)/pc)*100):0;
                  return [
                    h("div",{key:"p"},cell("price")),
                    h("div",{key:"c"},cell("cost","0.0001")),
                    h("div",{key:"m",style:{fontSize:13,fontWeight:700,
                      color:mg<0?C.danger:C.success}},mg+"%")
                  ];
                })(),
                h("div",{style:{fontSize:13,color:C.muted}}, item.cat||""),
                h("div",{style:{display:"flex",gap:5,alignItems:"center"}},
                h("button",{onClick:invView?(()=>showT("Read only — switch back to MAIN to adjust","warn")):()=>setModal("stock_edit_"+( item.id|| item.name)),
                  style:{padding:"4px 10px",background:"#1565C0",border:"none",
                    borderRadius:6,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}},
                  "✏️ Edit"),
                h("button",{
                  onClick:async function(){
                    // Check if used in BOM - query Firebase
                    let usedInBOM=false;
                    try{
                      const bomSnap=await getDocs(collection(db,"bom"));
                      usedInBOM=bomSnap.docs.some(function(d){
                        const data=d.data();
                        return Object.values(data).some(function(rows){
                          return Array.isArray(rows)&&rows.some(function(r){
                            return r.ingId=== item.id||r.ingName=== item.name;
                          });
                        });
                      });
                    }catch(e){}
                    if(usedInBOM){
                      showT("❌ Cannot delete — "+ item.name+" is used in BOM!","err");
                      return;
                    }
                    if(!confirm("Delete "+ item.name+"?"))return;
                    const isOwner=user.role==="owner"||user.role==="commissary";
                    const col=isOwner?"inventory":"inventory_"+branchId;
                    try{
                      // Log the deletion first
                      const logCol2=logColFor(isOwner?"main":branchId);
                      await addDoc(collection(db,logCol2),{
                         itemId: item.id,
                         itemName: item.name,
                        unit: item.unit||"",
                        type:"deleted",
                        amount: item.stock||0,
                        prevStock: item.stock||0,
                        newStock:0,
                        reason:"Item deleted",
                        by:user.name,
                        at:serverTimestamp()
                      });
                      await deleteDoc(doc(db,col, item.id));
                      showT( item.name+" deleted ✓");
                    }catch(e){showT("Error deleting","err");}
                  },
                  style:{padding:"4px 10px",background:"#FFEBEE",border:"1px solid #FFCDD2",
                    borderRadius:6,color:C.danger,fontSize:13,fontWeight:700,cursor:"pointer"}},
                  "🗑️"),
                h("input",{type:"number",onFocus:e=>e.target.select(),placeholder:"+/-",
                  style:{width:44,padding:"4px",border:"1px solid "+C.border,
                    borderRadius:6,fontSize:13,textAlign:"center",outline:"none"},
                  onKeyDown:async function(e){
                    if(e.key!=="Enter")return;
                    const adj=parseFloat(e.target.value);
                    if(!adj)return;
                    const isOwner=user.role==="owner"||user.role==="commissary";
                    const invCol=isOwner?"inventory":"inventory_"+branchId;
                    const logCol=logColFor(isOwner?"main":branchId);
                    const newQ=Math.max(0,( item.stock||0)+adj);
                    try{
                      const _u=lotsUnitCost( item.lots,Number( item.cost)||0);
                      const _nl=adj>0
                        ? lotsAdd( item.lots,adj,_u,"quick adjust",Date.now())
                        : lotsConsume( item.lots,-adj).lots;
                      await updateDoc(doc(db,invCol, item.id),{
                        stock:newQ,lastAdjusted:serverTimestamp(),
                        adjustedBy:user.name,lastAdjAmt:adj,
                        lots:_nl
                      });
                      await addDoc(collection(db,logCol),{
                         itemId: item.id, itemName: item.name,unit: item.unit||"",
                        type:adj>0?"add":"deduct",
                        amount:adj,prevStock: item.stock||0,newStock:newQ,
                        reason:"Quick adjust",by:user.name,at:serverTimestamp()
                      });
                      await addDoc(collection(db,logCol),{
                         itemId: item.id, itemName: item.name,unit: item.unit||"",
                        type:adj>0?"add":"deduct",amount:adj,
                        prevStock: item.stock||0,newStock:newQ,
                        reason:"Quick adjust",by:user.name,at:serverTimestamp()
                      });
                      showT((adj>0?"+":"")+String(adj)+" "+ item.name+" ✓");
                      e.target.value="";
                    }catch(err){showT("Error","err");}
                  }
                })
              )
              );
            })
          )
        ),  // end left col

          // RIGHT: Stock Activity Log
          h("div",{style:{background:"#fff",borderRadius:12,
            border:"1px solid "+C.border,overflow:"hidden",
            position:"sticky",top:0}},
            h("div",{style:{padding:"10px 14px",borderBottom:"1px solid "+C.border,
              display:"flex",justifyContent:"space-between",alignItems:"center"}},
              h("div",{style:{fontSize:14,fontWeight:800,color:C.text}},"📋 Stock Log"),
              h("div",{style:{fontSize:12,color:C.muted}},
                String(invLog.length)+" entries")
            ),
            h("div",{style:{maxHeight:"70vh",overflowY:"auto"}},
              invLog.length===0
                ? h("div",{style:{padding:"20px",textAlign:"center",
                    color:C.muted,fontSize:13}},"No adjustments yet")
                : invLog.map(function(log,ix){
                    const isSet=log.type==="set";
                    const isAdd=!isSet&&(log.amount||0)>0;
                    const col=isSet?"#1565C0":isAdd?C.success:C.danger;
                    const sign=isSet?"→":isAdd?"+":"-";
                    const val=isSet?String(log.newStock||0):
                      String(Math.abs(log.amount||0));
                    const SRC={sales:{l:"SALES",c:"#C62828",b:"#FFEBEE"},
                               void:{l:"VOID",c:"#E65100",b:"#FFF3E0"},
                               transfer:{l:"TRANSFER",c:"#1565C0",b:"#E3F2FD"}};
                    const src=SRC[log.source]||null;
                    const when=(function(){
                      const t=log.at&&log.at.toDate?log.at.toDate()
                        :(log.timestamp&&log.timestamp.toDate?log.timestamp.toDate():null);
                      return t?t.toLocaleString("en-PH",{month:"short",day:"numeric",
                        hour:"2-digit",minute:"2-digit"}):"";
                    })();
                    const hasBA=log.prevStock!=null&&log.newStock!=null;
                    return h("div",{key:log._docId||String(ix),
                      style:{padding:"9px 14px",borderBottom:"1px solid #f5f5f5",
                        borderLeft:"3px solid "+col}},
                      h("div",{style:{display:"flex",justifyContent:"space-between",
                        alignItems:"center",marginBottom:3,gap:6}},
                        h("div",{style:{flex:1,minWidth:0,display:"flex",
                          alignItems:"center",gap:5,flexWrap:"wrap"}},
                          h("span",{style:{fontSize:13,fontWeight:700,color:C.text}},
                            log. itemName||""),
                          src&&h("span",{style:{fontSize:12,fontWeight:800,padding:"1px 5px",
                            borderRadius:20,background:src.b,color:src.c}},src.l),
                          log.ref&&h("span",{style:{fontSize:11,color:C.muted}},"#"+log.ref)
                        ),
                        h("div",{style:{fontSize:13,fontWeight:900,color:col,flexShrink:0}},
                          sign+" "+val+" "+(log.unit||""))
                      ),
                      // before -> after is what makes the log reconcilable
                      hasBA&&h("div",{style:{display:"flex",alignItems:"center",gap:6,
                        background:"#FAFAFA",borderRadius:6,padding:"3px 7px",marginBottom:3}},
                        h("span",{style:{fontSize:13,color:C.muted}},
                          Number(log.prevStock).toLocaleString("en-PH")+" "+(log.unit||"")),
                        h("span",{style:{fontSize:13,color:col,fontWeight:900}},"→"),
                        h("span",{style:{fontSize:13,fontWeight:800,color:C.text}},
                          Number(log.newStock).toLocaleString("en-PH")+" "+(log.unit||"")),
                        log.convFactor&&log.convFactor!==1&&h("span",{style:{fontSize:11,
                          color:C.muted,marginLeft:"auto"}},"conv ÷"+log.convFactor)
                      ),
                      h("div",{style:{fontSize:12,color:C.muted,marginBottom:2}},
                        log.desc||log.reason||"Adjustment"),
                      h("div",{style:{display:"flex",justifyContent:"space-between",
                        fontSize:11,color:"#5A5A5A"}},
                        h("span",null,(log.by?"ni "+log.by:"")
                          +(log.invCol?" · "+log.invCol:"")),
                        h("span",null,when)
                      )
                    );
                  })
            )
          )
          ),

          // ── TOP CONSUMED ──
          page==="inventory"&&h("div",{style:{background:"#fff",borderRadius:12,border:"1px solid "+C.border,
            marginTop:12,overflow:"hidden"}},
            h("div",{style:{padding:"12px 16px",borderBottom:"1px solid "+C.border,
              fontSize:13,fontWeight:800}},"📦 Top Consumed Products & Supplies"),
            h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:0}},
              (function(){
                // Calculate consumption per day from orders (BOM deduction)
                const consMap={};
                const sevenDaysAgo=localDate(new Date(Date.now()-7*86400000));
                // Use inventory  items sorted by consumption rate
                return inventory
                  .filter(function(i){return (i.stock||0)>=0;})
                  .map(function(i){
                    // Estimate daily consumption from avgDeduction or manual rate
                    const dailyRate=i.dailyRate||i.avgDeduction||0;
                    const stock=i.stock||0;
                    const daysLeft=dailyRate>0?stock/dailyRate:null;
                    return {name:i.name,unit:i.unit||"",stock,dailyRate,daysLeft,cat:i.cat||""};
                  })
                  .filter(function(i){return i.dailyRate>0;})
                  .sort(function(a,b){return b.dailyRate-a.dailyRate;})
                  .slice(0,12)
                  .map(function(i,ix){
                    const urgent=i.daysLeft!=null&&i.daysLeft<5;
                    const warn=i.daysLeft!=null&&i.daysLeft<15;
                    const col=urgent?C.danger:warn?C.warning:C.info;
                    return h("div",{key:i.name,
                      style:{display:"flex",alignItems:"center",gap:12,
                        padding:"12px 16px",borderBottom:"1px solid #f5f5f5",
                        background:urgent?"#FFF8F8":warn?"#FFFBF0":"#fff"}},
                      h("div",{style:{width:40,height:40,background:"#f5f5f5",
                        borderRadius:8,flexShrink:0,display:"flex",
                        alignItems:"center",justifyContent:"center",
                        fontSize:18}},
                        urgent?"⚠️":warn?"🟡":"📦"),
                      h("div",{style:{flex:1}},
                        h("div",{style:{fontWeight:700,fontSize:14}},i.name),
                        h("div",{style:{fontSize:13,color:C.muted}},
                          i.daysLeft!=null
                            ? (urgent?"⚠️ ":"")+(i.daysLeft).toFixed(2)+" days remaining"
                            : "Stock: "+i.stock+" "+i.unit)
                      ),
                      h("div",{style:{background:col+"15",color:col,
                        borderRadius:8,padding:"4px 8px",fontSize:13,
                        fontWeight:700,flexShrink:0,textAlign:"center"}},
                        i.dailyRate.toFixed(0)+" "+i.unit+"/DAY")
                    );
                  });
              })()
            ),
            inventory.filter(function(i){return (i.dailyRate||0)>0;}).length===0
              ? h("div",{style:{padding:"20px",textAlign:"center",color:C.muted,fontSize:13}},
                  "Set 'Daily Rate' on inventory  items to see consumption tracking")
              : null
          )
        );
        })(),

        // ══ BRANCH P&L ══
        // Scoped to this branch, always. A manager is accountable for what
        // they can move — their sales, their cost of goods, their expenses.
        // Rent, franchise fees and anything above the branch stay out, because
        // a number nobody at this store can change is not management
        // information, it is just a number to argue about.
        page==="branch_pl"&&(function(){
          const R=rangeFor(plRange,plFrom,plTo);
          const mine=orders.filter(o=>o.branch===branchId&&inRange(o,R));
          const sales=mine.reduce((a,o)=>a+(o.total||0),0);
          const disc =mine.reduce((a,o)=>a+(o.discAmt||0),0);
          const txns=mine.length;

          // Cost of goods, from whichever source is configured. The BOM is
          // exact for what it lists and silent about the rest; a manual figure
          // covers the rest but is only as current as the last time someone
          // updated it. Hybrid takes the manual figure where one exists.
          const src=(companySettings.cogsSource||"bom");
          const fifoRows=plLogs.filter(l=>
            String(l.date||"")>=R.from&&String(l.date||"")<=R.to
            &&l.type==="deduct");
          const fifoCogs=fifoRows.reduce((a,l)=>a+(Number(l.cogs)||0),0);
          const cogsMissing=(src==="bom")
            ? fifoRows.filter(l=>l.cogs==null).length : 0;

          // per-serving cost from the menu, for the manual setting
          const manualOf=(id)=>{
            const mi=menuItems.find(x=>x.id===id);
            const c=mi&&mi.manualCost;
            return (c==null||c==="")?null:(Number(c)||0);
          };
          let manualCogs=0, uncosted=0;
          const uncostedNames={};
          mine.forEach(o=>{
            (o.items||[]).forEach(li=>{
              const q=Number(li.qty)||0;
              if(q<=0)return;
              const mc=manualOf(li.id||li.itemId);
              if(mc!=null){ manualCogs+=q*mc; }
              else { uncosted+=q; uncostedNames[li.name||li.id]=true; }
            });
          });

          const cogsFinal = (src==="manual") ? manualCogs : fifoCogs;
          const uncostedList=Object.keys(uncostedNames);

          const exp=expenses
            .filter(e=>e.branch===branchId
              &&String(e.date||"")>=R.from&&String(e.date||"")<=R.to)
            .reduce((a,e)=>a+(Number(e.amount)||0),0);
          const expRows={};
          expenses
            .filter(e=>e.branch===branchId
              &&String(e.date||"")>=R.from&&String(e.date||"")<=R.to)
            .forEach(e=>{
              const k=e.category||e.type||"Other";
              expRows[k]=(expRows[k]||0)+(Number(e.amount)||0);
            });

          const gross=sales-cogsFinal;
          const left=gross-exp;
          const pct=(v)=>sales>0?((v/sales)*100).toFixed(1)+"%":"—";

          const line=(label,value,opts)=>{
            opts=opts||{};
            return h("div",{key:label,style:{display:"flex",
              justifyContent:"space-between",alignItems:"baseline",
              padding:opts.big?"11px 0":"6px 0",
              borderTop:opts.rule?("1px solid "+C.border):"none"}},
              h("div",{style:{fontSize:opts.big?14:13,
                fontWeight:opts.big?800:(opts.sub?400:600),
                color:opts.sub?C.muted:C.text,
                paddingLeft:opts.sub?14:0}},label),
              h("div",{style:{display:"flex",gap:12,alignItems:"baseline"}},
                h("div",{style:{fontSize:11,color:C.muted,minWidth:44,
                  textAlign:"right"}},opts.noPct?"":pct(Math.abs(value))),
                h("div",{style:{fontSize:opts.big?16:13,
                  fontWeight:opts.big?900:600,minWidth:104,textAlign:"right",
                  color:opts.color||C.text}},
                  (value<0?"−₱":"₱")+peso(Math.abs(value)))));
          };

          return h("div",null,
            h(SectionHeader,{title:"📊 Branch P&L — "+curBranch.name}),

            h("div",{style:{background:"#fff",border:"1px solid "+C.border,
              borderRadius:12,padding:"11px 13px",marginBottom:12}},
              h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
                RANGE_KEYS.map(([k,lbl])=>h("button",{key:k,
                  onClick:()=>setPlRange(k),
                  style:{padding:"7px 13px",borderRadius:8,fontSize:13,
                    cursor:"pointer",fontWeight:plRange===k?800:500,
                    border:"1px solid "+(plRange===k?C.primary:C.border),
                    background:plRange===k?C.primary+"18":"#fff",
                    color:plRange===k?C.primary:C.text}},lbl))),
              plRange==="custom"&&h("div",{style:{display:"flex",gap:8,
                marginTop:9,alignItems:"center",flexWrap:"wrap"}},
                h("span",{style:{fontSize:12,color:C.muted}},"From"),
                h("input",{type:"date",value:plFrom,
                  onChange:e=>setPlFrom(e.target.value),
                  style:{padding:"7px",border:"1px solid "+C.border,
                    borderRadius:8,fontSize:13,outline:"none"}}),
                h("span",{style:{fontSize:12,color:C.muted}},"to"),
                h("input",{type:"date",value:plTo,
                  onChange:e=>setPlTo(e.target.value),
                  style:{padding:"7px",border:"1px solid "+C.border,
                    borderRadius:8,fontSize:13,outline:"none"}})),
              h("div",{style:{fontSize:11,color:C.muted,marginTop:7}},
                (R.from===R.to?R.from:(R.from+" → "+R.to))
                +"  ·  "+txns+" transaction"+(txns===1?"":"s"))),

            h("div",{style:{fontSize:11,color:C.muted,marginBottom:10}},
              "Cost of goods from "
              +(src==="manual"?"the cost set on each menu item"
                :"the BOM, at FIFO prices")
              +(uncostedList.length&&src==="manual"
                ?("  ·  "+uncostedList.length+" item"
                  +(uncostedList.length>1?"s have":" has")+" no cost set: "
                  +uncostedList.slice(0,4).join(", ")
                  +(uncostedList.length>4?"…":"")):"")),

            cogsMissing>0&&h("div",{style:{background:C.warning+"14",
              border:"1px solid "+C.warning,borderRadius:11,
              padding:"11px 13px",marginBottom:12}},
              h("div",{style:{fontSize:12,fontWeight:800,color:C.warning}},
                "Cost of goods is incomplete"),
              h("div",{style:{fontSize:11,color:C.muted,marginTop:2,
                lineHeight:1.5}},
                cogsMissing+" stock movement"+(cogsMissing>1?"s":"")
                +" in this period predate lot costing, so what is shown below "
                +"is lower than the real cost. Figures become exact from the "
                +"first sale after the lots were seeded.")),

            h("div",{style:{background:"#fff",border:"1px solid "+C.border,
              borderRadius:12,padding:"16px 18px",marginBottom:12}},
              line("Sales",sales,{big:true,noPct:true}),
              disc>0&&line("of which discounts given",-disc,{sub:true}),
              line("Cost of goods sold",-cogsFinal,{rule:true,
                color:cogsFinal>0?C.danger:C.muted}),
              line("Gross profit",gross,{big:true,rule:true,
                color:gross>=0?C.success:C.danger}),

              Object.keys(expRows).length>0&&h("div",{style:{marginTop:6}},
                h("div",{style:{fontSize:11,fontWeight:800,color:C.muted,
                  letterSpacing:1,paddingTop:9,
                  borderTop:"1px solid "+C.border}},"EXPENSES"),
                Object.keys(expRows).sort((a,b)=>expRows[b]-expRows[a])
                  .map(k=>line(k,-expRows[k],{sub:true}))),
              line("Total expenses",-exp,{rule:true,
                color:exp>0?C.danger:C.muted}),

              line("Left after branch costs",left,{big:true,rule:true,
                color:left>=0?C.success:C.danger})),

            h("div",{style:{fontSize:11,color:C.muted,lineHeight:1.6,
              background:C.bg,borderRadius:10,padding:"11px 13px"}},
              h("b",{style:{color:C.text}},"What this covers: "),
              "sales rung at this branch, the FIFO cost of the stock those "+
              "sales consumed, and expenses recorded here. It stops at what "+
              "this branch controls — rent, franchise fees and head-office "+
              "costs are not in it, so this is not the company's profit.")
          );
        })(),

        // ══ SALES REPORT ══
        page==="sales_report"&&h("div",null,
          h(SectionHeader,{title:"Sales Report (Firebase)"}),
          h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:12}},
            h(Stat,{label:"Gross Sales",value:"₱"+peso(orders.filter(o=>o.status!=="void").reduce((s,o)=>s+(o.subtotal||0),0)),icon:"💰",color:C.primary}),
            h(Stat,{label:"Total Discounts",value:"₱"+peso(orders.reduce((s,o)=>s+(o.discAmt||0),0)),icon:"🏷️",color:C.danger}),
            h(Stat,{label:"Net Sales",value:"₱"+peso(orders.filter(o=>o.status!=="void"&&o.status!=="cancelled").reduce((s,o)=>s+(o.total||0),0)),icon:"📈",color:C.success})
          ),
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
            h("div",{style:{background:"#fff",borderRadius:12,padding:"13px 15px",border:"1px solid "+C.border}},
              h("b",{style:{fontSize:14}},"Sales by Branch"),
              h("div",{style:{marginTop:9}},
                branches.map(b=>{
                  const bs=orders.filter(o=>o.branch===b.id).reduce((s,o)=>s+(o.total||0),0);
                  return h("div",{key:b.id,style:{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f5f5f5"}},
                    h("span",{style:{fontSize:13,color:C.muted}},b.full),
                    h("span",{style:{fontSize:13,fontWeight:800,color:C.primary}},"₱"+bs.toFixed(0))
                  );
                })
              )
            ),
            h("div",{style:{background:"#fff",borderRadius:12,padding:"13px 15px",border:"1px solid "+C.border}},
              h("b",{style:{fontSize:14}},"Sales by Payment Method"),
              h("div",{style:{marginTop:9}},
                [
                  {id:"cash",     label:"💵 Cash",          color:"#2E7D32"},
                  {id:"gcash",    label:"💙 GCash",         color:"#0070FF"},
