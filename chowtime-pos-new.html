                  (f.toQty>=(f.qty||0))?"  [T/O]":"  ["+f.toQty+" T/O]")
              )),
              i.isBogo&&(i.freebies||[]).length===0&&h("div",{style:{fontSize:9,color:"#FF4B2B",fontWeight:700,paddingLeft:18}},"BOGO – "+((i.qty||1)*2)+" items"),
              i.note&&h("div",{style:{fontSize:9,color:C.muted,fontStyle:"italic",paddingLeft:18}},'"'+i.note+'"')

          h("div",{style:{fontSize:10,color:C.muted}},

            da>0&&h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:2,color:C.danger}},h("span",null,"Disc. ("+dt.label+")"),h("span",null,"-₱"+peso(da))),
            h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:2}},h("span",null,"VATable"),h("span",null,"₱"+peso(vatable))),

            h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,fontWeight:800,color:C.success}},h("span",null,"Change"),h("span",null,"₱"+peso((parseFloat(ord.cash)-(ord.total||0)))))
          ),
          da>0&&h("div",{style:{background:"#FFF8E1",borderRadius:7,padding:"6px 10px",marginTop:7,fontSize:9,color:"#795548"}},
            h("div",null,h("b",null,dt.label+" ID: "),ord.discId||"___________"),

                border:"2px solid #2E7D32",borderRadius:8,color:"#2E7D32",
                fontWeight:700,fontSize:11,cursor:"pointer"}},
              "💵 Open Drawer"),
            h("button",{onClick:()=>setCurOrd(null),

            h("div",{style:{gridColumn:"1/-1",display:"flex",gap:6}},

                onClick:async function(){
                  showT("Scanning for Bluetooth printer...","ok");

                  if(ok)showT("✅ Printer connected! Tap 📡 BT Print","ok");
                  else showT("❌ Check Bluetooth — pair Xprinter first","warn");

                style:{flex:1,padding:"8px",background:"#1565C0",
                  border:"none",borderRadius:8,color:"#fff",
                  fontWeight:700,fontSize:11,cursor:"pointer"}},
                "📡 Connect Printer"),
              h("button",{
                onClick:function(){testPrint(companySettings,
                  companySettings.paperSize||"80mm",showT);},
                style:{flex:1,padding:"8px",background:"#fff",
                  border:"2px solid #1565C0",borderRadius:8,
                  color:"#1565C0",fontWeight:700,fontSize:11,cursor:"pointer"}},

  // ── MAIN LAYOUT ──────────────────────────────────────────
  return h("div",{style:{display:"flex",height:"100vh",background:C.bg,fontFamily:"'Segoe UI',system-ui,sans-serif",overflow:"hidden"}},

    // SIDEBAR
    h("div",{style:{width:192,background:"#FFFFFF",borderRight:"1px solid #E6E6E6",display:"flex",flexDirection:"column",flexShrink:0,height:"100vh",position:"relative"}},
      h("div",{style:{padding:"10px 11px 6px",flexShrink:0}},
        h("div",{style:{display:"flex",alignItems:"center",gap:7,marginBottom:9}},
          h("div",{style:{width:28,height:28,background:`linear-gradient(135deg,${C.primary},${C.dark})`,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13}},"🍽️"),
          h("div",null,
            h("div",{style:{color:C.primary,fontWeight:900,fontSize:12}},"CHOWTIME"),
            h("div",{style:{color:"#8A8A8A",fontSize:7,fontWeight:700,letterSpacing:2}},"FAST-FOOD CHAIN")
          )
        ),
        h("div",{style:{background:`${role?.color||"#E63946"}18`,border:`1px solid ${role?.color||"#E63946"}44`,borderRadius:7,padding:"6px 8px",display:"flex",gap:6,alignItems:"center"}},
          h("span",{style:{fontSize:14}},role?.emoji||"👤"),
          h("div",null,
            h("div",{style:{color:role?.color||"#E63946",fontSize:8,fontWeight:700}},role?.label||""),
            h("div",{style:{color:"#1A1A1A",fontSize:10,fontWeight:700}},user.name),
            h("div",{style:{color:"#8A8A8A",fontSize:8}},user.branch==="all"?"All Branches":user.branch==="comm"?"Commissary":curBranch.name)
          )
        ),
        // Online indicator
        h("div",{style:{display:"flex",alignItems:"center",gap:5,marginTop:7,padding:"4px 8px",background:"#F5F5F5",borderRadius:6}},
          h("div",{style:{width:6,height:6,borderRadius:"50%",background:isOnline?C.success:C.danger}}),
          h("span",{style:{fontSize:8,color:"#8A8A8A"}},isOnline?"Firebase Live":"Offline"),
          dbReady&&h("span",{style:{fontSize:7,color:"#9E9E9E"}},orders.length+" orders")
        )
      ),
      h("nav",{style:{flex:1,padding:"3px 6px",overflowY:"auto",minHeight:0}},
        (function(){
          // permitted pages for this role, in the role's own order
          const allowed=(role?.nav||[]).filter(p=>{
            if(user?.role==="owner"||user?.role==="commissary"||user?.role==="manager")return true;
            const rolePerms=(companySettings?.rolePerms||{})[user?.role];
            if(!rolePerms)return true;
            return rolePerms[p]!==false;
          });

          const badgeFor=(p)=>{
            var cnt=0;
            if(p==="stock_order"){
              cnt=advances.filter(function(a){
                return a._type==="po"&&a.branch===branchId&&
                  (a.status==="paid"||a.status==="discrepancy");}).length;
            }
            if(p==="inventory"){
              cnt=inventory.filter(function(i){
                return (i.stock||0)<=(i.minStock||10)&&(i.stock||0)>=0;}).length;
            }
            if(p==="po_monitor"){
              cnt=advances.filter(function(a){
                return a._type==="po"&&
                  (a.status==="received_by_main"||a.status==="discrepancy");}).length;
            }
            if(p==="void_requests"){
              cnt=advances.filter(function(a){
                return a._type==="void"&&a.status==="pending";}).length;
            }
            return cnt;
          };

          const pill=(cnt)=>cnt>0?h("span",{style:{
            background:C.primary,color:"#fff",borderRadius:10,fontSize:8,fontWeight:900,
            padding:"1px 5px",minWidth:16,textAlign:"center",flexShrink:0}},
            cnt>9?"9+":String(cnt)):null;

          const item=(p,indent)=>{
            const m=NAV_META[p]; if(!m)return null;
            return h("button",{key:p,onClick:()=>setPage(p),
              style:{width:"100%",display:"flex",alignItems:"center",gap:6,
                padding:"5px 9px 5px "+(indent?22:9)+"px",borderRadius:7,border:"none",
                background:page===p?"#FDE7E8":"transparent",
                boxShadow:page===p?("inset 3px 0 0 "+C.primary):"none",
                color:page===p?C.primary:"#3A3A3A",
                cursor:"pointer",fontSize:10,fontWeight:page===p?700:500,textAlign:"left"}},
              h("span",{style:{fontSize:11}},m.icon),
              h("span",{style:{flex:1}},m.label),
              pill(badgeFor(p)));
          };

          const grouped=new Set();
          NAV_GROUPS.forEach(g=>g.pages.forEach(p=>grouped.add(p)));
          const loose=allowed.filter(p=>!grouped.has(p));

          const out=[];
          // ungrouped pages first (dashboards etc.)
          loose.forEach(p=>out.push(item(p,false)));

          NAV_GROUPS.forEach(g=>{
            const kids=g.pages.filter(p=>allowed.includes(p));
            if(!kids.length)return;
            // a group wrapping a single page just adds a click for nothing
            if(kids.length===1){ out.push(item(kids[0],false)); return; }
            const hasActive=kids.includes(page);
            // the group holding the current page is always open, so you can
            // never navigate into a section and then lose sight of it
            const open=hasActive||!!openNav[g.id];
            const total=kids.reduce((s2,p)=>s2+badgeFor(p),0);
            out.push(h("button",{key:"g-"+g.id,
              onClick:()=>setOpenNav(prev=>Object.assign({},prev,{[g.id]:!open})),
              style:{width:"100%",display:"flex",alignItems:"center",gap:6,
                padding:"6px 9px",marginTop:4,borderRadius:7,border:"none",
                background:hasActive?"#F2F2F2":"transparent",
                color:hasActive?"#1A1A1A":"#5A5A5A",
                cursor:"pointer",fontSize:10,fontWeight:700,textAlign:"left"}},
              h("span",{style:{fontSize:11}},g.icon),
              h("span",{style:{flex:1}},g.label),
              !open&&pill(total),
              h("span",{style:{fontSize:8,opacity:.6,transform:open?"rotate(90deg)":"none",
                transition:"transform .12s"}},"\u25B6")
            ));
            if(open)kids.forEach(p=>out.push(item(p,true)));
          });
          return out;
        })()
      ),
      h("div",{style:{padding:"6px 8px",flexShrink:0,
          borderTop:"1px solid #ECECEC"}},
        h("div",{style:{fontSize:8,color:"#9E9E9E",paddingLeft:4}},

      // PAGE CONTENT

          height:page==="pos"||page==="kitchen"?"100%":"auto"}},

        // STICKY MINI HEADER - always at top
        page!=="pos"&&page!=="kitchen"&&h("div",{style:{
          display:"flex",justifyContent:"space-between",alignItems:"center",
          marginBottom:12,paddingBottom:10,borderBottom:"1px solid "+C.border}},
          h("div",{style:{display:"flex",alignItems:"center",gap:6}},
            h("span",{style:{fontSize:16}},NAV_META[page]?.icon||""),
            h("div",null,
              h("div",{style:{fontSize:13,fontWeight:800,color:C.text}},NAV_META[page]?.label||""),
              h("div",{style:{fontSize:8,color:C.muted}},
                new Date().toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric"})+" · "+curBranch.name)
            )
          ),
          h("div",{style:{display:"flex",alignItems:"center",gap:8,position:"relative"}},
            // Notification bell
            (function(){
              const unread=notifs.filter(x=>!x.read).length;
              return h("div",{style:{position:"relative"}},
                h("button",{onClick:()=>setShowNotifs(v=>!v),
                  style:{width:32,height:32,borderRadius:9,cursor:"pointer",
                    border:"1px solid "+(unread?C.primary:C.border),
                    background:unread?"#FFF0F0":"#fff",fontSize:15,lineHeight:1,
                    position:"relative"}},
                  "\uD83D\uDD14",
                  unread>0&&h("span",{style:{position:"absolute",top:-5,right:-5,
                    background:C.primary,color:"#fff",borderRadius:10,fontSize:8,
                    fontWeight:900,padding:"1px 5px",minWidth:15}},
                    unread>9?"9+":String(unread))
                ),
                showNotifs&&h("div",{style:{position:"absolute",right:0,top:38,width:320,
                  maxHeight:400,overflowY:"auto",background:"#fff",zIndex:950,
                  border:"1px solid "+C.border,borderRadius:12,
                  boxShadow:"0 12px 32px rgba(0,0,0,.16)"}},
                  h("div",{style:{padding:"10px 13px",borderBottom:"1px solid "+C.border,
                    display:"flex",justifyContent:"space-between",alignItems:"center"}},
                    h("b",{style:{fontSize:12}},"Notifications"),
                    unread>0&&h("button",{
                      onClick:async()=>{
                        for(const x of notifs.filter(y=>!y.read)){
                          try{await updateDoc(doc(db,"notifications",x._docId),{read:true});}catch(e){}
                        }
                      },
                      style:{background:"none",border:"none",color:C.primary,
                        fontSize:9,fontWeight:700,cursor:"pointer"}},"Basahin lahat")

                        color:C.muted,fontSize:11}},
                        h("div",{style:{fontSize:26,marginBottom:6}},"\uD83D\uDD14"),
                        "Wala pang notification")
                    : notifs.slice(0,20).map(nf=>{
                        const m=NOTIF_META[nf.type]||NOTIF_META.info;
                        const t=nf.at&&nf.at.toDate?nf.at.toDate():null;
                        return h("button",{key:nf._docId,
                          onClick:async()=>{
                            if(nf.page)setPage(nf.page);
                            setShowNotifs(false);
                            if(!nf.read){
                              try{await updateDoc(doc(db,"notifications",nf._docId),{read:true});}catch(e){}
                            }
                          },
                          style:{display:"flex",gap:9,width:"100%",textAlign:"left",
                            padding:"10px 13px",border:"none",cursor:"pointer",
                            borderBottom:"1px solid #f5f5f5",

                          h("span",{style:{fontSize:15,flexShrink:0}},m.icon),
                          h("div",{style:{flex:1,minWidth:0}},
                            h("div",{style:{fontSize:11,fontWeight:nf.read?600:800,
                              color:m.color,marginBottom:1}},nf.title||""),
                            h("div",{style:{fontSize:10,color:C.muted,lineHeight:1.4}},nf.message||""),
                            h("div",{style:{fontSize:8,color:"#bbb",marginTop:2}},
                              (nf.ref?nf.ref+" · ":"")+
                              (t?t.toLocaleString("en-PH",{month:"short",day:"numeric",
                                hour:"2-digit",minute:"2-digit"}):(nf.date||"")))
                          ),
                          !nf.read&&h("span",{style:{width:7,height:7,borderRadius:"50%",
                            background:C.primary,flexShrink:0,marginTop:4}})
                        );
                      })
                )
              );
            })(),
            h("button",{onClick:handleSignOut,
              style:{padding:"5px 12px",background:C.primary,border:"none",

        ),

        h("div",{key:page,style:{flex:1,display:"flex",flexDirection:"column"}},

        // ══ DASHBOARD (Owner) ══
        page==="dashboard"&&h("div",null,

          // ── TOP KPI ROW ──
          h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:14}},
            h(Stat,{label:"All Branch Sales Today",
              value:"₱"+orders.filter(o=>o.date===new Date().toISOString().slice(0,10))
                .filter(o=>o.status!=="void"&&o.status!=="cancelled")

                h("div",{style:{fontSize:9,opacity:.7,marginBottom:4}},"🛒 WALK-IN POS SALES"),
                h("div",{style:{fontSize:22,fontWeight:900}},
                  "₱"+orders.filter(o=>o.branch==="ct-main"&&
                    o.status!=="void"&&o.status!=="cancelled"&&
                    o.date===new Date().toISOString().slice(0,10))
                    .reduce((s,o)=>s+(o.total||0),0).toLocaleString()),
                h("div",{style:{fontSize:9,opacity:.6}},

                h("div",{style:{textAlign:"right",flexShrink:0}},
                  h("div",{style:{fontSize:11,fontWeight:800,
                    color:priceType==="franchisee"?"#E65100":priceType==="wholesale"?"#6A1B9A":C.text}},
                    "₱"+peso((getPriceByType(item)*(item.qty||1)))),
                  h("div",{style:{fontSize:8,color:C.muted,textDecoration:"line-through",
                    visibility:priceType!=="retail"?"visible":"hidden"}},
                    "₱"+peso(item.lineTotal))
                )
              )
            ))
        ),
        h("div",{style:{padding:"10px 14px 16px",borderTop:"1px solid "+C.border,
          display:cart.length>0?"block":"none"}},
          h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:12,fontWeight:800,marginBottom:9}},h("span",null,"Subtotal"),h("span",null,"₱"+peso(cartTotal))),
          h("button",{onClick:()=>{setCartOpen(false);setModal("checkout");},style:{width:"100%",padding:"12px",background:`linear-gradient(135deg,${C.primary},${C.dark})`,border:"none",borderRadius:10,color:"#fff",fontSize:12,fontWeight:800,cursor:"pointer"}},"Proceed to Checkout →")
        )
      )
    ),

    // DR PROCESS MODAL
    modal&&modal.startsWith("issue_dr_")&&h("div",{
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",
        display:"flex",alignItems:"center",justifyContent:"center",zIndex:900}},
      h(DRProcessModal,{
        po:advances.find(a=>a._docId===modal.replace("issue_dr_","")),
        db,user,showT,companySettings,branches,
        onClose:()=>setModal(null)
      })
    ),



    // NEW INVENTORY ITEM MODAL
    modal==="new_po"&&h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:900,padding:16}},
      h("div",{style:{background:"#fff",borderRadius:16,width:"100%",maxWidth:860,
        maxHeight:"88vh",overflowY:"auto"}},
        // MUST be h(POForm,...) not POForm(...): it owns 6 useState + 1 useEffect.
        // Calling it inline would splice those hooks into App's own hook list,
        // and since this branch only renders while the modal is open the count
        // changes between renders -> "Rendered more hooks than during the
        // previous render". Direct calls are only safe for hook-free helpers.
        h(POForm,{branchId,user,db,
          // the live catalogue, not the hardcoded seed list
          INIT_INVENTORY:(inventory&&inventory.length?inventory:INIT_INVENTORY),
          editPO:editingPO,
          key:editingPO?("edit-"+editingPO._docId):"new",
          onClose:()=>{setModal(null);setEditingPO(null);},
          showT,advances,setAdvances,branches})
      )
    ),

    modal==="new_inv_item"&&h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:900}},
      h("div",{style:{background:"#fff",borderRadius:16,padding:"20px",width:380,
        maxHeight:"80vh",overflowY:"auto"}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
          h("div",{style:{fontSize:14,fontWeight:800}},"📦 Add Inventory Item"),
          h("button",{onClick:()=>setModal(null),
            style:{background:"none",border:"none",fontSize:20,cursor:"pointer"}},"×")
        ),
        h(NewInventoryItemForm,{db,user,branchId,showT,onClose:()=>setModal(null),
          invBranch,inventory})
      )
    ),

    // STOCK EDIT MODAL
    modal&&modal.startsWith("stock_edit_")&&h("div",{
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",
        display:"flex",alignItems:"center",justifyContent:"center",zIndex:900}},
      h(StockEditModal,{
        item:inventory.find(function(i){return (i.id||i.name)===modal.replace("stock_edit_","");}),
        boms:Object.values(appBoms||{}),
        db,user,branchId,showT,
        onClose:function(){setModal(null);}
      })
    ),

    // RECEIVE ITEMS MODAL
    modal&&modal.startsWith("receive_")&&h("div",{
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",
        display:"flex",alignItems:"center",justifyContent:"center",zIndex:900}},
      h(ReceiveItemsModal,{
        po:advances.find(a=>a._docId===modal.replace("receive_","")),
        db,user,showT,branchId,
        onClose:()=>setModal(null)
      })
    ),

    // PAYMENT MODAL
    modal&&modal.startsWith("payment_")&&h("div",{
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",
        display:"flex",alignItems:"center",justifyContent:"center",zIndex:900}},
      h(PaymentModal,{
        po:advances.find(a=>a._docId===modal.replace("payment_","")),
        db,user,showT,
        onClose:()=>setModal(null)
      })
    ),

    // RECEIVE ITEMS MODAL (Branch side)
    modal&&modal.startsWith("receive_")&&h("div",{
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",
        display:"flex",alignItems:"center",justifyContent:"center",zIndex:900}},
      h(ReceiveItemsModal,{
        po:advances.find(a=>a._docId===modal.replace("receive_","")),
        db,user,branchId,showT,
        onClose:()=>setModal(null)
      })
    ),

    // MODALS + TOAST - always rendered, display:none when inactive
    h("div",{style:{display:modal==="checkout"?"block":"none"}},
      CheckoutModal()
    ),
    h("div",{style:{display:modal==="receipt"&&curOrd?"block":"none"}},
      curOrd&&ReceiptModal({ord:curOrd})
    ),
    h("div",{style:{display:toast?"block":"none"}},
      toast&&h(Toast,{msg:toast.msg,type:toast.type,onDone:()=>setToast(null)})
    )
  ); // end layout return
} // end App

try{
  
// Error Boundary to catch React render errors
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={hasError:false,error:null};}
  static getDerivedStateFromError(error){return {hasError:true,error};}
  componentDidCatch(error,info){console.error("React render error:",error,info);}
  render(){
    if(this.state.hasError){
      const err=this.state.error;
      return h("div",{style:{minHeight:"100vh",background:"#1a1a2e",color:"#fff",
        fontFamily:"monospace",padding:30,display:"flex",flexDirection:"column",
        alignItems:"center",justifyContent:"center"}},
        h("div",{style:{fontSize:30,marginBottom:12}},"⚠️ Render Error"),
        h("div",{style:{fontSize:13,color:"#ff6b6b",marginBottom:8}},err&&err.message||"Unknown"),
        h("pre",{style:{fontSize:9,color:"#aaa",background:"#0d0d1a",padding:12,
          borderRadius:8,maxWidth:700,overflow:"auto",whiteSpace:"pre-wrap"}},
          err&&err.stack||""),
        h("button",{onClick:()=>location.reload(),
          style:{marginTop:16,padding:"10px 20px",background:"#C8151B",border:"none",
            borderRadius:8,color:"#fff",fontWeight:700,cursor:"pointer"}},
          "🔄 Reload")
      );
    }
    return this.props.children;
  }
}

createRoot(document.getElementById("root")).render(h(ErrorBoundary,null,h(App)));
}catch(err){
  document.getElementById("err-overlay").style.display="flex"; document.getElementById("err-overlay").innerHTML=
    '<div style="font-family:monospace;padding:30px;background:#1a1a2e;min-height:100vh;color:#fff">'+
    '<div style="font-size:40px;margin-bottom:16px">⚠️</div>'+
    '<div style="font-size:20px;font-weight:900;color:#ff6b6b;margin-bottom:8px">ChowTime POS — Startup Error</div>'+
    '<div style="font-size:13px;color:#ffd93d;margin-bottom:16px">'+err.message+'</div>'+
    '<div style="font-size:11px;color:#aaa;background:#0d0d1a;padding:12px;border-radius:8px">'+
    'Steps to fix:<br>'+
    '1. Open Firebase Console → Firestore → Rules<br>'+
    '2. Set: allow read, write: if request.auth != null;<br>'+
    '3. Publish rules → refresh this page<br>'+
    '4. Make sure Authentication → Email/Password is enabled'+
    '</div></div>';
}
